<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter%3Awght%40100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div
      data-pencil-name="Mobile Brand Header"
      class="box-border w-[390px] h-fit flex flex-col gap-[14px] p-[24px] justify-start items-start bg-[#1F2733]"
    >
      <div
        data-pencil-name="Header Logo"
        class="box-border w-fit h-fit shrink-0 flex flex-row gap-[10px] justify-start items-center"
      >
        <div
          data-pencil-name="Logo Mark"
          class="box-border w-[36px] shrink-0 h-[36px] flex flex-row gap-0 justify-start items-start bg-[#FFFFFF] bg-[url('../img/standalone-logo.png')] bg-no-repeat bg-contain bg-center rounded-[8px]"
        ></div>
        <div
          data-pencil-name="Logo Text"
          class="box-border w-fit shrink-0 h-fit flex flex-row gap-[1px] justify-start items-center"
        >
          <div
            data-pencil-name="Logo 3M"
            class="text-[19px]/[normal] box-border text-[#FFFFFF] font-[Inter,system-ui,sans-serif] font-extrabold tracking-[-0.3px] text-left [white-space:nowrap]"
          >
            3M
          </div>
          <div
            data-pencil-name="Logo RAI"
            class="text-[19px]/[normal] box-border text-[#F7941D] font-[Inter,system-ui,sans-serif] font-extrabold tracking-[-0.3px] text-left [white-space:nowrap]"
          >
            RAI
          </div>
        </div>
      </div>
      <div
        data-pencil-name="Header Tagline"
        class="text-[19px]/[25px] box-border w-full text-[#FFFFFF] font-[Inter,system-ui,sans-serif] font-bold tracking-[-0.4px] text-left"
      >
        Fewer clicks between you and what you want.
      </div>
    </div>
  </body>
</html>
