<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter%3Awght%40100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div
      data-pencil-name="Order Card"
      class="box-border w-[1040px] h-fit flex flex-col gap-[16px] p-[20px] justify-start items-start bg-[#FFFFFF] [outline:1px_solid_#E5E7EB] [outline-offset:-0.5px] rounded-[12px]"
    >
      <div
        data-pencil-name="Order Top"
        class="box-border w-full h-fit shrink-0 flex flex-row gap-0 justify-between items-center"
      >
        <div
          data-pencil-name="Order Ident"
          class="box-border w-fit shrink-0 h-fit flex flex-col gap-[4px] justify-start items-start"
        >
          <div
            data-pencil-name="Order Number"
            class="text-[15.5px]/[normal] box-border text-[#1A1A2E] font-[Inter,system-ui,sans-serif] font-semibold text-left [white-space:nowrap]"
          >
            ORD-3MRAI-10482
          </div>
          <div
            data-pencil-name="Order Meta"
            class="text-[13.5px]/[normal] box-border text-[#6B7280] font-[Inter,system-ui,sans-serif] font-normal text-left [white-space:nowrap]"
          >
            Placed Aug 2, 2026 · 3 items
          </div>
        </div>
        <div
          data-pencil-name="Order Right"
          class="box-border w-fit shrink-0 h-fit flex flex-row gap-[16px] justify-start items-center"
        >
          <div
            data-pencil-name="Order Status"
            class="box-border w-fit shrink-0 h-[28px] flex flex-row gap-[7px] p-[0px_11px] justify-start items-center bg-[#ECFDF5] rounded-[14px]"
          >
            <div
              data-pencil-name="Badge Dot"
              class="box-border w-[7px] shrink-0 h-[7px] bg-[#047857] rounded-full"
            ></div>
            <div
              data-pencil-name="Badge Label"
              class="text-[12.5px]/[normal] box-border text-[#047857] font-[Inter,system-ui,sans-serif] font-semibold text-left [white-space:nowrap]"
            >
              Delivered
            </div>
          </div>
          <div
            data-pencil-name="Order Total"
            class="text-[18px]/[normal] box-border text-[#1A1A2E] font-[Inter,system-ui,sans-serif] font-bold tracking-[-0.3px] text-left [white-space:nowrap]"
          >
            $256.00
          </div>
          <svg
            data-pencil-name="Order Chevron"
            data-icon-name="chevron-right"
            data-icon-set="lucide"
            viewBox="0 0 13.99993896484375 14"
            preserveAspectRatio="xMidYMid meet"
            xmlns="http://www.w3.org/2000/svg"
            class="box-border w-[18px] shrink-0 h-[18px]"
          >
            <path
              d="M5.09619 2.93945q-0.25293 0.08545-0.37939 0.30762-0.04102 0.08545-0.04102 0.25293 0 0.16748 0.04102 0.25293 0.04443 0.08203 1.62353 1.66455l1.58252 1.58252-1.58252 1.58252q-1.5791 1.58252-1.62353 1.66797-0.04102 0.08203-0.04102 0.23584 0 0.15381 0.03418 0.23926 0.0376 0.08203 0.1333 0.18115 0.09912 0.0957 0.18115 0.1333 0.08545 0.03418 0.23926 0.03418 0.15381 0 0.24268-0.04785 0.09229-0.05127 1.90381-1.8628 1.81494-1.81494 1.86279-1.9038 0.05127-0.09229 0.05127-0.25977 0-0.16748-0.04443-0.24951-0.04102-0.08545-1.85938-1.90723l-1.44238-1.42871q-0.33496-0.33496-0.46143-0.41699-0.09912-0.07178-0.19824-0.07178l-0.04102 0q-0.14014 0-0.18115 0.01367z"
              fill="#9CA3AF"
            ></path>
          </svg>
        </div>
      </div>
      <div
        data-pencil-name="Order Divider"
        class="box-border w-full h-[1px] shrink-0 bg-[#E5E7EB]"
      ></div>
      <div
        data-pencil-name="Order Bottom"
        class="box-border w-full h-fit shrink-0 flex flex-row gap-0 justify-between items-center"
      >
        <div
          data-pencil-name="Order Thumbs"
          class="box-border w-fit shrink-0 h-fit flex flex-row gap-[8px] justify-start items-center"
        >
          <div
            data-pencil-name="Thumb 1"
            class="box-border w-[52px] shrink-0 h-[52px] bg-[#FAFAFA] rounded-[8px]"
          ></div>
          <div
            data-pencil-name="Thumb 2"
            class="box-border w-[52px] shrink-0 h-[52px] bg-[#FAFAFA] rounded-[8px]"
          ></div>
          <div
            data-pencil-name="Thumb 3"
            class="box-border w-[52px] shrink-0 h-[52px] bg-[#FAFAFA] rounded-[8px]"
          ></div>
        </div>
        <div
          data-pencil-name="View Details"
          class="box-border w-fit shrink-0 h-[38px] flex flex-row gap-[7px] p-[0px_15px] justify-start items-center bg-[#FFFFFF] [outline:1px_solid_#D1D5DB] [outline-offset:-0.5px] rounded-[8px]"
        >
          <div
            data-pencil-name="Details Label"
            class="text-[13.5px]/[normal] box-border text-[#2D3748] font-[Inter,system-ui,sans-serif] font-semibold text-left [white-space:nowrap]"
          >
            View details
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
