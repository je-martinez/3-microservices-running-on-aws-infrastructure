# Static file server for the Angular SPA build (dist/web/browser).
#
# This is a SERVER BLOCK ONLY, dropped into /etc/nginx/conf.d/ where the
# nginx:alpine image's stock nginx.conf includes it. Contrast
# infra/modules/compute/nginx/nginx.conf, which is a FULL config (events{} +
# http{}) because that one replaces the main file to load the njs module.
# Writing a full config here would produce "events directive is duplicate".
#
# Nothing is proxied: the app makes no backend calls in phase 1, every screen
# renders typed fixtures. There is deliberately no upstream, no resolver, and
# no /v1 location — the API gateway lives elsewhere (see ADR-0016).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA fallback — the reason this file exists ──────────────────────────
    # The router owns 12 client-side paths (/login, /orders/:orderId, …) that
    # exist only once main.js has booted. A browser asking nginx for /orders
    # directly — a refresh, a bookmark, a pasted link — is asking for a file
    # that was never built, and without this fallback nginx answers 404 and the
    # app never loads. try_files serves index.html for any unmatched path so
    # the router can resolve it in the browser instead.
    #
    # $uri first, so a real file (main-*.js, styles-*.css) still wins and a
    # missing asset stays a genuine 404 rather than silently returning HTML.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Caching, keyed on Angular's output hashing ──────────────────────────
    # `outputHashing: "all"` (angular.json, production) puts a content hash in
    # every asset filename, so a changed file is a NEW url and can be cached
    # immutably — a rebuild invalidates by renaming, not by expiry.
    #
    # `expires off` + a single add_header, NOT `expires 1y`: `expires` emits its
    # own `Cache-Control: max-age=…`, so pairing the two sent TWO Cache-Control
    # headers (verified: `max-age=31536000` and `public, immutable` as separate
    # lines). They do not contradict each other, but a client that reads only
    # the first silently loses `immutable`. max-age is written into the one
    # header instead.
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Assets are hashed, so a 404 here means a stale index.html is asking
        # for a chunk this image does not have. Let it 404 honestly rather than
        # falling back to index.html, which would hand the browser HTML with a
        # .js content-type and produce a confusing MIME/syntax error instead.
        try_files $uri =404;
    }

    # index.html is NOT hashed (it is the entry point that names the hashed
    # files), so it must never be cached: a cached copy would keep pointing at
    # the previous build's chunks after a redeploy, which 404 under the rule
    # above and leave a blank page.
    #
    # `add_header` only, deliberately — NOT paired with `expires`. `expires -1`
    # emits its own `Cache-Control: no-cache`, so having both sent TWO
    # Cache-Control headers on every response (verified: `no-cache` and
    # `no-store, must-revalidate` together), leaving which one applies up to the
    # caching intermediary. `expires off` below suppresses nginx's header so
    # exactly one is sent.
    location = /index.html {
        expires off;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Compress on the fly. The image ships no pre-compressed .gz siblings, and
    # text/html is always compressed by nginx (it is not listed in gzip_types).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
