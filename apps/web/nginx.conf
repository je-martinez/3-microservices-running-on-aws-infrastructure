# Static file server for the Angular SPA build (dist/web/browser), plus a
# same-origin /v1/ proxy to the API gateway.
#
# This is a SERVER BLOCK ONLY, dropped into /etc/nginx/conf.d/ where the
# nginx:alpine image's stock nginx.conf includes it. Contrast
# infra/modules/compute/nginx/nginx.conf, which is a FULL config (events{} +
# http{}) because that one replaces the main file to load the njs module.
# Writing a full config here would produce "events directive is duplicate".
#
# CONTRACT: This file is an ENVSUBST TEMPLATE, mounted at
# /etc/nginx/templates/default.conf.template and rendered at container start.
# NGINX_ENVSUBST_FILTER restricts substitution to ^(API_GATEWAY_|GEOAPIFY_), so
# nginx's own $uri/$host/$request_uri survive; drop the filter and they render
# empty. Adding a variable here means widening that filter in the Dockerfile.
# See [[env-files]]

# ── Geoapify key: server-side only, and the OFF switch when it is absent ─────
# CONTRACT: The key MUST NOT reach the browser. An NG_APP_* value is compiled
# into the bundle and readable in devtools, so the key lives here and nginx
# appends it; the browser only ever sees the same-origin /geocode/ path.
# See [[2026-09-04-web-gateway-integration-design]]
#
# `map` needs http{} context — legal here because conf.d is included from
# inside it. $host is an arbitrary input: the value is a constant, and a map
# is the only way to hold an envsubst result outside a location block.
map $host $geoapify_key {
    default "${GEOAPIFY_API_KEY}";
}

# CONTRACT: Fail CLOSED on an empty key. Do NOT call Geoapify without one — it
# answers 401 and burns a request off the 3,000/day free tier for a call that
# could never succeed. An unset key means the feature is off, not broken.
map $geoapify_key $geoapify_disabled {
    ""      1;
    default 0;
}

# JSON access log for /geocode/ ONLY — the daily call count against the free
# tier, in the shape transform/parse_body already parses (service_name +
# severity_text/_number, like every other service). escape=json is what keeps a
# quoted user query from producing invalid JSON.
# See [[openobserve-cloudwatch]], [[logging-context]]
log_format geocode_json escape=json
    '{"timestamp":"$time_iso8601",'
    '"service_name":"web-geocode",'
    '"severity_text":"$geocode_severity_text",'
    '"severity_number":$geocode_severity_number,'
    '"deployment_environment":"local",'
    '"message":"geocode_proxied",'
    '"app_event":"geocode_proxied",'
    '"http_request_method":"$request_method",'
    '"http_route":"/geocode/",'
    '"http_response_status_code":$status,'
    '"upstream_status":"$upstream_status",'
    '"duration_ms":$geocode_duration_ms,'
    '"bytes_sent":$body_bytes_sent}';

# Severity from the status, the same status->level policy transform/parse_body
# applies to the gateway's nginx: 5xx error, 4xx warn, else info. Written as
# maps because a log_format can only interpolate variables, not branch.
map $status $geocode_severity_text {
    ~^5 "ERROR";
    ~^4 "WARN";
    default "INFO";
}
map $status $geocode_severity_number {
    ~^5 17;
    ~^4 13;
    default 9;
}

# WHY: $request_time is SECONDS ("0.123"); every other service emits duration_ms.
# Emitted as seconds*1000 by stripping the decimal point, so one query spans all
# services. The first branch also drops the leading zeros: "0123" is not valid
# JSON number syntax and the record would be rejected on ingest.
#
# CONTRACT: Keep each regex QUOTED and spell repetition out as \d\d\d. nginx
# parses an unquoted `{` as the start of a block, so a `\d{3}` quantifier fails
# the whole config with `unexpected "{"` — a parse error, not a bad match.
map $request_time $geocode_duration_ms {
    "~^0\.0*(?<frac>[1-9]\d*)$"          "$frac";
    "~^(?<sec>[1-9]\d*)\.(?<ms>\d\d\d)$" "$sec$ms";
    default                              "0";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # WORKAROUND(local): Do NOT resolve the gateway host at startup. Floci is
    # recreated on every apply with a new IP, and a pinned one stays unreachable
    # until nginx itself restarts. Docker's embedded DNS re-resolves per request
    # only because $gateway is a variable.
    # See [[floci-recreate-destroys-backing-containers]]
    #
    # CONTRACT: ipv6=off is REQUIRED, and only became so once an EXTERNAL host
    # was proxied. 127.0.0.11 forwards to the host's resolver, so it answers for
    # api.geoapify.com — with BOTH an A and an AAAA record. This container has no
    # IPv6 route (verified: `ip -6 route` is empty), so nginx picking the AAAA
    # fails the request with "Network is unreachable" intermittently, depending
    # on which record it selects.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Static-file requests are NOT logged. The fluentd driver on this service
    # (docker-compose.yml) ships stdout to the collector, and combined-format
    # lines carry no service_name, so they land in the `unclassified` stream the
    # pipeline exists to keep empty. Only /geocode/ logs, in JSON, below.
    # See [[openobserve-cloudwatch]]
    access_log off;

    # ── Same-origin API proxy — the reason CORS is not configured anywhere ───
    # CONTRACT: The browser MUST only ever call this app's own origin. Neither
    # the API gateway nor its nginx sends CORS headers, so a cross-origin call
    # is blocked at the preflight on every request.
    # See [[2026-09-04-web-gateway-integration-design]]
    #
    # WORKAROUND(local): Do NOT write Floci's stage segment as `$default`.
    # nginx parses it as a variable and fails to start with `unknown "default"
    # variable`; there is no escape for a literal `$` in nginx config. %24 is
    # sent percent-encoded and Floci routes it identically (verified).
    # See [[floci-vs-ministack-spike-findings]]
    #
    # CONTRACT: $request_uri must stay appended. A proxy_pass containing a
    # variable does NOT append the unmatched request URI, so without it every
    # call reaches the gateway as bare /v1 and 404s.
    location /v1/ {
        set $gateway ${API_GATEWAY_PROXY_HOST};
        proxy_pass http://$gateway/restapis/${API_GATEWAY_API_ID}/%24default/_user_request_$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Geocoding proxy — keeps the Geoapify key out of the bundle ──────────
    # The browser calls /geocode/?text=... same-origin; nginx forwards to
    # Geoapify's autocomplete and appends the key. Same shape as /v1/ above.
    location /geocode/ {
        # CONTRACT: Serve 503 while the key is unset. Do NOT let the request
        # through — Geoapify answers 401 and still counts it against the
        # 3,000/day free tier. The body names the env var so the fix is obvious.
        if ($geoapify_disabled) {
            add_header Content-Type application/json always;
            return 503 '{"error":"geocoding_disabled","detail":"Set GEOAPIFY_API_KEY in the CUSTOM box of .env.local.web, then: docker compose up -d web"}';
        }

        # CONTRACT: $upstream must stay a variable so the resolver above runs
        # per request; a literal host is resolved once at startup. And because
        # proxy_pass then contains a variable, the unmatched URI is NOT appended
        # — the path and $args are written out explicitly instead.
        set $upstream "api.geoapify.com";
        proxy_pass https://$upstream/v1/geocode/autocomplete?$args&apiKey=$geoapify_key;

        # CONTRACT: Both lines are required for an HTTPS upstream. Without SNI
        # Cloudflare serves the wrong certificate and the handshake fails; with
        # the client's $host (localhost:3004) the request is not routed to the
        # Geoapify vhost at all.
        proxy_ssl_server_name on;
        proxy_set_header Host api.geoapify.com;

        proxy_http_version 1.1;
        # WHY: The client's Authorization/Cookie headers have no meaning to
        # Geoapify and must not leak to a third party. The key is the only
        # credential this request carries.
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";

        # The one location that logs, and the reason the fluentd driver is on.
        access_log /dev/stdout geocode_json;
    }

    # ── SPA fallback — the reason this file exists ──────────────────────────
    # The router owns 12 client-side paths (/login, /orders/:orderId, …) that
    # exist only once main.js has booted. A browser asking nginx for /orders
    # directly — a refresh, a bookmark, a pasted link — is asking for a file
    # that was never built, and without this fallback nginx answers 404 and the
    # app never loads. try_files serves index.html for any unmatched path so
    # the router can resolve it in the browser instead.
    #
    # $uri first, so a real file (main-*.js, styles-*.css) still wins and a
    # missing asset stays a genuine 404 rather than silently returning HTML.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Caching, keyed on Angular's output hashing ──────────────────────────
    # `outputHashing: "all"` (angular.json, production) puts a content hash in
    # every asset filename, so a changed file is a NEW url and can be cached
    # immutably — a rebuild invalidates by renaming, not by expiry.
    #
    # `expires off` + a single add_header, NOT `expires 1y`: `expires` emits its
    # own `Cache-Control: max-age=…`, so pairing the two sent TWO Cache-Control
    # headers (verified: `max-age=31536000` and `public, immutable` as separate
    # lines). They do not contradict each other, but a client that reads only
    # the first silently loses `immutable`. max-age is written into the one
    # header instead.
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Assets are hashed, so a 404 here means a stale index.html is asking
        # for a chunk this image does not have. Let it 404 honestly rather than
        # falling back to index.html, which would hand the browser HTML with a
        # .js content-type and produce a confusing MIME/syntax error instead.
        try_files $uri =404;
    }

    # index.html is NOT hashed (it is the entry point that names the hashed
    # files), so it must never be cached: a cached copy would keep pointing at
    # the previous build's chunks after a redeploy, which 404 under the rule
    # above and leave a blank page.
    #
    # `add_header` only, deliberately — NOT paired with `expires`. `expires -1`
    # emits its own `Cache-Control: no-cache`, so having both sent TWO
    # Cache-Control headers on every response (verified: `no-cache` and
    # `no-store, must-revalidate` together), leaving which one applies up to the
    # caching intermediary. `expires off` below suppresses nginx's header so
    # exactly one is sent.
    location = /index.html {
        expires off;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Compress on the fly. The image ships no pre-compressed .gz siblings, and
    # text/html is always compressed by nginx (it is not listed in gzip_types).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
