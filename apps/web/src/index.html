    <!-- CONTRACT: This block stays INLINE — no <link>, nothing moved to styles.css.
         An external stylesheet is fetched after the HTML, so the white first paint
         this loader exists to cover has already happened by the time it arrives.
         CONTRACT: #2D3748 mirrors --color-brand-navy in styles.css and is the one
         hard-coded hex the app allows; that token lives in a stylesheet that has not
         loaded yet. Change one and change the other, or the loader flashes a
         different navy than the app it hands over to. -->
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #2D3748;
        opacity: 1;
        transition: opacity 200ms ease;
      }
      /* WHY: The mark is a data URI, not /img/standalone-logo.png — a second
         request resolves after the flash it is meant to cover. */
      #boot-loader .boot-loader-lockup {
        display: flex;
        align-items: center;
        gap: 1.25rem;
        animation: boot-loader-pulse 1.4s ease-in-out infinite;
      }
      /* WHY: A white tile behind the mark, mirroring app-logo-lockup. The cube's
         faces are near-navy, so straight on this background only its orange edge
         survives and the shape reads as a stray fragment. */
      #boot-loader .boot-loader-tile {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 5rem;
        height: 5rem;
        border-radius: 1.375rem;
        background: #FFFFFF;
      }
      #boot-loader img {
        width: 3.75rem;
        height: 3.75rem;
      }
      /* CONTRACT: These mirror the tokens app-logo-lockup uses — #FFFFFF is
         --color-surface-white and #F7941D is --color-brand-orange. They are
         literals only because styles.css has not loaded at first paint. */
      #boot-loader .boot-loader-wordmark {
        display: flex;
        align-items: center;
        font-family: Inter, system-ui, sans-serif;
        font-size: 2.75rem;
        font-weight: 800;
        letter-spacing: -0.03rem;
        line-height: 1;
      }
      #boot-loader .boot-loader-wordmark .boot-loader-3m { color: #FFFFFF; }
      #boot-loader .boot-loader-wordmark .boot-loader-rai { color: #F7941D; }
      /* Removed by the teardown below; the class only drives the fade. */
      #boot-loader.boot-loader-done {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes boot-loader-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }
      /* WARNING: Reduced motion is a medical setting (vestibular disorders,
         migraine), not a taste preference. The pulse is dropped outright; the
         fade-out is a plain opacity change and stays. */
      @media (prefers-reduced-motion: reduce) {
        #boot-loader .boot-loader-lockup { animation: none; }
      }
    </style>
  </head>

         Angular's own teardown (boot-loader.ts) is the normal path and fires after
         first render; this timeout is the last resort for a bundle that 404s or
         throws before bootstrap, whose only other outcome is a navy screen forever
         with no error visible. 8s is far past a healthy boot, so it never races the
         normal path. -->
    <script>
      setTimeout(function () {
        var el = document.getElementById('boot-loader');
        if (el) el.remove();
      }, 8000);
    </script>
  </body>
</html>
