<div class="bg-surface-white flex h-fit w-full flex-col items-start justify-start gap-0 overflow-hidden">
  <div class="bg-surface-white flex w-full flex-1 flex-col items-start justify-start gap-5 p-5 md:gap-7 md:p-9">
    <div class="flex h-fit w-full shrink-0 flex-col items-start justify-between gap-4 md:flex-row md:items-end md:gap-0">
      <div class="flex h-fit w-fit shrink-0 flex-col items-start justify-start gap-2xs">
        <h1 class="text-ink-primary text-2xl font-bold tracking-[-0.7px] md:text-display">New arrivals</h1>
        <p class="text-ink-secondary text-sm">{{ products.length }} products · updated today</p>
      </div>
      <div class="flex h-fit w-full flex-row flex-wrap items-center justify-start gap-md md:w-fit">
        <span class="bg-brand-navy border-brand-navy text-surface-white flex h-control w-fit shrink-0 flex-row items-center justify-start rounded-full border px-icon text-body font-semibold">
          All
        </span>
        @for (category of categories; track category) {
          <span class="border-line-strong text-ink-secondary flex h-control w-fit shrink-0 flex-row items-center justify-start rounded-full border px-icon text-body">
            {{ category }}
          </span>
        }
        <span class="border-line-strong text-ink-primary flex h-control w-fit shrink-0 flex-row items-center justify-start gap-2 rounded-full border px-2xl text-body">
          Featured
          <svg lucideChevronDown class="text-ink-secondary h-icon-sm w-icon-sm"></svg>
        </span>
      </div>
    </div>

    <div class="grid w-full grid-cols-2 gap-3 md:grid-cols-4 md:gap-6">
      @for (product of products; track product.id) {
        <app-product-card [product]="product" />
      }
    </div>
  </div>
</div>

@if (overlay.active() === 'cart' || overlay.active() === 'cart-payment') {
  <app-cart-drawer
    [step]="overlay.active() === 'cart-payment' ? 'payment' : 'cart'"
    [address]="savedAddress"
  />
}
