<div class="flex h-fit w-full shrink-0 flex-col items-start justify-start gap-2xl">
  @if (loading()) {
    <p class="text-ink-secondary text-body-sm w-full" aria-busy="true">Loading your cards…</p>
  }

  @if (cardsError(); as message) {
    <p data-testid="cards-error" class="text-danger-red text-body-sm w-full" role="alert">
      {{ message }}
    </p>
  }

  @if (showNewCardBlock()) {
    <app-new-card-block
      data-testid="new-card-block"
      (cancelled)="closeNewCard()"
      (confirmed)="onCardConfirmed($event)"
    />
  } @else {
    <div
      data-testid="saved-cards-list"
      class="flex h-fit w-full shrink-0 flex-col items-start justify-start gap-md"
      role="radiogroup"
      aria-label="Saved cards"
    >
      @for (entry of entries(); track entry.card.id) {
        <app-saved-card-row
          [card]="entry.card"
          [selected]="entry.card.id === selectedId()"
          [expired]="entry.expired"
          (cardSelected)="onSelect($event)"
          (setDefault)="onSetDefault($event)"
          (remove)="onRemove($event)"
        />
      }
    </div>

    <app-button-ghost
      data-testid="add-card-button"
      label="Add card"
      icon="plus"
      [compact]="true"
      (clicked)="openNewCard()"
    />
  }

  <div class="bg-line h-px w-full shrink-0"></div>

  <div class="flex h-fit w-full shrink-0 flex-row items-center justify-center gap-2xs">
    <span class="text-ink-muted text-xs whitespace-nowrap">Powered by</span>
    <span class="text-ink-secondary text-body-sm font-bold whitespace-nowrap">Stripe</span>
  </div>
</div>
