<!-- Mobile: full-bleed click-catcher behind the sheet; paints nothing. -->
<div
  class="fixed inset-0 z-50 md:hidden"
  role="presentation"
  (click)="overlay.close()"
></div>

<div
  class="border-line bg-surface-white fixed inset-x-0 bottom-0 z-50 flex h-fit w-full flex-col items-start justify-start gap-xs rounded-t-sheet border-t p-3 pb-5xl shadow-[0px_-8px_32px_0px_#1A1A2E33] md:inset-x-auto md:top-header-offset md:right-6 md:bottom-auto md:w-65 md:gap-hairline md:rounded-xl md:border md:p-2 md:pb-2 md:shadow-[0px_12px_32px_0px_#1A1A2E29]"
>
  <!-- Grabber: mobile-only affordance, absent from the desktop dropdown. -->
  <div class="flex h-fit w-full shrink-0 flex-row items-center justify-center pt-1 pb-2 md:hidden">
    <div class="bg-line-strong h-1 w-10 shrink-0 rounded-full"></div>
  </div>

  <div class="flex h-fit w-full shrink-0 flex-col items-start justify-start gap-rule pt-xs px-3 pb-3 md:py-md md:px-3">
    <div class="text-ink-primary text-base font-semibold whitespace-nowrap md:text-body-lg">{{ user.fullName }}</div>
    <div class="text-ink-secondary text-body whitespace-nowrap md:text-body-sm">{{ user.email }}</div>
  </div>

  <div class="bg-line h-px w-full shrink-0"></div>

  <button
    type="button"
    class="flex h-control-xl w-full shrink-0 flex-row items-center justify-start gap-lg rounded-lg px-3 md:h-control-md"
    [class.bg-surface-subtle]="isActive()('/profile')"
    (click)="goTo('/profile')"
  >
    <svg lucideUser class="text-ink-primary h-icon-md w-icon-md md:h-icon md:w-icon"></svg>
    <span class="text-ink-primary text-label md:text-sm">Profile</span>
  </button>

  <button
    type="button"
    class="flex h-control-xl w-full shrink-0 flex-row items-center justify-start gap-lg rounded-lg px-3 md:h-control-md"
    [class.bg-surface-subtle]="isActive()('/orders')"
    (click)="goTo('/orders')"
  >
    <svg lucidePackage class="text-ink-primary h-icon-md w-icon-md md:h-icon md:w-icon"></svg>
    <span class="text-ink-primary text-label md:text-sm">My orders</span>
  </button>

  <div class="bg-line h-px w-full shrink-0"></div>

  <button
    type="button"
    class="flex h-control-xl w-full shrink-0 flex-row items-center justify-start gap-lg rounded-lg px-3 md:h-control-md"
    (click)="signOut()"
  >
    <svg lucideLogOut class="text-danger-red h-icon-md w-icon-md md:h-icon md:w-icon"></svg>
    <span class="text-danger-red text-label font-semibold md:text-sm">Sign out</span>
  </button>
</div>
