<section class="flex flex-1 flex-col items-center justify-center px-6 py-10 lg:px-10">
  <form
    class="flex w-full max-w-120 flex-col gap-4xl lg:gap-7"
    (submit)="$event.preventDefault()"
  >
    <a routerLink="/login" class="text-ink-secondary inline-flex w-fit items-center gap-sm">
      <svg lucideArrowLeft class="h-4 w-4"></svg>
      <span class="text-sm font-semibold">Back to sign in</span>
    </a>

    <div class="flex flex-col gap-2 lg:gap-2.5">
      <h1 class="font-heading text-ink-primary text-display-sm font-bold tracking-tight lg:text-display-lg">
        Reset your password
      </h1>
      <p class="font-body text-ink-secondary text-body-lg leading-[1.55] lg:text-base">
        Enter the email on your account and we'll send you a 6-digit code to set a new password.
      </p>
    </div>

    <app-field
      label="Email"
      type="email"
      icon="mail"
      placeholder="you@example.com"
      help="The code expires 10 minutes after it is sent."
    />

    <app-button-primary label="Send reset code" icon="arrow-right" />

    <p class="flex w-full justify-center gap-2xs text-body-lg lg:text-label">
      <span class="text-ink-secondary">Remembered your password?</span>
      <a routerLink="/login" class="text-brand-navy font-semibold">Sign in</a>
    </p>
  </form>
</section>
