<section class="flex flex-1 flex-col items-center justify-center px-6 py-10 lg:px-10">
  <form class="flex w-full max-w-120 flex-col gap-6" (submit)="$event.preventDefault(); submit()">
    <a routerLink="/register" class="text-ink-secondary inline-flex w-fit items-center gap-sm">
      <svg lucideArrowLeft class="h-4 w-4"></svg>
      <span class="text-sm font-semibold">Back to sign up</span>
    </a>

    <div class="flex flex-col gap-2.5">
      <h1 class="font-heading text-ink-primary text-display-sm font-bold tracking-tight lg:text-display-lg">
        Sign up with just your email
      </h1>
      <p class="font-body text-ink-secondary text-body-lg leading-[1.55] lg:text-base">
        No password to create. We'll send a 6-digit code to confirm it's you.
      </p>
    </div>

    <div class="flex w-full flex-col gap-4">
      <app-field
        label="Full name"
        icon="user"
        placeholder="Jose Martinez"
        [value]="fullName()"
        (valueChange)="fullName.set($event)"
      />
      <app-field
        label="Email"
        type="email"
        icon="mail"
        placeholder="you@example.com"
        [value]="email()"
        (valueChange)="email.set($event)"
      />
    </div>

    <label class="flex w-full items-center gap-base">
      <input type="checkbox" class="sr-only" [checked]="accepted()" (change)="accepted.set(!accepted())" />
      <span
        class="flex h-3xl w-3xl shrink-0 items-center justify-center rounded"
        [class]="accepted() ? 'bg-brand-navy' : 'border border-line-strong'"
      >
        @if (accepted()) {
          <svg lucideCheck class="text-surface-white h-3 w-3"></svg>
        }
      </span>
      <span class="text-sm">
        <span class="text-ink-secondary">I agree to the</span>
        <span class="text-brand-navy font-semibold"> Terms </span>
        <span class="text-ink-secondary">and</span>
        <span class="text-brand-navy font-semibold"> Privacy Policy</span>
      </span>
    </label>

    @if (error(); as message) {
      <p role="alert" class="text-danger-red w-full text-body-lg">{{ message }}</p>
    }

    <app-button-primary
      [label]="submitting() ? 'Sending…' : 'Send me a code'"
      icon="arrow-right"
      [disabled]="submitting()"
      (clicked)="submit()"
    />

    <div class="bg-brand-orange-light flex w-full items-center gap-md rounded-md p-3.5">
      <svg lucideInfo class="text-brand-orange h-4 w-4 shrink-0"></svg>
      <p class="text-ink-on-orange-light flex-1 text-body leading-[1.5]">
        You can add a password later from your account settings.
      </p>
    </div>

    <div class="flex w-full items-center gap-2xl">
      <span class="bg-line h-px flex-1"></span>
      <span class="text-ink-muted text-body-sm">or</span>
      <span class="bg-line h-px flex-1"></span>
    </div>

    <a routerLink="/register" class="block w-full">
      <app-button-ghost label="Use email and password" icon="lock" />
    </a>

    <p class="flex w-full justify-center gap-2xs text-label">
      <span class="text-ink-secondary">Already have an account?</span>
      <a routerLink="/login" class="text-brand-navy font-semibold">Sign in</a>
    </p>
  </form>
</section>
