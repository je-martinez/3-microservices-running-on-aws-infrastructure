<header
  class="border-line bg-surface-white flex h-15 w-full items-center justify-between border-b px-5 md:h-19 md:px-12"
>
  <!--
    CONTRACT: The logo group stays `min-w-0` and the lockup's wordmark hides below
    360px. The design's narrowest frame is 390px (`Mobile App Header`), where the
    20px padding, the 107px lockup and the 219px control group leave 15px of slack;
    at 320px the same row needs 366px and pushes the cart button 27px past the
    viewport edge, clipping it. Nothing in the control group is decorative, so the
    wordmark is what yields. See [[angular-component-authoring]]
  -->
  <div class="flex min-w-0 items-center gap-10">
    <!-- WHY: The lockup links home here, and only here. The auth screens show the
         same component with nowhere to go back to. -->
    <a routerLink="/" aria-label="3MRAI home" class="inline-flex w-fit shrink-0">
      <app-logo-lockup [hideWordmarkOnTiny]="true" />
    </a>
  </div>

  <div class="flex shrink-0 items-center gap-md md:gap-2xl">
    <!-- Desktop: full search field. Filters the loaded catalogue in the
         browser; there is no search endpoint and none is called. -->
    <div
      class="border-line bg-surface-subtle hidden h-11 w-65 items-center gap-md rounded-md border px-2xl md:flex"
    >
      <svg lucideSearch class="text-ink-muted text-subtitle"></svg>
      <input
        type="search"
        aria-label="Search products"
        placeholder="Search products"
        class="text-ink-primary placeholder:text-ink-muted w-full bg-transparent text-sm outline-none"
        [value]="search.query()"
        (input)="onSearch($event)"
      />
    </div>

    <!-- Mobile: the magnifier reveals the field rather than emitting nowhere. -->
    <button
      type="button"
      aria-label="Search products"
      [attr.aria-expanded]="search.expandedOnMobile()"
      class="border-line text-brand-navy flex h-10 w-10 items-center justify-center rounded-md border md:hidden"
      (click)="search.toggleMobileField()"
    >
      <svg lucideSearch class="text-lg"></svg>
    </button>

    <button
      type="button"
      class="border-line text-brand-navy relative flex h-10 w-10 items-center justify-center rounded-md border md:h-11 md:w-11"
      (click)="notificationsClicked.emit()"
    >
      <svg lucideBell class="text-lg md:text-title"></svg>
      @if (hasUnreadNotifications()) {
        <span
          class="bg-brand-orange border-surface-white absolute top-sm right-sm h-base w-base rounded-full border-[1.5px] md:top-base md:right-base"
        ></span>
      }
    </button>

    <button
      type="button"
      class="border-line text-brand-navy flex h-10 w-10 items-center justify-center rounded-md border md:h-11 md:w-11"
      (click)="profileClicked.emit()"
    >
      <svg lucideUser class="text-lg md:text-title"></svg>
    </button>

    <button
      type="button"
      class="bg-brand-navy text-surface-white flex h-10 items-center gap-2 rounded-md px-2xl text-sm font-semibold md:h-11 md:gap-base md:px-4"
      (click)="cartClicked.emit()"
    >
      <svg lucideShoppingBag class="text-subtitle md:text-lg"></svg>
      {{ cartCount() }}
    </button>
  </div>

  @if (search.expandedOnMobile()) {
    <div
      class="border-line bg-surface-subtle mt-md flex h-11 w-full items-center gap-md rounded-md border px-2xl md:hidden"
    >
      <svg lucideSearch class="text-ink-muted text-subtitle"></svg>
      <input
        type="search"
        aria-label="Search products"
        placeholder="Search products"
        class="text-ink-primary placeholder:text-ink-muted w-full bg-transparent text-sm outline-none"
        [value]="search.query()"
        (input)="onSearch($event)"
      />
    </div>
  }
</header>
