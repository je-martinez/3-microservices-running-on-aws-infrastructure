<router-outlet />
@if (overlay.hasScrim()) {
  <app-scrim (dismiss)="overlay.close()" />
}
@if (overlay.active() === 'account-menu') {
  <app-account-menu [liveState]="socket.liveState()" (retryRequested)="socket.retryNow()" />
}
@if (overlay.active() === 'notifications') {
  <app-notifications-panel />
}
