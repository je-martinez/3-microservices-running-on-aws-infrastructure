<button
  type="button"
  class="h-field bg-brand-orange rounded-md text-surface-white inline-flex w-full items-center justify-center gap-md text-base font-semibold"
  [disabled]="disabled()"
  [class.opacity-50]="disabled()"
  (click)="clicked.emit()"
>
  {{ label() }}
  @if (icon(); as iconName) {
    <svg [lucideIcon]="iconName" class="text-title"></svg>
  }
</button>
