<label class="flex h-fit w-full flex-col gap-2">
  <span class="text-ink-primary text-sm font-semibold">{{ label() }}</span>
  <span
    class="h-field bg-surface-white flex w-full items-center gap-xl rounded-md border px-3xl"
    [class.border-line]="!visibleError()"
    [class.border-danger-red]="visibleError()"
  >
    @if (icon(); as iconName) {
      <svg [lucideIcon]="iconName" class="text-ink-muted shrink-0 text-title"></svg>
    }
    <input
      class="text-ink-primary placeholder:text-ink-muted w-full flex-1 border-0 bg-transparent text-base outline-none"
      [type]="nativeType()"
      [attr.inputmode]="type() === 'numeric' ? 'numeric' : null"
      [attr.autocomplete]="autocomplete()"
      [attr.maxlength]="maxLength()"
      [attr.aria-invalid]="visibleError() ? 'true' : null"
      [attr.aria-required]="required() ? 'true' : null"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [value]="value()"
      (input)="onInput($any($event.target))"
    />
    @if (trailingIcon(); as trailingIconName) {
      <button
        type="button"
        class="text-ink-muted shrink-0 text-title"
        (click)="trailingIconClick.emit()"
      >
        <svg [lucideIcon]="trailingIconName"></svg>
      </button>
    }
  </span>
  @if (visibleError(); as message) {
    <span role="alert" class="text-danger-red text-body-sm">{{ message }}</span>
  } @else if (help(); as helpText) {
    <span class="text-ink-secondary text-body-sm">{{ helpText }}</span>
  }
</label>
