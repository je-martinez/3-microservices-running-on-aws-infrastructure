<article
  class="border-line bg-surface-white flex h-fit w-full flex-col items-start justify-start gap-[0.8125rem] rounded-xl border p-4 md:gap-4 md:p-5"
>
  <div class="flex h-fit w-full shrink-0 flex-row items-center justify-between">
    <div class="flex h-fit w-fit shrink-0 flex-col items-start justify-start gap-[0.1875rem] md:gap-1">
      <div class="text-ink-primary text-[0.9375rem] font-semibold whitespace-nowrap md:text-[0.96875rem]">
        {{ entry().order.id }}
      </div>
      <div class="text-ink-secondary text-[0.8125rem] whitespace-nowrap md:text-[0.84375rem]">
        {{ placedLabel() }}
      </div>
    </div>

    <!-- Desktop: status badge + total + chevron together on the right. -->
    <div class="hidden h-fit w-fit shrink-0 flex-row items-center justify-start gap-4 md:flex">
      @if (entry().tracking; as tracking) {
        <app-status-badge [status]="tracking.status" />
      }
      <span class="text-ink-primary text-lg font-bold tracking-[-0.01875rem] whitespace-nowrap">{{
        total()
      }}</span>
      <svg lucideChevronRight class="text-ink-muted h-[1.125rem] w-[1.125rem]"></svg>
    </div>
  </div>

  <!-- Mobile: status badge and total on their own row (no chevron). -->
  <div class="flex h-fit w-full shrink-0 flex-row items-center justify-between md:hidden">
    @if (entry().tracking; as tracking) {
      <app-status-badge [status]="tracking.status" />
    } @else {
      <span></span>
    }
    <span class="text-ink-primary text-lg font-bold tracking-[-0.01875rem] whitespace-nowrap">{{
      total()
    }}</span>
  </div>

  <div class="bg-line h-px w-full shrink-0"></div>

  <div class="flex h-fit w-full shrink-0 flex-row items-center justify-between">
    <div class="flex h-fit w-fit shrink-0 flex-row items-center justify-start gap-2">
      @for (line of lines(); track line.productId) {
        <div class="bg-surface-subtle h-[2.875rem] w-[2.875rem] shrink-0 rounded-lg md:h-[3.25rem] md:w-[3.25rem]"></div>
      }
    </div>
    <button
      type="button"
      class="border-line-strong text-brand-navy flex h-9 w-fit shrink-0 flex-row items-center justify-start rounded-lg border px-[0.875rem] text-[0.84375rem] font-semibold md:h-[2.375rem] md:px-[0.9375rem]"
    >
      View details
    </button>
  </div>
</article>
