<div
  class="border-line bg-surface-white fixed top-24 right-6 z-50 flex h-fit w-100 max-w-[calc(100vw-2rem)] flex-col items-start justify-start gap-0 overflow-hidden rounded-xl border shadow-[0px_10px_30px_0px_#1A1A2E29]"
>
  <div class="flex h-fit w-full shrink-0 flex-row items-start justify-start gap-3 p-4">
    @if (notification().status; as status) {
      <app-tracking-status-icon [status]="status" />
    } @else {
      <span
        class="bg-surface-subtle inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-full"
      >
        <svg lucideIcon="bell" class="text-ink-secondary h-3xl w-3xl"></svg>
      </span>
    }

    <div class="flex h-fit flex-1 flex-col items-start justify-start gap-1">
      <div class="text-ink-muted text-eyebrow font-semibold tracking-eyebrow whitespace-nowrap">
        ORDER UPDATE
      </div>
      <div class="text-ink-primary text-body-lg font-semibold whitespace-nowrap">
        {{ notification().title }}
      </div>
      <div class="text-ink-secondary w-full text-body-sm leading-body-sm">
        {{ notification().body }}
      </div>
      <div class="flex h-fit w-fit shrink-0 flex-row items-center justify-start gap-4 pt-xs">
        <button
          type="button"
          class="text-brand-navy text-body-sm font-semibold whitespace-nowrap"
          (click)="viewOrder.emit()"
        >
          View order
        </button>
        <button
          type="button"
          class="text-ink-secondary text-body-sm whitespace-nowrap"
          (click)="dismissed.emit()"
        >
          Dismiss
        </button>
      </div>
    </div>

    <button
      type="button"
      class="flex h-6 w-6 shrink-0 flex-row items-center justify-center rounded-md"
      (click)="dismissed.emit()"
    >
      <svg lucideX class="text-ink-muted h-icon-sm w-icon-sm"></svg>
    </button>
  </div>

  <!-- Progress Track / Progress Fill: the design shows this partially
       drained (auto-dismiss countdown). Phase 1 has no timer driving it,
       so it renders full — a host adding a real timer animates the
       fill's width down to 0 over the toast's lifetime. -->
  <div class="bg-line flex h-rule w-full shrink-0 flex-row items-start justify-start">
    <div class="bg-brand-orange h-rule w-full shrink-0"></div>
  </div>
</div>
