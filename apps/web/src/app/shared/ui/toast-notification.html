<div
  data-testid="toast"
  class="border-line bg-surface-white fixed top-24 right-6 z-50 flex h-fit w-100 max-w-[calc(100vw-2rem)] flex-col items-start justify-start gap-0 overflow-hidden rounded-xl border shadow-[0px_10px_30px_0px_#1A1A2E29]"
  (mouseenter)="hold(true)"
  (mouseleave)="hold(false)"
  (focusin)="hold(true)"
  (focusout)="hold(false)"
>
  <div class="flex h-fit w-full shrink-0 flex-row items-start justify-start gap-3 p-4">
    <span
      data-testid="icon-bubble"
      class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-full"
      [class]="visual().bubble"
    >
      <svg [lucideIcon]="visual().icon" class="h-3xl w-3xl" [class]="visual().iconColor"></svg>
    </span>

    <div class="flex h-fit flex-1 flex-col items-start justify-start gap-1">
      <div
        data-testid="toast-eyebrow"
        class="text-ink-muted text-eyebrow tracking-eyebrow font-semibold whitespace-nowrap"
      >
        {{ eyebrow() }}
      </div>
      <div class="text-ink-primary text-body-lg font-semibold whitespace-nowrap">
        {{ notification().title }}
      </div>
      <div class="text-ink-secondary text-body-sm leading-body-sm w-full">
        {{ notification().body }}
      </div>
      <div class="pt-xs flex h-fit w-fit shrink-0 flex-row items-center justify-start gap-4">
        <button
          data-testid="toast-cta"
          type="button"
          class="text-brand-navy text-body-sm font-semibold whitespace-nowrap"
          (click)="viewOrder.emit()"
        >
          {{ ctaLabel() }}
        </button>
        <button
          type="button"
          class="text-ink-secondary text-body-sm whitespace-nowrap"
          (click)="dismissed.emit()"
        >
          Dismiss
        </button>
      </div>
    </div>

    <button
      data-testid="toast-close"
      type="button"
      class="flex h-6 w-6 shrink-0 flex-row items-center justify-center rounded-md"
      aria-label="Dismiss notification"
      (click)="dismissed.emit()"
    >
      <svg lucideX class="text-ink-muted h-icon-sm w-icon-sm"></svg>
    </button>
  </div>

  <div class="bg-line flex h-rule w-full shrink-0 flex-row items-start justify-start">
    <div
      data-testid="toast-progress"
      class="toast-progress bg-brand-orange h-rule shrink-0"
      [style.animation-duration.ms]="dismissMs"
      [attr.data-paused]="held()"
    ></div>
  </div>
</div>
