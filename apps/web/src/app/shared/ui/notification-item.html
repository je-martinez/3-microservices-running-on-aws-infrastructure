<div
  data-testid="notification-row"
  class="flex h-fit w-full shrink-0 flex-row items-center justify-start gap-3 rounded-md p-2xl"
  [class]="showsUnread() ? 'bg-surface-subtle' : ''"
>
  <span
    data-testid="icon-bubble"
    class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-full"
    [class]="visual().bubble"
  >
    <svg [lucideIcon]="visual().icon" class="h-3xl w-3xl" [class]="visual().iconColor"></svg>
  </span>

  <div class="flex h-fit flex-1 flex-col items-start justify-start gap-rule">
    <div class="text-ink-primary text-body-lg font-semibold whitespace-nowrap">
      {{ notification().title }}
    </div>
    <div class="text-ink-secondary text-body-sm leading-body-sm w-full">
      {{ notification().body }}
    </div>
    <div data-testid="group-time" class="text-ink-muted text-xs whitespace-nowrap">
      {{ time() }}
    </div>
  </div>

  @if (showsUnread()) {
    <div
      data-testid="unread-dot"
      class="bg-brand-orange h-base w-base shrink-0 rounded-full"
      aria-label="Unread"
    ></div>
  }
</div>
