<div
  class="flex h-fit w-full shrink-0 flex-row items-center justify-start gap-3 rounded-[0.625rem] p-[0.875rem]"
  [class]="notification().read ? '' : 'bg-surface-subtle'"
>
  @if (notification().status; as status) {
    <app-tracking-status-icon [status]="status" />
  } @else {
    <span
      class="bg-surface-subtle inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-full"
    >
      <svg lucideIcon="bell" class="text-ink-secondary h-[1.125rem] w-[1.125rem]"></svg>
    </span>
  }

  <div class="flex h-fit flex-1 flex-col items-start justify-start gap-[0.1875rem]">
    <div class="text-ink-primary text-[0.90625rem] font-semibold whitespace-nowrap">
      {{ notification().title }}
    </div>
    <div class="text-ink-secondary w-full text-[0.8125rem] leading-[1.1875rem]">
      {{ notification().body }}
    </div>
    <div class="text-ink-muted text-xs whitespace-nowrap">{{ timeLabel() }}</div>
  </div>

  @if (!notification().read) {
    <div class="bg-brand-orange h-[0.5625rem] w-[0.5625rem] shrink-0 rounded-full"></div>
  }
</div>
