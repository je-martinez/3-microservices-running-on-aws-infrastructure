<div class="bg-success-bg flex h-fit w-full flex-row items-center justify-start gap-3 rounded-md py-2xl pr-3 pl-4">
  <svg lucideCircleCheck class="text-success-ink h-icon-lg w-icon-lg shrink-0"></svg>
  <div class="flex h-fit min-w-0 flex-1 flex-col items-start justify-start gap-0.5">
    <span class="text-success-ink font-heading text-label font-bold tracking-[-0.0125rem]">
      {{ heading() }}
    </span>
    <span class="text-success-ink font-body text-body-sm leading-normal">
      {{ message() }}
    </span>
  </div>
  <button
    type="button"
    aria-label="Dismiss"
    class="text-success-ink flex h-7 w-7 shrink-0 flex-row items-center justify-center rounded-[0.375rem]"
    [attr.data-testid]="dismissTestId()"
    (click)="dismiss()"
  >
    <svg lucideX class="h-4 w-4"></svg>
  </button>
</div>
