openapi: '3.1.1'
info:
  title: Orders Service API
  version: v1
paths:
  /v1/orders:
    post:
      tags:
        - Orders
      summary: 'Create an order for the caller, decrementing product stock.'
      operationId: CreateOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '409':
          description: Conflict
  /v1/orders/my-orders:
    get:
      tags:
        - Orders
      summary: List the caller's orders (ownership by cognito_sub); optionally with each order's tracking.
      operationId: GetMyOrders
      parameters:
        - name: includeTracking
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderWithTrackingDto'
        '401':
          description: Unauthorized
  '/v1/orders/{orderId}':
    get:
      tags:
        - Orders
      summary: Get one of the caller's orders by id; another user's order returns 404. Optionally includes its tracking.
      operationId: GetOrderById
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
        - name: includeTracking
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderWithTrackingDto'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
  /v1/health:
    get:
      tags:
        - Orders
      summary: Liveness probe.
      operationId: Health
      responses:
        '200':
          description: OK
  /v1/orders/e2e-cleanup:
    delete:
      tags:
        - Orders
      summary: Soft-delete every order tagged "E2E Source" and restore seed stock (only mapped when E2E_TESTING_ENABLED).
      operationId: E2eCleanup
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/E2eCleanupResponse'
  /v1/products:
    get:
      tags:
        - Products
      summary: List the active product catalog.
      operationId: GetProducts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductDto'
        '401':
          description: Unauthorized
components:
  schemas:
    CreateOrderLine:
      required:
        - productId
        - quantity
      type: object
      properties:
        productId:
          type: string
        quantity:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: uint32
    CreateOrderRequest:
      required:
        - lines
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CreateOrderLine'
    E2eCleanupResponse:
      required:
        - deleted
        - deletedDetails
        - restocked
      type: object
      properties:
        deleted:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        deletedDetails:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        restocked:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
    OrderDto:
      required:
        - id
        - userId
        - cognitoSub
        - subtotalCents
        - taxCents
        - shippingCents
        - totalCents
        - createdAt
        - lines
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        cognitoSub:
          type: string
        subtotalCents:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int64
        taxCents:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int64
        shippingCents:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int64
        totalCents:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int64
        createdAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineDto'
    OrderLineDto:
      required:
        - productId
        - quantity
        - subtotalCents
        - taxCents
        - totalCents
      type: object
      properties:
        productId:
          type: string
        quantity:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: uint32
        subtotalCents:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int64
        taxCents:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int64
        totalCents:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int64
    OrderWithTrackingDto:
      required:
        - order
        - tracking
      type: object
      properties:
        order:
          $ref: '#/components/schemas/OrderDto'
        tracking:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/TrackingDto'
    ProductDto:
      required:
        - id
        - name
        - description
        - unitPriceCents
        - unitsInStock
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        unitPriceCents:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int64
        unitsInStock:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: uint32
    TrackingDto:
      required:
        - id
        - user_id
        - order_id
        - status
        - datetime
        - history
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        order_id:
          type: string
        status:
          type: string
        datetime:
          type: string
        history:
          type: array
          items:
            $ref: '#/components/schemas/TrackingHistoryEntryDto'
    TrackingHistoryEntryDto:
      required:
        - tracking_id
        - user_id
        - order_id
        - status
        - datetime
      type: object
      properties:
        tracking_id:
          type: string
        user_id:
          type: string
        order_id:
          type: string
        status:
          type: string
        datetime:
          type: string
tags:
  - name: Orders
  - name: Products