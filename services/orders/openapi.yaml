openapi: '3.1.1'
info:
  title: Orders Service API
  description: 'HTTP API for the 3MRAI Orders microservice (.NET Minimal APIs + Aurora MySQL). Identity is enforced at the API Gateway authorizer, which forwards the Cognito subject as the x-user-id header.'
  version: 1.0.0
servers:
  - url: http://localhost:3001
    description: Local (docker compose / Floci)
paths:
  /v1/orders:
    post:
      tags:
        - Orders
      summary: 'Create an order for the caller, decrementing product stock.'
      operationId: CreateOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '409':
          description: Conflict
  /v1/orders/my-orders:
    get:
      tags:
        - Orders
      summary: List the caller's orders (ownership by cognito_sub); optionally with each order's tracking.
      operationId: GetMyOrders
      parameters:
        - name: includeTracking
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderWithTrackingDto'
        '401':
          description: Unauthorized
  '/v1/orders/{orderId}':
    get:
      tags:
        - Orders
      summary: Get one of the caller's orders by id; another user's order returns 404. Optionally includes its tracking.
      operationId: GetOrderById
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
        - name: includeTracking
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderWithTrackingDto'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
  /v1/health:
    get:
      tags:
        - health
      summary: Liveness probe.
      operationId: Health
      responses:
        '200':
          description: OK
  /v1/orders/by-user:
    delete:
      tags:
        - internal
      summary: '[Internal] Soft-delete every order, line and cart belonging to a user.'
      operationId: InternalDeleteByUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalDeleteByUserRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalDeleteResponse'
        '401':
          description: Unauthorized
  /v1/orders/e2e-cleanup:
    delete:
      tags:
        - e2e
      summary: Soft-delete every order tagged "E2E Source" and restore seed stock (only mapped when E2E_TESTING_ENABLED).
      operationId: E2eCleanup
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/E2eCleanupResponse'
  /v1/products:
    get:
      tags:
        - Products
      summary: List the active product catalog.
      operationId: GetProducts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductDto'
        '401':
          description: Unauthorized
  /v1/cart:
    get:
      tags:
        - Cart
      summary: 'Read the caller''s active cart, fully priced and calculated.'
      operationId: GetMyCart
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDto'
        '401':
          description: Unauthorized
    put:
      tags:
        - Cart
      summary: Replace the caller's cart lines; an empty set deletes the cart.
      operationId: UpdateCart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDto'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
    delete:
      tags:
        - Cart
      summary: Delete the caller's active cart and all its lines.
      operationId: DeleteCart
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
components:
  schemas:
    CartDto:
      required:
        - id
        - items
        - subtotal
        - tax
        - shipping
        - total
        - canCheckout
      type: object
      properties:
        id:
          type:
            - 'null'
            - string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartLineDto'
        subtotal:
          $ref: '#/components/schemas/Money'
        tax:
          $ref: '#/components/schemas/Money'
        shipping:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        canCheckout:
          type: boolean
    CartLineDto:
      required:
        - productId
        - name
        - quantity
        - unitsInStock
        - available
        - unitPrice
        - subtotal
        - image
        - unavailableReason
      type: object
      properties:
        productId:
          type: string
        name:
          type:
            - 'null'
            - string
        quantity:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: uint32
        unitsInStock:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: uint32
        available:
          type: boolean
        unitPrice:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Money'
        subtotal:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Money'
        image:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ProductImageDto'
        unavailableReason:
          type:
            - 'null'
            - string
    CreateOrderLine:
      required:
        - productId
        - quantity
      type: object
      properties:
        productId:
          type: string
        quantity:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: uint32
    CreateOrderRequest:
      required:
        - lines
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CreateOrderLine'
    E2eCleanupResponse:
      required:
        - deleted
        - deletedDetails
        - restocked
      type: object
      properties:
        deleted:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        deletedDetails:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        restocked:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
    InternalDeleteByUserRequest:
      required:
        - cognitoSub
      type: object
      properties:
        cognitoSub:
          type: string
    InternalDeleteResponse:
      required:
        - deleted
        - deletedDetails
        - deletedCarts
      type: object
      properties:
        deleted:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        deletedDetails:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        deletedCarts:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
    Money:
      required:
        - cents
        - amount
        - formatted
        - currency
      type: object
      properties:
        cents:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int64
        amount:
          type: string
        formatted:
          type: string
        currency:
          type: string
    OrderDto:
      required:
        - id
        - userId
        - cognitoSub
        - subtotal
        - tax
        - shipping
        - total
        - createdAt
        - lines
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        cognitoSub:
          type: string
        subtotal:
          $ref: '#/components/schemas/Money'
        tax:
          $ref: '#/components/schemas/Money'
        shipping:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        createdAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineDto'
    OrderLineDto:
      required:
        - productId
        - quantity
        - subtotal
        - tax
        - total
      type: object
      properties:
        productId:
          type: string
        quantity:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: uint32
        subtotal:
          $ref: '#/components/schemas/Money'
        tax:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
    OrderWithTrackingDto:
      required:
        - order
        - tracking
      type: object
      properties:
        order:
          $ref: '#/components/schemas/OrderDto'
        tracking:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/TrackingDto'
    ProductDto:
      required:
        - id
        - name
        - description
        - unitPrice
        - unitsInStock
        - categories
        - image
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        unitPrice:
          $ref: '#/components/schemas/Money'
        unitsInStock:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: uint32
        categories:
          type: array
          items:
            type: string
        image:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ProductImageDto'
    ProductImageDto:
      required:
        - uri
        - width
        - height
        - blurhash
      type: object
      properties:
        uri:
          type: string
        width:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        height:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        blurhash:
          type: string
    TrackingDto:
      required:
        - id
        - user_id
        - order_id
        - status
        - datetime
        - history
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        order_id:
          type: string
        status:
          type: string
        datetime:
          type: string
        history:
          type: array
          items:
            $ref: '#/components/schemas/TrackingHistoryEntryDto'
    TrackingHistoryEntryDto:
      required:
        - tracking_id
        - user_id
        - order_id
        - status
        - datetime
      type: object
      properties:
        tracking_id:
          type: string
        user_id:
          type: string
        order_id:
          type: string
        status:
          type: string
        datetime:
          type: string
    UpdateCartItemRequest:
      required:
        - productId
        - quantity
      type: object
      properties:
        productId:
          type:
            - 'null'
            - string
        quantity:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
    UpdateCartRequest:
      required:
        - items
      type: object
      properties:
        items:
          type:
            - 'null'
            - array
          items:
            $ref: '#/components/schemas/UpdateCartItemRequest'
tags:
  - name: Orders
  - name: health
  - name: internal
  - name: e2e
  - name: Products
  - name: Cart