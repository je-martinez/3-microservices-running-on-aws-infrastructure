version: "2"
sql:
  - engine: "mysql"
    # Schema comes from the migrations themselves, so the generated models can
    # never drift from the DDL the database actually runs. There is no second
    # schema definition to keep in sync.
    schema: "migrations/"
    queries: "internal/adapter/mysql/queries/"
    gen:
      go:
        package: "mysql"
        out: "internal/adapter/mysql"
        sql_package: "database/sql"
        # No JSON tags on generated models. These are persistence structs; the
        # HTTP response types are separate and hand-written, precisely so a
        # response can never accidentally carry shipping_address or cognito_sub.
        emit_json_tags: false
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        emit_result_struct_pointers: false
        emit_params_struct_pointers: false
        overrides:
          # tags -> the hand-written Tags type (tags.go), which implements
          # sql.Scanner and driver.Valuer over []string.
          #
          # Tags lives in its OWN package (tagtype), not in package mysql
          # alongside the generated code. sqlc's go_type override can only name
          # a type via an import path, and pointing that import at the very
          # package it is generating into emits
          # `import mysql "…/internal/adapter/mysql"` inside a file that IS
          # package mysql — a self-import that fails with "import cycle not
          # allowed". A bare `go_type: "Tags"` is rejected too ("not a Go basic
          # type"), so a separate package is the only arrangement sqlc supports
          # for a hand-written Scanner/Valuer on a generated model.
          - column: "tracking.tags"
            go_type:
              import: "github.com/jemartinez/3mrai/services/tracking-go/internal/adapter/mysql/tagtype"
              package: "tagtype"
              type: "Tags"
          # shipping_address stays RAW JSON. Deliberately NOT a Go struct: the
          # shape is owned by Orders/Users, this service only stores and returns
          # it, and a strict model would turn an additive upstream field into a
          # tracking-creation outage.
          #
          # NO explicit override is needed, and adding one BREAKS the build:
          # sqlc already maps a nullable JSON column to json.RawMessage and
          # imports "encoding/json" itself, so an override naming that same
          # import makes it emit the import a second time —
          # `json redeclared in this block`. The generated field is verified to
          # be json.RawMessage by the assertion test in models_test.go.
