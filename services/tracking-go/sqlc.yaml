version: "2"
sql:
  - engine: "mysql"
    # WHY: The migrations are the schema, so generated models cannot drift from
    # the DDL the database runs.
    schema: "migrations/"
    queries: "internal/adapter/mysql/queries/"
    gen:
      go:
        package: "mysql"
        out: "internal/adapter/mysql"
        sql_package: "database/sql"
        # CONTRACT: Do NOT emit JSON tags here. These are persistence structs;
        # response types are hand-written so a response cannot accidentally
        # serialize shipping_address or cognito_sub. See [[logging-context]]
        emit_json_tags: false
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        emit_result_struct_pointers: false
        emit_params_struct_pointers: false
        overrides:
          # CONTRACT: Keep Tags in its own tagtype package. sqlc names an
          # override type only by import path, so pointing it at package mysql
          # emits a self-import that fails with "import cycle not allowed".
          - column: "tracking.tags"
            go_type:
              import: "github.com/jemartinez/3mrai/services/tracking-go/internal/adapter/mysql/tagtype"
              package: "tagtype"
              type: "Tags"
          # CONTRACT: []byte, NOT json.RawMessage, and no import on the
          # override. RawMessage is no sql.Scanner, so the nullable column's
          # common NULL path fails at runtime ("unsupported Scan, storing
          # driver.Value type <nil>"); naming an import redeclares json.
          # The shape stays raw because Orders/Users own it. models_test.go
          # pins the generated type.
          - column: "tracking.shipping_address"
            go_type:
              type: "byte"
              slice: true
