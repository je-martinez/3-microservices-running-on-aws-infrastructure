openapi: 3.0.0
paths:
  "/v1/health":
    get:
      operationId: getHealth
      parameters: []
      responses:
        "200":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HealthResponse"
      summary: "Liveness probe"
      tags:
        - health
  "/v1/users/register":
    post:
      operationId: registerUser
      parameters: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/User"
        "409":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      summary: "Register a new user"
      tags:
        - users
  "/v1/users/register/passwordless":
    post:
      operationId: registerPasswordlessUser
      parameters: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RegisterPasswordlessInput"
      responses:
        "201":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/User"
        "409":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      summary: "Register a new passwordless user (OTP-only login)"
      tags:
        - users
  "/v1/users/login":
    post:
      operationId: loginUser
      parameters: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/LoginInput"
      responses:
        "200":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AuthTokens"
        "401":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      summary: "Log in and obtain tokens"
      tags:
        - users
  "/v1/users/refresh":
    post:
      operationId: refreshToken
      parameters: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RefreshInput"
      responses:
        "200":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/RefreshedTokens"
        "401":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      summary: "Exchange a refresh token for new id/access tokens"
      tags:
        - users
  "/v1/users/logout":
    post:
      description: "Globally signs the caller out, invalidating the id, access and refresh tokens Cognito issued to them. Idempotent: an already-revoked or expired token also answers 204, because the session being gone is the requested outcome."
      operationId: logoutUser
      parameters:
        - name: authorization
          in: header
          description: "Bearer <Cognito access token>. The same header the gateway authorizer reads; the access token is what authorizes the revocation, so no body is needed."
          required: false
          schema:
            type: string
      responses:
        "204":
          description: "Default Response"
        "401":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      summary: "Revoke the caller's Cognito session"
      tags:
        - users
  "/v1/users/otp/start":
    post:
      operationId: startOtpChallenge
      parameters: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/OtpStartInput"
      responses:
        "200":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/OtpStartResponse"
        "401":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      summary: "Start an OTP login challenge (password or passwordless users)"
      tags:
        - users
  "/v1/users/otp/verify":
    post:
      operationId: verifyOtpChallenge
      parameters: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/OtpVerifyInput"
      responses:
        "200":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AuthTokens"
        "401":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      summary: "Verify an OTP code and obtain tokens"
      tags:
        - users
  "/v1/users/password/forgot":
    post:
      description: "Always answers 202 with the same body, whether or not the email belongs to an account — the response deliberately does not reveal which."
      operationId: forgotPassword
      parameters: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ForgotPasswordInput"
      responses:
        "202":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PasswordResetAccepted"
      summary: "Request a password reset code by email"
      tags:
        - users
  "/v1/users/password/confirm":
    post:
      operationId: confirmPasswordReset
      parameters: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ConfirmPasswordResetInput"
      responses:
        "200":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PasswordResetConfirmed"
        "401":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      summary: "Confirm a password reset with the emailed code"
      tags:
        - users
  "/v1/users/me":
    get:
      operationId: getMe
      parameters:
        - name: x-user-id
          in: header
          description: "Cognito subject forwarded by the API Gateway authorizer. Required in practice — a request without it resolves no current user and is answered 404 (not a 400)."
          required: false
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/User"
        "404":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      summary: "Get the current user's profile"
      tags:
        - users
    patch:
      operationId: updateMe
      parameters:
        - name: x-user-id
          in: header
          description: "Cognito subject forwarded by the API Gateway authorizer. Required in practice — a request without it resolves no current user and is answered 404 (not a 400)."
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/User"
        "404":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      summary: "Update the current user's profile"
      tags:
        - users
    delete:
      operationId: deleteMe
      parameters:
        - name: x-user-id
          in: header
          description: "Cognito subject forwarded by the API Gateway authorizer. Required in practice — a request without it resolves no current user and is answered 404 (not a 400)."
          required: false
          schema:
            type: string
      responses:
        "204":
          description: "Default Response"
        "404":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "502":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      summary: "Delete the current user's account"
      tags:
        - users
  "/v1/users/me/password":
    patch:
      description: "Sets a new password for the authenticated caller and clears mustChangePassword. Accepts no other user fields — use PATCH /v1/users/me for profile changes."
      operationId: changeMyPassword
      parameters:
        - name: x-user-id
          in: header
          description: "Cognito subject forwarded by the API Gateway authorizer. Required in practice — a request without it resolves no current user and is answered 404 (not a 400)."
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/User"
        "404":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      summary: "Change the current user's password"
      tags:
        - users
  "/v1/webhooks/cognito":
    post:
      operationId: cognitoWebhook
      parameters:
        - name: x-webhook-secret
          in: header
          description: "Shared secret guarding the Cognito webhook. Required in practice — a missing or wrong value is rejected 401 by the handler (not schema-validated to a 400)."
          required: false
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            "application/json":
              schema:
                type: object
                properties:
                  status:
                    type: string
                required:
                  - status
                additionalProperties: false
        "401":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "422":
          description: ""
          content:
            "application/json":
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - invalid_payload
                  details:
                    type: array
                    items: {}
                required:
                  - error
                  - details
                additionalProperties: false
        "500":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      summary: "Cognito PostConfirmation trigger webhook"
      tags:
        - webhooks
  "/v1/users/e2e-cleanup":
    delete:
      operationId: e2eCleanup
      parameters: []
      responses:
        "200":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/E2ECleanupResponse"
      summary: "[E2E] Delete E2E-sourced users"
      tags:
        - e2e
  "/v1/users/e2e-identity":
    get:
      operationId: e2eIdentity
      parameters:
        - name: email
          required: false
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            "application/json":
              schema:
                type: object
                properties: {}
                additionalProperties: {}
        "400":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      summary: "[E2E] Read captured identity by email"
      tags:
        - e2e
  "/v1/notifications":
    get:
      description: "Returns the newest 50 by created_at desc with NO date bound, plus an exact unread_count and a 90-day window_total that may exceed items.length. Deliberately unpaginated."
      operationId: listNotifications
      parameters:
        - name: x-user-id
          in: header
          description: "Cognito subject forwarded by the API Gateway authorizer. Required in practice — a request without it resolves no current user and is answered 404 (not a 400)."
          required: false
          schema:
            type: string
        - name: filter
          required: false
          in: query
          schema:
            enum:
              - all
              - unread
              - read
            type: string
      responses:
        "200":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/NotificationsPage"
      summary: "List the caller's newest notifications"
      tags:
        - notifications
  "/v1/notifications/unread-count":
    get:
      operationId: getUnreadNotificationCount
      parameters:
        - name: x-user-id
          in: header
          description: "Cognito subject forwarded by the API Gateway authorizer. Required in practice — a request without it resolves no current user and is answered 404 (not a 400)."
          required: false
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/UnreadCount"
      summary: "Count the caller's unread notifications"
      tags:
        - notifications
  "/v1/notifications/read":
    patch:
      description: "Idempotent: only rows with read_at IS NULL are updated, which matters because the client's mark-on-enter can fire twice on a remount. A SINGLE id matching no row answers 404, indistinguishable from \"does not exist\", so it cannot probe for another user's notifications."
      operationId: markNotificationsRead
      parameters:
        - name: x-user-id
          in: header
          description: "Cognito subject forwarded by the API Gateway authorizer. Required in practice — a request without it resolves no current user and is answered 404 (not a 400)."
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/MarkReadInput"
      responses:
        "200":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/MarkReadResult"
        "404":
          description: ""
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      summary: "Mark the caller's notifications read"
      tags:
        - notifications
info:
  title: "Users Service API"
  description: "HTTP API for the 3MRAI Users microservice (NestJS + Aurora Postgres). Identity is enforced at the API Gateway authorizer, which forwards the Cognito subject as the x-user-id header."
  version: 1.0.0
  contact: {}
tags:
  - name: health
    description: Liveness
  - name: users
    description: "Registration, auth and profile"
  - name: webhooks
    description: "Inbound Cognito trigger (shared-secret guarded)"
  - name: notifications
    description: "In-app notification inbox"
  - name: e2e
    description: "Test-only routes (E2E_TESTING_ENABLED)"
servers:
  - url: "http://localhost:3000"
    description: "Local (docker compose / Floci)"
    variables: null
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
          pattern: "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$"
        fullName:
          type: string
        address:
          anyOf:
            - {}
            - type: "null"
        phoneNumber:
          anyOf:
            - type: string
            - type: "null"
        tags:
          type: array
          items:
            type: string
        authType:
          type: string
          enum:
            - PASSWORD
            - PASSWORDLESS
        mustChangePassword:
          type: boolean
        createdBy:
          anyOf:
            - type: string
            - type: "null"
        createdAt:
          type: string
        updatedBy:
          anyOf:
            - type: string
            - type: "null"
        updatedAt:
          type: string
        deletedBy:
          anyOf:
            - type: string
            - type: "null"
        deletedAt:
          anyOf:
            - type: string
            - type: "null"
        isDeleted:
          type: boolean
      required:
        - id
        - email
        - fullName
        - address
        - phoneNumber
        - tags
        - authType
        - mustChangePassword
        - createdBy
        - createdAt
        - updatedBy
        - updatedAt
        - deletedBy
        - deletedAt
        - isDeleted
      additionalProperties: false
    AuthTokens:
      type: object
      properties:
        idToken:
          type: string
        accessToken:
          type: string
        refreshToken:
          type: string
      required:
        - idToken
        - accessToken
        - refreshToken
      additionalProperties: false
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
      additionalProperties: false
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          const: ok
      required:
        - status
      additionalProperties: false
    RefreshedTokens:
      type: object
      properties:
        idToken:
          type: string
        accessToken:
          type: string
      required:
        - idToken
        - accessToken
      additionalProperties: false
    OtpStartResponse:
      type: object
      properties:
        session:
          type: string
      required:
        - session
      additionalProperties: false
    PasswordResetAccepted:
      type: object
      properties:
        status:
          type: string
          const: accepted
      required:
        - status
      additionalProperties: false
    PasswordResetConfirmed:
      type: object
      properties:
        status:
          type: string
          const: password_updated
      required:
        - status
      additionalProperties: false
    E2ECleanupResponse:
      type: object
      properties:
        deleted:
          type: number
      required:
        - deleted
      additionalProperties: false
    RegisterInput:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$"
        password:
          type: string
        fullName:
          type: string
        address: {}
        phoneNumber:
          type: string
      required:
        - email
        - password
        - fullName
      additionalProperties: false
    RegisterPasswordlessInput:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$"
        fullName:
          type: string
        address: {}
        phoneNumber:
          type: string
      required:
        - email
        - fullName
      additionalProperties: false
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$"
        password:
          type: string
      required:
        - email
        - password
      additionalProperties: false
    OtpStartInput:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$"
      required:
        - email
      additionalProperties: false
    OtpVerifyInput:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$"
        session:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: "^\\d{6}$"
      required:
        - email
        - session
        - code
      additionalProperties: false
    RefreshInput:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
        - refreshToken
      additionalProperties: false
    UpdateProfileInput:
      type: object
      properties:
        fullName:
          type: string
        address: {}
        phoneNumber:
          type: string
      additionalProperties: false
    ForgotPasswordInput:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$"
      required:
        - email
      additionalProperties: false
    ConfirmPasswordResetInput:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$"
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: "^\\d{6}$"
        newPassword:
          type: string
          minLength: 8
      required:
        - email
        - code
        - newPassword
      additionalProperties: false
    ChangePasswordInput:
      type: object
      properties:
        newPassword:
          type: string
          minLength: 8
      required:
        - newPassword
      additionalProperties: false
    NotificationsPage:
      type: object
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Notification"
        unread_count:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        window_total:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        window_days:
          type: number
          const: 90
      required:
        - items
        - unread_count
        - window_total
        - window_days
      additionalProperties: false
    UnreadCount:
      type: object
      properties:
        unread_count:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - unread_count
      additionalProperties: false
    MarkReadResult:
      type: object
      properties:
        updated:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        unread_count:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - updated
        - unread_count
      additionalProperties: false
    MarkReadInput:
      type: object
      properties:
        ids:
          maxItems: 50
          type: array
          items:
            type: string
            minLength: 1
      required:
        - ids
      additionalProperties: false
    Notification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        body:
          type: string
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties: {}
        read_at:
          anyOf:
            - type: string
            - type: "null"
        created_at:
          type: string
      required:
        - id
        - type
        - title
        - body
        - metadata
        - read_at
        - created_at
      additionalProperties: false
