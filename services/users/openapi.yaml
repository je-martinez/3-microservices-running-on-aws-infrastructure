openapi: 3.1.0
info:
  title: Users Service API
  version: 1.0.0
  description: HTTP API for the 3MRAI Users microservice (Fastify + Aurora
    Postgres). Identity is enforced at the API Gateway authorizer, which
    forwards the Cognito subject as the x-user-id header.
components:
  schemas:
    RegisterInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: "#/components/schemas/RegisterInput"
      type: object
      properties:
        email:
          description: New user's email
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        password:
          description: Plaintext password (sent to the auth provider)
          type: string
        fullName:
          description: Display name
          type: string
        address:
          description: Free-form structured address (stored as JSON)
        phoneNumber:
          type: string
      required:
        - email
        - password
        - fullName
    RegisterPasswordlessInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: "#/components/schemas/RegisterPasswordlessInput"
      type: object
      properties:
        email:
          description: New passwordless user's email
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        fullName:
          description: Display name
          type: string
        address:
          description: Free-form structured address (stored as JSON)
        phoneNumber:
          type: string
      required:
        - email
        - fullName
    LoginInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: "#/components/schemas/LoginInput"
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        password:
          type: string
      required:
        - email
        - password
    OtpStartInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: "#/components/schemas/OtpStartInput"
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
      required:
        - email
    OtpVerifyInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: "#/components/schemas/OtpVerifyInput"
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        session:
          description: Opaque challenge session returned by /v1/users/otp/start
          type: string
          minLength: 1
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^\d{6}$
      required:
        - email
        - session
        - code
    RefreshInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: "#/components/schemas/RefreshInput"
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
        - refreshToken
    UpdateProfileInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: "#/components/schemas/UpdateProfileInput"
      type: object
      properties:
        fullName:
          type: string
        address: {}
        phoneNumber:
          type: string
    ForgotPasswordInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: "#/components/schemas/ForgotPasswordInput"
      type: object
      properties:
        email:
          description: Email of the account to reset
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
      required:
        - email
    ConfirmPasswordResetInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: "#/components/schemas/ConfirmPasswordResetInput"
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^\d{6}$
        newPassword:
          description: The new plaintext password. Validated against the Cognito user
            pool's password policy.
          type: string
          minLength: 8
      required:
        - email
        - code
        - newPassword
    ChangePasswordInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: "#/components/schemas/ChangePasswordInput"
      type: object
      properties:
        newPassword:
          description: The new plaintext password. Validated against the Cognito user
            pool's password policy.
          type: string
          minLength: 8
      required:
        - newPassword
    User:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: "#/components/schemas/User"
      type: object
      properties:
        id:
          description: Prefixed nano id, e.g. usr_V1StGXR8Z5
          type: string
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        fullName:
          type: string
        address:
          anyOf:
            - {}
            - type: "null"
        phoneNumber:
          anyOf:
            - type: string
            - type: "null"
        tags:
          type: array
          items:
            type: string
        authType:
          description: Read-only. PASSWORDLESS accounts have no usable password and
            authenticate via OTP only.
          type: string
          enum:
            - PASSWORD
            - PASSWORDLESS
        mustChangePassword:
          description: Read-only. True when the frontend MUST send the user through PATCH
            /v1/users/me/password before letting them continue. Cleared by that
            endpoint and by POST /v1/users/password/confirm.
          type: boolean
        createdBy:
          anyOf:
            - type: string
            - type: "null"
        createdAt:
          type: string
        updatedBy:
          anyOf:
            - type: string
            - type: "null"
        updatedAt:
          type: string
        deletedBy:
          anyOf:
            - type: string
            - type: "null"
        deletedAt:
          anyOf:
            - type: string
            - type: "null"
        isDeleted:
          type: boolean
      required:
        - id
        - email
        - fullName
        - address
        - phoneNumber
        - tags
        - authType
        - mustChangePassword
        - createdBy
        - createdAt
        - updatedBy
        - updatedAt
        - deletedBy
        - deletedAt
        - isDeleted
      additionalProperties: false
    AuthTokens:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: "#/components/schemas/AuthTokens"
      type: object
      properties:
        idToken:
          type: string
        accessToken:
          type: string
        refreshToken:
          type: string
      required:
        - idToken
        - accessToken
        - refreshToken
      additionalProperties: false
    Error:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: "#/components/schemas/Error"
      type: object
      properties:
        error:
          type: string
      required:
        - error
      additionalProperties: false
    PasswordResetAccepted:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: "#/components/schemas/PasswordResetAccepted"
      type: object
      properties:
        status:
          type: string
          const: accepted
      required:
        - status
      additionalProperties: false
    PasswordResetConfirmed:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: "#/components/schemas/PasswordResetConfirmed"
      type: object
      properties:
        status:
          type: string
          const: password_updated
      required:
        - status
      additionalProperties: false
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness probe
      tags:
        - health
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
                additionalProperties: false
  /v1/users/register:
    post:
      operationId: registerUser
      summary: Register a new user
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/users/register/passwordless:
    post:
      operationId: registerPasswordlessUser
      summary: Register a new passwordless user (OTP-only login)
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPasswordlessInput"
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/users/login:
    post:
      operationId: loginUser
      summary: Log in and obtain tokens
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/users/refresh:
    post:
      operationId: refreshToken
      summary: Exchange a refresh token for new id/access tokens
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInput"
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  idToken:
                    type: string
                  accessToken:
                    type: string
                required:
                  - idToken
                  - accessToken
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/users/otp/start:
    post:
      operationId: startOtpChallenge
      summary: Start an OTP login challenge (password or passwordless users)
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpStartInput"
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    description: Opaque challenge session to hand back to /v1/users/otp/verify
                    type: string
                required:
                  - session
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/users/otp/verify:
    post:
      operationId: verifyOtpChallenge
      summary: Verify an OTP code and obtain tokens
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyInput"
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/users/password/forgot:
    post:
      operationId: forgotPassword
      summary: Request a password reset code by email
      tags:
        - users
      description: Always answers 202 with the same body, whether or not the email
        belongs to an account — the response deliberately does not reveal which.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "202":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetAccepted"
  /v1/users/password/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Confirm a password reset with the emailed code
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPasswordResetInput"
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetConfirmed"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/users/me:
    get:
      operationId: getMe
      summary: Get the current user's profile
      tags:
        - users
      parameters:
        - schema:
            type: string
          in: header
          name: x-user-id
          required: false
          description: Cognito subject forwarded by the API Gateway authorizer. Required
            in practice — a request without it resolves no current user and is
            answered 404 (not a 400).
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateMe
      summary: Update the current user's profile
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      parameters:
        - schema:
            type: string
          in: header
          name: x-user-id
          required: false
          description: Cognito subject forwarded by the API Gateway authorizer. Required
            in practice — a request without it resolves no current user and is
            answered 404 (not a 400).
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/users/me/password:
    patch:
      operationId: changeMyPassword
      summary: Change the current user's password
      tags:
        - users
      description: Sets a new password for the authenticated caller and clears
        mustChangePassword. Accepts no other user fields — use PATCH
        /v1/users/me for profile changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      parameters:
        - schema:
            type: string
          in: header
          name: x-user-id
          required: false
          description: Cognito subject forwarded by the API Gateway authorizer. Required
            in practice — a request without it resolves no current user and is
            answered 404 (not a 400).
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/webhooks/cognito:
    post:
      operationId: cognitoWebhook
      summary: Cognito PostConfirmation trigger webhook
      tags:
        - webhooks
      parameters:
        - schema:
            type: string
          in: header
          name: x-webhook-secret
          required: false
          description: Shared secret guarding the Cognito webhook. Required in practice —
            a missing or wrong value is rejected 401 by the handler (not
            schema-validated to a 400).
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required:
                  - status
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - invalid_payload
                  details:
                    type: array
                    items: {}
                required:
                  - error
                  - details
                additionalProperties: false
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/users/e2e-cleanup:
    delete:
      operationId: e2eCleanup
      summary: "[E2E] Delete E2E-sourced users"
      tags:
        - e2e
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: number
                required:
                  - deleted
                additionalProperties: false
  /v1/users/e2e-identity:
    get:
      operationId: e2eIdentity
      summary: "[E2E] Read captured identity by email"
      tags:
        - e2e
      parameters:
        - schema:
            type: string
          in: query
          name: email
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: {}
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
servers:
  - url: http://localhost:3000
    description: Local (docker compose / Floci)
tags:
  - name: health
    description: Liveness
  - name: users
    description: Registration, auth and profile
  - name: webhooks
    description: Inbound Cognito trigger (shared-secret guarded)
  - name: e2e
    description: Test-only routes (E2E_TESTING_ENABLED)
