# 3MRAI local development orchestrator.
# Floci emulates AWS locally (SQS, Lambda, ECS, RDS, S3, DocumentDB, …) on a
# single port :4566 — it is where the project's AWS resources are created for
# local dev. The four services run on one network with docker-watch (live
# reload) and point their AWS SDKs at Floci via AWS_ENDPOINT_URL.
# Skeleton: service build contexts use per-service skeleton Dockerfiles; real
# per-service config (ports, depends-on details, healthchecks) is filled in per
# service milestone.
name: 3mrai

networks:
  3mrai-network:
    driver: bridge

services:
  # Local AWS emulator (ADR-0017) — replaced Ministack on :4566.
  # MIT, single-port emulator. Launches ECS tasks as real Docker containers and
  # joins them to the compose network via FLOCI_SERVICES_ECS_DOCKER_NETWORK, so the
  # Nginx ECS task resolves `users` by service name through Docker DNS.
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
      # RDS proxy ports (7000-7010): Floci assigns one per cluster at apply time
      # in the 7000-7099 range, BY CREATION ORDER — which is NOT stable across
      # applies, so Postgres/MySQL can flip between 7001/7002. The actual per-
      # engine ports are DISCOVERED from describe-db-clusters (Engine per cluster)
      # by scripts/discover_db_port.py and written into .env as USERS_DB_PORT /
      # ORDERS_DB_PORT — never hardcoded. Published to the host so host-side
      # clients — the phase-2 post-effects Terraform postgresql/mysql providers,
      # and any SQL client — can reach the DBs at localhost:<port>. In-network
      # containers still use floci:<port>.
      - "7000-7010:7000-7010"
      # ElastiCache proxy ports — the SAME proxy arrangement as the RDS range
      # above: Floci launches a real `valkey/valkey:8` container per replication
      # group and PROXIES TCP to it, so a host-side client can reach it at
      # localhost:<port>. Publishing the range is REQUIRED for that; without it
      # the port is simply closed, which reads exactly like "the emulator doesn't
      # really serve Redis" (it does — see the floci skill, quirk 14).
      #
      # DELIBERATELY NOT FLOCI'S 6379-6399 DEFAULT. 6379 is Redis's well-known
      # port, so the default range collides with any local Redis a developer runs
      # (here: a `redis_alpine` container publishing 6379). Whoever binds first
      # wins and the other silently fails — Floci refusing to start with "port is
      # already allocated", or worse, a client reaching the WRONG Redis. Moved to
      # 6479-6499: same 21-port width, clear of both 6379 and this machine's other
      # 6xxx listeners.
      #
      # The published range and FLOCI_SERVICES_ELASTICACHE_PROXY_BASE_PORT/
      # _MAX_PORT below MUST agree — publishing ports Floci does not allocate from
      # (or vice versa) yields a closed port with no error anywhere.
      #
      # THIS RANGE IS HOST-SIDE ONLY, and that is why REDIS_PORT stays 6379.
      # In-network containers (users, and anything else on 3mrai-network) do not
      # go through this proxy at all: they dial the backing container directly at
      # `floci-valkey-<replication-group-id>:6379`, which is unaffected by the
      # range chosen here. Only clients on the HOST — redis-cli, a GUI, a test run
      # outside Docker — use these ports. Do not "fix" REDIS_PORT to 6479.
      - "6479-6499:6479-6499"
    environment:
      # ECS tasks launched by Floci join the compose network and can resolve
      # other compose containers (users) by service name via Docker DNS.
      - FLOCI_SERVICES_ECS_DOCKER_NETWORK=3mrai_3mrai-network
      # ElastiCache proxy range — must match the published ports above exactly.
      # Floci allocates one port per replication group from this range, starting
      # at BASE. Moved off the 6379-6399 default so a developer's own local Redis
      # on 6379 and this emulator can run at the same time.
      - FLOCI_SERVICES_ELASTICACHE_PROXY_BASE_PORT=6479
      - FLOCI_SERVICES_ELASTICACHE_PROXY_MAX_PORT=6499
      # Persist state across restarts under ./data/floci (git-ignored).
      # `persistent` flushes on every write; `hybrid` batches on a 5s async timer
      # and loses writes on an unclean stop — do not "optimize" this to hybrid.
      # See docs/lessons/floci-storage-modes-and-tmp-corruption.md
      - FLOCI_STORAGE_MODE=persistent
      - FLOCI_STORAGE_PERSISTENT_PATH=/app/data
      # SES relay → Mailpit, so an email the events-pipeline Lambda sends lands
      # in a real, inspectable inbox at http://localhost:8025 instead of only
      # being recorded inside the emulator. `mailpit` resolves through Docker
      # DNS on 3mrai-network.
      #
      # Floci stores every sent email locally REGARDLESS of this relay (its
      # /_aws/ses endpoint), so the relay is for human/E2E inspection, not for
      # delivery correctness. The relay also does not preserve arbitrary
      # headers, attachments, or complex multipart bodies — fine for the simple
      # HTML this pipeline sends; if attachments ever appear, inspect via
      # /_aws/ses instead. See the milestone design spec's "Mailpit" section.
      - FLOCI_SERVICES_SES_SMTP_HOST=mailpit
      - FLOCI_SERVICES_SES_SMTP_PORT=1025
    volumes:
      - ./data/floci:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [3mrai-network]
    depends_on:
      # `service_started`, NOT `service_healthy`, and the difference matters:
      # floci gates users, orders, tracking and the nginx ECS task, so a
      # `service_healthy` gate here would let an unpullable or unhealthy Mailpit
      # image stop the entire API from booting. An email inbox must not have
      # that power — SES stores mail locally regardless of the relay, so a
      # missing Mailpit costs inspectability, not correctness.
      #
      # What this still buys: ordering. Mailpit is created before Floci, so the
      # first email of a session is very likely relayed rather than dropped on a
      # refused connection. It is a best-effort ordering hint, not a guarantee
      # (a started container is not yet a listening SMTP server) — which is the
      # right trade for a non-critical dependency.
      mailpit:
        condition: service_started
    healthcheck:
      # The floci image ships curl (Quarkus app on :4566).
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Observability (opt-in): `docker compose --profile observability up` ──
  # OTel collector: fluentd from the compose services + CloudWatch (ECS/RDS) on
  # Floci, exported to self-hosted OpenObserve. Pinned image; do not use :latest.
  # Trace backend. Logs live in OpenObserve; traces live here, joined by the
  # trace_id every log line carries. See ADR-0019 for why traces are not in
  # OpenObserve: its ingest rejected the collector's OTLP batches with HTTP 400,
  # and ADR-0018 had already flagged its APM maturity as the weak spot to
  # re-evaluate if tracing became a hard requirement. It did.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: [observability]
    ports:
      - "16686:16686"   # Jaeger UI — the waterfall view
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks: [3mrai-network]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.156.0
    profiles: [observability]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "24224:24224"   # fluent_forward — published so the Docker daemon (host) can reach it
      # OTLP trace ingest. The services reach it in-network at
      # http://otel-collector:4318, so publishing is only for host-side probing.
      # NOTE: this service sits behind `profiles: [observability]`, so a plain
      # `docker compose up` does NOT start it and the SDKs' exports fail with
      # connection refused — harmless by design, but it means traces only flow
      # when the stack is brought up with the observability profile enabled.
      - "4317:4317"     # OTLP/gRPC
      - "4318:4318"     # OTLP/HTTP
    environment:
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      # base64("admin@3mrai.local:Complexpass#123") — the OpenObserve Basic auth
      # header value. Local dev only; prod injects this from Secrets Manager.
      - O2_BASIC_AUTH=YWRtaW5AM21yYWkubG9jYWw6Q29tcGxleHBhc3MjMTIz
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks: [3mrai-network]
    depends_on:
      floci:
        condition: service_healthy

  # OpenObserve: single-binary logs backend (ADR-0018). Behind the observability
  # profile like the collector. Pinned image; do not use :latest. Local dev creds
  # only — prod reads them from Secrets Manager (ADR-0007).
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.91.1
    profiles: [observability]
    environment:
      - ZO_ROOT_USER_EMAIL=admin@3mrai.local
      - ZO_ROOT_USER_PASSWORD=Complexpass#123
    ports:
      - "5080:5080"   # UI + OTLP HTTP ingest
    volumes:
      - ./data/openobserve:/data
    networks: [3mrai-network]

  # Real Users service (Fastify + Prisma).
  # Build context is the REPO ROOT so pnpm-lock.yaml and pnpm-workspace.yaml
  # are available to the multi-stage Dockerfile.
  # The container is reachable as `users` on 3mrai-network so the Nginx ECS
  # task can proxy_pass to http://users:3000 via Docker embedded DNS.
  #
  # COGNITO_USER_POOL_ID / COGNITO_CLIENT_ID come from ./.env, which
  # `make infra-up` regenerates from `terraform output` after every apply —
  # Floci mints new IDs on each apply, so they must never be hardcoded here.
  users:
    build:
      context: .
      dockerfile: services/users/Dockerfile
    networks: [3mrai-network]
    ports:
      - "3000:3000"
      # gRPC surface (GetUserById). Reachable as `users:50051` on the network so
      # the Orders service can resolve identity. Guarded by the x-api-key interceptor.
      - "50051:50051"
    depends_on:
      floci:
        condition: service_healthy
    # Environment comes from the GENERATED .env.local.users (see
    # docs/superpowers/specs/2026-07-20-env-file-generation-design.md).
    # Nothing is declared inline on purpose: compose gives `environment:`
    # precedence over `env_file:`, so a leftover inline entry would silently
    # override the generated value and reintroduce the duplication this
    # removes. Regenerate with `make env-file`; edit only the CUSTOM box.
    env_file:
      - .env.local.users
    # stdout → the observability collector's fluent_forward receiver.
    # localhost:24224 because the Docker daemon resolves fluentd-address from the
    # HOST, not this network. fluentd-async so the service still starts when the
    # observability profile (and thus the collector) is not running.
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "users"
    develop:
      watch:
        # Users runs the compiled production build (runtime stage → node
        # dist/server.js), NOT `tsx watch`, so a source sync would copy the .ts
        # files but the process keeps running the old dist/. `rebuild` reconstructs
        # the image on a source change so the new code actually runs. Requires
        # `docker compose watch` to be active.
        - action: rebuild
          path: ./services/users/src

  # Orders service (.NET Core 10 Minimal API, Clean Architecture + EF Core/MySQL).
  # Build context is the REPO ROOT so the shared gRPC contract (proto/users.proto)
  # is inside the build context — Grpc.Tools generates the Users client from it.
  # Reachable as `orders` on 3mrai-network; resolves caller identity by calling
  # the Users gRPC server at users:50051 (guarded by the shared x-api-key).
  orders:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    networks: [3mrai-network]
    ports:
      # Host 3001 → container 8080 (ASPNETCORE_URLS). Health: GET /v1/health.
      - "3001:8080"
    depends_on:
      floci:
        condition: service_healthy
      # The gRPC client is dialed lazily on POST /v1/orders, so "started" is
      # enough — reads and health do not need Users up.
      users:
        condition: service_started
    # Environment comes from the GENERATED .env.local.orders — see the note
    # on the users service above for why nothing is declared inline.
    env_file:
      - .env.local.orders
    # stdout → the observability collector's fluent_forward receiver.
    # localhost:24224 because the Docker daemon resolves fluentd-address from the
    # HOST, not this network. fluentd-async so the service still starts when the
    # observability profile (and thus the collector) is not running.
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "orders"
    develop:
      watch:
        # Orders is .NET (compiled): a source sync alone would copy .cs files into
        # the container but NOT recompile — the running process keeps the old DLL.
        # `rebuild` reconstructs the image on any source change so the new code
        # actually runs. Requires `docker compose watch` to be active.
        - action: rebuild
          path: ./services/orders/src

  # Tracking service (FastAPI + uvicorn on Python 3.12, SQLAlchemy/pymysql → MySQL).
  # Build context is ./services/tracking — NOT the repo root like Users and Orders.
  # It needs nothing from outside its own tree: the Users gRPC stubs generated from
  # proto/users.proto are COMMITTED under src/shared/grpc/generated/, so the shared
  # .proto is read neither at build nor at run time (verified — contrast Users,
  # whose gRPC SERVER loads /app/proto/users.proto at boot).
  # Reachable as `tracking` on 3mrai-network so the Nginx ECS task can
  # proxy_pass to http://tracking:8000. REST-only: Tracking serves no gRPC (JE-108),
  # so there is no second port to publish.
  tracking:
    build: ./services/tracking
    networks: [3mrai-network]
    ports:
      # Host 3002 → container 8000 (uvicorn --port). 3000/3001 are taken by Users
      # and Orders. Health: GET /v1/health (unprefixed — the gateway publishes
      # /v1/tracking/health and nginx rewrites; see health_router.py).
      - "3002:8000"
    depends_on:
      floci:
        condition: service_healthy
      # NOT depends_on: users. Tracking's only gRPC is an OUTBOUND client to Users,
      # dialed lazily per request on POST /v1/trackings/init-tracking — nothing at
      # boot, and neither the reads, the carrier PUT, nor the healthcheck touch it.
      # Orders declares `users: service_started` for the same lazy client; the
      # difference is only that Orders' compose block predates this reasoning being
      # written down. `service_started` buys no ordering guarantee that matters here
      # (a started container is not a listening gRPC server), so adding it would be
      # coupling that looks like a guarantee without being one.
    # Environment comes from the GENERATED .env.local.tracking — see the note on
    # the users service above for why nothing is declared inline. An
    # `environment:` block here would silently WIN over env_file, so the service
    # would never see its generated DB URLs, gRPC port, or API keys.
    env_file:
      - .env.local.tracking
    healthcheck:
      # python -m urllib, NOT curl: python:3.12-slim ships neither curl nor wget
      # (verified), and installing curl just for a probe would add an apt layer to
      # buy nothing — the interpreter is already in the image.
      # Hits the service's own UNPREFIXED /v1/health. The handler deliberately does
      # NOT touch the database (it is a liveness probe), so this reports healthy
      # even while Floci's MySQL is down — which is correct: a transient DB blip
      # must not cycle an otherwise-serving task.
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=2).status == 200 else 1)
      interval: 10s
      timeout: 3s
      retries: 5
      # uvicorn imports the app graph (FastAPI + SQLAlchemy + grpc) before it
      # listens; failures inside this window do not count against `retries`.
      start_period: 10s
    # stdout → the observability collector's fluent_forward receiver.
    # localhost:24224 because the Docker daemon resolves fluentd-address from the
    # HOST, not this network. fluentd-async so the service still starts when the
    # observability profile (and thus the collector) is not running.
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "tracking"
    # Adds --reload to the image's CMD. Tracking is INTERPRETED Python, so the
    # `sync` below is genuinely enough to get new code into the container — unlike
    # Users (compiled to dist/) and Orders (compiled to a DLL), which both need
    # `rebuild`. But a sync only helps if the process re-imports the file, so the
    # reload watcher is required for the pair to work.
    # It lives HERE and not in the Dockerfile CMD on purpose: --reload is a
    # local-dev tool (extra watcher process, reload-on-touch) that must not follow
    # the image into a deployment.
    command:
      ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    develop:
      watch:
        - action: sync
          path: ./services/tracking/src
          target: /app/src

  # NOTE: there is deliberately NO `events-pipeline` compose service.
  # The pipeline is a REAL Lambda on Floci, deployed by Terraform together with
  # its SQS event source mapping (see functions/events-pipeline/CLAUDE.md §1).
  # The previous build+watch worker here was a skeleton that never ran the
  # actual trigger: a compose worker polling SQS by hand would have exercised
  # neither the event source mapping, the batching, nor the partial-batch
  # responses — the three things most likely to break. Code changes ship via
  # `pnpm run build` + `terraform apply` (archive_file's hash triggers the
  # function update), which is why it also has no docker-watch block.

  # Mailpit — the local inbox. Floci's SES relays here (see the floci service's
  # FLOCI_SERVICES_SES_SMTP_* above), so emails the pipeline sends are readable
  # at http://localhost:8025 and assertable over its HTTP API from the
  # layer-2 integration test.
  #
  # NOT behind a profile, unlike email-preview: it is part of the running system
  # (Floci's relay target and the E2E assertion point), not a developer tool.
  mailpit:
    # Pinned, like every other image here — `latest` would silently change the
    # API this project's tests query.
    image: axllent/mailpit:v1.20
    networks: [3mrai-network]
    ports:
      - "8025:8025" # web UI + HTTP API (/api/v1/…)
      - "1025:1025" # SMTP — what Floci's SES relay connects to
    healthcheck:
      # busybox wget, verified present in this image (it also ships nc, but no
      # curl). NOT `mailpit healthcheck`: that subcommand does not exist in
      # v1.20 — it was added in a later release, and using it here left the
      # container stuck in `health: starting` forever with
      # `unknown command "healthcheck"`, which in turn blocks floci (it waits
      # on service_healthy). Probing the HTTP API is also the stronger check:
      # it is the endpoint the integration test queries.
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 3s
      retries: 10

  # react-email preview server (`email dev`, reads ./emails, port 3000).
  # Behind the `preview` profile so a normal `make up` does NOT start it — it is
  # a developer tool, and port 3000 is already taken by the Users service on the
  # host. Start it with:
  #   docker compose --profile preview up email-preview
  email-preview:
    build:
      # Context is the REPO ROOT (pnpm-lock.yaml / pnpm-workspace.yaml live
      # there), like the users and orders services — see the Dockerfile header.
      context: .
      dockerfile: functions/events-pipeline/Dockerfile
      target: preview
    profiles: ["preview"]
    networks: [3mrai-network]
    ports:
      # Host 3003 → container 3000. NOT 3000:3000: the Users service already
      # publishes host 3000, so that mapping fails to bind whenever the normal
      # stack is up — which is exactly when a developer wants the preview.
      - "3003:3000"
    develop:
      watch:
        # `sync` (not `rebuild`) is enough here: `email dev` is a Next.js dev
        # server that hot-reloads the .tsx files it watches.
        - action: sync
          path: ./functions/events-pipeline/emails
          target: /app/emails
