# 3MRAI local development orchestrator.
# Floci emulates AWS locally (SQS, Lambda, ECS, RDS, S3, DocumentDB, …) on the
# single port :4566, and is where this project's AWS resources are created for
# local dev. The services share one network with docker-watch (live reload) and
# point their AWS SDKs at Floci via AWS_ENDPOINT_URL.
name: 3mrai

networks:
  3mrai-network:
    driver: bridge

# CONTRACT: Runtime-generated state goes in a NAMED VOLUME, never a ./data bind
# mount. Only `docker compose down -v` clears this state, and it cannot remove a
# bind mount — state that outlives a teardown leaves Floci reporting phantom
# DocumentDB/ElastiCache clusters as `available` with no container behind them,
# so Terraform creates nothing and a service later fails on
# `getaddrinfo ENOTFOUND floci-docdb-…`. It looks intermittent because Floci
# relaunches RDS containers at boot but not DocumentDB or ElastiCache.
# Versioned files a container reads (configs, source) stay bind mounts — see the
# collector's `:ro` config mount below.
# See [[floci-recreate-destroys-backing-containers]]
volumes:
  # What resources Floci believes exist (its emulated control plane).
  floci-state:
  # OpenObserve's log store — observability profile only, but the same rule.
  openobserve-data:

services:
  # Local AWS emulator (ADR-0017) — replaced Ministack on :4566.
  # MIT, single-port emulator. Launches ECS tasks as real Docker containers and
  # joins them to the compose network via FLOCI_SERVICES_ECS_DOCKER_NETWORK, so the
  # Nginx ECS task resolves `users` by service name through Docker DNS.
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
      # RDS proxy ports. Floci assigns one per cluster BY CREATION ORDER, so
      # Postgres/MySQL flip between 7001/7002 across applies — never hardcode a
      # port. scripts/discover_db_port.py reads them from describe-db-clusters
      # into .env as USERS_DB_PORT / ORDERS_DB_PORT. Published so host-side
      # clients (the phase-2 postgresql/mysql providers, any SQL client) reach
      # localhost:<port>; in-network containers use floci:<port>.
      - "7000-7010:7000-7010"
      # ElastiCache proxy ports — same arrangement as the RDS range above: Floci
      # proxies TCP to a real valkey container per replication group, and without
      # the range published the port is closed, which reads like "the emulator
      # doesn't really serve Redis" (it does).
      # WORKAROUND(local): Do NOT use Floci's 6379-6399 default. It collides with
      # any local Redis on 6379 — whoever binds first wins and the other fails
      # silently, or a client reaches the WRONG Redis.
      # CONTRACT: This range and FLOCI_SERVICES_ELASTICACHE_PROXY_BASE_PORT /
      # _MAX_PORT below MUST agree; a mismatch yields a closed port, no error.
      # CONTRACT: HOST-SIDE ONLY — do NOT "fix" REDIS_PORT to 6479. In-network
      # containers dial `floci-valkey-<group-id>:6379` directly, bypassing this
      # proxy entirely. See [[floci-elasticache-two-ports-and-provider-panic]]
      - "6479-6499:6479-6499"
    environment:
      # ECS tasks launched by Floci join the compose network and can resolve
      # other compose containers (users) by service name via Docker DNS.
      # The GENERIC network setting, documented as "Docker network name used by
      # all container-backed services" — RDS, DocumentDB, ElastiCache, Lambda and
      # ECS alike. The ECS-specific one below is kept because it is the setting
      # the nginx reverse-proxy task depends on and the one this repo verified.
      - FLOCI_SERVICES_DOCKER_NETWORK=3mrai_3mrai-network
      - FLOCI_SERVICES_ECS_DOCKER_NETWORK=3mrai_3mrai-network
      # ElastiCache proxy range — must match the published ports above exactly.
      # Floci allocates one port per replication group from this range, starting
      # at BASE. Moved off the 6379-6399 default so a developer's own local Redis
      # on 6379 and this emulator can run at the same time.
      - FLOCI_SERVICES_ELASTICACHE_PROXY_BASE_PORT=6479
      - FLOCI_SERVICES_ELASTICACHE_PROXY_MAX_PORT=6499
      # Persist state across restarts in the `floci-state` NAMED VOLUME (see the
      # top-level `volumes:` block for why it is not a ./data bind mount).
      # `persistent` flushes on every write; `hybrid` batches on a 5s async timer
      # and loses writes on an unclean stop — do not "optimize" this to hybrid.
      # See [[floci-storage-modes-and-tmp-corruption]]
      - FLOCI_STORAGE_MODE=persistent
      - FLOCI_STORAGE_PERSISTENT_PATH=/app/data
      # SES relay → Mailpit (resolved via Docker DNS), so pipeline email lands in
      # an inspectable inbox at http://localhost:8025. Floci records every sent
      # email locally regardless (its /_aws/ses endpoint), so this relay serves
      # inspection, not delivery correctness. It drops arbitrary headers,
      # attachments and complex multipart bodies — fine for the plain HTML sent
      # here; inspect anything richer through /_aws/ses instead.
      - FLOCI_SERVICES_SES_SMTP_HOST=mailpit
      - FLOCI_SERVICES_SES_SMTP_PORT=1025
    volumes:
      - floci-state:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [3mrai-network]
    depends_on:
      # `service_started`, NOT `service_healthy`. Floci gates users, orders,
      # tracking and the nginx ECS task, so a health gate here would let an
      # unhealthy inbox stop the whole API from booting — and a missing Mailpit
      # costs inspectability, not correctness. What it buys is ordering only:
      # Mailpit starts first, so the session's first email is usually relayed
      # rather than refused. Best-effort, not a guarantee.
      mailpit:
        condition: service_started
    healthcheck:
      # The floci image ships curl (Quarkus app on :4566).
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Observability (opt-in): `docker compose --profile observability up` ──
  # OTel collector: fluentd from the compose services + CloudWatch (ECS/RDS) on
  # Floci, exported to self-hosted OpenObserve. Pinned image; do not use :latest.
  # Logs AND traces both live in OpenObserve, joined by the trace_id every log
  # line carries. See [[ADR-0019-distributed-tracing-opentelemetry]]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.156.0
    profiles: [observability]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "24224:24224"   # fluent_forward — published so the Docker daemon (host) can reach it
      # OTLP trace ingest. Services reach it in-network at otel-collector:4318;
      # publishing is for host-side probing only.
      # WARNING: Behind `profiles: [observability]`, so a bare `docker compose
      # up` leaves it down and every SDK export fails DNS, spamming full
      # `getaddrinfo ENOTFOUND otel-collector` traces (8 in 2 min on an idle
      # stack). Start the stack with `make bootstrap`, which brings this up.
      - "4317:4317"     # OTLP/gRPC
      - "4318:4318"     # OTLP/HTTP
      # health_check extension — published because `make doctor` probes it from
      # the HOST to report exactly the situation described just above: services
      # configured to export traces while this container is not running.
      - "13133:13133"   # health_check
    environment:
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      # base64("admin@3mrai.local:Complexpass#123") — the OpenObserve Basic auth
      # header value. Local dev only; prod injects this from Secrets Manager.
      - O2_BASIC_AUTH=YWRtaW5AM21yYWkubG9jYWw6Q29tcGxleHBhc3MjMTIz
      # The OpenObserve organization everything lands in. It needs no creating:
      # ingesting into /api/3mrai/... auto-creates the org `3mrai` from the URL
      # (ZO_CREATE_ORG_THROUGH_INGESTION), deterministically on every rebuild.
      # Do NOT create it via POST /api/organizations instead — that path ignores
      # the identifier in the body and generates a random one, which would change
      # on every `make clean` and force consumers to discover it at runtime.
      - O2_ORG=3mrai
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks: [3mrai-network]
    depends_on:
      floci:
        condition: service_healthy

  # OpenObserve: single-binary logs backend (ADR-0018). Behind the observability
  # profile like the collector. Pinned image; do not use :latest. Local dev creds
  # only — prod reads them from Secrets Manager (ADR-0007).
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.91.1
    profiles: [observability]
    environment:
      - ZO_ROOT_USER_EMAIL=admin@3mrai.local
      - ZO_ROOT_USER_PASSWORD=Complexpass#123
    ports:
      - "5080:5080"   # UI + OTLP HTTP ingest
    volumes:
      # Named volume, same rule as `floci-state`: runtime-generated state is
      # never a ./data bind mount, so `docker compose down -v` can actually
      # clear it. (The collector's config mount above stays a bind mount on
      # purpose — that one is versioned source, not state.)
      - openobserve-data:/data
    networks: [3mrai-network]

  # Users service (Fastify + Prisma). Build context is the REPO ROOT so
  # pnpm-lock.yaml and pnpm-workspace.yaml reach the multi-stage Dockerfile.
  # Reachable as `users` on 3mrai-network, so the Nginx ECS task can
  # proxy_pass to http://users:3000 through Docker embedded DNS.
  users:
    build:
      context: .
      dockerfile: services/users/Dockerfile
    networks: [3mrai-network]
    ports:
      - "3000:3000"
      # gRPC surface (GetUserById). Reachable as `users:50051` on the network so
      # the Orders service can resolve identity. Guarded by the x-api-key interceptor.
      - "50051:50051"
    depends_on:
      floci:
        condition: service_healthy
    # Environment comes from the GENERATED .env.local.users (see
    # docs/superpowers/specs/2026-07-20-env-file-generation-design.md).
    # Nothing is declared inline on purpose: compose gives `environment:`
    # precedence over `env_file:`, so a leftover inline entry would silently
    # override the generated value and reintroduce the duplication this
    # removes. Regenerate with `make env-file`; edit only the CUSTOM box.
    env_file:
      - .env.local.users
    # stdout → the observability collector's fluent_forward receiver.
    # localhost:24224 because the Docker daemon resolves fluentd-address from the
    # HOST, not this network. fluentd-async so the service still starts when the
    # observability profile (and thus the collector) is not running.
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "users"
    develop:
      watch:
        # Users runs the compiled production build (runtime stage → node
        # dist/server.js), NOT `tsx watch`, so a source sync would copy the .ts
        # files but the process keeps running the old dist/. `rebuild` reconstructs
        # the image on a source change so the new code actually runs. Requires
        # `docker compose watch` to be active.
        - action: rebuild
          path: ./services/users/src

  # Orders service (.NET Core 10 Minimal API, Clean Architecture + EF Core/MySQL).
  # Build context is the REPO ROOT so the shared gRPC contract (proto/users.proto)
  # is inside the build context — Grpc.Tools generates the Users client from it.
  # Reachable as `orders` on 3mrai-network; resolves caller identity by calling
  # the Users gRPC server at users:50051 (guarded by the shared x-api-key).
  orders:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    networks: [3mrai-network]
    ports:
      # Host 3001 → container 8080 (ASPNETCORE_URLS). Health: GET /v1/health.
      - "3001:8080"
    depends_on:
      floci:
        condition: service_healthy
      # The gRPC client is dialed lazily on POST /v1/orders, so "started" is
      # enough — reads and health do not need Users up.
      users:
        condition: service_started
    # Environment comes from the GENERATED .env.local.orders — see the note
    # on the users service above for why nothing is declared inline.
    env_file:
      - .env.local.orders
    # stdout → the observability collector's fluent_forward receiver.
    # localhost:24224 because the Docker daemon resolves fluentd-address from the
    # HOST, not this network. fluentd-async so the service still starts when the
    # observability profile (and thus the collector) is not running.
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "orders"
    develop:
      watch:
        # Orders is .NET (compiled): a source sync alone would copy .cs files into
        # the container but NOT recompile — the running process keeps the old DLL.
        # `rebuild` reconstructs the image on any source change so the new code
        # actually runs. Requires `docker compose watch` to be active.
        - action: rebuild
          path: ./services/orders/src

  # Tracking service (Go 1.26 + Gin, sqlc/database-sql → MySQL). Reachable as
  # `tracking` on 3mrai-network so the Nginx ECS task can proxy_pass to
  # http://tracking:8000. REST-only — no gRPC server, so no second port.
  # WHY: Build context is ./services/tracking-go, not the repo root like Users
  # and Orders: the Users gRPC stubs are COMMITTED under
  # internal/adapter/grpcusers/gen/, so no shared .proto is read here at all.
  tracking:
    build: ./services/tracking-go
    networks: [3mrai-network]
    ports:
      # Host 3002 → container 8000. 3000/3001 are taken by Users and Orders.
      # Health: GET /v1/health (unprefixed — the gateway publishes
      # /v1/tracking/health and nginx rewrites).
      - "3002:8000"
    depends_on:
      floci:
        condition: service_healthy
      # WHY: No `depends_on: users`. Tracking's only gRPC is an OUTBOUND client
      # dialled LAZILY, and a dial failure is logged and swallowed, so nothing at
      # boot touches Users. `service_started` would not help either — a started
      # container is not a listening gRPC server.

    # CONTRACT: Environment comes from the GENERATED .env.local.tracking. Do NOT
    # add an `environment:` block — it silently WINS over env_file, and the
    # service would never see its generated DB URLs, gRPC target or API keys.
    # See [[env-files]]
    env_file:
      - .env.local.tracking
    # WHY: No healthcheck, in compose or in the image. The runtime stage is
    # distroless — no shell, no curl, no wget — so the only executable in the
    # container is the server binary. Nothing depends_on this service, so no
    # `condition: service_healthy` is left unsatisfiable. Probe from the host:
    #   curl -fsS http://localhost:3002/v1/health

    # stdout → the collector's fluent_forward receiver. localhost:24224 because
    # the Docker daemon resolves fluentd-address from the HOST, not this network;
    # fluentd-async so the service still starts without the observability
    # profile.
    # CONTRACT: Keep tag "tracking" — saved OpenObserve queries, dashboard panels
    # and collector pipelines all filter on it. See [[logging-context]]
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "tracking"
    # NO `develop.watch` block, unlike Users and the Python service this
    # replaced. Go is COMPILED: a synced .go file would change nothing in a
    # running container, and the sync would be a mechanism that looks like
    # hot-reload while doing nothing. Orders (also compiled) uses `rebuild` for
    # this reason; that is a real option here too. Pick up a code change with:
    #   docker compose up -d --build tracking

  # WHY: There is deliberately NO `events-pipeline` compose service. The
  # pipeline is a REAL Lambda on Floci, deployed by Terraform with its SQS event
  # source mapping (see functions/events-pipeline/CLAUDE.md §1). A compose
  # worker polling SQS by hand would exercise neither that mapping, nor
  # batching, nor partial-batch responses. Ship code with `pnpm run build` +
  # `terraform apply` — archive_file's hash triggers the function update.

  # Mailpit — the local inbox. Floci's SES relays here (see the floci service's
  # FLOCI_SERVICES_SES_SMTP_* above), so pipeline email is readable at
  # http://localhost:8025 and assertable over its HTTP API from the layer-2
  # integration test. NOT behind a profile, unlike email-preview: it is part of
  # the running system — Floci's relay target and the E2E assertion point — and
  # not a developer tool.
  mailpit:
    # Pinned, like every other image here — `latest` would silently change the
    # API this project's tests query.
    image: axllent/mailpit:v1.20
    networks: [3mrai-network]
    environment:
      # WHY: 5000, not Mailpit's default 500 — at the cap it evicts the OLDEST
      # message, and accumulated runs do reach it. 5000 is ~25x a full suite's
      # volume, so capacity eviction can never push out a suite's own mail.
      # It is NOT the cause of slow email specs: that is events-pipeline
      # throughput (~50 events/min), measured in e2e/support/purge-mailpit.ts.
      MP_MAX_MESSAGES: "5000"
    ports:
      - "8025:8025" # web UI + HTTP API (/api/v1/…)
      - "1025:1025" # SMTP — what Floci's SES relay connects to
    healthcheck:
      # busybox wget — present in this image, unlike curl. Do NOT switch to
      # `mailpit healthcheck`: v1.20 has no such subcommand, and it leaves the
      # container in `health: starting` forever with
      # `unknown command "healthcheck"`, which blocks floci behind it. Probing
      # the HTTP API is the stronger check anyway — it is the endpoint the
      # integration test queries.
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 3s
      retries: 10

  # react-email preview server (`email dev`, reads ./emails, port 3000).
  # Behind the `preview` profile so a normal `make up` does NOT start it — it is
  # a developer tool, and port 3000 is already taken by the Users service on the
  # host. Start it with:
  #   docker compose --profile preview up email-preview
  email-preview:
    build:
      # Context is the REPO ROOT (pnpm-lock.yaml / pnpm-workspace.yaml live
      # there), like the users and orders services — see the Dockerfile header.
      context: .
      dockerfile: functions/events-pipeline/Dockerfile
      target: preview
    profiles: ["preview"]
    networks: [3mrai-network]
    ports:
      # Host 3003 → container 3000. NOT 3000:3000: the Users service already
      # publishes host 3000, so that mapping fails to bind whenever the normal
      # stack is up — which is exactly when a developer wants the preview.
      - "3003:3000"
    develop:
      watch:
        # `sync` (not `rebuild`) is enough here: `email dev` is a Next.js dev
        # server that hot-reloads the .tsx files it watches.
        - action: sync
          path: ./functions/events-pipeline/emails
          target: /app/emails

  # Web app (Angular 21 + Tailwind 4 SPA). Build context is the REPO ROOT so
  # pnpm-lock.yaml and pnpm-workspace.yaml reach the multi-stage Dockerfile.
  # Served as STATIC FILES by nginx — the build emits a browser bundle only, so
  # there is no Node process in the runtime image.
  # WHY: No depends_on — a dependency on floci/users would turn a broken
  # emulator into a broken web app. Add one if the app ever needs one at boot.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # CONTRACT: BUILD-TIME, not runtime. @ngx-env/builder inlines NG_APP_*
        # into the bundle at compile time, so moving these to the env_file below
        # leaves them read by nothing — the container keeps serving what was
        # compiled in, with no error. Changing one needs a REBUILD:
        #     docker compose build web && docker compose up -d web
        # `restart` re-serves the same bundle and looks like the flag being
        # ignored. false matches apps/web/.env.example (plain payment screen).
        # See [[env-files]]
        NG_APP_STRIPE_ENABLED: "false"
        # The base path every gateway call hangs off, and the one NG_APP_* that
        # is effectively fixed. RELATIVE on purpose: nothing in this repo sends
        # CORS headers, so an absolute gateway origin would be blocked at the
        # preflight on every request. Floci's per-apply <api-id> stays out of
        # the bundle entirely — it lives in the nginx proxy below.
        NG_APP_API_GATEWAY_URL: "/v1"
        # A FLAG, not the Geoapify key. The key is server-side only, read by
        # nginx from GEOAPIFY_API_KEY in the env_file below — an NG_APP_* value
        # is compiled into the bundle and readable in devtools, so a key there
        # would be public. false by default: with no key the proxy answers 503,
        # and offering an autocomplete that always fails is worse than not
        # offering it. Turn both on together.
        NG_APP_GEOCODE_ENABLED: "true"
    networks: [3mrai-network]
    ports:
      # Host 3004 → container 80 (nginx). 3000/3001/3002 are taken by users,
      # orders and tracking, and 3003 by email-preview, so this continues the
      # sequence.
      - "3004:80"
    # Read at RUNTIME by nginx, not by the bundle — the two halves of this
    # service's configuration are deliberately split. The build args above are
    # compiled in; these two values are rendered into the nginx config at
    # container start (see apps/web/Dockerfile's templates COPY), because Floci
    # mints a new <api-id> on every apply and a baked-in one would 404.
    env_file:
      - .env.local.web
    # stdout → the collector's fluent_forward receiver, to count /geocode/ calls
    # against Geoapify's 3,000/day free tier. fluentd-async so the app starts
    # without the observability profile; a side effect is that
    # `docker compose logs web` shows nothing (the count lives in OpenObserve's
    # `logs` stream under service_name = web-geocode).
    # CONTRACT: Safe only because apps/web/nginx.conf sets `access_log off`
    # globally and re-enables it for /geocode/ ALONE, in a JSON format carrying
    # service_name + severity_text/_number. Do NOT log static-file requests —
    # combined format has no service_name, so every line lands in the
    # `unclassified` stream. See [[openobserve-cloudwatch]]
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "web"
    develop:
      watch:
        # `rebuild`, not `sync`: the image serves a COMPILED bundle out of
        # nginx's html root, so copying a changed .ts file in would change
        # nothing a browser can see — there is no compiler in the runtime stage
        # to notice it. Requires `docker compose watch` to be active.
        # For a fast edit loop, prefer `pnpm web:dev` (ng serve, HMR) and use
        # this container for verifying the built artifact.
        - action: rebuild
          path: ./apps/web/src
