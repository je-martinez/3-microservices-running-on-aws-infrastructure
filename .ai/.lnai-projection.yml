# Classification decisions for multi-provider config sync.
#
# Committed on purpose, unlike the rest of .ai/: these are DECISIONS, not
# generated output. Without them every run reclassifies from scratch and
# produces drift — the exact problem this design exists to prevent.
#
# Spec: docs/superpowers/specs/2026-08-06-multi-provider-agent-config-sync-design.md
#
# rules:     universal   -> goes to .ai/AGENTS.md, reaches every provider
#            claude-only -> stays in CLAUDE.md, never propagated
# skills:    share | exclude
# subagents: role        -> described in the AGENTS.md "## Roles" appendix
#            prohibition -> written as a "do not do this yourself" rule instead,
#                           because the agent is the single writer of a resource

rules:
  # Universal: policy that holds no matter which tool runs the agent.
  conventional-commits: universal
  python-first-scripting: universal
  env-files-generated: universal
  logging-context-and-pii: universal
  testing-three-layers: universal
  language-spanish-user-english-docs: universal
  scope-yagni: universal
  never-commit-without-confirmation: universal

  # Added 2026-08-06, first end-to-end run. CLAUDE.md topics that the original
  # list did not name explicitly.
  documentation-vault-conventions: universal  # structure/frontmatter/validation
  branch-flow: universal                      # feature/task branches, PR targets
  phase-c-batch-review: universal             # batching + dependency gates
  node-version-pinned: universal              # .nvmrc; activate before npx/node

  # Added 2026-08-10. Universal because it is a property of the local stack, not
  # of any agent tool: an emulator resource can report `available` with no
  # backing container, and `terraform apply` then creates nothing while
  # reporting success. Any agent that runs `make clean` or reads a resource
  # status needs this, whichever CLI it is driven from.
  local-emulator-state: universal             # named volume; clean is destructive

  # Added 2026-08-13.
  #
  # package-manager-pnpm: universal. A property of the repo's lockfile, not of
  # any agent tool: `npm install` corrupts the pnpm tree and drops a stray
  # package-lock.json whichever CLI ran it. Every provider installs deps.
  #
  # vault-over-memory (the GOLDEN RULE): universal, but note the seam. The
  # POLICY — durable conventions/decisions/lessons belong in the versioned,
  # reviewable vault, never only in an assistant's private memory store — holds
  # for any assistant that has a memory feature (Cursor rules-memory, Copilot,
  # Gemini's save_memory, OpenCode). Only the Claude-specific MECHANISM (the
  # ~/.claude/ path and routing the write through `obsidian-vault`) is dropped;
  # the prohibition on writing to docs/ directly already lives in
  # ## Prohibitions. Projecting it makes the rule land where it is needed most,
  # since every one of those providers has its own invisible memory store.
  #
  # load-testing-surface: universal. Where load tests live and why they omit the
  # E2E headers is a property of the repo layout; the only Claude-specific part
  # is the `e2e-impl` subagent, projected as a role.
  package-manager-pnpm: universal
  vault-over-memory: universal
  load-testing-surface: universal

  # Claude-only: names a tool, skill, or plugin that exists only in Claude Code.
  # Note the seam — the POLICY "never commit without confirmation" is universal
  # (above); only its MECHANISM (the A/B/C/D/E menu rendered via
  # AskUserQuestion) is Claude-specific.
  git-confirmation-menu: claude-only
  superpowers-skills: claude-only
  plugin-mcp-servers: claude-only
  subagent-delegation-flow: claude-only

  # Added 2026-08-06. Points at .claude/ paths and Claude-Code-only machinery.
  claude-memory-location: claude-only  # "no ~/.claude/ memory file" is internal
  nested-claude-md-files: claude-only  # services/<svc>/CLAUDE.md loading model

  # Added 2026-08-25, after the cart milestone.
  #
  # route-completeness-checklist: universal. "A new route is not done when the
  # service serves it" — gateway + nginx wiring, all three test layers, load
  # scenarios, observability, and the preview/charging rounding rule. Nothing in
  # it names an agent tool: the failure it prevents (a route that 404s at the
  # gateway while working perfectly on the service port) is a property of this
  # repo's Terraform + nginx topology and reproduces identically whichever CLI
  # edits the code. Extends the already-universal testing-three-layers topic, so
  # it lands in .ai/rules/testing.md and is summarized in AGENTS.md. Only the
  # [[money-representation]] wikilink is dropped, replaced by the vault path —
  # Obsidian link syntax does not resolve outside Claude Code.
  route-completeness-checklist: universal

  # observability-reads-included: universal, with a seam worth naming.
  #
  # The POLICY — every endpoint gets a workflow span and at least one flow log,
  # READS INCLUDED, with distinct shapes for reads (one `_succeeded` with a
  # count, no `_started`, no `_failed`) and writes (the full triad plus
  # `reason`) — is a repo-wide logging convention. It completes the flow-event
  # section of logging-and-pii, which previously described the triad without
  # ever saying which endpoints owe one.
  #
  # Its MECHANISM is .NET-specific (`TraceWorkflowAsync`, `LogContextEnricher`,
  # `CartReadService.BuildAsync`) but NOT Claude-specific, so it travels as
  # illustration rather than as the rule. That distinction matters: the source
  # lives in services/orders/CLAUDE.md, a nested file no target provider
  # auto-loads, so declining to project it would drop the rule entirely for
  # every provider rather than merely relocating it.
  #
  # Two sub-rules generalize cleanly beyond Orders and are stated as such:
  # never re-pass identity fields an enricher already attaches, and instrument
  # the ENTRY POINT rather than a shared helper (a helper reused by the write
  # path emits a spurious nested read span inside every write).
  observability-reads-included: universal

  # shared-queue-backlog: universal. Added 2026-08-25, same day as the source
  # section (e2e/CLAUDE.md, commit a4b9b3d).
  #
  # Universal on the strongest available test: the failure is a property of the
  # LOCAL STACK's topology — one SQS queue shared by Users, Orders and Tracking,
  # drained by a single sequential Lambda — and it reproduces identically no
  # matter which CLI started the run. Nothing in it names an agent tool.
  #
  # It is narrower than most projected rules (one repo's test environment rather
  # than a coding convention), and that argued for rule-file-only placement. It
  # gets a short AGENTS.md paragraph anyway, for a specific reason: the rule's
  # value is in RECOGNITION, and .ai/rules/testing.md only activates on a test
  # file path. An agent debugging this reads Lambda handlers, dispatch code, or
  # Mailpit — not a *.spec.ts — so the rule file would stay silent exactly when
  # it is needed. The ambient line is what makes the misdiagnosis avoidable.
  #
  # Lands in .ai/rules/testing.md, which already owns load-testing-surface, so
  # the "two suites, two jobs" material stays in one place rather than being
  # split across a new file.
  #
  # Nothing is dropped: the source section names no Claude-specific mechanism.
  # The `e2e-impl` agent that owns this surface already travels as a role.
  shared-queue-backlog: universal

  # review-against-the-brief: universal. Added 2026-08-26, same day as the source
  # bullet (CLAUDE.md, "Phase C review flow").
  #
  # Universal on the strongest available test: it describes how to READ a diff,
  # and names no tool, skill, plugin, or Claude Code affordance. The failure it
  # prevents — a requirement silently dropped in implementation, leaving no trace
  # because the shipped code is self-consistent and its tests cover what was
  # built rather than what was specified — is a property of how review works, not
  # of which CLI performs it. Every provider in this repo reviews diffs.
  #
  # Lands in .ai/rules/git-and-commits.md, which already owns the Phase C review
  # flow (chaining, batching, dependency gates, never-auto-merge), so the review
  # discipline stays in one place rather than starting a fourth review location.
  # NOT in testing.md despite the tests angle: the rule's claim is that tests are
  # the thing that CANNOT catch this, so filing it under testing would put it
  # behind a path glob that only activates on the files it says are unreliable.
  #
  # It also gets an AGENTS.md paragraph, for the same reason shared-queue-backlog
  # did: its value is in RECOGNITION at review time. A rule file activates on the
  # paths in the diff, which for a review pass is arbitrary and unrelated to
  # review; the ambient line is what makes it present when a diff is being judged.
  #
  # Dropped: the [[2026-08-26-spec-said-so-review-checked-the-diff-not-the-spec]]
  # wikilink, replaced by the backticked vault path per the route-completeness
  # precedent above. The incident itself is retained inline as prose — it is the
  # evidence for the rule, and a provider that cannot follow the link would
  # otherwise receive an unsupported assertion.
  review-against-the-brief: universal

skills:
  # Portable knowledge worth having in any tool.
  #
  # NOTE (2026-08-06): the copy in .ai/skills/floci/SKILL.md needs its
  # `description` wrapped in double quotes. The source value contains ": " twice
  # (":4566" and "Knowledge layer:"), which Claude Code's parser tolerates and
  # lnai's (gray-matter/js-yaml) rejects outright. Re-apply after every re-copy;
  # fix the COPY, never .claude/skills/.
  floci: share
  terraform-skill: share

  # Added 2026-08-13. Gatling JS conventions are vendor knowledge sourced from
  # the official docs — nothing in it depends on Claude Code, and the repo's
  # load simulations are code any provider may be asked to touch.
  #
  # NOTE: unlike floci, this one needs NO quoting fix — verified 2026-08-13 by
  # parsing its frontmatter with js-yaml directly. Its description contains
  # colons but never the ": " sequence that breaks a plain scalar. Re-verify
  # after editing the source description rather than assuming either way.
  gatling-js: share

  # Depend on Obsidian tooling other providers do not have.
  obsidian-bases: exclude
  obsidian-cli: exclude
  obsidian-markdown: exclude
  json-canvas: exclude
  defuddle: exclude

  # ---------------------------------------------------------------------------
  # Added 2026-08-25 (JE-194). These 17 had no entry at all, which meant they
  # reached no provider AND nothing failed — the silent-skip failure mode the
  # issue exists to close. Judged against what this repo actually runs, the way
  # gatling-js was admitted: vendor knowledge for a stack in this repo travels;
  # generic advice or a product we do not use does not.
  #
  # SHARE — load-bearing stack knowledge for a service that runs here.

  # Orders is .NET 10 / EF Core 9 / Pomelo MySQL. EF Core is the ONLY data
  # access path in that service, and this skill's core claims (NoTracking by
  # default, query splitting, never hand-edit a migration, migrations run as a
  # dedicated step rather than at startup) are exactly the decisions Orders
  # already made. A provider editing Orders without it will regress them.
  efcore-patterns: share

  # Both Orders AND Tracking run Aurora MySQL (Tracking via SQLAlchemy 2 +
  # PyMySQL + Alembic), so this is two services, not one. InnoDB index/locking/
  # EXPLAIN knowledge is engine-level and not something a general model reliably
  # has at the level of detail here (deadlock diagnosis, online DDL, covering
  # indexes). Caveat kept in mind and accepted: its opening paragraph pushes
  # PlanetScale as a host, which is noise in a repo that runs Aurora on Floci —
  # but it explicitly defers to an existing provider, and one stray hosting
  # recommendation does not outweigh 18 reference files of InnoDB detail.
  mysql: share

  # Users is Fastify 5 + TypeScript. Framework-specific and non-obvious:
  # encapsulation/plugin scoping, JSON-Schema serialization, decorators, hooks,
  # and `inject` for testing are the things a model gets wrong by defaulting to
  # Express idioms. Directly matches the service's structure.
  fastify-best-practices: share

  # Users runs Prisma 7.8 against Aurora Postgres. These three are the ORM
  # itself — the client API surface, the CLI/migrate workflow, and the v7 shape.
  #
  # prisma-upgrade-v7 is share DESPITE the upgrade being done: Users is already
  # on the v7 shape (`prisma-client` generator, @prisma/adapter-pg driver
  # adapter, prisma.config.ts, generated client under src/generated/prisma). A
  # provider carrying v6 habits will "fix" that shape back to `prisma-client-js`
  # and break the build. Here the migration guide reads as an explanation of why
  # the current code looks the way it does, which is the more valuable use.
  prisma-client-api: share
  prisma-cli: share
  prisma-upgrade-v7: share

  # Tracking is FastAPI + Pydantic v2. This is the OFFICIAL FastAPI skill and
  # the only one of the four FastAPI skills that travels (see the exclusions
  # below): it is version-current vendor guidance rather than a project
  # scaffold, and its content — Annotated[..., Depends()], response models,
  # router-level prefixes/tags — is what a provider actually needs while editing
  # an existing service.
  fastapi: share

  # TypeScript is the language of Users, events-pipeline, realtime-events, and
  # the e2e suite. This is the deeper of the two TypeScript skills (type guards,
  # branded types, discriminated unions, utility types, tsconfig/project
  # references) and the reference files make it usable rather than aspirational.
  # Its tRPC section is dead weight here; the rest carries it.
  typescript-pro: share

  # EXCLUDE — redundant with a shared skill, generic enough to be noise, or
  # about a product this repo does not use. Excluding is not a judgment on
  # quality: a projection stuffed with low-signal rules buries the high-signal
  # ones, and every provider pays the context cost on every run.

  # Prisma's HOSTED Postgres product: Console provisioning, create-db, the
  # Management API, service tokens, claim URLs, OAuth. This repo runs Prisma the
  # ORM against Aurora Postgres on Floci and has no Prisma Platform account.
  # Following either skill here would send an agent to provision an external,
  # billable database instead of using the local emulator — actively harmful,
  # not merely irrelevant. The parts of Prisma we DO use travel via
  # prisma-client-api / prisma-cli / prisma-upgrade-v7.
  prisma-postgres: exclude
  prisma-postgres-setup: exclude

  # Three redundant FastAPI skills. All four overlap heavily; `fastapi` (the
  # official one) is shared and covers the same ground more currently.
  #
  # fastapi-templates is scaffolding for NEW projects ("starting new FastAPI
  # projects from scratch", a proposed app/ layout with routers/models/schemas/
  # services/repositories). Tracking already exists with a different, deliberate
  # layout (src/features/<x>/{api,commands,queries}); projecting a competing
  # skeleton invites a provider to restructure a working service.
  #
  # fastapi-expert and fastapi-patterns both teach async SQLAlchemy as the
  # data-access default. Tracking uses SQLAlchemy 2 SYNCHRONOUSLY with PyMySQL
  # and Alembic — an agent following them would introduce async sessions and an
  # async driver the service does not install. fastapi-expert also carries a
  # Django-migration reference and `related-skills` pointing at skills that do
  # not exist here.
  fastapi-templates: exclude
  fastapi-expert: exclude
  fastapi-patterns: exclude

  # Broad, and what it teaches this repo has already decided. It is a schema
  # DESIGN and database-SELECTION skill (SQL vs NoSQL decision tree,
  # normalization analysis, a 276K bundle of Python analyzers with sample
  # schemas) aimed at greenfield modeling. Every engine choice here is settled
  # and recorded as an ADR — Aurora MySQL for Orders/Tracking, Aurora Postgres
  # for Users, DocumentDB for events-pipeline. The concrete engine-level advice
  # a provider would actually use arrives via `mysql`. Its bundled scripts also
  # would not run under another provider's tooling.
  database-designer: exclude

  # Reads as .NET/EF Core advice (AsNoTracking, EF Core vs Dapper) and is a
  # near-subset of efcore-patterns, which is shared. The genuinely general parts
  # (avoid N+1, no SELECT *, always bound a result set) are table stakes that a
  # capable model applies unprompted; projecting them costs context on every run
  # and teaches nothing repo-specific.
  database-performance: exclude

  # Generic "be a modern Python expert" persona: Python 3.12+, async, uv, ruff,
  # pydantic. 8K with no reference files and no procedure. Tracking's actual
  # Python conventions are already specified where they bind — pinned
  # requirements.txt (NOT uv), ruff config in pyproject.toml, the feature-folder
  # layout — in services/tracking/CLAUDE.md, and the repo's python-first
  # scripting rule already travels as a projected rule. Its uv recommendation
  # would contradict this repo's pinned-requirements contract.
  python-pro: exclude

  # Subsumed by typescript-pro, which is shared: same topics (generics,
  # conditional/mapped types, template literals, utility types) with more depth
  # and better reference material. Projecting both would put two overlapping
  # type-system tutorials in front of every provider.
  typescript-advanced-types: exclude

subagents:
  # Implementers and the planner: safe to describe as roles.
  users-impl: role
  orders-impl: role
  tracking-impl: role
  events-pipeline-impl: role
  infra-impl: role
  solutions-architect: role

  # Added 2026-08-13. Sixth code-only implementer; same shape as the others —
  # writes only test/simulation code, never git, never Linear.
  e2e-impl: role

  # Single writers. Projecting these as "available roles" would invite an agent
  # to believe it may write to Linear or docs/ itself. They become prohibitions.
  linear-pm: prohibition
  obsidian-vault: prohibition
  github-ops: prohibition

  # The sync agent itself is Claude-only machinery; it has nothing to say to
  # other providers.
  ai-config-sync: exclude
