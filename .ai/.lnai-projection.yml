# CONTRACT: Committed on purpose, unlike the rest of .ai/. Delete an entry and
# that item reclassifies from scratch on the next run, silently drifting.
# rules: universal -> .ai/AGENTS.md | claude-only -> CLAUDE.md. skills: share |
# exclude. subagents: role -> AGENTS.md "## Roles" | prohibition -> a "do not do
# this yourself" rule, for the single writer of a resource.
# See [[2026-08-06-multi-provider-agent-config-sync-design]]

rules:
  # Universal: policy that holds no matter which tool runs the agent.
  conventional-commits: universal
  python-first-scripting: universal
  env-files-generated: universal
  logging-context-and-pii: universal
  testing-three-layers: universal
  language-spanish-user-english-docs: universal
  scope-yagni: universal
  never-commit-without-confirmation: universal

  # Added 2026-08-06, first end-to-end run. CLAUDE.md topics that the original
  # list did not name explicitly.
  documentation-vault-conventions: universal  # structure/frontmatter/validation
  branch-flow: universal                      # feature/task branches, PR targets
  phase-c-batch-review: universal             # batching + dependency gates
  node-version-pinned: universal              # .nvmrc; activate before npx/node

  # Added 2026-08-10. Universal because it is a property of the local stack, not
  # of any agent tool: an emulator resource can report `available` with no
  # backing container, and `terraform apply` then creates nothing while
  # reporting success. Any agent that runs `make clean` or reads a resource
  # status needs this, whichever CLI it is driven from.
  local-emulator-state: universal             # named volume; clean is destructive

  # package-manager-pnpm: `npm install` corrupts the pnpm tree whichever CLI runs it.
  # vault-over-memory: the POLICY travels; the ~/.claude path and obsidian-vault
  #   routing do not. Every target provider has its own invisible memory store.
  # load-testing-surface: repo layout, not tooling.
  package-manager-pnpm: universal
  vault-over-memory: universal
  load-testing-surface: universal

  # Claude-only: names a tool, skill, or plugin that exists only in Claude Code.
  # Note the seam — the POLICY "never commit without confirmation" is universal
  # (above); only its MECHANISM (the A/B/C/D/E menu rendered via
  # AskUserQuestion) is Claude-specific.
  git-confirmation-menu: claude-only
  superpowers-skills: claude-only
  plugin-mcp-servers: claude-only
  subagent-delegation-flow: claude-only

  # Added 2026-08-06. Points at .claude/ paths and Claude-Code-only machinery.
  claude-memory-location: claude-only  # "no ~/.claude/ memory file" is internal
  nested-claude-md-files: claude-only  # services/<svc>/CLAUDE.md loading model

  # route-completeness-checklist: gateway + nginx wiring, three test layers, load
  # scenarios, observability, preview rounding. The failure it prevents — a route
  # that 404s at the gateway while working on the service port — is Terraform +
  # nginx topology, not tooling. Lands in .ai/rules/testing.md.
  route-completeness-checklist: universal

  # observability-reads-included: the policy travels; its .NET mechanism travels
  # as illustration only. Source is services/orders/CLAUDE.md, which no target
  # provider auto-loads — declining would drop the rule for everyone, not relocate
  # it. Sub-rules kept: never re-pass enricher-attached identity fields, and
  # instrument the ENTRY POINT (a shared helper emits a nested span per write).
  observability-reads-included: universal

  # shared-queue-backlog: local-stack topology (one SQS queue, one sequential
  # Lambda), so it reproduces under any CLI. Lands in .ai/rules/testing.md AND
  # gets an AGENTS.md line: its value is recognition, and the rule file only
  # activates on a *.spec.ts path — an agent debugging this reads Lambda
  # handlers, so the file would stay silent exactly when it is needed.
  shared-queue-backlog: universal

  # review-against-the-brief: how to READ a diff; names no tool. Lands in
  # .ai/rules/git-and-commits.md with the rest of the review flow — NOT
  # testing.md, since the rule's claim is that tests cannot catch this. Plus an
  # AGENTS.md line: a rule file activates on the diff's paths, which are
  # arbitrary at review time. Wikilink dropped for the vault path; the incident
  # stays inline as the rule's evidence.
  review-against-the-brief: universal

  # code-comments: governs comment CONTENT, names no tool. Own rule file, since
  # scripting-language picks a language for NEW scripts and the globs would fight.
  # Dropped: the [[code-comments]] wikilink; kept: the `See [[vault-id]]` form,
  # where the syntax IS the rule.
  #
  # CONTRACT: Also an AGENTS.md paragraph, never the rule file alone — Cursor and
  # Windsurf receive every rule non-ambient, and a rule file cannot reach the
  # decision NOT to narrate.
  #
  # CONTRACT: Every glob stays `**/`-prefixed. An unprefixed `Makefile*` makes
  # lnai's Codex/Gemini plugins create a literal directory of that name.
  code-comments: universal

skills:
  # Portable knowledge worth having in any tool.
  # WORKAROUND(provider): .ai/skills/floci/SKILL.md needs its `description`
  # double-quoted — it contains ": " twice, which lnai's js-yaml rejects. Fix the
  # COPY after every re-copy, never .claude/skills/.
  floci: share
  terraform-skill: share

  # Vendor knowledge from the official docs; the load simulations are code any
  # provider may touch. Needs no quoting fix — its description has colons but
  # never the ": " sequence that breaks a plain scalar.
  gatling-js: share

  # Depend on Obsidian tooling other providers do not have.
  obsidian-bases: exclude
  obsidian-cli: exclude
  obsidian-markdown: exclude
  json-canvas: exclude
  defuddle: exclude

  # Excluded on tooling: every step runs over the Pencil MCP server, which no
  # other provider has, and .pen files are encrypted. TODO(JE-174): the
  # templateUrl/rem-not-px pair reaches nobody — angular-component-authoring has
  # no `rules:` entry. Add one when apps/web stops being Claude-only work.
  pencil-design-extraction: exclude

  # ─── JE-194 (2026-08-25): 17 unclassified skills ────────────────────────────
  # Vendor knowledge for a stack that RUNS here travels; generic advice does not.
  # SHARE — load-bearing stack knowledge for a service that runs here.

  # Orders is .NET 10 / EF Core 9 / Pomelo MySQL. EF Core is the ONLY data
  # access path in that service, and this skill's core claims (NoTracking by
  # default, query splitting, never hand-edit a migration, migrations run as a
  # dedicated step rather than at startup) are exactly the decisions Orders
  # already made. A provider editing Orders without it will regress them.
  efcore-patterns: share

  # Two services on Aurora MySQL (Orders, Tracking). Engine-level InnoDB detail
  # — deadlocks, online DDL, covering indexes — that a general model lacks.
  # Accepted caveat: its intro pushes PlanetScale, noise in an Aurora repo.
  mysql: share

  # Users is Fastify 5 + TypeScript. Framework-specific and non-obvious:
  # encapsulation/plugin scoping, JSON-Schema serialization, decorators, hooks,
  # and `inject` for testing are the things a model gets wrong by defaulting to
  # Express idioms. Directly matches the service's structure.
  fastify-best-practices: share

  # Users runs Prisma 7.8 on Aurora Postgres: client API, CLI/migrate, v7 shape.
  # prisma-upgrade-v7 ships despite the upgrade being done — a provider carrying
  # v6 habits "fixes" `prisma-client` back to `prisma-client-js` and breaks the
  # build.
  prisma-client-api: share
  prisma-cli: share
  prisma-upgrade-v7: share

  # No service runs FastAPI; a provider carrying it pattern-matches Python web
  # idioms onto Go. CONTRACT: this says nothing about Python as a SCRIPTING
  # language — that stays the default and `python-first-scripting` still travels.
  fastapi: exclude

  # TypeScript is the language of Users, events-pipeline, realtime-events, and
  # the e2e suite. This is the deeper of the two TypeScript skills (type guards,
  # branded types, discriminated unions, utility types, tsconfig/project
  # references) and the reference files make it usable rather than aspirational.
  # Its tRPC section is dead weight here; the rest carries it.
  typescript-pro: share

  # EXCLUDE — redundant with a shared skill, generic enough to be noise, or
  # about a product this repo does not use. Excluding is not a judgment on
  # quality: a projection stuffed with low-signal rules buries the high-signal
  # ones, and every provider pays the context cost on every run.

  # Prisma's HOSTED Postgres product: Console provisioning, create-db, the
  # Management API, service tokens, claim URLs, OAuth. This repo runs Prisma the
  # ORM against Aurora Postgres on Floci and has no Prisma Platform account.
  # Following either skill here would send an agent to provision an external,
  # billable database instead of using the local emulator — actively harmful,
  # not merely irrelevant. The parts of Prisma we DO use travel via
  # prisma-client-api / prisma-cli / prisma-upgrade-v7.
  prisma-postgres: exclude
  prisma-postgres-setup: exclude

  # Same: no service runs FastAPI. (Even when one did, these three were out —
  # templates invites restructuring a working service, and the other two teach
  # async SQLAlchemy the service did not use.)
  fastapi-templates: exclude
  fastapi-expert: exclude
  fastapi-patterns: exclude

  # Greenfield schema DESIGN and engine SELECTION; every engine choice here is
  # settled in an ADR. The engine-level advice a provider needs arrives via
  # `mysql`, and its bundled Python analyzers would not run elsewhere.
  database-designer: exclude

  # Reads as .NET/EF Core advice (AsNoTracking, EF Core vs Dapper) and is a
  # near-subset of efcore-patterns, which is shared. The genuinely general parts
  # (avoid N+1, no SELECT *, always bound a result set) are table stakes that a
  # capable model applies unprompted; projecting them costs context on every run
  # and teaches nothing repo-specific.
  database-performance: exclude

  # Generic persona, 8K, no reference files. Python here is scripting, governed
  # by the projected `python-first-scripting` rule; a web/async persona adds
  # nothing to script authoring and its uv advice contradicts the pinned deps.
  python-pro: exclude

  # Subsumed by typescript-pro, which is shared: same topics (generics,
  # conditional/mapped types, template literals, utility types) with more depth
  # and better reference material. Projecting both would put two overlapping
  # type-system tutorials in front of every provider.
  typescript-advanced-types: exclude

  # ─── Go skills (Tracking: Gin, sqlc, golang-migrate, grpc-go, OTel) ─────────
  # CONTRACT: A skill with NO entry here reaches no provider and nothing fails.
  # These nine had none until 2026-08-27 — a migration installs skills without
  # touching this file. Accepted caveat: each cross-references sibling samber
  # skills not installed here, so those "see also" pointers dangle.

  # SHARE — the four that match how this service is actually written, each
  # mapping onto a rule services/tracking-go/CLAUDE.md states independently.

  # context.Context is where this service's most expensive Go bug lives: a
  # goroutine outliving a request must NOT inherit the request context, which is
  # cancelled when the response is sent. This skill covers exactly that
  # (context.WithoutCancel, propagation across layers, background work) and
  # tracking-impl carries the same rule as a non-negotiable. Highest-value of
  # the nine.
  golang-context: share

  # Tracking reaches Aurora MySQL through sqlc over database/sql. This is
  # database/sql-level knowledge — parameterized queries, NULLable columns,
  # struct scanning, transactions and isolation, SELECT FOR UPDATE, pool
  # configuration, context propagation — which is the layer sqlc generates ONTO
  # and which a provider still has to get right by hand. Pairs with `mysql`
  # (engine-level) rather than duplicating it.
  golang-database: share

  # The service's error convention is unusual and easy to "fix" wrongly: errors
  # are values declared BESIDE the type that produces them, with no shared
  # errors package. This skill teaches the wrapping/%w/errors.Is/As machinery
  # that convention is built on, plus slog — which is this service's logger.
  golang-error-handling: share

  # Go concurrency is not something a model reliably gets right unprompted, and
  # this service runs goroutines that outlive requests (the ticker, background
  # dispatch). Goroutine leaks, channel ownership and race conditions are the
  # named triggers; `go test -race` is already in the service's make test.
  golang-concurrency: share

  # EXCLUDE — real quality, but redundant here, or about tooling this repo does
  # not run. The context budget is the constraint: nine Go skills at ~50-120K
  # each would crowd out the higher-signal ones above on every single run.

  # 120K, mostly Prometheus/Grafana/Pyroscope — none of which this repo runs
  # (OTLP to OpenObserve, CloudWatch for metrics). The parts that apply already
  # bind via logging-and-pii, ADR-0019, and the service's CLAUDE.md.
  golang-observability: exclude

  # Layout advice for STARTING or restructuring a project (cmd/internal/pkg,
  # monorepo setup, package splits). Tracking already has a deliberate,
  # documented layout with a hard architectural rule — internal/domain is PURE
  # and may import only the standard library — that this skill does not know
  # about. Same objection that excluded fastapi-templates: a competing skeleton
  # invites a provider to restructure a working service.
  golang-project-layout: exclude

  # Both are general Go craft that a capable model applies unprompted (MixedCaps
  # vs snake_case, Get-prefix on getters, line breaking, when a comment helps).
  # ~108K combined for advice that is table stakes, and the repo enforces the
  # mechanical part with tooling rather than prose: gofmt -s -w . and
  # golangci-lint run are required before any Tracking task reports done. A
  # linter that fails the build beats a style essay in a context window.
  golang-naming: exclude
  golang-code-style: exclude

  # This repo's testing rules are stricter and would conflict: real MySQL with
  # mocks forbidden, TDD with an observed red step, and ownership tests needing
  # two DIFFERENT values for user_id and cognito_sub. A generic tutorial dilutes.
  golang-testing: exclude

subagents:
  # Implementers and the planner: safe to describe as roles.
  users-impl: role
  orders-impl: role
  tracking-impl: role
  events-pipeline-impl: role
  infra-impl: role
  solutions-architect: role

  # Added 2026-08-13. Sixth code-only implementer; same shape as the others —
  # writes only test/simulation code, never git, never Linear.
  e2e-impl: role

  # Added 2026-09-02. Seventh code-only implementer (apps/web, Angular). Absent
  # from this map until now, so lnai skipped it silently and every sync left the
  # providers with six implementers instead of seven.
  web-impl: role

  # Single writers. Projecting these as "available roles" would invite an agent
  # to believe it may write to Linear or docs/ itself. They become prohibitions.
  linear-pm: prohibition
  obsidian-vault: prohibition
  github-ops: prohibition

  # The sync agent itself is Claude-only machinery; it has nothing to say to
  # other providers.
  ai-config-sync: exclude
