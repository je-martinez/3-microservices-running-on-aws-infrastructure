<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery status change to an in-app toast</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-soft: #7a8399;
      --color-accent: #eb6c36;
      --color-rule: rgba(45,49,66,0.12);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --motion-fast: 160ms;
      --motion-step: 480ms;
      --motion-hold: 960ms;
      --motion-total: 7680ms;
      --motion-ease: cubic-bezier(.2,.8,.2,1);
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 32px;
      color: var(--color-ink);
      background: var(--color-paper);
      font-family: var(--font-sans);
    }
    [data-motion-root] { width: min(100%, 1360px); }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 24px; font: 400 32px/1.15 var(--font-serif); }
    svg { display: block; width: 100%; min-width: 720px; }

    /* Static source is complete. Only an initialized enhancement hides items. */
    .motion-ready [data-motion-item] {
      opacity: .12;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
                  transform var(--motion-step) var(--motion-ease);
    }
    .motion-ready [data-motion-item].is-visible,
    .motion-ready[data-frame="end"] [data-motion-item],
    .motion-ready[data-frame="static"] [data-motion-item] {
      opacity: 1;
      transform: none;
    }
    .motion-ready[data-frame="step"] [data-motion-item].is-current .badge { fill: var(--color-accent); }

    [data-motion-controls] {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule);
    }
    .motion-ready [data-motion-controls] { display: flex; }
    [data-motion-controls][hidden] { display: none !important; }
    [data-motion-controls] button {
      min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--color-muted);
      border-radius: 4px;
      color: var(--color-ink);
      background: var(--color-paper);
      font: 600 12px/1 var(--font-sans);
      cursor: pointer;
    }
    [data-motion-controls] button:hover { border-color: var(--color-accent); }
    [data-motion-controls] button:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }
    [data-motion-controls] button:disabled { cursor: not-allowed; opacity: .45; }
    [data-motion-status-visible] {
      margin-left: auto;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    noscript p {
      margin: 12px 0 0;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }

    html[data-motion="static"] [data-motion-controls],
    html[data-motion="static"] [data-motion-decorative] { display: none !important; }
    html[data-motion="static"] [data-motion-item] {
      opacity: 1 !important;
      transform: none !important;
      animation: none !important;
      transition: none !important;
    }
    html[data-motion="step"] [data-motion-controls],
    html[data-motion="step"] [data-motion-decorative] { display: none !important; }
    html[data-motion="step"] [data-motion-item] {
      animation: none !important;
      transition: none !important;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
      [data-motion-item] { opacity: 1 !important; transform: none !important; }
      [data-motion-decorative] { display: none !important; }
      [data-motion-controls] { display: none !important; }
    }
    @media print {
      [data-motion-controls], [data-motion-decorative] { display: none !important; }
      [data-motion-item] {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        transition: none !important;
      }
    }

    .lbl { fill: #7a8399; font: 400 8px var(--font-mono); letter-spacing: .06em; }
    .zone-lbl { fill: rgba(45,49,66,0.55); font: 500 8px var(--font-mono); letter-spacing: .14em; }
    .name { fill: #2d3142; font: 600 12px var(--font-sans); }
    .sub { fill: #4f5d75; font: 400 8px var(--font-mono); letter-spacing: .04em; }
    .badge { fill: #2d3142; }
    .badge-n { fill: #f5f5f5; font: 600 12px var(--font-mono); }
    .cap { fill: #2d3142; font: 400 12px var(--font-sans); }
    .eyebrow-svg { fill: #4f5d75; font: 500 8px var(--font-mono); letter-spacing: .14em; }
  </style>
</head>
<body>
  <main data-motion-root data-motion-mode="step" data-step-count="8" data-step-current="8" data-frame="static" data-static-frame="complete">
    <p class="eyebrow">Tracking · Flow · Local dev on Floci</p>
    <h1>Delivery status change to an in-app toast</h1>

    <svg viewBox="0 72 1312 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tracking-notification-title tracking-notification-desc">
      <title id="tracking-notification-title">Delivery status change to an in-app toast</title>
      <desc id="tracking-notification-desc">A carrier webhook advances a delivery in the Tracking service, which commits the status with an outbox message in RDS MySQL; the outbox poller publishes TRACKING_STATUS_CHANGED to SNS, which feeds the events pipeline's status email and, through a filtered SQS queue, the Users service, which stores a notification row and pushes it over the WebSocket API to every socket the browser registered in DynamoDB.</desc>
      <defs>
        <marker id="trn-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="trn-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="trn-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
      <rect y="72" width="1312" height="800" fill="#f5f5f5"/>

      <!-- Zones (painted first) -->
      <rect x="688" y="96" width="384" height="132" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="700" y="100" width="148" height="12" rx="2" fill="#f5f5f5"/>
      <text x="704" y="109" class="zone-lbl">FLOCI :4566 · REALTIME</text>

      <rect x="464" y="292" width="384" height="320" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="476" y="296" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="305" class="zone-lbl">FLOCI :4566 · EVENTS</text>

      <!-- Connectors (before nodes) -->
      <!-- web <-> ws: the socket the browser opens and the push comes back over -->
      <path d="M160,168 H704" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-start="url(#trn-arrow-link)" marker-end="url(#trn-arrow-link)"/>
      <!-- ws -> sockets table -->
      <path d="M832,168 H928" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#trn-arrow)"/>
      <!-- carrier -> tracking: webhook (async) -->
      <path d="M160,360 H256" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#trn-arrow)"/>
      <!-- tracking -> tracking db -->
      <path d="M320,404 V508" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#trn-arrow)"/>
      <!-- tracking -> sns: outbox publish (focal, async) -->
      <path d="M384,360 H480" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#trn-arrow-accent)"/>
      <!-- sns -> events queue -> pipeline (async) -->
      <path d="M544,404 V508" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#trn-arrow)"/>
      <path d="M608,552 H704" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#trn-arrow)"/>
      <!-- sns -> notifications queue -> users (async) -->
      <path d="M608,360 H704" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#trn-arrow)"/>
      <path d="M832,360 H928" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#trn-arrow)"/>
      <!-- users -> users db -->
      <path d="M1056,360 H1152" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#trn-arrow)"/>
      <!-- users -> sockets table: query -->
      <path d="M1024,316 V212" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#trn-arrow)"/>
      <!-- users -> ws: push -->
      <path d="M944,316 V272 Q944,264 936,264 H808 Q800,264 800,256 V212" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#trn-arrow)"/>

      <!-- Arrow labels (masked, 8px off their stroke) -->
      <rect x="280" y="148" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="300" y="157" class="lbl" text-anchor="middle">SOCKET</text>
      <rect x="884" y="148" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="898" y="157" class="lbl" text-anchor="middle">SAVE</text>
      <rect x="200" y="340" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="224" y="349" class="lbl" text-anchor="middle">WEBHOOK</text>
      <rect x="332" y="460" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="370" y="469" class="lbl" text-anchor="middle">COMMIT+OUTBOX</text>
      <rect x="396" y="324" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="436" y="333" class="lbl" text-anchor="middle">STATUS_CHANGED</text>
      <rect x="620" y="532" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="656" y="541" class="lbl" text-anchor="middle">STATUS EMAIL</text>
      <rect x="648" y="340" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="674" y="349" class="lbl" text-anchor="middle">FILTERED</text>
      <rect x="1076" y="340" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1112" y="349" class="lbl" text-anchor="middle">NOTIFICATION</text>
      <rect x="1032" y="236" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1050" y="245" class="lbl" text-anchor="middle">QUERY</text>
      <rect x="836" y="244" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="852" y="253" class="lbl" text-anchor="middle">PUSH</text>

      <!-- Nodes -->
      <!-- Web app (input) -->
      <rect x="32" y="124" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="124" width="128" height="88" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Client.svg" x="76" y="136" width="40" height="40"/>
      <text x="96" y="196" class="name" text-anchor="middle">Web app</text>

      <!-- WS API -->
      <rect x="704" y="124" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="704" y="124" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonAPIGateway.svg" x="748" y="132" width="40" height="40"/>
      <text x="768" y="188" class="name" text-anchor="middle">WS API</text>
      <text x="768" y="204" class="sub" text-anchor="middle">API Gateway</text>

      <!-- Sockets (DynamoDB, store) -->
      <rect x="928" y="124" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="928" y="124" width="128" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonDynamoDB.svg" x="972" y="132" width="40" height="40"/>
      <text x="992" y="188" class="name" text-anchor="middle">Sockets</text>
      <text x="992" y="204" class="sub" text-anchor="middle">DynamoDB</text>

      <!-- Carrier (external) -->
      <rect x="32" y="316" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="316" width="128" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Internet.svg" x="76" y="328" width="40" height="40"/>
      <text x="96" y="388" class="name" text-anchor="middle">Carrier</text>

      <!-- Tracking service (focal) -->
      <rect x="256" y="316" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="256" y="316" width="128" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="264" y="322" width="48" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="288" y="331" fill="rgba(235,108,54,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COMPOSE</text>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Server.svg" x="300" y="336" width="40" height="40"/>
      <text x="320" y="392" class="name" text-anchor="middle">Tracking service</text>

      <!-- Events topic (SNS) -->
      <rect x="480" y="316" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="480" y="316" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonSimpleNotificationService.svg" x="524" y="328" width="40" height="40"/>
      <text x="544" y="388" class="name" text-anchor="middle">Events topic</text>

      <!-- Notifications queue (SQS) -->
      <rect x="704" y="316" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="704" y="316" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonSimpleQueueService.svg" x="748" y="328" width="40" height="40"/>
      <text x="768" y="388" class="name" text-anchor="middle">Notifications queue</text>

      <!-- Users service -->
      <rect x="928" y="316" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="928" y="316" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="1000" y="322" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="1024" y="331" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COMPOSE</text>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Server.svg" x="972" y="336" width="40" height="40"/>
      <text x="992" y="392" class="name" text-anchor="middle">Users service</text>

      <!-- Users DB (store) -->
      <rect x="1152" y="316" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="1152" y="316" width="128" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="1160" y="322" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="1174" y="331" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VPC</text>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonRDS.svg" x="1196" y="328" width="40" height="40"/>
      <text x="1216" y="380" class="name" text-anchor="middle">Users DB</text>
      <text x="1216" y="396" class="sub" text-anchor="middle">RDS PostgreSQL</text>

      <!-- Tracking DB (store) -->
      <rect x="256" y="508" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="256" y="508" width="128" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="264" y="514" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="278" y="523" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VPC</text>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonRDS.svg" x="300" y="520" width="40" height="40"/>
      <text x="320" y="572" class="name" text-anchor="middle">Tracking DB</text>
      <text x="320" y="588" class="sub" text-anchor="middle">RDS MySQL</text>

      <!-- Events queue (SQS) -->
      <rect x="480" y="508" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="480" y="508" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonSimpleQueueService.svg" x="524" y="520" width="40" height="40"/>
      <text x="544" y="580" class="name" text-anchor="middle">Events queue</text>

      <!-- Events pipeline (Lambda) -->
      <rect x="704" y="508" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="704" y="508" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AWSLambda.svg" x="748" y="520" width="40" height="40"/>
      <text x="768" y="580" class="name" text-anchor="middle">Events pipeline</text>

      <!-- Steps: badges on their connectors + the numbered caption list -->
      <line x1="32" y1="640" x2="1280" y2="640" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="664" class="eyebrow-svg">STEPS</text>

      <g data-motion-item data-step="1" aria-label="Step 1: the browser opens a socket and the connection is stored">
        <circle class="badge" cx="432" cy="168" r="8"/><text class="badge-n" x="432" y="172" text-anchor="middle">1</text>
        <circle class="badge" cx="856" cy="168" r="8"/><text class="badge-n" x="856" y="172" text-anchor="middle">1</text>
        <circle class="badge" cx="40" cy="688" r="8"/><text class="badge-n" x="40" y="692" text-anchor="middle">1</text>
        <text class="cap" x="56" y="692">An authorizer Lambda validates the user's JWT before the socket opens;</text>
        <text class="cap" x="56" y="708">the connect Lambda stores the connection under the user, with a 2-hour TTL</text>
      </g>
      <g data-motion-item data-step="2" aria-label="Step 2: the carrier webhook reaches Tracking">
        <circle class="badge" cx="180" cy="360" r="8"/><text class="badge-n" x="180" y="364" text-anchor="middle">2</text>
        <circle class="badge" cx="40" cy="728" r="8"/><text class="badge-n" x="40" y="732" text-anchor="middle">2</text>
        <text class="cap" x="56" y="732">The carrier webhook reaches Tracking; the transition is checked first</text>
      </g>
      <g data-motion-item data-step="3" aria-label="Step 3: one MySQL transaction writes status, history and outbox">
        <circle class="badge" cx="320" cy="432" r="8"/><text class="badge-n" x="320" y="436" text-anchor="middle">3</text>
        <circle class="badge" cx="40" cy="752" r="8"/><text class="badge-n" x="40" y="756" text-anchor="middle">3</text>
        <text class="cap" x="56" y="756">Status, history row and outbox message are written in one MySQL transaction</text>
      </g>
      <g data-motion-item data-step="4" aria-label="Step 4: the outbox poller publishes to SNS and the pipeline emails it">
        <circle class="badge" cx="404" cy="360" r="8"/><text class="badge-n" x="404" y="364" text-anchor="middle">4</text>
        <circle class="badge" cx="40" cy="776" r="8"/><text class="badge-n" x="40" y="780" text-anchor="middle">4</text>
        <text class="cap" x="56" y="780">The outbox poller publishes TRACKING_STATUS_CHANGED to SNS; the pipeline emails it</text>
      </g>
      <g data-motion-item data-step="5" aria-label="Step 5: the same message reaches Users through its filtered queue">

      <!-- Legend strip -->

    <div data-motion-controls role="group" aria-label="Diagram playback controls">
      <button type="button" data-motion-action="prev">Previous</button>
      <button type="button" data-motion-action="play" aria-pressed="false">Play</button>
      <button type="button" data-motion-action="pause" aria-pressed="true">Pause</button>
      <button type="button" data-motion-action="next">Next</button>
      <button type="button" data-motion-action="replay">Replay</button>
      <span class="keyboard-help">←/→ step · Space play/pause · R replay · Home/End jump</span>
      <span data-motion-status-visible aria-hidden="true">Step <span data-motion-step-label>8</span> of 8</span>
    </div>
    <p class="sr-only" data-motion-status role="status" aria-live="polite" aria-atomic="true"></p>
    <noscript><p>Animation controls require JavaScript. The complete final diagram is shown above.</p></noscript>
  </main>

  <script data-diagram-controls>
    (() => {
      const params = new URLSearchParams(location.search);
      const staticOverride = params.get('motion') === 'static' || document.documentElement.dataset.motion === 'static';
      const requestedStep = params.get('step');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');
      document.fonts.ready.then(() => { document.documentElement.dataset.fontsReady = 'true'; });

      document.querySelectorAll('[data-motion-root]').forEach((root) => {
        const count = Number(root.dataset.stepCount);
        const hold = parseFloat(getComputedStyle(root).getPropertyValue('--motion-hold')) || 720;
        const parsedStep = requestedStep !== null && /^\d+$/.test(requestedStep) ? Number(requestedStep) : null;
        const exactStep = params.get('motion') === 'step' && Number.isSafeInteger(parsedStep) && parsedStep >= 0 && parsedStep <= count ? parsedStep : null;
        const items = [...root.querySelectorAll('[data-motion-item]')];
        const labels = Array.from({ length: count + 1 }, (_, index) => index === 0
          ? 'Ready'
          : items.filter((item) => !item.hasAttribute('data-motion-decorative') && Number(item.dataset.step) === index)
              .map((item) => item.getAttribute('aria-label')).join('; '));
        const controls = root.querySelector('[data-motion-controls]');
        const status = root.querySelector('[data-motion-status]');
        const visibleStep = root.querySelector('[data-motion-step-label]');
        let step = count;
        let timer = 0;
        let playing = false;
        let stepBeforeReduce = 0;
        let resumeAfterReduce = root.dataset.motionMode === 'reveal';

        const buttons = (action) => controls.querySelector(`[data-motion-action="${action}"]`);
        const clearClock = () => { window.clearTimeout(timer); timer = 0; };
        const announce = () => { status.textContent = `Step ${step} of ${count}: ${labels[step] || 'Complete'}`; };
        const setControlsAvailable = (available) => {
          controls.hidden = !available;
          controls.setAttribute('aria-hidden', String(!available));
          controls.dataset.playbackDisabled = String(!available);
          controls.querySelectorAll('button').forEach((control) => { control.disabled = !available; });
        };

        function render(next, userInitiated = false) {
          step = Math.max(0, Math.min(count, next));
          root.dataset.stepCurrent = String(step);
          root.dataset.frame = step === count ? 'end' : step === 0 ? 'start' : 'step';
          items.forEach((item) => {
            const itemStep = Number(item.dataset.step);
            item.classList.toggle('is-visible', itemStep <= step);
            item.classList.toggle('is-current', itemStep === step);
          });
          if (visibleStep) visibleStep.textContent = String(step);
          const unavailable = controls.dataset.playbackDisabled === 'true';
          buttons('prev').disabled = unavailable || step === 0;
          buttons('next').disabled = unavailable || step === count;
          if (userInitiated) announce();
        }

        function pause(userInitiated = false) {
          clearClock();
          playing = false;
          root.classList.remove('is-playing');
          buttons('play').setAttribute('aria-pressed', 'false');
          buttons('pause').setAttribute('aria-pressed', 'true');
          if (userInitiated) status.textContent = `Paused at step ${step} of ${count}`;
        }

        function finish() {
          pause(false);
          root.dataset.frame = 'end';
          status.textContent = `Complete · step ${count} of ${count}`;
        }

        function tick() {
          if (!playing) return;
          if (step >= count) { finish(); return; }
          render(step + 1, false);
          if (step >= count) { finish(); return; }
          timer = window.setTimeout(tick, hold);
        }

        function play(fromStart = false, userInitiated = false) {
          clearClock();
          if (fromStart || step >= count) render(0, userInitiated);
          playing = true;
          root.classList.add('is-playing');
          buttons('play').setAttribute('aria-pressed', 'true');
          buttons('pause').setAttribute('aria-pressed', 'false');
          timer = window.setTimeout(tick, hold);
        }

        controls.addEventListener('click', (event) => {
          const button = event.target.closest('[data-motion-action]');
          if (!button) return;
          const action = button.dataset.motionAction;
          if (action === 'play') play(false, true);
          if (action === 'pause') pause(true);
          if (action === 'replay') play(true, true);
          if (action === 'prev') { pause(false); render(step - 1, true); }
          if (action === 'next') { pause(false); render(step + 1, true); }
        });

        root.addEventListener('keydown', (event) => {
          if (event.target.matches('input, textarea, select, a[href]')) return;
          const keys = { ArrowLeft: step - 1, ArrowRight: step + 1, Home: 0, End: count };
          if (event.code === 'Space' && !event.target.closest('button')) {
            event.preventDefault();
            playing ? pause(true) : play(false, true);
            return;
          }
          if (!event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === 'r') {
            event.preventDefault();
            play(true, true);
            return;
          }
          if (!(event.key in keys)) return;
          event.preventDefault();
          pause(false);
          render(keys[event.key], true);
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden' && playing) pause(false);
        });
        reduce.addEventListener('change', (event) => {
          if (event.matches && root.dataset.motionState !== 'reduced') {
            stepBeforeReduce = step;
            resumeAfterReduce = playing;
          }
          pause(false);
          if (event.matches) {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'reduced';
            status.textContent = 'Reduced motion · complete static frame · playback controls unavailable';
          } else if (staticOverride || root.dataset.motionMode === 'none') {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'static';
            status.textContent = 'Static frame · complete diagram · playback controls unavailable';
          } else {
            delete root.dataset.motionState;
            if (exactStep !== null) {
              setControlsAvailable(false);
              render(exactStep, false);
              root.dataset.frame = 'step';
              root.dataset.motionState = 'test';
              status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
            } else {
              setControlsAvailable(true);
              render(stepBeforeReduce, false);
              status.textContent = `Ready · step ${step} of ${count}`;
              if (resumeAfterReduce && root.dataset.motionMode === 'reveal') {
                play(false, false);
              }
            }
            resumeAfterReduce = false;
          }
        });

        if (staticOverride) {
          document.documentElement.dataset.motion = 'static';
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = 'static';
          status.textContent = 'Static frame · complete diagram · playback controls unavailable';
        } else if (reduce.matches || root.dataset.motionMode === 'none') {
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = reduce.matches ? 'reduced' : 'static';
          status.textContent = reduce.matches
            ? 'Reduced motion · complete static frame · playback controls unavailable'
            : 'Static frame · complete diagram · playback controls unavailable';
        } else if (exactStep !== null) {
          document.documentElement.dataset.motion = 'step';
          pause(false);
          setControlsAvailable(false);
          render(exactStep, false);
          root.dataset.frame = 'step';
          root.dataset.motionState = 'test';
          status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
        } else if (root.dataset.motionMode === 'reveal') {
          setControlsAvailable(true);
          render(0, false);
          play(false, false);
        } else {
          pause(false);
          setControlsAvailable(true);
          render(0, false);
          status.textContent = `Ready · step 0 of ${count}`;
        }
        root.classList.add('motion-ready');
      });
    })();
  </script>
</body>
</html>
