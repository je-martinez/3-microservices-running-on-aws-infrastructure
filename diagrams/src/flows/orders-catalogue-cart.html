<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse the catalogue and edit the cart</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-soft: #7a8399;
      --color-accent: #eb6c36;
      --color-rule: rgba(45,49,66,0.12);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --motion-fast: 160ms;
      --motion-step: 480ms;
      --motion-hold: 960ms;
      --motion-total: 7680ms;
      --motion-ease: cubic-bezier(.2,.8,.2,1);
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 32px;
      color: var(--color-ink);
      background: var(--color-paper);
      font-family: var(--font-sans);
    }
    [data-motion-root] { width: min(100%, 1360px); }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 24px; font: 400 32px/1.15 var(--font-serif); }
    svg { display: block; width: 100%; min-width: 720px; }

    /* Static source is complete. Only an initialized enhancement hides items. */
    .motion-ready [data-motion-item] {
      opacity: .12;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
                  transform var(--motion-step) var(--motion-ease);
    }
    .motion-ready [data-motion-item].is-visible,
    .motion-ready[data-frame="end"] [data-motion-item],
    .motion-ready[data-frame="static"] [data-motion-item] {
      opacity: 1;
      transform: none;
    }
    .motion-ready[data-frame="step"] [data-motion-item].is-current .badge { fill: var(--color-accent); }

    [data-motion-controls] {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule);
    }
    .motion-ready [data-motion-controls] { display: flex; }
    [data-motion-controls][hidden] { display: none !important; }
    [data-motion-controls] button {
      min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--color-muted);
      border-radius: 4px;
      color: var(--color-ink);
      background: var(--color-paper);
      font: 600 12px/1 var(--font-sans);
      cursor: pointer;
    }
    [data-motion-controls] button:hover { border-color: var(--color-accent); }
    [data-motion-controls] button:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }
    [data-motion-controls] button:disabled { cursor: not-allowed; opacity: .45; }
    [data-motion-status-visible] {
      margin-left: auto;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    noscript p {
      margin: 12px 0 0;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }

    html[data-motion="static"] [data-motion-controls],
    html[data-motion="static"] [data-motion-decorative] { display: none !important; }
    html[data-motion="static"] [data-motion-item] {
      opacity: 1 !important;
      transform: none !important;
      animation: none !important;
      transition: none !important;
    }
    html[data-motion="step"] [data-motion-controls],
    html[data-motion="step"] [data-motion-decorative] { display: none !important; }
    html[data-motion="step"] [data-motion-item] {
      animation: none !important;
      transition: none !important;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
      [data-motion-item] { opacity: 1 !important; transform: none !important; }
      [data-motion-decorative] { display: none !important; }
      [data-motion-controls] { display: none !important; }
    }
    @media print {
      [data-motion-controls], [data-motion-decorative] { display: none !important; }
      [data-motion-item] {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        transition: none !important;
      }
    }

    .lbl { fill: #7a8399; font: 400 8px var(--font-mono); letter-spacing: .06em; }
    .zone-lbl { fill: rgba(45,49,66,0.55); font: 500 8px var(--font-mono); letter-spacing: .14em; }
    .name { fill: #2d3142; font: 600 12px var(--font-sans); }
    .sub { fill: #4f5d75; font: 400 8px var(--font-mono); letter-spacing: .04em; }
    .badge { fill: #2d3142; }
    .badge-n { fill: #f5f5f5; font: 600 12px var(--font-mono); }
    .cap { fill: #2d3142; font: 400 12px var(--font-sans); }
    .eyebrow-svg { fill: #4f5d75; font: 500 8px var(--font-mono); letter-spacing: .14em; }
  </style>
</head>
<body>
  <main data-motion-root data-motion-mode="step" data-step-count="8" data-step-current="8" data-frame="static" data-static-frame="complete">
    <p class="eyebrow">Orders · Flow · Local dev on Floci</p>

    <svg viewBox="0 84 1312 672" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="orders-catalogue-cart-title orders-catalogue-cart-desc">

      <rect x="328" y="96" width="92" height="12" rx="2" fill="#f5f5f5"/>
      <text x="332" y="105" class="zone-lbl">DOCKER COMPOSE</text>

      <rect x="608" y="236" width="432" height="232" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="620" y="240" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="624" y="249" class="zone-lbl">FLOCI :4566</text>

      <rect x="816" y="300" width="200" height="144" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="828" y="304" width="176" height="12" rx="2" fill="#f5f5f5"/>
      <text x="832" y="313" class="zone-lbl">VPC 10.0.0.0/16 · SUBNETS A+B</text>

      <!-- Connectors (before nodes) -->

      <text x="440" y="233" class="lbl" text-anchor="middle">GRPC</text>

      <!-- Nodes -->

      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Server.svg" x="396" y="308" width="40" height="40"/>

      <text x="32" y="524" class="eyebrow-svg">STEPS</text>

      <g data-motion-item data-step="1" aria-label="Step 1: the home page loads the catalogue from Orders">
        <circle class="badge" cx="248" cy="344" r="8"/><text class="badge-n" x="248" y="348" text-anchor="middle">1</text>
        <circle class="badge" cx="40" cy="548" r="8"/><text class="badge-n" x="40" y="552" text-anchor="middle">1</text>
        <text class="cap" x="56" y="552">The home page loads the catalogue once; category chips and search filter in the browser</text>

      <g data-motion-item data-step="2" aria-label="Step 2: the catalogue is served from one shared cache key">
        <circle class="badge" cx="532" cy="312" r="8"/><text class="badge-n" x="532" y="316" text-anchor="middle">2</text>
        <circle class="badge" cx="40" cy="580" r="8"/><text class="badge-n" x="40" y="584" text-anchor="middle">2</text>
        <text class="cap" x="56" y="584">One key shared by every buyer, 10-minute TTL; a miss goes on to the DB</text>
      </g>
      <g data-motion-item data-step="3" aria-label="Step 3: the cart drawer reads the cart on open">
        <circle class="badge" cx="272" cy="344" r="8"/><text class="badge-n" x="272" y="348" text-anchor="middle">3</text>
        <circle class="badge" cx="40" cy="612" r="8"/><text class="badge-n" x="40" y="616" text-anchor="middle">3</text>
        <text class="cap" x="56" y="616">The drawer reads the cart on open; a buyer with no cart gets an empty one, never a 404</text>
      </g>
      <g data-motion-item data-step="4" aria-label="Step 4: Orders resolves the user id from its identity cache or Users over gRPC">
        <circle class="badge" cx="416" cy="252" r="8"/><text class="badge-n" x="416" y="256" text-anchor="middle">4</text>
        <circle class="badge" cx="40" cy="644" r="8"/><text class="badge-n" x="40" y="648" text-anchor="middle">4</text>
        <text class="cap" x="56" y="648">Per-user keys need the user id: the identity cache first, else Users over gRPC</text>
      </g>
      <g data-motion-item data-step="5" aria-label="Step 5: the cart is served from its per-user cache key or priced from the DB">
        <circle class="badge" cx="556" cy="312" r="8"/><text class="badge-n" x="556" y="316" text-anchor="middle">5</text>
        <circle class="badge" cx="532" cy="376" r="8"/><text class="badge-n" x="532" y="380" text-anchor="middle">5</text>
        <circle class="badge" cx="672" cy="548" r="8"/><text class="badge-n" x="672" y="552" text-anchor="middle">5</text>
        <text class="cap" x="688" y="552">A per-user key, 60-second TTL; a hit returns the stored body without the handler;</text>
        <text class="cap" x="688" y="568">on a miss one catalogue query prices every line and flags unavailable ones</text>
      </g>
      <g data-motion-item data-step="6" aria-label="Step 6: stepper clicks debounce into one full replacement of the cart">
        <circle class="badge" cx="296" cy="344" r="8"/><text class="badge-n" x="296" y="348" text-anchor="middle">6</text>
        <circle class="badge" cx="672" cy="596" r="8"/><text class="badge-n" x="672" y="600" text-anchor="middle">6</text>
        <text class="cap" x="688" y="600">Stepper clicks debounce per product and queue, so a burst becomes one full replacement</text>
      </g>
      <g data-motion-item data-step="7" aria-label="Step 7: one transaction writes the cart, then the caller's cache keys are swept">
        <circle class="badge" cx="556" cy="376" r="8"/><text class="badge-n" x="556" y="380" text-anchor="middle">7</text>
        <circle class="badge" cx="580" cy="312" r="8"/><text class="badge-n" x="580" y="316" text-anchor="middle">7</text>
        <circle class="badge" cx="672" cy="628" r="8"/><text class="badge-n" x="672" y="632" text-anchor="middle">7</text>
        <text class="cap" x="688" y="632">One transaction; no live lines deletes the cart; a lost create race retries once;</text>
        <text class="cap" x="688" y="648">after the commit, the caller's whole per-user key index is swept</text>
      </g>
      <g data-motion-item data-step="8" aria-label="Step 8: the drawer renders the totals Orders computed">
        <circle class="badge" cx="320" cy="344" r="8"/><text class="badge-n" x="320" y="348" text-anchor="middle">8</text>
        <circle class="badge" cx="672" cy="676" r="8"/><text class="badge-n" x="672" y="680" text-anchor="middle">8</text>
        <text class="cap" x="688" y="680">Totals count available lines only; an unavailable line blocks the drawer's Continue</text>
      </g>

      <!-- Legend strip -->

      <text x="32" y="736" class="eyebrow-svg">LEGEND</text>
      <line x1="104" y1="732" x2="136" y2="732" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#occ-arrow)"/>
      <text x="148" y="736" class="lbl">SYNC CALL</text>

      <text x="460" y="736" class="lbl">FOCAL SERVICE · OWNS THE CART AND EVERY FIGURE</text>
      <rect x="732" y="724" width="24" height="16" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>

    <div data-motion-controls role="group" aria-label="Diagram playback controls">

    </div>
    <p class="sr-only" data-motion-status role="status" aria-live="polite" aria-atomic="true"></p>
    <noscript><p>Animation controls require JavaScript. The complete final diagram is shown above.</p></noscript>
  </main>

  <script data-diagram-controls>
    (() => {
      const params = new URLSearchParams(location.search);
      const staticOverride = params.get('motion') === 'static' || document.documentElement.dataset.motion === 'static';
      const requestedStep = params.get('step');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');
      document.fonts.ready.then(() => { document.documentElement.dataset.fontsReady = 'true'; });

      document.querySelectorAll('[data-motion-root]').forEach((root) => {
        const count = Number(root.dataset.stepCount);
        const hold = parseFloat(getComputedStyle(root).getPropertyValue('--motion-hold')) || 720;
        const parsedStep = requestedStep !== null && /^\d+$/.test(requestedStep) ? Number(requestedStep) : null;
        const exactStep = params.get('motion') === 'step' && Number.isSafeInteger(parsedStep) && parsedStep >= 0 && parsedStep <= count ? parsedStep : null;
        const items = [...root.querySelectorAll('[data-motion-item]')];
        const labels = Array.from({ length: count + 1 }, (_, index) => index === 0
          ? 'Ready'
          : items.filter((item) => !item.hasAttribute('data-motion-decorative') && Number(item.dataset.step) === index)
              .map((item) => item.getAttribute('aria-label')).join('; '));
        const controls = root.querySelector('[data-motion-controls]');
        const status = root.querySelector('[data-motion-status]');
        const visibleStep = root.querySelector('[data-motion-step-label]');
        let step = count;
        let timer = 0;
        let playing = false;
        let stepBeforeReduce = 0;
        let resumeAfterReduce = root.dataset.motionMode === 'reveal';

        const buttons = (action) => controls.querySelector(`[data-motion-action="${action}"]`);
        const clearClock = () => { window.clearTimeout(timer); timer = 0; };
        const announce = () => { status.textContent = `Step ${step} of ${count}: ${labels[step] || 'Complete'}`; };
        const setControlsAvailable = (available) => {
          controls.hidden = !available;
          controls.setAttribute('aria-hidden', String(!available));
          controls.dataset.playbackDisabled = String(!available);
          controls.querySelectorAll('button').forEach((control) => { control.disabled = !available; });
        };

        function render(next, userInitiated = false) {
          step = Math.max(0, Math.min(count, next));
          root.dataset.stepCurrent = String(step);
          root.dataset.frame = step === count ? 'end' : step === 0 ? 'start' : 'step';
          items.forEach((item) => {
            const itemStep = Number(item.dataset.step);
            item.classList.toggle('is-visible', itemStep <= step);
            item.classList.toggle('is-current', itemStep === step);
          });
          if (visibleStep) visibleStep.textContent = String(step);
          const unavailable = controls.dataset.playbackDisabled === 'true';
          buttons('prev').disabled = unavailable || step === 0;
          buttons('next').disabled = unavailable || step === count;
          if (userInitiated) announce();
        }

        function pause(userInitiated = false) {
          clearClock();
          playing = false;
          root.classList.remove('is-playing');
          buttons('play').setAttribute('aria-pressed', 'false');
          buttons('pause').setAttribute('aria-pressed', 'true');
          if (userInitiated) status.textContent = `Paused at step ${step} of ${count}`;
        }

        function finish() {
          pause(false);
          root.dataset.frame = 'end';
          status.textContent = `Complete · step ${count} of ${count}`;
        }

        function tick() {
          if (!playing) return;
          if (step >= count) { finish(); return; }
          render(step + 1, false);
          if (step >= count) { finish(); return; }
          timer = window.setTimeout(tick, hold);
        }

        function play(fromStart = false, userInitiated = false) {
          clearClock();
          if (fromStart || step >= count) render(0, userInitiated);
          playing = true;
          root.classList.add('is-playing');
          buttons('play').setAttribute('aria-pressed', 'true');
          buttons('pause').setAttribute('aria-pressed', 'false');
          timer = window.setTimeout(tick, hold);
        }

        controls.addEventListener('click', (event) => {
          const button = event.target.closest('[data-motion-action]');
          if (!button) return;
          const action = button.dataset.motionAction;
          if (action === 'play') play(false, true);
          if (action === 'pause') pause(true);
          if (action === 'replay') play(true, true);
          if (action === 'prev') { pause(false); render(step - 1, true); }
          if (action === 'next') { pause(false); render(step + 1, true); }
        });

        root.addEventListener('keydown', (event) => {
          if (event.target.matches('input, textarea, select, a[href]')) return;
          const keys = { ArrowLeft: step - 1, ArrowRight: step + 1, Home: 0, End: count };
          if (event.code === 'Space' && !event.target.closest('button')) {
            event.preventDefault();
            playing ? pause(true) : play(false, true);
            return;
          }
          if (!event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === 'r') {
            event.preventDefault();
            play(true, true);
            return;
          }
          if (!(event.key in keys)) return;
          event.preventDefault();
          pause(false);
          render(keys[event.key], true);
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden' && playing) pause(false);
        });
        reduce.addEventListener('change', (event) => {
          if (event.matches && root.dataset.motionState !== 'reduced') {
            stepBeforeReduce = step;
            resumeAfterReduce = playing;
          }
          pause(false);
          if (event.matches) {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'reduced';
            status.textContent = 'Reduced motion · complete static frame · playback controls unavailable';
          } else if (staticOverride || root.dataset.motionMode === 'none') {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'static';
            status.textContent = 'Static frame · complete diagram · playback controls unavailable';
          } else {
            delete root.dataset.motionState;
            if (exactStep !== null) {
              setControlsAvailable(false);
              render(exactStep, false);
              root.dataset.frame = 'step';
              root.dataset.motionState = 'test';
              status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
            } else {
              setControlsAvailable(true);
              render(stepBeforeReduce, false);
              status.textContent = `Ready · step ${step} of ${count}`;
              if (resumeAfterReduce && root.dataset.motionMode === 'reveal') {
                play(false, false);
              }
            }
            resumeAfterReduce = false;
          }
        });

        if (staticOverride) {
          document.documentElement.dataset.motion = 'static';
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = 'static';
          status.textContent = 'Static frame · complete diagram · playback controls unavailable';
        } else if (reduce.matches || root.dataset.motionMode === 'none') {
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = reduce.matches ? 'reduced' : 'static';
          status.textContent = reduce.matches
            ? 'Reduced motion · complete static frame · playback controls unavailable'
            : 'Static frame · complete diagram · playback controls unavailable';
        } else if (exactStep !== null) {
          document.documentElement.dataset.motion = 'step';
          pause(false);
          setControlsAvailable(false);
          render(exactStep, false);
          root.dataset.frame = 'step';
          root.dataset.motionState = 'test';
          status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
        } else if (root.dataset.motionMode === 'reveal') {
          setControlsAvailable(true);
          render(0, false);
          play(false, false);
        } else {
          pause(false);
          setControlsAvailable(true);
          render(0, false);
          status.textContent = `Ready · step 0 of ${count}`;
        }
        root.classList.add('motion-ready');
      });
    })();
  </script>
</body>
</html>
