<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared response cache, shown on the Users profile read</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-soft: #7a8399;
      --color-accent: #eb6c36;
      --color-rule: rgba(45,49,66,0.12);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --motion-fast: 160ms;
      --motion-step: 480ms;
      --motion-hold: 960ms;
      --motion-total: 7680ms;
      --motion-ease: cubic-bezier(.2,.8,.2,1);
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 32px;
      color: var(--color-ink);
      background: var(--color-paper);
      font-family: var(--font-sans);
    }
    [data-motion-root] { width: min(100%, 1360px); }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 24px; font: 400 32px/1.15 var(--font-serif); }
    svg { display: block; width: 100%; min-width: 720px; }

    /* Static source is complete. Only an initialized enhancement hides items. */
    .motion-ready [data-motion-item] {
      opacity: .12;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
                  transform var(--motion-step) var(--motion-ease);
    }
    .motion-ready [data-motion-item].is-visible,
    .motion-ready[data-frame="end"] [data-motion-item],
    .motion-ready[data-frame="static"] [data-motion-item] {
      opacity: 1;
      transform: none;
    }
    .motion-ready[data-frame="step"] [data-motion-item].is-current .badge { fill: var(--color-accent); }

    [data-motion-controls] {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule);
    }
    .motion-ready [data-motion-controls] { display: flex; }
    [data-motion-controls][hidden] { display: none !important; }
    [data-motion-controls] button {
      min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--color-muted);
      border-radius: 4px;
      color: var(--color-ink);
      background: var(--color-paper);
      font: 600 12px/1 var(--font-sans);
      cursor: pointer;
    }
    [data-motion-controls] button:hover { border-color: var(--color-accent); }
    [data-motion-controls] button:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }
    [data-motion-controls] button:disabled { cursor: not-allowed; opacity: .45; }
    [data-motion-status-visible] {
      margin-left: auto;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    noscript p {
      margin: 12px 0 0;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }

    html[data-motion="static"] [data-motion-controls],
    html[data-motion="static"] [data-motion-decorative] { display: none !important; }
    html[data-motion="static"] [data-motion-item] {
      opacity: 1 !important;
      transform: none !important;
      animation: none !important;
      transition: none !important;
    }
    html[data-motion="step"] [data-motion-controls],
    html[data-motion="step"] [data-motion-decorative] { display: none !important; }
    html[data-motion="step"] [data-motion-item] {
      animation: none !important;
      transition: none !important;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
      [data-motion-item] { opacity: 1 !important; transform: none !important; }
      [data-motion-decorative] { display: none !important; }
      [data-motion-controls] { display: none !important; }
    }
    @media print {
      [data-motion-controls], [data-motion-decorative] { display: none !important; }
      [data-motion-item] {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        transition: none !important;
      }
    }

    .lbl { fill: #7a8399; font: 400 8px var(--font-mono); letter-spacing: .06em; }
    .zone-lbl { fill: rgba(45,49,66,0.55); font: 500 8px var(--font-mono); letter-spacing: .14em; }
    .name { fill: #2d3142; font: 600 12px var(--font-sans); }
    .sub { fill: #4f5d75; font: 400 8px var(--font-mono); letter-spacing: .04em; }
    .badge { fill: #2d3142; }
    .badge-n { fill: #f5f5f5; font: 600 12px var(--font-mono); }
    .cap { fill: #2d3142; font: 400 12px var(--font-sans); }
    .eyebrow-svg { fill: #4f5d75; font: 500 8px var(--font-mono); letter-spacing: .14em; }
  </style>
</head>
<body>
  <main data-motion-root data-motion-mode="step" data-step-count="8" data-step-current="8" data-frame="static" data-static-frame="complete">
    <p class="eyebrow">Shared · Pattern · Local dev on Floci</p>
    <h1>Shared response cache, shown on the Users profile read</h1>

    <svg viewBox="0 88 992 748" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="response-cache-title response-cache-desc">
      <title id="response-cache-title">Shared response cache on the Users profile read</title>
      <desc id="response-cache-desc">The Users service reads its profile response from a Valkey ElastiCache cache through an interceptor that fails open to Postgres within 50 ms, stores only successful bodies for five minutes without holding the response, and invalidates the entry only after a profile or password write has persisted.</desc>
      <defs>
        <marker id="rc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="rc-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="rc-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
      <rect width="992" height="836" fill="#f5f5f5"/>

      <!-- Zones (painted first) -->
      <rect x="352" y="176" width="176" height="208" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="364" y="180" width="92" height="12" rx="2" fill="#f5f5f5"/>
      <text x="368" y="189" class="zone-lbl">DOCKER COMPOSE</text>

      <rect x="776" y="104" width="176" height="344" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="788" y="108" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="792" y="117" class="zone-lbl">FLOCI :4566</text>

      <!-- Connectors (before nodes) -->
      <!-- web -> users: the profile read and the writes -->
      <path d="M160,280 H384" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#rc-arrow-link)"/>
      <!-- users -> cache: get, set, del (the pattern's subject) -->
      <path d="M512,248 H656 Q664,248 664,240 V188 Q664,180 672,180 H800" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#rc-arrow-accent)"/>
      <!-- users -> db -->
      <path d="M512,312 H656 Q664,312 664,320 V372 Q664,380 672,380 H800" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rc-arrow)"/>

      <!-- Arrow labels (masked, 8px off their stroke) -->
      <rect x="168" y="260" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="196" y="269" class="lbl" text-anchor="middle">VIA API GW</text>
      <rect x="696" y="160" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="726" y="169" class="lbl" text-anchor="middle">GET/SET/DEL</text>
      <rect x="688" y="360" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="722" y="369" class="lbl" text-anchor="middle">READ · WRITE</text>

      <!-- Nodes -->
      <!-- Web app (input) -->
      <rect x="32" y="236" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="236" width="128" height="88" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Client.svg" x="76" y="244" width="40" height="40"/>
      <text x="96" y="300" class="name" text-anchor="middle">Web app</text>
      <text x="96" y="316" class="sub" text-anchor="middle">browser</text>

      <!-- Users service (focal) -->
      <rect x="384" y="200" width="128" height="160" rx="6" fill="#f5f5f5"/>
      <rect x="384" y="200" width="128" height="160" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Server.svg" x="428" y="244" width="40" height="40"/>
      <text x="448" y="304" class="name" text-anchor="middle">Users service</text>

      <!-- Valkey cache (ElastiCache, outside the VPC) -->
      <rect x="800" y="136" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="136" width="128" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonElastiCache.svg" x="844" y="144" width="40" height="40"/>
      <text x="864" y="200" class="name" text-anchor="middle">Valkey cache</text>
      <text x="864" y="216" class="sub" text-anchor="middle">ElastiCache</text>

      <!-- Users Postgres (RDS, in the VPC subnets) -->
      <rect x="800" y="336" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="336" width="128" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="808" y="342" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="822" y="351" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VPC</text>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonRDS.svg" x="844" y="344" width="40" height="40"/>
      <text x="864" y="400" class="name" text-anchor="middle">Users Postgres</text>
      <text x="864" y="416" class="sub" text-anchor="middle">RDS</text>

      <!-- Steps: badges on their connectors + the numbered caption list -->
      <line x1="32" y1="480" x2="960" y2="480" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="504" class="eyebrow-svg">STEPS</text>

      <g data-motion-item data-step="1" aria-label="Step 1: the interceptor runs before the profile handler">
        <circle class="badge" cx="240" cy="280" r="8"/><text class="badge-n" x="240" y="284" text-anchor="middle">1</text>
        <circle class="badge" cx="40" cy="528" r="8"/><text class="badge-n" x="40" y="532" text-anchor="middle">1</text>
        <text class="cap" x="56" y="532">The interceptor runs first; with CACHE_ENABLED off it steps aside and sends no X-Cache</text>
      </g>
      <g data-motion-item data-step="2" aria-label="Step 2: the caller is resolved in Postgres to build the key">
        <circle class="badge" cx="568" cy="312" r="8"/><text class="badge-n" x="568" y="316" text-anchor="middle">2</text>
        <circle class="badge" cx="40" cy="560" r="8"/><text class="badge-n" x="40" y="564" text-anchor="middle">2</text>
        <text class="cap" x="56" y="564">The key carries the resolved user id, so the caller is looked up before the key exists</text>
      </g>
      <g data-motion-item data-step="3" aria-label="Step 3: the cache read fails open within 50 ms">
        <circle class="badge" cx="568" cy="248" r="8"/><text class="badge-n" x="568" y="252" text-anchor="middle">3</text>
        <circle class="badge" cx="40" cy="592" r="8"/><text class="badge-n" x="40" y="596" text-anchor="middle">3</text>
        <text class="cap" x="56" y="596">The cache read has a 50 ms timeout; an outage falls through to the database and answers BYPASS</text>
      </g>
      <g data-motion-item data-step="4" aria-label="Step 4: a hit returns the stored body without running the handler">
        <circle class="badge" cx="264" cy="280" r="8"/><text class="badge-n" x="264" y="284" text-anchor="middle">4</text>
        <circle class="badge" cx="40" cy="624" r="8"/><text class="badge-n" x="40" y="628" text-anchor="middle">4</text>
        <text class="cap" x="56" y="628">A hit returns the stored body plus X-Cache-TTL, and the handler never runs</text>
      </g>
      <g data-motion-item data-step="5" aria-label="Step 5: a miss runs the handler against Postgres">
        <circle class="badge" cx="592" cy="312" r="8"/><text class="badge-n" x="592" y="316" text-anchor="middle">5</text>
        <circle class="badge" cx="40" cy="656" r="8"/><text class="badge-n" x="40" y="660" text-anchor="middle">5</text>
        <text class="cap" x="56" y="660">On a miss the handler runs as if no cache existed</text>
      </g>
      <g data-motion-item data-step="6" aria-label="Step 6: only a 200 is stored, and the miss answers without a TTL header">
        <circle class="badge" cx="592" cy="248" r="8"/><text class="badge-n" x="592" y="252" text-anchor="middle">6</text>
        <circle class="badge" cx="288" cy="280" r="8"/><text class="badge-n" x="288" y="284" text-anchor="middle">6</text>
        <circle class="badge" cx="40" cy="688" r="8"/><text class="badge-n" x="40" y="692" text-anchor="middle">6</text>
        <text class="cap" x="56" y="692">Only a 200 is stored, with a 5-minute TTL, and the response does not wait for it; a miss carries no TTL header</text>
      </g>
      <g data-motion-item data-step="7" aria-label="Step 7: a profile edit or password change commits its write first">
        <circle class="badge" cx="312" cy="280" r="8"/><text class="badge-n" x="312" y="284" text-anchor="middle">7</text>
        <circle class="badge" cx="616" cy="312" r="8"/><text class="badge-n" x="616" y="316" text-anchor="middle">7</text>
        <circle class="badge" cx="40" cy="720" r="8"/><text class="badge-n" x="40" y="724" text-anchor="middle">7</text>
        <text class="cap" x="56" y="724">A profile edit or password change alters what the cached body shows; the write is committed first</text>
      </g>
      <g data-motion-item data-step="8" aria-label="Step 8: the entry is invalidated only after the write persists">
        <circle class="badge" cx="616" cy="248" r="8"/><text class="badge-n" x="616" y="252" text-anchor="middle">8</text>
        <circle class="badge" cx="40" cy="752" r="8"/><text class="badge-n" x="40" y="756" text-anchor="middle">8</text>
        <text class="cap" x="56" y="756">Invalidation runs only after the write persists; earlier lets a concurrent read restore the stale body</text>
      </g>

      <!-- Legend strip -->
      <line x1="32" y1="784" x2="960" y2="784" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="812" class="eyebrow-svg">LEGEND</text>
      <line x1="96" y1="808" x2="128" y2="808" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rc-arrow)"/>
      <text x="140" y="812" class="lbl">SYNC CALL</text>
      <line x1="208" y1="808" x2="240" y2="808" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#rc-arrow-link)"/>
      <text x="252" y="812" class="lbl">HTTP FROM THE BROWSER</text>
      <line x1="380" y1="808" x2="412" y2="808" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#rc-arrow-accent)"/>
      <text x="424" y="812" class="lbl">CACHE CALLS</text>
      <rect x="500" y="800" width="24" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="536" y="812" class="lbl">FOCAL SERVICE</text>
      <rect x="624" y="802" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="638" y="811" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VPC</text>
      <text x="664" y="812" class="lbl">10.0.0.0/16 · SUBNETS A+B</text>
      <circle class="badge" cx="836" cy="808" r="8"/><text class="badge-n" x="836" y="812" text-anchor="middle">n</text>
      <text x="852" y="812" class="lbl">STEP · CAPTION n</text>
    </svg>

    <div data-motion-controls role="group" aria-label="Diagram playback controls">
      <button type="button" data-motion-action="prev">Previous</button>
      <button type="button" data-motion-action="play" aria-pressed="false">Play</button>
      <button type="button" data-motion-action="pause" aria-pressed="true">Pause</button>
      <button type="button" data-motion-action="next">Next</button>
      <button type="button" data-motion-action="replay">Replay</button>
      <span class="keyboard-help">←/→ step · Space play/pause · R replay · Home/End jump</span>
      <span data-motion-status-visible aria-hidden="true">Step <span data-motion-step-label>8</span> of 8</span>
    </div>
    <p class="sr-only" data-motion-status role="status" aria-live="polite" aria-atomic="true"></p>
    <noscript><p>Animation controls require JavaScript. The complete final diagram is shown above.</p></noscript>
  </main>

  <script data-diagram-controls>
    (() => {
      const params = new URLSearchParams(location.search);
      const staticOverride = params.get('motion') === 'static' || document.documentElement.dataset.motion === 'static';
      const requestedStep = params.get('step');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');
      document.fonts.ready.then(() => { document.documentElement.dataset.fontsReady = 'true'; });

      document.querySelectorAll('[data-motion-root]').forEach((root) => {
        const count = Number(root.dataset.stepCount);
        const hold = parseFloat(getComputedStyle(root).getPropertyValue('--motion-hold')) || 720;
        const parsedStep = requestedStep !== null && /^\d+$/.test(requestedStep) ? Number(requestedStep) : null;
        const exactStep = params.get('motion') === 'step' && Number.isSafeInteger(parsedStep) && parsedStep >= 0 && parsedStep <= count ? parsedStep : null;
        const items = [...root.querySelectorAll('[data-motion-item]')];
        const labels = Array.from({ length: count + 1 }, (_, index) => index === 0
          ? 'Ready'
          : items.filter((item) => !item.hasAttribute('data-motion-decorative') && Number(item.dataset.step) === index)
              .map((item) => item.getAttribute('aria-label')).join('; '));
        const controls = root.querySelector('[data-motion-controls]');
        const status = root.querySelector('[data-motion-status]');
        const visibleStep = root.querySelector('[data-motion-step-label]');
        let step = count;
        let timer = 0;
        let playing = false;
        let stepBeforeReduce = 0;
        let resumeAfterReduce = root.dataset.motionMode === 'reveal';

        const buttons = (action) => controls.querySelector(`[data-motion-action="${action}"]`);
        const clearClock = () => { window.clearTimeout(timer); timer = 0; };
        const announce = () => { status.textContent = `Step ${step} of ${count}: ${labels[step] || 'Complete'}`; };
        const setControlsAvailable = (available) => {
          controls.hidden = !available;
          controls.setAttribute('aria-hidden', String(!available));
          controls.dataset.playbackDisabled = String(!available);
          controls.querySelectorAll('button').forEach((control) => { control.disabled = !available; });
        };

        function render(next, userInitiated = false) {
          step = Math.max(0, Math.min(count, next));
          root.dataset.stepCurrent = String(step);
          root.dataset.frame = step === count ? 'end' : step === 0 ? 'start' : 'step';
          items.forEach((item) => {
            const itemStep = Number(item.dataset.step);
            item.classList.toggle('is-visible', itemStep <= step);
            item.classList.toggle('is-current', itemStep === step);
          });
          if (visibleStep) visibleStep.textContent = String(step);
          const unavailable = controls.dataset.playbackDisabled === 'true';
          buttons('prev').disabled = unavailable || step === 0;
          buttons('next').disabled = unavailable || step === count;
          if (userInitiated) announce();
        }

        function pause(userInitiated = false) {
          clearClock();
          playing = false;
          root.classList.remove('is-playing');
          buttons('play').setAttribute('aria-pressed', 'false');
          buttons('pause').setAttribute('aria-pressed', 'true');
          if (userInitiated) status.textContent = `Paused at step ${step} of ${count}`;
        }

        function finish() {
          pause(false);
          root.dataset.frame = 'end';
          status.textContent = `Complete · step ${count} of ${count}`;
        }

        function tick() {
          if (!playing) return;
          if (step >= count) { finish(); return; }
          render(step + 1, false);
          if (step >= count) { finish(); return; }
          timer = window.setTimeout(tick, hold);
        }

        function play(fromStart = false, userInitiated = false) {
          clearClock();
          if (fromStart || step >= count) render(0, userInitiated);
          playing = true;
          root.classList.add('is-playing');
          buttons('play').setAttribute('aria-pressed', 'true');
          buttons('pause').setAttribute('aria-pressed', 'false');
          timer = window.setTimeout(tick, hold);
        }

        controls.addEventListener('click', (event) => {
          const button = event.target.closest('[data-motion-action]');
          if (!button) return;
          const action = button.dataset.motionAction;
          if (action === 'play') play(false, true);
          if (action === 'pause') pause(true);
          if (action === 'replay') play(true, true);
          if (action === 'prev') { pause(false); render(step - 1, true); }
          if (action === 'next') { pause(false); render(step + 1, true); }
        });

        root.addEventListener('keydown', (event) => {
          if (event.target.matches('input, textarea, select, a[href]')) return;
          const keys = { ArrowLeft: step - 1, ArrowRight: step + 1, Home: 0, End: count };
          if (event.code === 'Space' && !event.target.closest('button')) {
            event.preventDefault();
            playing ? pause(true) : play(false, true);
            return;
          }
          if (!event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === 'r') {
            event.preventDefault();
            play(true, true);
            return;
          }
          if (!(event.key in keys)) return;
          event.preventDefault();
          pause(false);
          render(keys[event.key], true);
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden' && playing) pause(false);
        });
        reduce.addEventListener('change', (event) => {
          if (event.matches && root.dataset.motionState !== 'reduced') {
            stepBeforeReduce = step;
            resumeAfterReduce = playing;
          }
          pause(false);
          if (event.matches) {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'reduced';
            status.textContent = 'Reduced motion · complete static frame · playback controls unavailable';
          } else if (staticOverride || root.dataset.motionMode === 'none') {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'static';
            status.textContent = 'Static frame · complete diagram · playback controls unavailable';
          } else {
            delete root.dataset.motionState;
            if (exactStep !== null) {
              setControlsAvailable(false);
              render(exactStep, false);
              root.dataset.frame = 'step';
              root.dataset.motionState = 'test';
              status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
            } else {
              setControlsAvailable(true);
              render(stepBeforeReduce, false);
              status.textContent = `Ready · step ${step} of ${count}`;
              if (resumeAfterReduce && root.dataset.motionMode === 'reveal') {
                play(false, false);
              }
            }
            resumeAfterReduce = false;
          }
        });

        if (staticOverride) {
          document.documentElement.dataset.motion = 'static';
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = 'static';
          status.textContent = 'Static frame · complete diagram · playback controls unavailable';
        } else if (reduce.matches || root.dataset.motionMode === 'none') {
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = reduce.matches ? 'reduced' : 'static';
          status.textContent = reduce.matches
            ? 'Reduced motion · complete static frame · playback controls unavailable'
            : 'Static frame · complete diagram · playback controls unavailable';
        } else if (exactStep !== null) {
          document.documentElement.dataset.motion = 'step';
          pause(false);
          setControlsAvailable(false);
          render(exactStep, false);
          root.dataset.frame = 'step';
          root.dataset.motionState = 'test';
          status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
        } else if (root.dataset.motionMode === 'reveal') {
          setControlsAvailable(true);
          render(0, false);
          play(false, false);
        } else {
          pause(false);
          setControlsAvailable(true);
          render(0, false);
          status.textContent = `Ready · step 0 of ${count}`;
        }
        root.classList.add('motion-ready');
      });
    })();
  </script>
</body>
</html>
