<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Self-owned password reset</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-soft: #7a8399;
      --color-accent: #eb6c36;
      --color-rule: rgba(45,49,66,0.12);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --motion-fast: 160ms;
      --motion-step: 480ms;
      --motion-hold: 960ms;
      --motion-total: 7680ms;
      --motion-ease: cubic-bezier(.2,.8,.2,1);
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 32px;
      color: var(--color-ink);
      background: var(--color-paper);
      font-family: var(--font-sans);
    }
    [data-motion-root] { width: min(100%, 1360px); }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 24px; font: 400 32px/1.15 var(--font-serif); }
    svg { display: block; width: 100%; min-width: 720px; }

    /* Static source is complete. Only an initialized enhancement hides items. */
    .motion-ready [data-motion-item] {
      opacity: .12;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
                  transform var(--motion-step) var(--motion-ease);
    }
    .motion-ready [data-motion-item].is-visible,
    .motion-ready[data-frame="end"] [data-motion-item],
    .motion-ready[data-frame="static"] [data-motion-item] {
      opacity: 1;
      transform: none;
    }
    .motion-ready[data-frame="step"] [data-motion-item].is-current .badge { fill: var(--color-accent); }

    [data-motion-controls] {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule);
    }
    .motion-ready [data-motion-controls] { display: flex; }
    [data-motion-controls][hidden] { display: none !important; }
    [data-motion-controls] button {
      min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--color-muted);
      border-radius: 4px;
      color: var(--color-ink);
      background: var(--color-paper);
      font: 600 12px/1 var(--font-sans);
      cursor: pointer;
    }
    [data-motion-controls] button:hover { border-color: var(--color-accent); }
    [data-motion-controls] button:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }
    [data-motion-controls] button:disabled { cursor: not-allowed; opacity: .45; }
    [data-motion-status-visible] {
      margin-left: auto;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    noscript p {
      margin: 12px 0 0;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }

    html[data-motion="static"] [data-motion-controls],
    html[data-motion="static"] [data-motion-decorative] { display: none !important; }
    html[data-motion="static"] [data-motion-item] {
      opacity: 1 !important;
      transform: none !important;
      animation: none !important;
      transition: none !important;
    }
    html[data-motion="step"] [data-motion-controls],
    html[data-motion="step"] [data-motion-decorative] { display: none !important; }
    html[data-motion="step"] [data-motion-item] {
      animation: none !important;
      transition: none !important;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
      [data-motion-item] { opacity: 1 !important; transform: none !important; }
      [data-motion-decorative] { display: none !important; }
      [data-motion-controls] { display: none !important; }
    }
    @media print {
      [data-motion-controls], [data-motion-decorative] { display: none !important; }
      [data-motion-item] {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        transition: none !important;
      }
    }

    .lbl { fill: #7a8399; font: 400 8px var(--font-mono); letter-spacing: .06em; }
    .zone-lbl { fill: rgba(45,49,66,0.55); font: 500 8px var(--font-mono); letter-spacing: .14em; }
    .name { fill: #2d3142; font: 600 12px var(--font-sans); }
    .sub { fill: #4f5d75; font: 400 8px var(--font-mono); letter-spacing: .04em; }
    .badge { fill: #2d3142; }
    .badge-n { fill: #f5f5f5; font: 600 12px var(--font-mono); }
    .cap { fill: #2d3142; font: 400 12px var(--font-sans); }
    .eyebrow-svg { fill: #4f5d75; font: 500 8px var(--font-mono); letter-spacing: .14em; }
  </style>
</head>
<body>
  <main data-motion-root data-motion-mode="step" data-step-count="8" data-step-current="8" data-frame="static" data-static-frame="complete">
    <p class="eyebrow">Users · Flow · Local dev on Floci</p>
    <h1>Self-owned password reset</h1>

    <svg viewBox="0 80 1360 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="users-password-reset-title users-password-reset-desc">
      <title id="users-password-reset-title">Self-owned password reset</title>
      <desc id="users-password-reset-desc">The Users service mints a reset code, stores only its hash in ElastiCache Redis, publishes PASSWORD_RESET_REQUESTED through SNS, SQS and the events pipeline to an SES email, then verifies and consumes the code, sets the new password in Cognito directly and clears the must-change-password flag in the Users DB; Cognito's own forgot-password flow is never called.</desc>
      <defs>
        <marker id="upr-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="upr-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="upr-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
      <rect width="1360" height="880" fill="#f5f5f5"/>

      <!-- Zones (painted first) -->
      <rect x="256" y="252" width="200" height="172" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="268" y="256" width="92" height="12" rx="2" fill="#f5f5f5"/>
      <text x="272" y="265" class="zone-lbl">DOCKER COMPOSE</text>

      <rect x="256" y="480" width="200" height="136" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="268" y="596" width="176" height="12" rx="2" fill="#f5f5f5"/>
      <text x="272" y="605" class="zone-lbl">VPC 10.0.0.0/16 · SUBNETS A+B</text>

      <rect x="552" y="92" width="792" height="496" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="564" y="96" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="568" y="105" class="zone-lbl">FLOCI :4566</text>

      <!-- Connectors (before nodes) -->
      <!-- web -> users: REST -->
      <path d="M160,344 H292" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#upr-arrow-link)"/>
      <!-- users -> redis: code hash (focal) -->
      <path d="M420,296 H648 Q656,296 656,288 V212" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#upr-arrow-accent)"/>
      <!-- users -> cognito: set password -->
      <path d="M420,328 H840 Q848,328 848,320 V212" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#upr-arrow)"/>
      <!-- users -> sns: reset event (async) -->
      <path d="M420,392 H648 Q656,392 656,400 V476" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#upr-arrow)"/>
      <!-- users -> db -->
      <path d="M356,408 V504" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#upr-arrow)"/>
      <!-- sns -> sqs -> pipeline (async), pipeline -> ses -->
      <path d="M720,520 H784" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#upr-arrow)"/>
      <path d="M912,520 H976" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#upr-arrow)"/>
      <path d="M1104,520 H1200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#upr-arrow)"/>

      <!-- Arrow labels (masked, 8px off their stroke) -->
      <rect x="180" y="324" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="196" y="333" class="lbl" text-anchor="middle">REST</text>
      <rect x="448" y="276" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="285" class="lbl" text-anchor="middle">CODE HASH</text>
      <rect x="736" y="308" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="772" y="317" class="lbl" text-anchor="middle">SET PASSWORD</text>
      <rect x="664" y="428" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="696" y="437" class="lbl" text-anchor="middle">RESET EVENT</text>
      <rect x="1132" y="500" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1164" y="509" class="lbl" text-anchor="middle">RESET EMAIL</text>

      <!-- Nodes -->
      <!-- Web app (input) -->
      <rect x="32" y="300" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="300" width="128" height="88" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Client.svg" x="76" y="312" width="40" height="40"/>
      <text x="96" y="372" class="name" text-anchor="middle">Web app</text>

      <!-- Users service (focal) -->
      <rect x="292" y="280" width="128" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="292" y="280" width="128" height="128" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Server.svg" x="336" y="308" width="40" height="40"/>
      <text x="356" y="372" class="name" text-anchor="middle">Users service</text>

      <!-- Users DB (store) -->
      <rect x="292" y="504" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="292" y="504" width="128" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonRDS.svg" x="336" y="512" width="40" height="40"/>
      <text x="356" y="568" class="name" text-anchor="middle">Users DB</text>
      <text x="356" y="584" class="sub" text-anchor="middle">RDS PostgreSQL</text>

      <!-- Redis (store) -->
      <rect x="592" y="124" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="592" y="124" width="128" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonElastiCache.svg" x="636" y="132" width="40" height="40"/>
      <text x="656" y="188" class="name" text-anchor="middle">Redis</text>
      <text x="656" y="204" class="sub" text-anchor="middle">ElastiCache</text>

      <!-- Cognito -->
      <rect x="784" y="124" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="784" y="124" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonCognito.svg" x="828" y="132" width="40" height="40"/>
      <text x="848" y="188" class="name" text-anchor="middle">Cognito</text>
      <text x="848" y="204" class="sub" text-anchor="middle">user pool</text>

      <!-- Events topic (SNS) -->
      <rect x="592" y="476" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="592" y="476" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonSimpleNotificationService.svg" x="636" y="488" width="40" height="40"/>
      <text x="656" y="548" class="name" text-anchor="middle">Events topic</text>

      <!-- Events queue (SQS) -->
      <rect x="784" y="476" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="784" y="476" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonSimpleQueueService.svg" x="828" y="488" width="40" height="40"/>
      <text x="848" y="548" class="name" text-anchor="middle">Events queue</text>

      <!-- Events pipeline (Lambda) -->
      <rect x="976" y="476" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="976" y="476" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AWSLambda.svg" x="1020" y="488" width="40" height="40"/>
      <text x="1040" y="548" class="name" text-anchor="middle">Events pipeline</text>

      <!-- SES -->
      <rect x="1200" y="476" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="1200" y="476" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonSimpleEmailService.svg" x="1244" y="484" width="40" height="40"/>
      <text x="1264" y="540" class="name" text-anchor="middle">SES</text>
      <text x="1264" y="556" class="sub" text-anchor="middle">Mailpit</text>

      <!-- Steps: badges on their connectors + the numbered caption list -->
      <line x1="32" y1="640" x2="1328" y2="640" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="664" class="eyebrow-svg">STEPS</text>

      <g data-motion-item data-step="1" aria-label="Step 1: the browser requests a reset from Users">
        <circle class="badge" cx="236" cy="344" r="8"/><text class="badge-n" x="236" y="348" text-anchor="middle">1</text>
        <circle class="badge" cx="40" cy="688" r="8"/><text class="badge-n" x="40" y="692" text-anchor="middle">1</text>
        <text class="cap" x="56" y="692">A reset is requested; the answer is identical whether or not the email belongs to an account</text>
      </g>
      <g data-motion-item data-step="2" aria-label="Step 2: Users looks the email up in the Users DB">
        <circle class="badge" cx="356" cy="436" r="8"/><text class="badge-n" x="356" y="440" text-anchor="middle">2</text>
        <circle class="badge" cx="40" cy="720" r="8"/><text class="badge-n" x="40" y="724" text-anchor="middle">2</text>
        <text class="cap" x="56" y="724">An unknown email stops at the lookup: no code minted, no event published</text>
      </g>
      <g data-motion-item data-step="3" aria-label="Step 3: Users stores the hash of a new code in Redis">
        <circle class="badge" cx="552" cy="296" r="8"/><text class="badge-n" x="552" y="300" text-anchor="middle">3</text>
        <circle class="badge" cx="40" cy="752" r="8"/><text class="badge-n" x="40" y="756" text-anchor="middle">3</text>
        <text class="cap" x="56" y="756">A 6-digit code is minted; only its hash is stored, one key per email, 10-minute TTL</text>
      </g>
      <g data-motion-item data-step="4" aria-label="Step 4: PASSWORD_RESET_REQUESTED flows through SNS and SQS to the events pipeline">
        <circle class="badge" cx="488" cy="392" r="8"/><text class="badge-n" x="488" y="396" text-anchor="middle">4</text>
        <circle class="badge" cx="40" cy="784" r="8"/><text class="badge-n" x="40" y="788" text-anchor="middle">4</text>
        <text class="cap" x="56" y="788">PASSWORD_RESET_REQUESTED goes via SNS to the events queue;</text>
        <text class="cap" x="56" y="804">a publish failure is logged, never returned</text>
      </g>
      <g data-motion-item data-step="5" aria-label="Step 5: the pipeline emails the code through SES">
        <circle class="badge" cx="1120" cy="520" r="8"/><text class="badge-n" x="1120" y="524" text-anchor="middle">5</text>
        <circle class="badge" cx="704" cy="688" r="8"/><text class="badge-n" x="704" y="692" text-anchor="middle">5</text>
        <text class="cap" x="720" y="692">The pipeline renders the forgot-password email; the stored event has the code redacted</text>
      </g>
      <g data-motion-item data-step="6" aria-label="Step 6: the browser sends the code and a new password to Users">
        <circle class="badge" cx="268" cy="344" r="8"/><text class="badge-n" x="268" y="348" text-anchor="middle">6</text>
        <circle class="badge" cx="704" cy="720" r="8"/><text class="badge-n" x="704" y="724" text-anchor="middle">6</text>
        <text class="cap" x="720" y="724">The user comes back with the emailed code and a new password</text>
      </g>
      <g data-motion-item data-step="7" aria-label="Step 7: Users checks the code against its hash in Redis and deletes it">
        <circle class="badge" cx="584" cy="296" r="8"/><text class="badge-n" x="584" y="300" text-anchor="middle">7</text>
        <circle class="badge" cx="704" cy="752" r="8"/><text class="badge-n" x="704" y="756" text-anchor="middle">7</text>
        <text class="cap" x="720" y="756">The code is checked against its hash and deleted; every failure gets the same error</text>
      </g>
      <g data-motion-item data-step="8" aria-label="Step 8: Users sets the password in Cognito and clears the flag in the Users DB">
        <circle class="badge" cx="704" cy="328" r="8"/><text class="badge-n" x="704" y="332" text-anchor="middle">8</text>
        <circle class="badge" cx="356" cy="468" r="8"/><text class="badge-n" x="356" y="472" text-anchor="middle">8</text>
        <circle class="badge" cx="704" cy="784" r="8"/><text class="badge-n" x="704" y="788" text-anchor="middle">8</text>
        <text class="cap" x="720" y="788">Cognito's password is set directly, never ConfirmForgotPassword (it rejects foreign codes);</text>
        <text class="cap" x="720" y="804">the must-change-password flag is cleared and the cached profile invalidated</text>
      </g>

      <!-- Legend strip -->
      <line x1="32" y1="832" x2="1328" y2="832" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="860" class="eyebrow-svg">LEGEND</text>
      <line x1="104" y1="856" x2="136" y2="856" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#upr-arrow)"/>
      <text x="148" y="860" class="lbl">SYNC CALL</text>
      <line x1="236" y1="856" x2="268" y2="856" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#upr-arrow-link)"/>
      <text x="280" y="860" class="lbl">HTTP FROM THE BROWSER</text>
      <line x1="424" y1="856" x2="456" y2="856" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#upr-arrow)"/>
      <text x="468" y="860" class="lbl">ASYNC · TOPIC, QUEUE</text>
      <line x1="604" y1="856" x2="636" y2="856" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#upr-arrow-accent)"/>
      <text x="648" y="860" class="lbl">THE SELF-OWNED CODE</text>
      <rect x="784" y="848" width="24" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="820" y="860" class="lbl">FOCAL SERVICE</text>
      <circle class="badge" cx="936" cy="856" r="8"/><text class="badge-n" x="936" y="860" text-anchor="middle">n</text>
      <text x="952" y="860" class="lbl">STEP · SEE CAPTION n</text>
    </svg>

    <div data-motion-controls role="group" aria-label="Diagram playback controls">
      <button type="button" data-motion-action="prev">Previous</button>
      <button type="button" data-motion-action="play" aria-pressed="false">Play</button>
      <button type="button" data-motion-action="pause" aria-pressed="true">Pause</button>
      <button type="button" data-motion-action="next">Next</button>
      <button type="button" data-motion-action="replay">Replay</button>
      <span class="keyboard-help">←/→ step · Space play/pause · R replay · Home/End jump</span>
      <span data-motion-status-visible aria-hidden="true">Step <span data-motion-step-label>8</span> of 8</span>
    </div>
    <p class="sr-only" data-motion-status role="status" aria-live="polite" aria-atomic="true"></p>
    <noscript><p>Animation controls require JavaScript. The complete final diagram is shown above.</p></noscript>
  </main>

  <script data-diagram-controls>
    (() => {
      const params = new URLSearchParams(location.search);
      const staticOverride = params.get('motion') === 'static' || document.documentElement.dataset.motion === 'static';
      const requestedStep = params.get('step');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');
      document.fonts.ready.then(() => { document.documentElement.dataset.fontsReady = 'true'; });

      document.querySelectorAll('[data-motion-root]').forEach((root) => {
        const count = Number(root.dataset.stepCount);
        const hold = parseFloat(getComputedStyle(root).getPropertyValue('--motion-hold')) || 720;
        const parsedStep = requestedStep !== null && /^\d+$/.test(requestedStep) ? Number(requestedStep) : null;
        const exactStep = params.get('motion') === 'step' && Number.isSafeInteger(parsedStep) && parsedStep >= 0 && parsedStep <= count ? parsedStep : null;
        const items = [...root.querySelectorAll('[data-motion-item]')];
        const labels = Array.from({ length: count + 1 }, (_, index) => index === 0
          ? 'Ready'
          : items.filter((item) => !item.hasAttribute('data-motion-decorative') && Number(item.dataset.step) === index)
              .map((item) => item.getAttribute('aria-label')).join('; '));
        const controls = root.querySelector('[data-motion-controls]');
        const status = root.querySelector('[data-motion-status]');
        const visibleStep = root.querySelector('[data-motion-step-label]');
        let step = count;
        let timer = 0;
        let playing = false;
        let stepBeforeReduce = 0;
        let resumeAfterReduce = root.dataset.motionMode === 'reveal';

        const buttons = (action) => controls.querySelector(`[data-motion-action="${action}"]`);
        const clearClock = () => { window.clearTimeout(timer); timer = 0; };
        const announce = () => { status.textContent = `Step ${step} of ${count}: ${labels[step] || 'Complete'}`; };
        const setControlsAvailable = (available) => {
          controls.hidden = !available;
          controls.setAttribute('aria-hidden', String(!available));
          controls.dataset.playbackDisabled = String(!available);
          controls.querySelectorAll('button').forEach((control) => { control.disabled = !available; });
        };

        function render(next, userInitiated = false) {
          step = Math.max(0, Math.min(count, next));
          root.dataset.stepCurrent = String(step);
          root.dataset.frame = step === count ? 'end' : step === 0 ? 'start' : 'step';
          items.forEach((item) => {
            const itemStep = Number(item.dataset.step);
            item.classList.toggle('is-visible', itemStep <= step);
            item.classList.toggle('is-current', itemStep === step);
          });
          if (visibleStep) visibleStep.textContent = String(step);
          const unavailable = controls.dataset.playbackDisabled === 'true';
          buttons('prev').disabled = unavailable || step === 0;
          buttons('next').disabled = unavailable || step === count;
          if (userInitiated) announce();
        }

        function pause(userInitiated = false) {
          clearClock();
          playing = false;
          root.classList.remove('is-playing');
          buttons('play').setAttribute('aria-pressed', 'false');
          buttons('pause').setAttribute('aria-pressed', 'true');
          if (userInitiated) status.textContent = `Paused at step ${step} of ${count}`;
        }

        function finish() {
          pause(false);
          root.dataset.frame = 'end';
          status.textContent = `Complete · step ${count} of ${count}`;
        }

        function tick() {
          if (!playing) return;
          if (step >= count) { finish(); return; }
          render(step + 1, false);
          if (step >= count) { finish(); return; }
          timer = window.setTimeout(tick, hold);
        }

        function play(fromStart = false, userInitiated = false) {
          clearClock();
          if (fromStart || step >= count) render(0, userInitiated);
          playing = true;
          root.classList.add('is-playing');
          buttons('play').setAttribute('aria-pressed', 'true');
          buttons('pause').setAttribute('aria-pressed', 'false');
          timer = window.setTimeout(tick, hold);
        }

        controls.addEventListener('click', (event) => {
          const button = event.target.closest('[data-motion-action]');
          if (!button) return;
          const action = button.dataset.motionAction;
          if (action === 'play') play(false, true);
          if (action === 'pause') pause(true);
          if (action === 'replay') play(true, true);
          if (action === 'prev') { pause(false); render(step - 1, true); }
          if (action === 'next') { pause(false); render(step + 1, true); }
        });

        root.addEventListener('keydown', (event) => {
          if (event.target.matches('input, textarea, select, a[href]')) return;
          const keys = { ArrowLeft: step - 1, ArrowRight: step + 1, Home: 0, End: count };
          if (event.code === 'Space' && !event.target.closest('button')) {
            event.preventDefault();
            playing ? pause(true) : play(false, true);
            return;
          }
          if (!event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === 'r') {
            event.preventDefault();
            play(true, true);
            return;
          }
          if (!(event.key in keys)) return;
          event.preventDefault();
          pause(false);
          render(keys[event.key], true);
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden' && playing) pause(false);
        });
        reduce.addEventListener('change', (event) => {
          if (event.matches && root.dataset.motionState !== 'reduced') {
            stepBeforeReduce = step;
            resumeAfterReduce = playing;
          }
          pause(false);
          if (event.matches) {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'reduced';
            status.textContent = 'Reduced motion · complete static frame · playback controls unavailable';
          } else if (staticOverride || root.dataset.motionMode === 'none') {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'static';
            status.textContent = 'Static frame · complete diagram · playback controls unavailable';
          } else {
            delete root.dataset.motionState;
            if (exactStep !== null) {
              setControlsAvailable(false);
              render(exactStep, false);
              root.dataset.frame = 'step';
              root.dataset.motionState = 'test';
              status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
            } else {
              setControlsAvailable(true);
              render(stepBeforeReduce, false);
              status.textContent = `Ready · step ${step} of ${count}`;
              if (resumeAfterReduce && root.dataset.motionMode === 'reveal') {
                play(false, false);
              }
            }
            resumeAfterReduce = false;
          }
        });

        if (staticOverride) {
          document.documentElement.dataset.motion = 'static';
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = 'static';
          status.textContent = 'Static frame · complete diagram · playback controls unavailable';
        } else if (reduce.matches || root.dataset.motionMode === 'none') {
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = reduce.matches ? 'reduced' : 'static';
          status.textContent = reduce.matches
            ? 'Reduced motion · complete static frame · playback controls unavailable'
            : 'Static frame · complete diagram · playback controls unavailable';
        } else if (exactStep !== null) {
          document.documentElement.dataset.motion = 'step';
          pause(false);
          setControlsAvailable(false);
          render(exactStep, false);
          root.dataset.frame = 'step';
          root.dataset.motionState = 'test';
          status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
        } else if (root.dataset.motionMode === 'reveal') {
          setControlsAvailable(true);
          render(0, false);
          play(false, false);
        } else {
          pause(false);
          setControlsAvailable(true);
          render(0, false);
          status.textContent = `Ready · step 0 of ${count}`;
        }
        root.classList.add('motion-ready');
      });
    })();
  </script>
</body>
</html>
