<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How business metrics reach the dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-soft: #7a8399;
      --color-accent: #eb6c36;
      --color-rule: rgba(45,49,66,0.12);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --motion-fast: 160ms;
      --motion-step: 480ms;
      --motion-hold: 960ms;
      --motion-total: 7680ms;
      --motion-ease: cubic-bezier(.2,.8,.2,1);
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 32px;
      color: var(--color-ink);
      background: var(--color-paper);
      font-family: var(--font-sans);
    }
    [data-motion-root] { width: min(100%, 1360px); }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 8px; font: 400 32px/1.15 var(--font-serif); }
    .subtitle { margin: 0 0 24px; color: var(--color-muted); font: 400 16px/1.4 var(--font-sans); }
    svg { display: block; width: 100%; min-width: 720px; }

    /* Static source is complete. Only an initialized enhancement hides items. */
    .motion-ready [data-motion-item] {
      opacity: .12;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
                  transform var(--motion-step) var(--motion-ease);
    }
    .motion-ready [data-motion-item].is-visible,
    .motion-ready[data-frame="end"] [data-motion-item],
    .motion-ready[data-frame="static"] [data-motion-item] {
      opacity: 1;
      transform: none;
    }
    .motion-ready[data-frame="step"] [data-motion-item].is-current .badge { fill: var(--color-accent); }

    [data-motion-controls] {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule);
    }
    .motion-ready [data-motion-controls] { display: flex; }
    [data-motion-controls][hidden] { display: none !important; }
    [data-motion-controls] button {
      min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--color-muted);
      border-radius: 4px;
      color: var(--color-ink);
      background: var(--color-paper);
      font: 600 12px/1 var(--font-sans);
      cursor: pointer;
    }
    [data-motion-controls] button:hover { border-color: var(--color-accent); }
    [data-motion-controls] button:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }
    [data-motion-controls] button:disabled { cursor: not-allowed; opacity: .45; }
    [data-motion-status-visible] {
      margin-left: auto;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    noscript p {
      margin: 12px 0 0;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }

    html[data-motion="static"] [data-motion-controls],
    html[data-motion="static"] [data-motion-decorative] { display: none !important; }
    html[data-motion="static"] [data-motion-item] {
      opacity: 1 !important;
      transform: none !important;
      animation: none !important;
      transition: none !important;
    }
    html[data-motion="step"] [data-motion-controls],
    html[data-motion="step"] [data-motion-decorative] { display: none !important; }
    html[data-motion="step"] [data-motion-item] {
      animation: none !important;
      transition: none !important;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
      [data-motion-item] { opacity: 1 !important; transform: none !important; }
      [data-motion-decorative] { display: none !important; }
      [data-motion-controls] { display: none !important; }
    }
    @media print {
      [data-motion-controls], [data-motion-decorative] { display: none !important; }
      [data-motion-item] {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        transition: none !important;
      }
    }

    .lbl { fill: #7a8399; font: 400 8px var(--font-mono); letter-spacing: .06em; }
    .zone-lbl { fill: rgba(45,49,66,0.55); font: 500 8px var(--font-mono); letter-spacing: .14em; }
    .name { fill: #2d3142; font: 600 12px var(--font-sans); }
    .sub { fill: #4f5d75; font: 400 8px var(--font-mono); letter-spacing: .04em; }
    .badge { fill: #2d3142; }
    .badge-n { fill: #f5f5f5; font: 600 12px var(--font-mono); }
    .cap { fill: #2d3142; font: 400 12px var(--font-sans); }
    .eyebrow-svg { fill: #4f5d75; font: 500 8px var(--font-mono); letter-spacing: .14em; }
  </style>
</head>
<body>
  <main data-motion-root data-motion-mode="step" data-step-count="8" data-step-current="8" data-frame="static" data-static-frame="complete">
    <p class="eyebrow">Observability · Flow · Local dev</p>
    <p class="subtitle">Services publish to CloudWatch; the collector polls it into OpenObserve</p>
    <h1>How business metrics reach the dashboard</h1>

    <svg viewBox="0 104 1296 652" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="business-metrics-title business-metrics-desc">
      <title id="business-metrics-title">How business metrics reach the dashboard</title>
      <desc id="business-metrics-desc">In local dev the Users, Orders and Tracking services count their own tables every minute and publish gauges and zero-seeded counters to one CloudWatch namespace on Floci, an EventBridge rule ticks the email Lambda to publish its counters there too, and the OpenTelemetry collector queries CloudWatch, collapses each metric into one series and exports it to OpenObserve for the dashboard cards.</desc>
      <defs>
        <marker id="bm-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="bm-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="bm-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
      <rect y="104" width="1296" height="652" fill="#f5f5f5"/>

      <!-- Zones (painted first) -->
      <rect x="32" y="120" width="192" height="216" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="44" y="124" width="148" height="12" rx="2" fill="#f5f5f5"/>
      <text x="48" y="133" class="zone-lbl">DOCKER COMPOSE · SERVICES</text>

      <rect x="304" y="184" width="416" height="312" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="316" y="188" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="197" class="zone-lbl">FLOCI :4566</text>

      <rect x="832" y="120" width="432" height="216" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="1076" y="124" width="176" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1080" y="133" class="zone-lbl">DOCKER COMPOSE · OBSERVABILITY</text>

      <!-- service pollers -> CloudWatch: PutMetricData -->

      <!-- minute rule -> email Lambda: tick (async) -->

      <!-- collector -> CloudWatch: GetMetricData -->
      <path d="M864,260 H672" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bm-arrow)"/>
      <!-- collector -> itself: collapse -->
      <path d="M896,216 V188 Q896,180 904,180 H952 Q960,180 960,188 V214" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bm-arrow)"/>
      <!-- collector -> OpenObserve: OTLP -->
      <path d="M992,260 H1104" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bm-arrow)"/>

      <!-- Arrow labels (masked, 8px off their stroke) -->
      <rect x="100" y="148" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="128" y="157" class="lbl" text-anchor="middle">COUNT ROWS</text>
      <rect x="228" y="240" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="264" y="249" class="lbl" text-anchor="middle">PUTMETRICDATA</text>
      <rect x="496" y="400" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="512" y="409" class="lbl" text-anchor="middle">TICK</text>
      <rect x="624" y="320" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="664" y="329" class="lbl" text-anchor="middle">EMAIL COUNTERS</text>
      <rect x="716" y="240" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="752" y="249" class="lbl" text-anchor="middle">GETMETRICDATA</text>
      <rect x="904" y="148" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="928" y="157" class="lbl" text-anchor="middle">COLLAPSE</text>
      <rect x="1048" y="240" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1064" y="249" class="lbl" text-anchor="middle">OTLP</text>

      <!-- Nodes -->
      <!-- Service pollers -->
      <rect x="64" y="216" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="216" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Server.svg" x="108" y="220" width="40" height="40"/>
      <text x="128" y="276" class="name" text-anchor="middle">Service pollers</text>
      <text x="128" y="292" class="sub" text-anchor="middle">Users, Orders, Tracking</text>

      <!-- Minute rule -->
      <rect x="320" y="376" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="376" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonEventBridge.svg" x="364" y="388" width="40" height="40"/>
      <text x="384" y="448" class="name" text-anchor="middle">Minute rule</text>

      <!-- Email Lambda -->
      <rect x="544" y="376" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="544" y="376" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AWSLambda.svg" x="588" y="380" width="40" height="40"/>
      <text x="608" y="436" class="name" text-anchor="middle">Email Lambda</text>
      <text x="608" y="452" class="sub" text-anchor="middle">events-pipeline</text>

      <!-- CloudWatch (focal: the source of truth every reader queries) -->
      <rect x="544" y="216" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="544" y="216" width="128" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonCloudWatch.svg" x="588" y="220" width="40" height="40"/>
      <text x="608" y="276" class="name" text-anchor="middle">CloudWatch</text>
      <text x="608" y="292" class="sub" text-anchor="middle">3MRAI namespace</text>

      <!-- OTel collector -->
      <rect x="864" y="216" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="864" y="216" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Server.svg" x="908" y="228" width="40" height="40"/>
      <text x="928" y="288" class="name" text-anchor="middle">OTel collector</text>

      <!-- OpenObserve (store) -->
      <rect x="1104" y="216" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="1104" y="216" width="128" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/gh/selfhst/icons@7e8bfc59dd0f09dab84f53a6be206592a24799b1/svg/openobserve.svg" x="1148" y="220" width="40" height="40"/>
      <text x="1168" y="276" class="name" text-anchor="middle">OpenObserve</text>
      <text x="1168" y="292" class="sub" text-anchor="middle">dashboard cards</text>

      <!-- Steps: badges on their connectors + the numbered caption list -->
      <line x1="32" y1="528" x2="1264" y2="528" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="552" class="eyebrow-svg">STEPS</text>

      <g data-motion-item data-step="1" aria-label="Step 1: the services count their own tables every 60 seconds">
        <circle class="badge" cx="128" cy="180" r="8"/><text class="badge-n" x="128" y="184" text-anchor="middle">1</text>
        <circle class="badge" cx="40" cy="576" r="8"/><text class="badge-n" x="40" y="580" text-anchor="middle">1</text>
        <text class="cap" x="56" y="580">Users, Orders and Tracking count their own tables every 60s: gauges, not counters</text>
      </g>
      <g data-motion-item data-step="2" aria-label="Step 2: the services publish to one 3MRAI namespace with pre-summed ALL series">
        <circle class="badge" cx="352" cy="260" r="8"/><text class="badge-n" x="352" y="264" text-anchor="middle">2</text>
        <circle class="badge" cx="40" cy="608" r="8"/><text class="badge-n" x="40" y="612" text-anchor="middle">2</text>
        <text class="cap" x="56" y="612">One 3MRAI namespace; totals are their own ALL series, as Floci never aggregates</text>
      </g>
      <g data-motion-item data-step="3" aria-label="Step 3: error and business counters are seeded with zero every tick">
        <circle class="badge" cx="400" cy="260" r="8"/><text class="badge-n" x="400" y="264" text-anchor="middle">3</text>
        <circle class="badge" cx="40" cy="640" r="8"/><text class="badge-n" x="40" y="644" text-anchor="middle">3</text>
        <text class="cap" x="56" y="644">Error and business counters get a 0 each tick so a quiet panel reads 0, not an error</text>
      </g>
      <g data-motion-item data-step="4" aria-label="Step 4: an EventBridge rule ticks the email Lambda every minute">
        <circle class="badge" cx="472" cy="420" r="8"/><text class="badge-n" x="472" y="424" text-anchor="middle">4</text>
        <circle class="badge" cx="40" cy="672" r="8"/><text class="badge-n" x="40" y="676" text-anchor="middle">4</text>
        <text class="cap" x="56" y="676">A Lambda has no loop of its own, so an EventBridge rule supplies the clock</text>
      </g>
      <g data-motion-item data-step="5" aria-label="Step 5: the email Lambda publishes its sent and failed counters to CloudWatch">
        <circle class="badge" cx="608" cy="340" r="8"/><text class="badge-n" x="608" y="344" text-anchor="middle">5</text>
        <circle class="badge" cx="664" cy="576" r="8"/><text class="badge-n" x="664" y="580" text-anchor="middle">5</text>
        <text class="cap" x="680" y="580">emails_sent_total and emails_failed_total on each send, seeded at 0 on every tick</text>
      </g>
      <g data-motion-item data-step="6" aria-label="Step 6: the collector queries CloudWatch with exact dimension sets and a 60 second period">
        <circle class="badge" cx="808" cy="260" r="8"/><text class="badge-n" x="808" y="264" text-anchor="middle">6</text>
        <circle class="badge" cx="664" cy="608" r="8"/><text class="badge-n" x="664" y="612" text-anchor="middle">6</text>
        <text class="cap" x="680" y="612">Each query names the exact dimension set; the period matches the publishers' 60s</text>
      </g>
      <g data-motion-item data-step="7" aria-label="Step 7: the collector collapses each metric into one series before batching">
        <circle class="badge" cx="928" cy="180" r="8"/><text class="badge-n" x="928" y="184" text-anchor="middle">7</text>
        <circle class="badge" cx="664" cy="640" r="8"/><text class="badge-n" x="664" y="644" text-anchor="middle">7</text>
        <text class="cap" x="680" y="644">One series per metric instead of one per scrape, applied before batching</text>
      </g>
      <g data-motion-item data-step="8" aria-label="Step 8: the collector exports one OpenObserve stream per metric, read by the dashboard cards">
        <circle class="badge" cx="1024" cy="260" r="8"/><text class="badge-n" x="1024" y="264" text-anchor="middle">8</text>
        <circle class="badge" cx="664" cy="672" r="8"/><text class="badge-n" x="664" y="676" text-anchor="middle">8</text>
        <text class="cap" x="680" y="676">One stream per metric, such as amazonaws_com_3mrai_orders_total,</text>
        <text class="cap" x="680" y="692">read by dashboard cards</text>
      </g>

      <!-- Legend strip -->
      <line x1="32" y1="712" x2="1264" y2="712" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="740" class="eyebrow-svg">LEGEND</text>
      <line x1="104" y1="736" x2="136" y2="736" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bm-arrow)"/>
      <text x="148" y="740" class="lbl">SYNC · API CALL OR IN-PROCESS</text>
      <line x1="328" y1="736" x2="360" y2="736" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#bm-arrow)"/>
      <text x="372" y="740" class="lbl">ASYNC · SCHEDULED EVENT</text>
      <rect x="520" y="728" width="24" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="556" y="740" class="lbl">FOCAL · SOURCE OF TRUTH</text>
      <rect x="704" y="728" width="24" height="16" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="740" y="740" class="lbl">STORE</text>
      <circle class="badge" cx="800" cy="736" r="8"/><text class="badge-n" x="800" y="740" text-anchor="middle">n</text>
      <text x="816" y="740" class="lbl">STEP · SEE CAPTION n</text>

    <div data-motion-controls role="group" aria-label="Diagram playback controls">
      <button type="button" data-motion-action="prev">Previous</button>
      <button type="button" data-motion-action="play" aria-pressed="false">Play</button>

    </div>
    <p class="sr-only" data-motion-status role="status" aria-live="polite" aria-atomic="true"></p>
    <noscript><p>Animation controls require JavaScript. The complete final diagram is shown above.</p></noscript>
  </main>

  <script data-diagram-controls>
    (() => {
      const params = new URLSearchParams(location.search);
      const staticOverride = params.get('motion') === 'static' || document.documentElement.dataset.motion === 'static';
      const requestedStep = params.get('step');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');
      document.fonts.ready.then(() => { document.documentElement.dataset.fontsReady = 'true'; });

      document.querySelectorAll('[data-motion-root]').forEach((root) => {
        const count = Number(root.dataset.stepCount);
        const hold = parseFloat(getComputedStyle(root).getPropertyValue('--motion-hold')) || 720;
        const parsedStep = requestedStep !== null && /^\d+$/.test(requestedStep) ? Number(requestedStep) : null;
        const exactStep = params.get('motion') === 'step' && Number.isSafeInteger(parsedStep) && parsedStep >= 0 && parsedStep <= count ? parsedStep : null;
        const items = [...root.querySelectorAll('[data-motion-item]')];
        const labels = Array.from({ length: count + 1 }, (_, index) => index === 0
          ? 'Ready'
          : items.filter((item) => !item.hasAttribute('data-motion-decorative') && Number(item.dataset.step) === index)
              .map((item) => item.getAttribute('aria-label')).join('; '));
        const controls = root.querySelector('[data-motion-controls]');
        const status = root.querySelector('[data-motion-status]');
        const visibleStep = root.querySelector('[data-motion-step-label]');
        let step = count;
        let timer = 0;
        let playing = false;
        let stepBeforeReduce = 0;
        let resumeAfterReduce = root.dataset.motionMode === 'reveal';

        const buttons = (action) => controls.querySelector(`[data-motion-action="${action}"]`);
        const clearClock = () => { window.clearTimeout(timer); timer = 0; };
        const announce = () => { status.textContent = `Step ${step} of ${count}: ${labels[step] || 'Complete'}`; };
        const setControlsAvailable = (available) => {
          controls.hidden = !available;
          controls.setAttribute('aria-hidden', String(!available));
          controls.dataset.playbackDisabled = String(!available);
          controls.querySelectorAll('button').forEach((control) => { control.disabled = !available; });
        };

        function render(next, userInitiated = false) {
          step = Math.max(0, Math.min(count, next));
          root.dataset.stepCurrent = String(step);
          root.dataset.frame = step === count ? 'end' : step === 0 ? 'start' : 'step';
          items.forEach((item) => {
            const itemStep = Number(item.dataset.step);
            item.classList.toggle('is-visible', itemStep <= step);
            item.classList.toggle('is-current', itemStep === step);
          });
          if (visibleStep) visibleStep.textContent = String(step);
          const unavailable = controls.dataset.playbackDisabled === 'true';
          buttons('prev').disabled = unavailable || step === 0;
          buttons('next').disabled = unavailable || step === count;
          if (userInitiated) announce();
        }

        function pause(userInitiated = false) {
          clearClock();
          playing = false;
          root.classList.remove('is-playing');
          buttons('play').setAttribute('aria-pressed', 'false');
          buttons('pause').setAttribute('aria-pressed', 'true');
          if (userInitiated) status.textContent = `Paused at step ${step} of ${count}`;
        }

        function finish() {
          pause(false);
          root.dataset.frame = 'end';
          status.textContent = `Complete · step ${count} of ${count}`;
        }

        function tick() {
          if (!playing) return;
          if (step >= count) { finish(); return; }
          render(step + 1, false);
          if (step >= count) { finish(); return; }
          timer = window.setTimeout(tick, hold);
        }

        function play(fromStart = false, userInitiated = false) {
          clearClock();
          if (fromStart || step >= count) render(0, userInitiated);
          playing = true;
          root.classList.add('is-playing');
          buttons('play').setAttribute('aria-pressed', 'true');
          buttons('pause').setAttribute('aria-pressed', 'false');
          timer = window.setTimeout(tick, hold);
        }

        controls.addEventListener('click', (event) => {
          const button = event.target.closest('[data-motion-action]');
          if (!button) return;
          const action = button.dataset.motionAction;
          if (action === 'play') play(false, true);
          if (action === 'pause') pause(true);
          if (action === 'replay') play(true, true);
          if (action === 'prev') { pause(false); render(step - 1, true); }
          if (action === 'next') { pause(false); render(step + 1, true); }
        });

        root.addEventListener('keydown', (event) => {
          if (event.target.matches('input, textarea, select, a[href]')) return;
          const keys = { ArrowLeft: step - 1, ArrowRight: step + 1, Home: 0, End: count };
          if (event.code === 'Space' && !event.target.closest('button')) {
            event.preventDefault();
            playing ? pause(true) : play(false, true);
            return;
          }
          if (!event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === 'r') {
            event.preventDefault();
            play(true, true);
            return;
          }
          if (!(event.key in keys)) return;
          event.preventDefault();
          pause(false);
          render(keys[event.key], true);
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden' && playing) pause(false);
        });
        reduce.addEventListener('change', (event) => {
          if (event.matches && root.dataset.motionState !== 'reduced') {
            stepBeforeReduce = step;
            resumeAfterReduce = playing;
          }
          pause(false);
          if (event.matches) {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'reduced';
            status.textContent = 'Reduced motion · complete static frame · playback controls unavailable';
          } else if (staticOverride || root.dataset.motionMode === 'none') {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'static';
            status.textContent = 'Static frame · complete diagram · playback controls unavailable';
          } else {
            delete root.dataset.motionState;
            if (exactStep !== null) {
              setControlsAvailable(false);
              render(exactStep, false);
              root.dataset.frame = 'step';
              root.dataset.motionState = 'test';
              status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
            } else {
              setControlsAvailable(true);
              render(stepBeforeReduce, false);
              status.textContent = `Ready · step ${step} of ${count}`;
              if (resumeAfterReduce && root.dataset.motionMode === 'reveal') {
                play(false, false);
              }
            }
            resumeAfterReduce = false;
          }
        });

        if (staticOverride) {
          document.documentElement.dataset.motion = 'static';
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = 'static';
          status.textContent = 'Static frame · complete diagram · playback controls unavailable';
        } else if (reduce.matches || root.dataset.motionMode === 'none') {
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = reduce.matches ? 'reduced' : 'static';
          status.textContent = reduce.matches
            ? 'Reduced motion · complete static frame · playback controls unavailable'
            : 'Static frame · complete diagram · playback controls unavailable';
        } else if (exactStep !== null) {
          document.documentElement.dataset.motion = 'step';
          pause(false);
          setControlsAvailable(false);
          render(exactStep, false);
          root.dataset.frame = 'step';
          root.dataset.motionState = 'test';
          status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
        } else if (root.dataset.motionMode === 'reveal') {
          setControlsAvailable(true);
          render(0, false);
          play(false, false);
        } else {
          pause(false);
          setControlsAvailable(true);
          render(0, false);
          status.textContent = `Ready · step 0 of ${count}`;
        }
        root.classList.add('motion-ready');
      });
    })();
  </script>
</body>
</html>
