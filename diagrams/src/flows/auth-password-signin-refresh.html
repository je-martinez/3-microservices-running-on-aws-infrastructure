<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password sign-in and token refresh</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-soft: #7a8399;
      --color-accent: #eb6c36;
      --color-rule: rgba(45,49,66,0.12);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --motion-fast: 160ms;
      --motion-step: 480ms;
      --motion-hold: 960ms;
      --motion-total: 7680ms;
      --motion-ease: cubic-bezier(.2,.8,.2,1);
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 32px;
      color: var(--color-ink);
      background: var(--color-paper);
      font-family: var(--font-sans);
    }
    [data-motion-root] { width: min(100%, 1416px); }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 24px; font: 400 32px/1.15 var(--font-serif); }
    svg { display: block; width: 100%; min-width: 720px; }

    /* Static source is complete. Only an initialized enhancement hides items. */
    .motion-ready [data-motion-item] {
      opacity: .12;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
                  transform var(--motion-step) var(--motion-ease);
    }
    .motion-ready [data-motion-item].is-visible,
    .motion-ready[data-frame="end"] [data-motion-item],
    .motion-ready[data-frame="static"] [data-motion-item] {
      opacity: 1;
      transform: none;
    }
    .motion-ready[data-frame="step"] [data-motion-item].is-current .badge { fill: var(--color-accent); }

    [data-motion-controls] {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule);
    }
    .motion-ready [data-motion-controls] { display: flex; }
    [data-motion-controls][hidden] { display: none !important; }
    [data-motion-controls] button {
      min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--color-muted);
      border-radius: 4px;
      color: var(--color-ink);
      background: var(--color-paper);
      font: 600 12px/1 var(--font-sans);
      cursor: pointer;
    }
    [data-motion-controls] button:hover { border-color: var(--color-accent); }
    [data-motion-controls] button:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }
    [data-motion-controls] button:disabled { cursor: not-allowed; opacity: .45; }
    [data-motion-status-visible] {
      margin-left: auto;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    noscript p {
      margin: 12px 0 0;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }

    html[data-motion="static"] [data-motion-controls],
    html[data-motion="static"] [data-motion-decorative] { display: none !important; }
    html[data-motion="static"] [data-motion-item] {
      opacity: 1 !important;
      transform: none !important;
      animation: none !important;
      transition: none !important;
    }
    html[data-motion="step"] [data-motion-controls],
    html[data-motion="step"] [data-motion-decorative] { display: none !important; }
    html[data-motion="step"] [data-motion-item] {
      animation: none !important;
      transition: none !important;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
      [data-motion-item] { opacity: 1 !important; transform: none !important; }
      [data-motion-decorative] { display: none !important; }
      [data-motion-controls] { display: none !important; }
    }
    @media print {
      [data-motion-controls], [data-motion-decorative] { display: none !important; }
      [data-motion-item] {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        transition: none !important;
      }
    }

    .lbl { fill: #7a8399; font: 400 8px var(--font-mono); letter-spacing: .06em; }
    .zone-lbl { fill: rgba(45,49,66,0.55); font: 500 8px var(--font-mono); letter-spacing: .14em; }
    .name { fill: #2d3142; font: 600 12px var(--font-sans); }
    .sub { fill: #4f5d75; font: 400 8px var(--font-mono); letter-spacing: .04em; }
    .badge { fill: #2d3142; }
    .badge-n { fill: #f5f5f5; font: 600 12px var(--font-mono); }
    .cap { fill: #2d3142; font: 400 12px var(--font-sans); }
    .eyebrow-svg { fill: #4f5d75; font: 500 8px var(--font-mono); letter-spacing: .14em; }
  </style>
</head>
<body>
  <main data-motion-root data-motion-mode="step" data-step-count="8" data-step-current="8" data-frame="static" data-static-frame="complete">
    <p class="eyebrow">Users · Flow · Local dev on Floci</p>
    <h1>Password sign-in and token refresh</h1>

    <svg viewBox="0 148 1192 652" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="auth-password-signin-refresh-title auth-password-signin-refresh-desc">
      <title id="auth-password-signin-refresh-title">Password sign-in and token refresh</title>
      <desc id="auth-password-signin-refresh-desc">The web app signs in through a public API Gateway route that proxies to the Users service, which runs Cognito's admin password flow while a pre-token Lambda adds the app claims; protected calls pass the gateway's JWT authorizer, and an expired access token triggers one shared refresh through Users and Cognito before the call is retried.</desc>
      <defs>
        <marker id="apsr-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="apsr-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="apsr-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
      <rect width="1192" height="800" fill="#f5f5f5"/>

      <!-- Zones (painted first) -->
      <rect x="400" y="164" width="760" height="152" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="412" y="168" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="416" y="177" class="zone-lbl">FLOCI :4566</text>

      <rect x="568" y="360" width="192" height="160" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="580" y="364" width="92" height="12" rx="2" fill="#f5f5f5"/>
      <text x="584" y="373" class="zone-lbl">DOCKER COMPOSE</text>

      <!-- Connectors (before nodes); a response reuses its request's edge -->
      <!-- web -> gateway: sign in, refresh, protected calls -->
      <path d="M160,240 H432" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#apsr-arrow-link)"/>
      <!-- gateway -> users: proxy -->
      <path d="M496,284 V436 Q496,444 504,444 H600" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#apsr-arrow)"/>
      <!-- users -> cognito: admin password and refresh flows -->
      <path d="M728,444 H816 Q824,444 824,436 V284" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#apsr-arrow)"/>
      <!-- cognito -> pre-token trigger -->
      <path d="M888,240 H1000" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#apsr-arrow)"/>

      <!-- Arrow labels (masked, 8px off their stroke) -->
      <rect x="168" y="220" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="184" y="229" class="lbl" text-anchor="middle">REST</text>
      <rect x="520" y="424" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="540" y="433" class="lbl" text-anchor="middle">PROXY</text>
      <rect x="832" y="340" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="862" y="349" class="lbl" text-anchor="middle">ADMIN AUTH</text>
      <rect x="896" y="220" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="926" y="229" class="lbl" text-anchor="middle">ADD CLAIMS</text>

      <!-- Nodes -->
      <!-- Web app (input) -->
      <rect x="32" y="196" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="196" width="128" height="88" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Client.svg" x="76" y="208" width="40" height="40"/>
      <text x="96" y="268" class="name" text-anchor="middle">Web app</text>

      <!-- API Gateway -->
      <rect x="432" y="196" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="432" y="196" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonAPIGateway.svg" x="476" y="204" width="40" height="40"/>
      <text x="496" y="260" class="name" text-anchor="middle">API Gateway</text>
      <text x="496" y="276" class="sub" text-anchor="middle">JWT authorizer</text>

      <!-- Users service (focal) -->
      <rect x="600" y="396" width="128" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="396" width="128" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Server.svg" x="644" y="412" width="40" height="40"/>
      <text x="664" y="476" class="name" text-anchor="middle">Users service</text>

      <!-- Cognito -->
      <rect x="760" y="196" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="196" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonCognito.svg" x="804" y="204" width="40" height="40"/>
      <text x="824" y="260" class="name" text-anchor="middle">Cognito</text>
      <text x="824" y="276" class="sub" text-anchor="middle">user pool</text>

      <!-- Pre-token trigger (Lambda) -->
      <rect x="1000" y="196" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="1000" y="196" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AWSLambda.svg" x="1044" y="208" width="40" height="40"/>
      <text x="1064" y="268" class="name" text-anchor="middle">Pre-token trigger</text>

      <!-- Steps: badges on their connectors + the numbered caption list -->
      <line x1="32" y1="552" x2="1160" y2="552" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="576" class="eyebrow-svg">STEPS</text>

      <g data-motion-item data-step="1" aria-label="Step 1: email and password reach Users through a public route">
        <circle class="badge" cx="216" cy="240" r="8"/><text class="badge-n" x="216" y="244" text-anchor="middle">1</text>
        <circle class="badge" cx="496" cy="328" r="8"/><text class="badge-n" x="496" y="332" text-anchor="middle">1</text>
        <circle class="badge" cx="40" cy="600" r="8"/><text class="badge-n" x="40" y="604" text-anchor="middle">1</text>
        <text class="cap" x="56" y="604">Email and password take a public route, with no authorizer, and reach Users</text>
      </g>
      <g data-motion-item data-step="2" aria-label="Step 2: Users checks the credentials with Cognito">
        <circle class="badge" cx="780" cy="444" r="8"/><text class="badge-n" x="780" y="448" text-anchor="middle">2</text>
        <circle class="badge" cx="40" cy="632" r="8"/><text class="badge-n" x="40" y="636" text-anchor="middle">2</text>
        <text class="cap" x="56" y="636">Users checks the credentials with Cognito's admin password flow</text>
      </g>
      <g data-motion-item data-step="3" aria-label="Step 3: the pre-token trigger adds the app claims to both tokens">
        <circle class="badge" cx="976" cy="240" r="8"/><text class="badge-n" x="976" y="244" text-anchor="middle">3</text>
        <circle class="badge" cx="40" cy="664" r="8"/><text class="badge-n" x="40" y="668" text-anchor="middle">3</text>
        <text class="cap" x="56" y="668">The trigger copies the app user id and forced-change flag into both tokens</text>
      </g>
      <g data-motion-item data-step="4" aria-label="Step 4: Users returns the three tokens and the web app stores them">
        <circle class="badge" cx="496" cy="360" r="8"/><text class="badge-n" x="496" y="364" text-anchor="middle">4</text>
        <circle class="badge" cx="244" cy="240" r="8"/><text class="badge-n" x="244" y="244" text-anchor="middle">4</text>
        <circle class="badge" cx="40" cy="696" r="8"/><text class="badge-n" x="40" y="700" text-anchor="middle">4</text>
        <text class="cap" x="56" y="700">Users returns id, access and refresh tokens; the web app stores them</text>
      </g>
      <g data-motion-item data-step="5" aria-label="Step 5: a protected call carries the access token to the JWT authorizer">
        <circle class="badge" cx="272" cy="240" r="8"/><text class="badge-n" x="272" y="244" text-anchor="middle">5</text>
        <circle class="badge" cx="600" cy="600" r="8"/><text class="badge-n" x="600" y="604" text-anchor="middle">5</text>
        <text class="cap" x="616" y="604">A protected call carries the access token to the JWT authorizer</text>
      </g>
      <g data-motion-item data-step="6" aria-label="Step 6: the authorizer rejects an expired access token">
        <circle class="badge" cx="300" cy="240" r="8"/><text class="badge-n" x="300" y="244" text-anchor="middle">6</text>
        <circle class="badge" cx="600" cy="632" r="8"/><text class="badge-n" x="600" y="636" text-anchor="middle">6</text>
        <text class="cap" x="616" y="636">The authorizer rejects an expired access token before any service sees it</text>
      </g>
      <g data-motion-item data-step="7" aria-label="Step 7: one shared refresh per burst takes the refresh token to Users">
        <circle class="badge" cx="328" cy="240" r="8"/><text class="badge-n" x="328" y="244" text-anchor="middle">7</text>
        <circle class="badge" cx="496" cy="392" r="8"/><text class="badge-n" x="496" y="396" text-anchor="middle">7</text>
        <circle class="badge" cx="600" cy="664" r="8"/><text class="badge-n" x="600" y="668" text-anchor="middle">7</text>
        <text class="cap" x="616" y="668">One refresh per burst sends the stored refresh token, by a public route, to Users</text>
      </g>
      <g data-motion-item data-step="8" aria-label="Step 8: Cognito mints new id and access tokens and the call is retried">
        <circle class="badge" cx="824" cy="400" r="8"/><text class="badge-n" x="824" y="404" text-anchor="middle">8</text>
        <circle class="badge" cx="600" cy="696" r="8"/><text class="badge-n" x="600" y="700" text-anchor="middle">8</text>
        <text class="cap" x="616" y="700">New id and access tokens; the refresh token is kept and the call retried</text>
      </g>

      <!-- Legend strip -->
      <line x1="32" y1="736" x2="1160" y2="736" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="768" class="eyebrow-svg">LEGEND</text>
      <line x1="104" y1="764" x2="136" y2="764" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#apsr-arrow)"/>
      <text x="148" y="768" class="lbl">SYNC CALL</text>
      <line x1="236" y1="764" x2="268" y2="764" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#apsr-arrow-link)"/>
      <text x="280" y="768" class="lbl">HTTP FROM THE BROWSER</text>
      <rect x="424" y="756" width="24" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="460" y="768" class="lbl">FOCAL SERVICE</text>
      <circle class="badge" cx="576" cy="764" r="8"/><text class="badge-n" x="576" y="768" text-anchor="middle">n</text>
      <text x="592" y="768" class="lbl">STEP · SEE CAPTION n</text>
      <text x="732" y="768" class="lbl">A RESPONSE RETURNS ON ITS REQUEST'S EDGE</text>
    </svg>

    <div data-motion-controls role="group" aria-label="Diagram playback controls">
      <button type="button" data-motion-action="prev">Previous</button>
      <button type="button" data-motion-action="play" aria-pressed="false">Play</button>
      <button type="button" data-motion-action="pause" aria-pressed="true">Pause</button>
      <button type="button" data-motion-action="next">Next</button>
      <button type="button" data-motion-action="replay">Replay</button>
      <span class="keyboard-help">←/→ step · Space play/pause · R replay · Home/End jump</span>
      <span data-motion-status-visible aria-hidden="true">Step <span data-motion-step-label>8</span> of 8</span>
    </div>
    <p class="sr-only" data-motion-status role="status" aria-live="polite" aria-atomic="true"></p>
    <noscript><p>Animation controls require JavaScript. The complete final diagram is shown above.</p></noscript>
  </main>

  <script data-diagram-controls>
    (() => {
      const params = new URLSearchParams(location.search);
      const staticOverride = params.get('motion') === 'static' || document.documentElement.dataset.motion === 'static';
      const requestedStep = params.get('step');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');
      document.fonts.ready.then(() => { document.documentElement.dataset.fontsReady = 'true'; });

      document.querySelectorAll('[data-motion-root]').forEach((root) => {
        const count = Number(root.dataset.stepCount);
        const hold = parseFloat(getComputedStyle(root).getPropertyValue('--motion-hold')) || 720;
        const parsedStep = requestedStep !== null && /^\d+$/.test(requestedStep) ? Number(requestedStep) : null;
        const exactStep = params.get('motion') === 'step' && Number.isSafeInteger(parsedStep) && parsedStep >= 0 && parsedStep <= count ? parsedStep : null;
        const items = [...root.querySelectorAll('[data-motion-item]')];
        const labels = Array.from({ length: count + 1 }, (_, index) => index === 0
          ? 'Ready'
          : items.filter((item) => !item.hasAttribute('data-motion-decorative') && Number(item.dataset.step) === index)
              .map((item) => item.getAttribute('aria-label')).join('; '));
        const controls = root.querySelector('[data-motion-controls]');
        const status = root.querySelector('[data-motion-status]');
        const visibleStep = root.querySelector('[data-motion-step-label]');
        let step = count;
        let timer = 0;
        let playing = false;
        let stepBeforeReduce = 0;
        let resumeAfterReduce = root.dataset.motionMode === 'reveal';

        const buttons = (action) => controls.querySelector(`[data-motion-action="${action}"]`);
        const clearClock = () => { window.clearTimeout(timer); timer = 0; };
        const announce = () => { status.textContent = `Step ${step} of ${count}: ${labels[step] || 'Complete'}`; };
        const setControlsAvailable = (available) => {
          controls.hidden = !available;
          controls.setAttribute('aria-hidden', String(!available));
          controls.dataset.playbackDisabled = String(!available);
          controls.querySelectorAll('button').forEach((control) => { control.disabled = !available; });
        };

        function render(next, userInitiated = false) {
          step = Math.max(0, Math.min(count, next));
          root.dataset.stepCurrent = String(step);
          root.dataset.frame = step === count ? 'end' : step === 0 ? 'start' : 'step';
          items.forEach((item) => {
            const itemStep = Number(item.dataset.step);
            item.classList.toggle('is-visible', itemStep <= step);
            item.classList.toggle('is-current', itemStep === step);
          });
          if (visibleStep) visibleStep.textContent = String(step);
          const unavailable = controls.dataset.playbackDisabled === 'true';
          buttons('prev').disabled = unavailable || step === 0;
          buttons('next').disabled = unavailable || step === count;
          if (userInitiated) announce();
        }

        function pause(userInitiated = false) {
          clearClock();
          playing = false;
          root.classList.remove('is-playing');
          buttons('play').setAttribute('aria-pressed', 'false');
          buttons('pause').setAttribute('aria-pressed', 'true');
          if (userInitiated) status.textContent = `Paused at step ${step} of ${count}`;
        }

        function finish() {
          pause(false);
          root.dataset.frame = 'end';
          status.textContent = `Complete · step ${count} of ${count}`;
        }

        function tick() {
          if (!playing) return;
          if (step >= count) { finish(); return; }
          render(step + 1, false);
          if (step >= count) { finish(); return; }
          timer = window.setTimeout(tick, hold);
        }

        function play(fromStart = false, userInitiated = false) {
          clearClock();
          if (fromStart || step >= count) render(0, userInitiated);
          playing = true;
          root.classList.add('is-playing');
          buttons('play').setAttribute('aria-pressed', 'true');
          buttons('pause').setAttribute('aria-pressed', 'false');
          timer = window.setTimeout(tick, hold);
        }

        controls.addEventListener('click', (event) => {
          const button = event.target.closest('[data-motion-action]');
          if (!button) return;
          const action = button.dataset.motionAction;
          if (action === 'play') play(false, true);
          if (action === 'pause') pause(true);
          if (action === 'replay') play(true, true);
          if (action === 'prev') { pause(false); render(step - 1, true); }
          if (action === 'next') { pause(false); render(step + 1, true); }
        });

        root.addEventListener('keydown', (event) => {
          if (event.target.matches('input, textarea, select, a[href]')) return;
          const keys = { ArrowLeft: step - 1, ArrowRight: step + 1, Home: 0, End: count };
          if (event.code === 'Space' && !event.target.closest('button')) {
            event.preventDefault();
            playing ? pause(true) : play(false, true);
            return;
          }
          if (!event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === 'r') {
            event.preventDefault();
            play(true, true);
            return;
          }
          if (!(event.key in keys)) return;
          event.preventDefault();
          pause(false);
          render(keys[event.key], true);
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden' && playing) pause(false);
        });
        reduce.addEventListener('change', (event) => {
          if (event.matches && root.dataset.motionState !== 'reduced') {
            stepBeforeReduce = step;
            resumeAfterReduce = playing;
          }
          pause(false);
          if (event.matches) {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'reduced';
            status.textContent = 'Reduced motion · complete static frame · playback controls unavailable';
          } else if (staticOverride || root.dataset.motionMode === 'none') {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'static';
            status.textContent = 'Static frame · complete diagram · playback controls unavailable';
          } else {
            delete root.dataset.motionState;
            if (exactStep !== null) {
              setControlsAvailable(false);
              render(exactStep, false);
              root.dataset.frame = 'step';
              root.dataset.motionState = 'test';
              status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
            } else {
              setControlsAvailable(true);
              render(stepBeforeReduce, false);
              status.textContent = `Ready · step ${step} of ${count}`;
              if (resumeAfterReduce && root.dataset.motionMode === 'reveal') {
                play(false, false);
              }
            }
            resumeAfterReduce = false;
          }
        });

        if (staticOverride) {
          document.documentElement.dataset.motion = 'static';
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = 'static';
          status.textContent = 'Static frame · complete diagram · playback controls unavailable';
        } else if (reduce.matches || root.dataset.motionMode === 'none') {
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = reduce.matches ? 'reduced' : 'static';
          status.textContent = reduce.matches
            ? 'Reduced motion · complete static frame · playback controls unavailable'
            : 'Static frame · complete diagram · playback controls unavailable';
        } else if (exactStep !== null) {
          document.documentElement.dataset.motion = 'step';
          pause(false);
          setControlsAvailable(false);
          render(exactStep, false);
          root.dataset.frame = 'step';
          root.dataset.motionState = 'test';
          status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
        } else if (root.dataset.motionMode === 'reveal') {
          setControlsAvailable(true);
          render(0, false);
          play(false, false);
        } else {
          pause(false);
          setControlsAvailable(true);
          render(0, false);
          status.textContent = `Ready · step 0 of ${count}`;
        }
        root.classList.add('motion-ready');
      });
    })();
  </script>
</body>
</html>
