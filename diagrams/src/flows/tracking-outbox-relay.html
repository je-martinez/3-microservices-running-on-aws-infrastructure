<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracking transactional outbox relay</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-soft: #7a8399;
      --color-accent: #eb6c36;
      --color-rule: rgba(45,49,66,0.12);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --motion-fast: 160ms;
      --motion-step: 480ms;
      --motion-hold: 960ms;
      --motion-total: 7680ms;
      --motion-ease: cubic-bezier(.2,.8,.2,1);
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 32px;
      color: var(--color-ink);
      background: var(--color-paper);
      font-family: var(--font-sans);
    }
    [data-motion-root] { width: min(100%, 1408px); }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 24px; font: 400 32px/1.15 var(--font-serif); }
    svg { display: block; width: 100%; min-width: 720px; }

    /* Static source is complete. Only an initialized enhancement hides items. */
    .motion-ready [data-motion-item] {
      opacity: .12;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
                  transform var(--motion-step) var(--motion-ease);
    }
    .motion-ready [data-motion-item].is-visible,
    .motion-ready[data-frame="end"] [data-motion-item],
    .motion-ready[data-frame="static"] [data-motion-item] {
      opacity: 1;
      transform: none;
    }
    .motion-ready[data-frame="step"] [data-motion-item].is-current .badge { fill: var(--color-accent); }

    [data-motion-controls] {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule);
    }
    .motion-ready [data-motion-controls] { display: flex; }
    [data-motion-controls][hidden] { display: none !important; }
    [data-motion-controls] button {
      min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--color-muted);
      border-radius: 4px;
      color: var(--color-ink);
      background: var(--color-paper);
      font: 600 12px/1 var(--font-sans);
      cursor: pointer;
    }
    [data-motion-controls] button:hover { border-color: var(--color-accent); }
    [data-motion-controls] button:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }
    [data-motion-controls] button:disabled { cursor: not-allowed; opacity: .45; }
    [data-motion-status-visible] {
      margin-left: auto;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    noscript p {
      margin: 12px 0 0;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }

    html[data-motion="static"] [data-motion-controls],
    html[data-motion="static"] [data-motion-decorative] { display: none !important; }
    html[data-motion="static"] [data-motion-item] {
      opacity: 1 !important;
      transform: none !important;
      animation: none !important;
      transition: none !important;
    }
    html[data-motion="step"] [data-motion-controls],
    html[data-motion="step"] [data-motion-decorative] { display: none !important; }
    html[data-motion="step"] [data-motion-item] {
      animation: none !important;
      transition: none !important;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
      [data-motion-item] { opacity: 1 !important; transform: none !important; }
      [data-motion-decorative] { display: none !important; }
      [data-motion-controls] { display: none !important; }
    }
    @media print {
      [data-motion-controls], [data-motion-decorative] { display: none !important; }
      [data-motion-item] {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        transition: none !important;
      }
    }

    .lbl { fill: #7a8399; font: 400 8px var(--font-mono); letter-spacing: .06em; }
    .zone-lbl { fill: rgba(45,49,66,0.55); font: 500 8px var(--font-mono); letter-spacing: .14em; }
    .name { fill: #2d3142; font: 600 12px var(--font-sans); }
    .sub { fill: #4f5d75; font: 400 8px var(--font-mono); letter-spacing: .04em; }
    .badge { fill: #2d3142; }
    .badge-n { fill: #f5f5f5; font: 600 12px var(--font-mono); }
    .cap { fill: #2d3142; font: 400 12px var(--font-sans); }
    .eyebrow-svg { fill: #4f5d75; font: 500 8px var(--font-mono); letter-spacing: .14em; }
  </style>
</head>
<body>
  <main data-motion-root data-motion-mode="step" data-step-count="8" data-step-current="8" data-frame="static" data-static-frame="complete">
    <p class="eyebrow">Tracking · Flow · Local dev on Floci</p>
    <h1>Tracking transactional outbox relay</h1>


    <svg viewBox="0 80 1408 704" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tracking-outbox-relay-title tracking-outbox-relay-desc">
      <title id="tracking-outbox-relay-title">Tracking transactional outbox relay</title>
      <desc id="tracking-outbox-relay-desc">A carrier status update commits the tracking status, its history row and an outbox message in one MySQL transaction; an in-process poller claims due outbox rows, publishes TRACKING_STATUS_CHANGED to the SNS events topic, deletes delivered rows, retries failures with backoff and discards rows past the attempt limit, while SNS fans the event out to the SQS events queue and the events-pipeline Lambda.</desc>
      <defs>
        <marker id="tor-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="tor-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="tor-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
      <rect y="80" width="1408" height="704" fill="#f5f5f5"/>

      <!-- Zones (painted first) -->
      <rect x="240" y="92" width="232" height="416" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="252" y="96" width="92" height="12" rx="2" fill="#f5f5f5"/>
      <text x="256" y="105" class="zone-lbl">DOCKER COMPOSE</text>

      <rect x="592" y="112" width="272" height="152" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="604" y="116" width="228" height="12" rx="2" fill="#f5f5f5"/>
      <text x="608" y="125" class="zone-lbl">FLOCI · VPC 10.0.0.0/16 · SUBNETS A+B</text>

      <rect x="736" y="360" width="640" height="148" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="748" y="364" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="752" y="373" class="zone-lbl">FLOCI :4566 · EVENTS</text>

      <!-- poller -> db: claim / settle -->

      <!-- poller -> poller: discard -->
      <path d="M332,460 V480 Q332,488 340,488 H372 Q380,488 380,480 V460" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tor-arrow)"/>
      <!-- poller -> topic: publish (focal, async) -->
      <path d="M420,432 H768" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#tor-arrow-accent)"/>
      <!-- topic -> queue -> pipeline (async) -->
      <path d="M896,432 H992" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#tor-arrow)"/>
      <path d="M1120,432 H1216" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#tor-arrow)"/>

      <!-- Arrow labels (masked, off their stroke) -->
      <rect x="168" y="176" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="208" y="185" class="lbl" text-anchor="middle">STATUS UPDATE</text>
      <rect x="388" y="120" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="422" y="129" class="lbl" text-anchor="middle">BUS PIPELINE</text>
      <rect x="488" y="176" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="526" y="185" class="lbl" text-anchor="middle">COMMIT+OUTBOX</text>
      <rect x="712" y="312" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="752" y="321" class="lbl" text-anchor="middle">CLAIM / SETTLE</text>
      <rect x="388" y="468" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="410" y="477" class="lbl" text-anchor="middle">DISCARD</text>
      <rect x="620" y="412" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="644" y="421" class="lbl" text-anchor="middle">PUBLISH</text>
      <rect x="908" y="412" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="944" y="421" class="lbl" text-anchor="middle">RAW DELIVERY</text>
      <rect x="1148" y="412" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1168" y="421" class="lbl" text-anchor="middle">BATCH</text>

      <!-- Nodes -->
      <!-- Carrier (external) -->
      <rect x="32" y="152" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="152" width="128" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Internet.svg" x="76" y="164" width="40" height="40"/>
      <text x="96" y="224" class="name" text-anchor="middle">Carrier</text>

      <!-- Tracking API -->
      <rect x="292" y="152" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="292" y="152" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Server.svg" x="336" y="164" width="40" height="40"/>
      <text x="356" y="224" class="name" text-anchor="middle">Tracking API</text>

      <!-- Outbox poller (focal) -->
      <rect x="292" y="372" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="292" y="372" width="128" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Server.svg" x="336" y="380" width="40" height="40"/>
      <text x="356" y="436" class="name" text-anchor="middle">Outbox poller</text>
      <text x="356" y="452" class="sub" text-anchor="middle">in-process</text>

      <!-- Tracking DB (store) -->
      <rect x="640" y="152" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="152" width="128" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonRDS.svg" x="684" y="160" width="40" height="40"/>
      <text x="704" y="216" class="name" text-anchor="middle">Tracking DB</text>
      <text x="704" y="232" class="sub" text-anchor="middle">RDS MySQL</text>

      <!-- Events topic (SNS) -->
      <rect x="768" y="388" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="768" y="388" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonSimpleNotificationService.svg" x="812" y="400" width="40" height="40"/>
      <text x="832" y="460" class="name" text-anchor="middle">Events topic</text>

      <!-- Events queue (SQS) -->
      <rect x="992" y="388" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="992" y="388" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonSimpleQueueService.svg" x="1036" y="400" width="40" height="40"/>
      <text x="1056" y="460" class="name" text-anchor="middle">Events queue</text>

      <!-- Events pipeline (Lambda) -->
      <rect x="1216" y="388" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="1216" y="388" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AWSLambda.svg" x="1260" y="400" width="40" height="40"/>
      <text x="1280" y="460" class="name" text-anchor="middle">Events pipeline</text>

      <!-- Steps: badges on their connectors + the numbered caption list -->
      <line x1="32" y1="532" x2="1376" y2="532" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="556" class="eyebrow-svg">STEPS</text>

      <g data-motion-item data-step="1" aria-label="Step 1: the carrier sends a status update to the Tracking API">
        <circle class="badge" cx="268" cy="196" r="8"/><text class="badge-n" x="268" y="200" text-anchor="middle">1</text>
        <circle class="badge" cx="40" cy="580" r="8"/><text class="badge-n" x="40" y="584" text-anchor="middle">1</text>
        <text class="cap" x="56" y="584">The carrier webhook, or a TestMode progression, dispatches the update-status command</text>
      </g>
      <g data-motion-item data-step="2" aria-label="Step 2: the bus pipeline wraps the handler">
        <circle class="badge" cx="356" cy="124" r="8"/><text class="badge-n" x="356" y="128" text-anchor="middle">2</text>
        <circle class="badge" cx="40" cy="612" r="8"/><text class="badge-n" x="40" y="616" text-anchor="middle">2</text>
        <text class="cap" x="56" y="616">Tracing, app_event, logging and validation wrap the handler, outermost first</text>
      </g>
      <g data-motion-item data-step="3" aria-label="Step 3: status, history and outbox message commit in one transaction">
        <circle class="badge" cx="600" cy="196" r="8"/><text class="badge-n" x="600" y="200" text-anchor="middle">3</text>
        <circle class="badge" cx="40" cy="644" r="8"/><text class="badge-n" x="40" y="648" text-anchor="middle">3</text>
        <text class="cap" x="56" y="648">Status, history row and outbox message are written in one MySQL transaction</text>
      </g>
      <g data-motion-item data-step="4" aria-label="Step 4: the poller claims due outbox rows">
        <circle class="badge" cx="464" cy="400" r="8"/><text class="badge-n" x="464" y="404" text-anchor="middle">4</text>
        <circle class="badge" cx="40" cy="676" r="8"/><text class="badge-n" x="40" y="680" text-anchor="middle">4</text>
        <text class="cap" x="56" y="680">Every 5 s each task claims up to 20 due rows with FOR UPDATE SKIP LOCKED</text>
      </g>
      <g data-motion-item data-step="5" aria-label="Step 5: the poller publishes TRACKING_STATUS_CHANGED to the events topic">
        <circle class="badge" cx="520" cy="432" r="8"/><text class="badge-n" x="520" y="436" text-anchor="middle">5</text>
        <circle class="badge" cx="712" cy="580" r="8"/><text class="badge-n" x="712" y="584" text-anchor="middle">5</text>
        <text class="cap" x="728" y="584">The stored payload becomes TRACKING_STATUS_CHANGED, its traceparent restored</text>
      </g>
      <g data-motion-item data-step="6" aria-label="Step 6: the poller settles each row, deleting delivered rows and backing off failures">
        <circle class="badge" cx="576" cy="400" r="8"/><text class="badge-n" x="576" y="404" text-anchor="middle">6</text>
        <circle class="badge" cx="712" cy="612" r="8"/><text class="badge-n" x="712" y="616" text-anchor="middle">6</text>
        <text class="cap" x="728" y="616">Delivered rows are deleted; a failed publish keeps the row, bumps its attempts and</text>
        <text class="cap" x="728" y="632">backs off up to 5 minutes; the commit after publishing releases the row locks</text>
      </g>
      <g data-motion-item data-step="7" aria-label="Step 7: a row at the attempt limit is discarded">
        <circle class="badge" cx="356" cy="488" r="8"/><text class="badge-n" x="356" y="492" text-anchor="middle">7</text>
        <circle class="badge" cx="712" cy="660" r="8"/><text class="badge-n" x="712" y="664" text-anchor="middle">7</text>
        <text class="cap" x="728" y="664">A row at 12 attempts is deleted and logged at ERROR with its order id</text>
      </g>
      <g data-motion-item data-step="8" aria-label="Step 8: the topic fans the event out to the queue and the events pipeline">
        <circle class="badge" cx="944" cy="432" r="8"/><text class="badge-n" x="944" y="436" text-anchor="middle">8</text>
        <circle class="badge" cx="1168" cy="432" r="8"/><text class="badge-n" x="1168" y="436" text-anchor="middle">8</text>
        <circle class="badge" cx="712" cy="692" r="8"/><text class="badge-n" x="712" y="696" text-anchor="middle">8</text>
        <text class="cap" x="728" y="696">The topic fans the event out to the events queue, body unchanged; at-least-once:</text>
        <text class="cap" x="728" y="712">the pipeline dedupes a re-publish on its event_id</text>
      </g>

      <!-- Legend strip -->
      <line x1="32" y1="736" x2="1376" y2="736" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="764" class="eyebrow-svg">LEGEND</text>
      <line x1="104" y1="760" x2="136" y2="760" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tor-arrow)"/>
      <text x="148" y="764" class="lbl">SYNC CALL</text>
      <line x1="236" y1="760" x2="268" y2="760" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#tor-arrow)"/>
      <text x="280" y="764" class="lbl">ASYNC · WEBHOOK, TOPIC, QUEUE</text>
      <line x1="464" y1="760" x2="496" y2="760" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#tor-arrow-accent)"/>
      <text x="508" y="764" class="lbl">THE OUTBOX RELAY</text>
      <rect x="628" y="752" width="24" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="664" y="764" class="lbl">FOCAL · OUTBOX POLLER</text>
      <circle class="badge" cx="816" cy="760" r="8"/><text class="badge-n" x="816" y="764" text-anchor="middle">n</text>
      <text x="832" y="764" class="lbl">STEP · SEE CAPTION n</text>
    </svg>


    <div data-motion-controls role="group" aria-label="Diagram playback controls">
      <button type="button" data-motion-action="prev">Previous</button>
      <button type="button" data-motion-action="play" aria-pressed="false">Play</button>

    <p class="sr-only" data-motion-status role="status" aria-live="polite" aria-atomic="true"></p>
    <noscript><p>Animation controls require JavaScript. The complete final diagram is shown above.</p></noscript>
  </main>

  <script data-diagram-controls>
    (() => {
      const params = new URLSearchParams(location.search);
      const staticOverride = params.get('motion') === 'static' || document.documentElement.dataset.motion === 'static';
      const requestedStep = params.get('step');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');
      document.fonts.ready.then(() => { document.documentElement.dataset.fontsReady = 'true'; });

      document.querySelectorAll('[data-motion-root]').forEach((root) => {
        const count = Number(root.dataset.stepCount);
        const hold = parseFloat(getComputedStyle(root).getPropertyValue('--motion-hold')) || 720;
        const parsedStep = requestedStep !== null && /^\d+$/.test(requestedStep) ? Number(requestedStep) : null;
        const exactStep = params.get('motion') === 'step' && Number.isSafeInteger(parsedStep) && parsedStep >= 0 && parsedStep <= count ? parsedStep : null;
        const items = [...root.querySelectorAll('[data-motion-item]')];
        const labels = Array.from({ length: count + 1 }, (_, index) => index === 0
          ? 'Ready'
          : items.filter((item) => !item.hasAttribute('data-motion-decorative') && Number(item.dataset.step) === index)
              .map((item) => item.getAttribute('aria-label')).join('; '));
        const controls = root.querySelector('[data-motion-controls]');
        const status = root.querySelector('[data-motion-status]');
        const visibleStep = root.querySelector('[data-motion-step-label]');
        let step = count;
        let timer = 0;
        let playing = false;
        let stepBeforeReduce = 0;
        let resumeAfterReduce = root.dataset.motionMode === 'reveal';

        const buttons = (action) => controls.querySelector(`[data-motion-action="${action}"]`);
        const clearClock = () => { window.clearTimeout(timer); timer = 0; };
        const announce = () => { status.textContent = `Step ${step} of ${count}: ${labels[step] || 'Complete'}`; };
        const setControlsAvailable = (available) => {
          controls.hidden = !available;
          controls.setAttribute('aria-hidden', String(!available));
          controls.dataset.playbackDisabled = String(!available);
          controls.querySelectorAll('button').forEach((control) => { control.disabled = !available; });
        };

        function render(next, userInitiated = false) {
          step = Math.max(0, Math.min(count, next));
          root.dataset.stepCurrent = String(step);
          root.dataset.frame = step === count ? 'end' : step === 0 ? 'start' : 'step';
          items.forEach((item) => {
            const itemStep = Number(item.dataset.step);
            item.classList.toggle('is-visible', itemStep <= step);
            item.classList.toggle('is-current', itemStep === step);
          });
          if (visibleStep) visibleStep.textContent = String(step);
          const unavailable = controls.dataset.playbackDisabled === 'true';
          buttons('prev').disabled = unavailable || step === 0;
          buttons('next').disabled = unavailable || step === count;
          if (userInitiated) announce();
        }

        function pause(userInitiated = false) {
          clearClock();
          playing = false;
          root.classList.remove('is-playing');
          buttons('play').setAttribute('aria-pressed', 'false');
          buttons('pause').setAttribute('aria-pressed', 'true');
          if (userInitiated) status.textContent = `Paused at step ${step} of ${count}`;
        }

        function finish() {
          pause(false);
          root.dataset.frame = 'end';
          status.textContent = `Complete · step ${count} of ${count}`;
        }

        function tick() {
          if (!playing) return;
          if (step >= count) { finish(); return; }
          render(step + 1, false);
          if (step >= count) { finish(); return; }
          timer = window.setTimeout(tick, hold);
        }

        function play(fromStart = false, userInitiated = false) {
          clearClock();
          if (fromStart || step >= count) render(0, userInitiated);
          playing = true;
          root.classList.add('is-playing');
          buttons('play').setAttribute('aria-pressed', 'true');
          buttons('pause').setAttribute('aria-pressed', 'false');
          timer = window.setTimeout(tick, hold);
        }

        controls.addEventListener('click', (event) => {
          const button = event.target.closest('[data-motion-action]');
          if (!button) return;
          const action = button.dataset.motionAction;
          if (action === 'play') play(false, true);
          if (action === 'pause') pause(true);
          if (action === 'replay') play(true, true);
          if (action === 'prev') { pause(false); render(step - 1, true); }
          if (action === 'next') { pause(false); render(step + 1, true); }
        });

        root.addEventListener('keydown', (event) => {
          if (event.target.matches('input, textarea, select, a[href]')) return;
          const keys = { ArrowLeft: step - 1, ArrowRight: step + 1, Home: 0, End: count };
          if (event.code === 'Space' && !event.target.closest('button')) {
            event.preventDefault();
            playing ? pause(true) : play(false, true);
            return;
          }
          if (!event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === 'r') {
            event.preventDefault();
            play(true, true);
            return;
          }
          if (!(event.key in keys)) return;
          event.preventDefault();
          pause(false);
          render(keys[event.key], true);
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden' && playing) pause(false);
        });
        reduce.addEventListener('change', (event) => {
          if (event.matches && root.dataset.motionState !== 'reduced') {
            stepBeforeReduce = step;
            resumeAfterReduce = playing;
          }
          pause(false);
          if (event.matches) {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'reduced';
            status.textContent = 'Reduced motion · complete static frame · playback controls unavailable';
          } else if (staticOverride || root.dataset.motionMode === 'none') {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'static';
            status.textContent = 'Static frame · complete diagram · playback controls unavailable';
          } else {
            delete root.dataset.motionState;
            if (exactStep !== null) {
              setControlsAvailable(false);
              render(exactStep, false);
              root.dataset.frame = 'step';
              root.dataset.motionState = 'test';
              status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
            } else {
              setControlsAvailable(true);
              render(stepBeforeReduce, false);
              status.textContent = `Ready · step ${step} of ${count}`;
              if (resumeAfterReduce && root.dataset.motionMode === 'reveal') {
                play(false, false);
              }
            }
            resumeAfterReduce = false;
          }
        });

        if (staticOverride) {
          document.documentElement.dataset.motion = 'static';
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = 'static';
          status.textContent = 'Static frame · complete diagram · playback controls unavailable';
        } else if (reduce.matches || root.dataset.motionMode === 'none') {
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = reduce.matches ? 'reduced' : 'static';
          status.textContent = reduce.matches
            ? 'Reduced motion · complete static frame · playback controls unavailable'
            : 'Static frame · complete diagram · playback controls unavailable';
        } else if (exactStep !== null) {
          document.documentElement.dataset.motion = 'step';
          pause(false);
          setControlsAvailable(false);
          render(exactStep, false);
          root.dataset.frame = 'step';
          root.dataset.motionState = 'test';
          status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
        } else if (root.dataset.motionMode === 'reveal') {
          setControlsAvailable(true);
          render(0, false);
          play(false, false);
        } else {
          pause(false);
          setControlsAvailable(true);
          render(0, false);
          status.textContent = `Ready · step 0 of ${count}`;
        }
        root.classList.add('motion-ready');
      });
    })();
  </script>
</body>
</html>
