<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account deletion cascade</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-soft: #7a8399;
      --color-accent: #eb6c36;
      --color-rule: rgba(45,49,66,0.12);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --motion-fast: 160ms;
      --motion-step: 480ms;
      --motion-hold: 960ms;
      --motion-total: 7680ms;
      --motion-ease: cubic-bezier(.2,.8,.2,1);
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 32px;
      color: var(--color-ink);
      background: var(--color-paper);
      font-family: var(--font-sans);
    }
    [data-motion-root] { width: min(100%, 1080px); }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 24px; font: 400 32px/1.15 var(--font-serif); }
    svg { display: block; width: 100%; min-width: 720px; }

    /* Static source is complete. Only an initialized enhancement hides items. */
    .motion-ready [data-motion-item] {
      opacity: .12;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
                  transform var(--motion-step) var(--motion-ease);
    }
    .motion-ready [data-motion-item].is-visible,
    .motion-ready[data-frame="end"] [data-motion-item],
    .motion-ready[data-frame="static"] [data-motion-item] {
      opacity: 1;
      transform: none;
    }
    .motion-ready[data-frame="step"] [data-motion-item].is-current .badge { fill: var(--color-accent); }

    [data-motion-controls] {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule);
    }
    .motion-ready [data-motion-controls] { display: flex; }
    [data-motion-controls][hidden] { display: none !important; }
    [data-motion-controls] button {
      min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--color-muted);
      border-radius: 4px;
      color: var(--color-ink);
      background: var(--color-paper);
      font: 600 12px/1 var(--font-sans);
      cursor: pointer;
    }
    [data-motion-controls] button:hover { border-color: var(--color-accent); }
    [data-motion-controls] button:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }
    [data-motion-controls] button:disabled { cursor: not-allowed; opacity: .45; }
    [data-motion-status-visible] {
      margin-left: auto;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    noscript p {
      margin: 12px 0 0;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }

    html[data-motion="static"] [data-motion-controls],
    html[data-motion="static"] [data-motion-decorative] { display: none !important; }
    html[data-motion="static"] [data-motion-item] {
      opacity: 1 !important;
      transform: none !important;
      animation: none !important;
      transition: none !important;
    }
    html[data-motion="step"] [data-motion-controls],
    html[data-motion="step"] [data-motion-decorative] { display: none !important; }
    html[data-motion="step"] [data-motion-item] {
      animation: none !important;
      transition: none !important;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
      [data-motion-item] { opacity: 1 !important; transform: none !important; }
      [data-motion-decorative] { display: none !important; }
      [data-motion-controls] { display: none !important; }
    }
    @media print {
      [data-motion-controls], [data-motion-decorative] { display: none !important; }
      [data-motion-item] {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        transition: none !important;
      }
    }

    .lbl { fill: #7a8399; font: 400 8px var(--font-mono); letter-spacing: .06em; }
    .zone-lbl { fill: rgba(45,49,66,0.55); font: 500 8px var(--font-mono); letter-spacing: .14em; }
    .name { fill: #2d3142; font: 600 12px var(--font-sans); }
    .sub { fill: #4f5d75; font: 400 8px var(--font-mono); letter-spacing: .04em; }
    .badge { fill: #2d3142; }
    .badge-n { fill: #f5f5f5; font: 600 12px var(--font-mono); }
    .cap { fill: #2d3142; font: 400 12px var(--font-sans); }
    .eyebrow-svg { fill: #4f5d75; font: 500 8px var(--font-mono); letter-spacing: .14em; }
  </style>
</head>
<body>
  <main data-motion-root data-motion-mode="step" data-step-count="8" data-step-current="8" data-frame="static" data-static-frame="complete">
    <p class="eyebrow">Users · Flow · Local dev on Floci</p>
    <h1>Account deletion cascade</h1>

    <svg viewBox="0 56 1080 784" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="users-account-deletion-cascade-title users-account-deletion-cascade-desc">
      <title id="users-account-deletion-cascade-title">Account deletion cascade</title>
      <desc id="users-account-deletion-cascade-desc">When a user deletes their account, the Users service first has Orders and Tracking soft-delete that user's rows in the shared RDS MySQL, and only after both confirm soft-deletes its own row in the Users Postgres, drops the cached profile in ElastiCache and, last and best-effort, removes the Cognito user so the email can register again.</desc>
      <defs>
        <marker id="udc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="udc-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="udc-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
      <rect x="0" y="56" width="1080" height="784" fill="#f5f5f5"/>

      <!-- Zones (painted first) -->
      <rect x="296" y="72" width="472" height="264" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="304" y="76" width="92" height="12" rx="2" fill="#f5f5f5"/>
      <text x="308" y="85" class="zone-lbl">DOCKER COMPOSE</text>

      <rect x="296" y="432" width="752" height="144" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="460" y="436" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="464" y="445" class="zone-lbl">FLOCI :4566</text>

      <!-- Connectors (before nodes) -->
      <!-- web -> users: delete account -->
      <path d="M160,200 H320" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#udc-arrow-link)"/>
      <!-- users -> orders: cascade leg 1 -->
      <path d="M448,168 H480 Q488,168 488,160 V140 Q488,132 496,132 H616" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#udc-arrow)"/>
      <!-- users -> tracking: cascade leg 2 -->
      <path d="M448,232 H480 Q488,232 488,240 V268 Q488,276 496,276 H616" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#udc-arrow)"/>
      <!-- orders -> mysql -->
      <path d="M744,132 H968 Q976,132 976,140 V464" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#udc-arrow)"/>
      <!-- tracking -> mysql -->
      <path d="M744,276 H936 Q944,276 944,284 V464" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#udc-arrow)"/>
      <!-- users -> users postgres -->
      <path d="M352,264 V464" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#udc-arrow)"/>
      <!-- users -> profile cache -->
      <path d="M384,264 V392 Q384,400 392,400 H568 Q576,400 576,408 V464" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#udc-arrow)"/>
      <!-- users -> cognito -->
      <path d="M416,264 V360 Q416,368 424,368 H760 Q768,368 768,376 V464" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#udc-arrow)"/>

      <!-- Arrow labels (masked, 8px off their stroke) -->
      <rect x="200" y="180" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="244" y="189" class="lbl" text-anchor="middle">DELETE ACCOUNT</text>
      <rect x="540" y="112" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="566" y="121" class="lbl" text-anchor="middle">CASCADE</text>
      <rect x="540" y="256" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="566" y="265" class="lbl" text-anchor="middle">CASCADE</text>
      <rect x="836" y="112" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="870" y="121" class="lbl" text-anchor="middle">SOFT-DELETE</text>
      <rect x="836" y="256" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="870" y="265" class="lbl" text-anchor="middle">SOFT-DELETE</text>
      <rect x="276" y="384" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="310" y="393" class="lbl" text-anchor="middle">SOFT-DELETE</text>
      <rect x="460" y="380" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="490" y="389" class="lbl" text-anchor="middle">INVALIDATE</text>
      <rect x="600" y="348" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="632" y="357" class="lbl" text-anchor="middle">DELETE USER</text>

      <!-- Nodes -->
      <!-- Web app (input) -->
      <rect x="32" y="156" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="156" width="128" height="88" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Client.svg" x="76" y="168" width="40" height="40"/>
      <text x="96" y="228" class="name" text-anchor="middle">Web app</text>

      <!-- Users service (focal) -->
      <rect x="320" y="136" width="128" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="136" width="128" height="128" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Server.svg" x="364" y="164" width="40" height="40"/>
      <text x="384" y="228" class="name" text-anchor="middle">Users service</text>

      <!-- Orders service -->
      <rect x="616" y="88" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="88" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Server.svg" x="660" y="100" width="40" height="40"/>
      <text x="680" y="160" class="name" text-anchor="middle">Orders service</text>

      <!-- Tracking service -->
      <rect x="616" y="232" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="232" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Server.svg" x="660" y="244" width="40" height="40"/>
      <text x="680" y="304" class="name" text-anchor="middle">Tracking service</text>

      <!-- Users Postgres (store) -->
      <rect x="320" y="464" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="464" width="128" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="328" y="470" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="342" y="479" class="sub" text-anchor="middle">VPC</text>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonRDS.svg" x="364" y="472" width="40" height="40"/>
      <text x="384" y="528" class="name" text-anchor="middle">Users Postgres</text>
      <text x="384" y="544" class="sub" text-anchor="middle">RDS</text>

      <!-- Profile cache (store) -->
      <rect x="512" y="464" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="512" y="464" width="128" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonElastiCache.svg" x="556" y="472" width="40" height="40"/>
      <text x="576" y="528" class="name" text-anchor="middle">Profile cache</text>
      <text x="576" y="544" class="sub" text-anchor="middle">ElastiCache</text>

      <!-- Cognito -->
      <rect x="704" y="464" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="704" y="464" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonCognito.svg" x="748" y="472" width="40" height="40"/>
      <text x="768" y="528" class="name" text-anchor="middle">Cognito</text>
      <text x="768" y="544" class="sub" text-anchor="middle">user pool</text>

      <!-- RDS MySQL (store) -->
      <rect x="896" y="464" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="896" y="464" width="128" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="904" y="470" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="918" y="479" class="sub" text-anchor="middle">VPC</text>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonRDS.svg" x="940" y="472" width="40" height="40"/>
      <text x="960" y="528" class="name" text-anchor="middle">RDS MySQL</text>
      <text x="960" y="544" class="sub" text-anchor="middle">orders + tracking</text>

      <!-- Steps: badges on their connectors + the numbered caption list -->
      <line x1="32" y1="608" x2="1048" y2="608" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="632" class="eyebrow-svg">STEPS</text>

      <g data-motion-item data-step="1" aria-label="Step 1: the signed-in user deletes their own account">
        <circle class="badge" cx="180" cy="200" r="8"/><text class="badge-n" x="180" y="204" text-anchor="middle">1</text>
        <circle class="badge" cx="40" cy="660" r="8"/><text class="badge-n" x="40" y="664" text-anchor="middle">1</text>
        <text class="cap" x="56" y="664">The signed-in user deletes their own account, authenticated by a JWT</text>
      </g>
      <g data-motion-item data-step="2" aria-label="Step 2: Users calls Orders with the internal API key">
        <circle class="badge" cx="520" cy="132" r="8"/><text class="badge-n" x="520" y="136" text-anchor="middle">2</text>
        <circle class="badge" cx="40" cy="692" r="8"/><text class="badge-n" x="40" y="696" text-anchor="middle">2</text>
        <text class="cap" x="56" y="696">Users calls Orders with the internal API key, never through the gateway</text>
      </g>
      <g data-motion-item data-step="3" aria-label="Step 3: Orders soft-deletes the user's orders, lines and carts">
        <circle class="badge" cx="776" cy="132" r="8"/><text class="badge-n" x="776" y="136" text-anchor="middle">3</text>
        <circle class="badge" cx="40" cy="724" r="8"/><text class="badge-n" x="40" y="728" text-anchor="middle">3</text>
        <text class="cap" x="56" y="728">Orders soft-deletes orders, their lines and carts, by sub or user id</text>
      </g>
      <g data-motion-item data-step="4" aria-label="Step 4: the same internal call goes to Tracking">
        <circle class="badge" cx="520" cy="276" r="8"/><text class="badge-n" x="520" y="280" text-anchor="middle">4</text>
        <circle class="badge" cx="40" cy="756" r="8"/><text class="badge-n" x="40" y="760" text-anchor="middle">4</text>
        <text class="cap" x="56" y="760">The same internal call to Tracking; an empty identity is refused</text>
      </g>
      <g data-motion-item data-step="5" aria-label="Step 5: Tracking soft-deletes trackings and their history">
        <circle class="badge" cx="776" cy="276" r="8"/><text class="badge-n" x="776" y="280" text-anchor="middle">5</text>
        <circle class="badge" cx="560" cy="660" r="8"/><text class="badge-n" x="560" y="664" text-anchor="middle">5</text>
        <text class="cap" x="576" y="664">Tracking soft-deletes trackings and history; a repeat call is a no-op</text>
      </g>
      <g data-motion-item data-step="6" aria-label="Step 6: only after both legs confirm is the user row soft-deleted">
        <circle class="badge" cx="352" cy="300" r="8"/><text class="badge-n" x="352" y="304" text-anchor="middle">6</text>
        <circle class="badge" cx="560" cy="692" r="8"/><text class="badge-n" x="560" y="696" text-anchor="middle">6</text>
        <text class="cap" x="576" y="696">Only after both legs confirm is the user row soft-deleted; else a 502</text>
      </g>
      <g data-motion-item data-step="7" aria-label="Step 7: the cached profile is dropped">
        <circle class="badge" cx="440" cy="400" r="8"/><text class="badge-n" x="440" y="404" text-anchor="middle">7</text>
        <circle class="badge" cx="560" cy="724" r="8"/><text class="badge-n" x="560" y="728" text-anchor="middle">7</text>
        <text class="cap" x="576" y="728">The cached profile is dropped; if the cache is down, it expires on TTL</text>
      </g>
      <g data-motion-item data-step="8" aria-label="Step 8: last and best-effort, Cognito removes the user; no USER_DELETED event">
        <circle class="badge" cx="552" cy="368" r="8"/><text class="badge-n" x="552" y="372" text-anchor="middle">8</text>
        <circle class="badge" cx="560" cy="756" r="8"/><text class="badge-n" x="560" y="760" text-anchor="middle">8</text>
        <text class="cap" x="576" y="760">Last, best-effort: Cognito frees the email; no USER_DELETED event</text>
      </g>

      <!-- Legend strip -->
      <line x1="32" y1="792" x2="1048" y2="792" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="820" class="eyebrow-svg">LEGEND</text>
      <line x1="104" y1="816" x2="136" y2="816" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#udc-arrow)"/>
      <text x="148" y="820" class="lbl">SYNC CALL</text>
      <line x1="236" y1="816" x2="268" y2="816" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#udc-arrow-link)"/>
      <text x="280" y="820" class="lbl">HTTP FROM THE BROWSER</text>
      <rect x="412" y="808" width="24" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="448" y="820" class="lbl">FOCAL SERVICE</text>
      <circle class="badge" cx="564" cy="816" r="8"/><text class="badge-n" x="564" y="820" text-anchor="middle">n</text>
      <text x="580" y="820" class="lbl">STEP · SEE CAPTION n</text>
      <rect x="720" y="810" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="734" y="819" class="sub" text-anchor="middle">VPC</text>
      <text x="760" y="820" class="lbl">IN VPC 10.0.0.0/16 · SUBNETS A+B</text>
    </svg>

    <div data-motion-controls role="group" aria-label="Diagram playback controls">
      <button type="button" data-motion-action="prev">Previous</button>
      <button type="button" data-motion-action="play" aria-pressed="false">Play</button>
      <button type="button" data-motion-action="pause" aria-pressed="true">Pause</button>
      <button type="button" data-motion-action="next">Next</button>
      <button type="button" data-motion-action="replay">Replay</button>
      <span class="keyboard-help">←/→ step · Space play/pause · R replay · Home/End jump</span>
      <span data-motion-status-visible aria-hidden="true">Step <span data-motion-step-label>8</span> of 8</span>
    </div>
    <p class="sr-only" data-motion-status role="status" aria-live="polite" aria-atomic="true"></p>
    <noscript><p>Animation controls require JavaScript. The complete final diagram is shown above.</p></noscript>
  </main>

  <script data-diagram-controls>
    (() => {
      const params = new URLSearchParams(location.search);
      const staticOverride = params.get('motion') === 'static' || document.documentElement.dataset.motion === 'static';
      const requestedStep = params.get('step');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');
      document.fonts.ready.then(() => { document.documentElement.dataset.fontsReady = 'true'; });

      document.querySelectorAll('[data-motion-root]').forEach((root) => {
        const count = Number(root.dataset.stepCount);
        const hold = parseFloat(getComputedStyle(root).getPropertyValue('--motion-hold')) || 720;
        const parsedStep = requestedStep !== null && /^\d+$/.test(requestedStep) ? Number(requestedStep) : null;
        const exactStep = params.get('motion') === 'step' && Number.isSafeInteger(parsedStep) && parsedStep >= 0 && parsedStep <= count ? parsedStep : null;
        const items = [...root.querySelectorAll('[data-motion-item]')];
        const labels = Array.from({ length: count + 1 }, (_, index) => index === 0
          ? 'Ready'
          : items.filter((item) => !item.hasAttribute('data-motion-decorative') && Number(item.dataset.step) === index)
              .map((item) => item.getAttribute('aria-label')).join('; '));
        const controls = root.querySelector('[data-motion-controls]');
        const status = root.querySelector('[data-motion-status]');
        const visibleStep = root.querySelector('[data-motion-step-label]');
        let step = count;
        let timer = 0;
        let playing = false;
        let stepBeforeReduce = 0;
        let resumeAfterReduce = root.dataset.motionMode === 'reveal';

        const buttons = (action) => controls.querySelector(`[data-motion-action="${action}"]`);
        const clearClock = () => { window.clearTimeout(timer); timer = 0; };
        const announce = () => { status.textContent = `Step ${step} of ${count}: ${labels[step] || 'Complete'}`; };
        const setControlsAvailable = (available) => {
          controls.hidden = !available;
          controls.setAttribute('aria-hidden', String(!available));
          controls.dataset.playbackDisabled = String(!available);
          controls.querySelectorAll('button').forEach((control) => { control.disabled = !available; });
        };

        function render(next, userInitiated = false) {
          step = Math.max(0, Math.min(count, next));
          root.dataset.stepCurrent = String(step);
          root.dataset.frame = step === count ? 'end' : step === 0 ? 'start' : 'step';
          items.forEach((item) => {
            const itemStep = Number(item.dataset.step);
            item.classList.toggle('is-visible', itemStep <= step);
            item.classList.toggle('is-current', itemStep === step);
          });
          if (visibleStep) visibleStep.textContent = String(step);
          const unavailable = controls.dataset.playbackDisabled === 'true';
          buttons('prev').disabled = unavailable || step === 0;
          buttons('next').disabled = unavailable || step === count;
          if (userInitiated) announce();
        }

        function pause(userInitiated = false) {
          clearClock();
          playing = false;
          root.classList.remove('is-playing');
          buttons('play').setAttribute('aria-pressed', 'false');
          buttons('pause').setAttribute('aria-pressed', 'true');
          if (userInitiated) status.textContent = `Paused at step ${step} of ${count}`;
        }

        function finish() {
          pause(false);
          root.dataset.frame = 'end';
          status.textContent = `Complete · step ${count} of ${count}`;
        }

        function tick() {
          if (!playing) return;
          if (step >= count) { finish(); return; }
          render(step + 1, false);
          if (step >= count) { finish(); return; }
          timer = window.setTimeout(tick, hold);
        }

        function play(fromStart = false, userInitiated = false) {
          clearClock();
          if (fromStart || step >= count) render(0, userInitiated);
          playing = true;
          root.classList.add('is-playing');
          buttons('play').setAttribute('aria-pressed', 'true');
          buttons('pause').setAttribute('aria-pressed', 'false');
          timer = window.setTimeout(tick, hold);
        }

        controls.addEventListener('click', (event) => {
          const button = event.target.closest('[data-motion-action]');
          if (!button) return;
          const action = button.dataset.motionAction;
          if (action === 'play') play(false, true);
          if (action === 'pause') pause(true);
          if (action === 'replay') play(true, true);
          if (action === 'prev') { pause(false); render(step - 1, true); }
          if (action === 'next') { pause(false); render(step + 1, true); }
        });

        root.addEventListener('keydown', (event) => {
          if (event.target.matches('input, textarea, select, a[href]')) return;
          const keys = { ArrowLeft: step - 1, ArrowRight: step + 1, Home: 0, End: count };
          if (event.code === 'Space' && !event.target.closest('button')) {
            event.preventDefault();
            playing ? pause(true) : play(false, true);
            return;
          }
          if (!event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === 'r') {
            event.preventDefault();
            play(true, true);
            return;
          }
          if (!(event.key in keys)) return;
          event.preventDefault();
          pause(false);
          render(keys[event.key], true);
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden' && playing) pause(false);
        });
        reduce.addEventListener('change', (event) => {
          if (event.matches && root.dataset.motionState !== 'reduced') {
            stepBeforeReduce = step;
            resumeAfterReduce = playing;
          }
          pause(false);
          if (event.matches) {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'reduced';
            status.textContent = 'Reduced motion · complete static frame · playback controls unavailable';
          } else if (staticOverride || root.dataset.motionMode === 'none') {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'static';
            status.textContent = 'Static frame · complete diagram · playback controls unavailable';
          } else {
            delete root.dataset.motionState;
            if (exactStep !== null) {
              setControlsAvailable(false);
              render(exactStep, false);
              root.dataset.frame = 'step';
              root.dataset.motionState = 'test';
              status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
            } else {
              setControlsAvailable(true);
              render(stepBeforeReduce, false);
              status.textContent = `Ready · step ${step} of ${count}`;
              if (resumeAfterReduce && root.dataset.motionMode === 'reveal') {
                play(false, false);
              }
            }
            resumeAfterReduce = false;
          }
        });

        if (staticOverride) {
          document.documentElement.dataset.motion = 'static';
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = 'static';
          status.textContent = 'Static frame · complete diagram · playback controls unavailable';
        } else if (reduce.matches || root.dataset.motionMode === 'none') {
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = reduce.matches ? 'reduced' : 'static';
          status.textContent = reduce.matches
            ? 'Reduced motion · complete static frame · playback controls unavailable'
            : 'Static frame · complete diagram · playback controls unavailable';
        } else if (exactStep !== null) {
          document.documentElement.dataset.motion = 'step';
          pause(false);
          setControlsAvailable(false);
          render(exactStep, false);
          root.dataset.frame = 'step';
          root.dataset.motionState = 'test';
          status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
        } else if (root.dataset.motionMode === 'reveal') {
          setControlsAvailable(true);
          render(0, false);
          play(false, false);
        } else {
          pause(false);
          setControlsAvailable(true);
          render(0, false);
          status.textContent = `Ready · step 0 of ${count}`;
        }
        root.classList.add('motion-ready');
      });
    })();
  </script>
</body>
</html>
