<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passwordless sign-in with an emailed code</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-soft: #7a8399;
      --color-accent: #eb6c36;
      --color-rule: rgba(45,49,66,0.12);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --motion-fast: 160ms;
      --motion-step: 480ms;
      --motion-hold: 960ms;
      --motion-total: 7680ms;
      --motion-ease: cubic-bezier(.2,.8,.2,1);
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 32px;
      color: var(--color-ink);
      background: var(--color-paper);
      font-family: var(--font-sans);
    }
    [data-motion-root] { width: min(100%, 1480px); }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 24px; font: 400 32px/1.15 var(--font-serif); }
    svg { display: block; width: 100%; min-width: 720px; }

    /* Static source is complete. Only an initialized enhancement hides items. */
    .motion-ready [data-motion-item] {
      opacity: .12;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
                  transform var(--motion-step) var(--motion-ease);
    }
    .motion-ready [data-motion-item].is-visible,
    .motion-ready[data-frame="end"] [data-motion-item],
    .motion-ready[data-frame="static"] [data-motion-item] {
      opacity: 1;
      transform: none;
    }
    .motion-ready[data-frame="step"] [data-motion-item].is-current .badge { fill: var(--color-accent); }

    [data-motion-controls] {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule);
    }
    .motion-ready [data-motion-controls] { display: flex; }
    [data-motion-controls][hidden] { display: none !important; }
    [data-motion-controls] button {
      min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--color-muted);
      border-radius: 4px;
      color: var(--color-ink);
      background: var(--color-paper);
      font: 600 12px/1 var(--font-sans);
      cursor: pointer;
    }
    [data-motion-controls] button:hover { border-color: var(--color-accent); }
    [data-motion-controls] button:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }
    [data-motion-controls] button:disabled { cursor: not-allowed; opacity: .45; }
    [data-motion-status-visible] {
      margin-left: auto;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    noscript p {
      margin: 12px 0 0;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }

    html[data-motion="static"] [data-motion-controls],
    html[data-motion="static"] [data-motion-decorative] { display: none !important; }
    html[data-motion="static"] [data-motion-item] {
      opacity: 1 !important;
      transform: none !important;
      animation: none !important;
      transition: none !important;
    }
    html[data-motion="step"] [data-motion-controls],
    html[data-motion="step"] [data-motion-decorative] { display: none !important; }
    html[data-motion="step"] [data-motion-item] {
      animation: none !important;
      transition: none !important;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
      [data-motion-item] { opacity: 1 !important; transform: none !important; }
      [data-motion-decorative] { display: none !important; }
      [data-motion-controls] { display: none !important; }
    }
    @media print {
      [data-motion-controls], [data-motion-decorative] { display: none !important; }
      [data-motion-item] {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        transition: none !important;
      }
    }

    .lbl { fill: #7a8399; font: 400 8px var(--font-mono); letter-spacing: .06em; }
    .zone-lbl { fill: rgba(45,49,66,0.55); font: 500 8px var(--font-mono); letter-spacing: .14em; }
    .name { fill: #2d3142; font: 600 12px var(--font-sans); }
    .sub { fill: #4f5d75; font: 400 8px var(--font-mono); letter-spacing: .04em; }
    .badge { fill: #2d3142; }
    .badge-n { fill: #f5f5f5; font: 600 12px var(--font-mono); }
    .cap { fill: #2d3142; font: 400 12px var(--font-sans); }
    .eyebrow-svg { fill: #4f5d75; font: 500 8px var(--font-mono); letter-spacing: .14em; }
  </style>
</head>
<body>
  <main data-motion-root data-motion-mode="step" data-step-count="8" data-step-current="8" data-frame="static" data-static-frame="complete">
    <p class="eyebrow">Users · Flow · Local dev on Floci</p>
    <h1>Passwordless sign-in with an emailed code</h1>

    <svg viewBox="0 80 1480 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="auth-passwordless-otp-signin-title auth-passwordless-otp-signin-desc">
      <title id="auth-passwordless-otp-signin-title">Passwordless sign-in with an emailed code</title>
      <desc id="auth-passwordless-otp-signin-desc">The Users service opens a Cognito CUSTOM_AUTH session whose Lambda trigger mints a one-time code and sends AUTH_OTP_REQUESTED to the events queue for the events pipeline to email through SES; the browser then returns the code, the trigger checks it in constant time with three attempts, and Cognito issues tokens.</desc>
      <defs>
        <marker id="apo-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="apo-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="apo-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
      <rect y="80" width="1480" height="600" fill="#f5f5f5"/>

      <!-- Zones (painted first) -->
      <rect x="336" y="96" width="176" height="136" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="348" y="100" width="92" height="12" rx="2" fill="#f5f5f5"/>
      <text x="352" y="109" class="zone-lbl">DOCKER COMPOSE</text>

      <rect x="616" y="96" width="848" height="316" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="628" y="100" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="632" y="109" class="zone-lbl">FLOCI :4566</text>

      <!-- Connectors (before nodes) -->
      <!-- web -> users: start / verify -->
      <path d="M160,164 H352" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#apo-arrow-link)"/>
      <!-- users -> cognito: CUSTOM_AUTH -->
      <path d="M480,164 H648" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#apo-arrow)"/>
      <!-- cognito -> otp trigger: challenge -->
      <path d="M776,164 H904" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#apo-arrow)"/>
      <!-- otp trigger -> events queue: AUTH_OTP_REQUESTED (async) -->
      <path d="M968,208 V296" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#apo-arrow)"/>
      <!-- events queue -> pipeline (async) -->
      <path d="M1032,340 H1096" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#apo-arrow)"/>
      <!-- pipeline -> ses: email code -->
      <path d="M1224,340 H1304" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#apo-arrow)"/>

      <!-- Arrow labels (masked, off their stroke) -->
      <rect x="168" y="140" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="206" y="149" class="lbl" text-anchor="middle">START / VERIFY</text>
      <rect x="488" y="140" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="520" y="149" class="lbl" text-anchor="middle">CUSTOM_AUTH</text>
      <rect x="784" y="140" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="810" y="149" class="lbl" text-anchor="middle">CHALLENGE</text>
      <rect x="980" y="224" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1018" y="233" class="lbl" text-anchor="middle">OTP REQUESTED</text>
      <rect x="1232" y="316" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1260" y="325" class="lbl" text-anchor="middle">EMAIL CODE</text>

      <!-- Nodes -->
      <!-- Web app (input) -->
      <rect x="32" y="120" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="120" width="128" height="88" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Client.svg" x="76" y="128" width="40" height="40"/>
      <text x="96" y="184" class="name" text-anchor="middle">Web app</text>
      <text x="96" y="200" class="sub" text-anchor="middle">browser</text>

      <!-- Users service (focal) -->
      <rect x="352" y="120" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="352" y="120" width="128" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Server.svg" x="396" y="132" width="40" height="40"/>
      <text x="416" y="192" class="name" text-anchor="middle">Users service</text>

      <!-- Cognito -->
      <rect x="648" y="120" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="648" y="120" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonCognito.svg" x="692" y="128" width="40" height="40"/>
      <text x="712" y="184" class="name" text-anchor="middle">Cognito</text>
      <text x="712" y="200" class="sub" text-anchor="middle">user pool</text>

      <!-- OTP trigger (Lambda) -->
      <rect x="904" y="120" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="904" y="120" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AWSLambda.svg" x="948" y="128" width="40" height="40"/>
      <text x="968" y="184" class="name" text-anchor="middle">OTP trigger</text>
      <text x="968" y="200" class="sub" text-anchor="middle">CUSTOM_AUTH</text>

      <!-- Events queue (SQS) -->
      <rect x="904" y="296" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="904" y="296" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonSimpleQueueService.svg" x="948" y="308" width="40" height="40"/>
      <text x="968" y="368" class="name" text-anchor="middle">Events queue</text>

      <!-- Events pipeline (Lambda) -->
      <rect x="1096" y="296" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="1096" y="296" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AWSLambda.svg" x="1140" y="308" width="40" height="40"/>
      <text x="1160" y="368" class="name" text-anchor="middle">Events pipeline</text>

      <!-- SES -->
      <rect x="1304" y="296" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="1304" y="296" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonSimpleEmailService.svg" x="1348" y="304" width="40" height="40"/>
      <text x="1368" y="360" class="name" text-anchor="middle">SES</text>
      <text x="1368" y="376" class="sub" text-anchor="middle">Mailpit</text>

      <!-- Steps: badges on their connectors + the numbered caption list -->
      <line x1="32" y1="436" x2="1448" y2="436" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="460" class="eyebrow-svg">STEPS</text>

      <g data-motion-item data-step="1" aria-label="Step 1: the browser sends only the email to Users, without a JWT">
        <circle class="badge" cx="264" cy="164" r="8"/><text class="badge-n" x="264" y="168" text-anchor="middle">1</text>
        <circle class="badge" cx="40" cy="484" r="8"/><text class="badge-n" x="40" y="488" text-anchor="middle">1</text>
        <text class="cap" x="56" y="488">The browser sends only the email to Users, through the gateway without a JWT</text>
      </g>
      <g data-motion-item data-step="2" aria-label="Step 2: Users opens a CUSTOM_AUTH session with Cognito">
        <circle class="badge" cx="568" cy="164" r="8"/><text class="badge-n" x="568" y="168" text-anchor="middle">2</text>
        <circle class="badge" cx="40" cy="516" r="8"/><text class="badge-n" x="40" y="520" text-anchor="middle">2</text>
        <text class="cap" x="56" y="520">Users opens a CUSTOM_AUTH session for that email with Cognito</text>
      </g>
      <g data-motion-item data-step="3" aria-label="Step 3: the OTP trigger mints a one-time code">
        <circle class="badge" cx="848" cy="164" r="8"/><text class="badge-n" x="848" y="168" text-anchor="middle">3</text>
        <circle class="badge" cx="40" cy="548" r="8"/><text class="badge-n" x="40" y="552" text-anchor="middle">3</text>
        <text class="cap" x="56" y="552">The trigger mints a 6-digit code and keeps it in Cognito's private challenge only</text>
      </g>
      <g data-motion-item data-step="4" aria-label="Step 4: the trigger queues AUTH_OTP_REQUESTED for the events pipeline">
        <circle class="badge" cx="968" cy="264" r="8"/><text class="badge-n" x="968" y="268" text-anchor="middle">4</text>
        <circle class="badge" cx="1064" cy="340" r="8"/><text class="badge-n" x="1064" y="344" text-anchor="middle">4</text>
        <circle class="badge" cx="40" cy="580" r="8"/><text class="badge-n" x="40" y="584" text-anchor="middle">4</text>
        <text class="cap" x="56" y="584">The trigger queues AUTH_OTP_REQUESTED on SQS for the pipeline; the code is never logged</text>
      </g>
      <g data-motion-item data-step="5" aria-label="Step 5: the pipeline emails the code through SES">
        <circle class="badge" cx="1264" cy="340" r="8"/><text class="badge-n" x="1264" y="344" text-anchor="middle">5</text>
        <circle class="badge" cx="760" cy="484" r="8"/><text class="badge-n" x="760" y="488" text-anchor="middle">5</text>
        <text class="cap" x="776" y="488">The pipeline validates the envelope and emails the code through SES</text>
      </g>
      <g data-motion-item data-step="6" aria-label="Step 6: the browser keeps the opaque session and sends it back with the typed code">
        <circle class="badge" cx="292" cy="164" r="8"/><text class="badge-n" x="292" y="168" text-anchor="middle">6</text>
        <circle class="badge" cx="760" cy="516" r="8"/><text class="badge-n" x="760" y="520" text-anchor="middle">6</text>
        <text class="cap" x="776" y="520">The browser keeps the opaque session in memory and sends it back with the typed code</text>
      </g>
      <g data-motion-item data-step="7" aria-label="Step 7: Users answers the challenge and the trigger checks the code">
        <circle class="badge" cx="592" cy="164" r="8"/><text class="badge-n" x="592" y="168" text-anchor="middle">7</text>
        <circle class="badge" cx="872" cy="164" r="8"/><text class="badge-n" x="872" y="168" text-anchor="middle">7</text>
        <circle class="badge" cx="760" cy="548" r="8"/><text class="badge-n" x="760" y="552" text-anchor="middle">7</text>
        <text class="cap" x="776" y="552">Users answers the challenge; the trigger compares in constant time, three misses end it</text>
      </g>
      <g data-motion-item data-step="8" aria-label="Step 8: Cognito issues tokens and the web app loads the profile">
        <circle class="badge" cx="320" cy="164" r="8"/><text class="badge-n" x="320" y="168" text-anchor="middle">8</text>
        <circle class="badge" cx="616" cy="164" r="8"/><text class="badge-n" x="616" y="168" text-anchor="middle">8</text>
        <circle class="badge" cx="760" cy="580" r="8"/><text class="badge-n" x="760" y="584" text-anchor="middle">8</text>
        <text class="cap" x="776" y="584">Cognito issues tokens; the web app stores them, then loads the profile</text>
      </g>

      <!-- Legend strip -->
      <line x1="32" y1="624" x2="1448" y2="624" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="652" class="eyebrow-svg">LEGEND</text>
      <line x1="104" y1="648" x2="136" y2="648" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#apo-arrow)"/>
      <text x="148" y="652" class="lbl">SYNC CALL</text>
      <line x1="236" y1="648" x2="268" y2="648" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#apo-arrow-link)"/>
      <text x="280" y="652" class="lbl">HTTP FROM THE BROWSER</text>
      <line x1="424" y1="648" x2="456" y2="648" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#apo-arrow)"/>
      <text x="468" y="652" class="lbl">ASYNC · QUEUE</text>
      <rect x="572" y="640" width="24" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="608" y="652" class="lbl">FOCAL SERVICE</text>
      <circle class="badge" cx="724" cy="648" r="8"/><text class="badge-n" x="724" y="652" text-anchor="middle">n</text>
      <text x="740" y="652" class="lbl">STEP · SEE CAPTION n</text>
      <text x="880" y="652" class="lbl">LAMBDAS, QUEUE AND SES RUN OUTSIDE THE VPC</text>
    </svg>

    <div data-motion-controls role="group" aria-label="Diagram playback controls">
      <button type="button" data-motion-action="prev">Previous</button>
      <button type="button" data-motion-action="play" aria-pressed="false">Play</button>
      <button type="button" data-motion-action="pause" aria-pressed="true">Pause</button>
      <button type="button" data-motion-action="next">Next</button>
      <button type="button" data-motion-action="replay">Replay</button>
      <span class="keyboard-help">←/→ step · Space play/pause · R replay · Home/End jump</span>
      <span data-motion-status-visible aria-hidden="true">Step <span data-motion-step-label>8</span> of 8</span>
    </div>
    <p class="sr-only" data-motion-status role="status" aria-live="polite" aria-atomic="true"></p>
    <noscript><p>Animation controls require JavaScript. The complete final diagram is shown above.</p></noscript>
  </main>

  <script data-diagram-controls>
    (() => {
      const params = new URLSearchParams(location.search);
      const staticOverride = params.get('motion') === 'static' || document.documentElement.dataset.motion === 'static';
      const requestedStep = params.get('step');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');
      document.fonts.ready.then(() => { document.documentElement.dataset.fontsReady = 'true'; });

      document.querySelectorAll('[data-motion-root]').forEach((root) => {
        const count = Number(root.dataset.stepCount);
        const hold = parseFloat(getComputedStyle(root).getPropertyValue('--motion-hold')) || 720;
        const parsedStep = requestedStep !== null && /^\d+$/.test(requestedStep) ? Number(requestedStep) : null;
        const exactStep = params.get('motion') === 'step' && Number.isSafeInteger(parsedStep) && parsedStep >= 0 && parsedStep <= count ? parsedStep : null;
        const items = [...root.querySelectorAll('[data-motion-item]')];
        const labels = Array.from({ length: count + 1 }, (_, index) => index === 0
          ? 'Ready'
          : items.filter((item) => !item.hasAttribute('data-motion-decorative') && Number(item.dataset.step) === index)
              .map((item) => item.getAttribute('aria-label')).join('; '));
        const controls = root.querySelector('[data-motion-controls]');
        const status = root.querySelector('[data-motion-status]');
        const visibleStep = root.querySelector('[data-motion-step-label]');
        let step = count;
        let timer = 0;
        let playing = false;
        let stepBeforeReduce = 0;
        let resumeAfterReduce = root.dataset.motionMode === 'reveal';

        const buttons = (action) => controls.querySelector(`[data-motion-action="${action}"]`);
        const clearClock = () => { window.clearTimeout(timer); timer = 0; };
        const announce = () => { status.textContent = `Step ${step} of ${count}: ${labels[step] || 'Complete'}`; };
        const setControlsAvailable = (available) => {
          controls.hidden = !available;
          controls.setAttribute('aria-hidden', String(!available));
          controls.dataset.playbackDisabled = String(!available);
          controls.querySelectorAll('button').forEach((control) => { control.disabled = !available; });
        };

        function render(next, userInitiated = false) {
          step = Math.max(0, Math.min(count, next));
          root.dataset.stepCurrent = String(step);
          root.dataset.frame = step === count ? 'end' : step === 0 ? 'start' : 'step';
          items.forEach((item) => {
            const itemStep = Number(item.dataset.step);
            item.classList.toggle('is-visible', itemStep <= step);
            item.classList.toggle('is-current', itemStep === step);
          });
          if (visibleStep) visibleStep.textContent = String(step);
          const unavailable = controls.dataset.playbackDisabled === 'true';
          buttons('prev').disabled = unavailable || step === 0;
          buttons('next').disabled = unavailable || step === count;
          if (userInitiated) announce();
        }

        function pause(userInitiated = false) {
          clearClock();
          playing = false;
          root.classList.remove('is-playing');
          buttons('play').setAttribute('aria-pressed', 'false');
          buttons('pause').setAttribute('aria-pressed', 'true');
          if (userInitiated) status.textContent = `Paused at step ${step} of ${count}`;
        }

        function finish() {
          pause(false);
          root.dataset.frame = 'end';
          status.textContent = `Complete · step ${count} of ${count}`;
        }

        function tick() {
          if (!playing) return;
          if (step >= count) { finish(); return; }
          render(step + 1, false);
          if (step >= count) { finish(); return; }
          timer = window.setTimeout(tick, hold);
        }

        function play(fromStart = false, userInitiated = false) {
          clearClock();
          if (fromStart || step >= count) render(0, userInitiated);
          playing = true;
          root.classList.add('is-playing');
          buttons('play').setAttribute('aria-pressed', 'true');
          buttons('pause').setAttribute('aria-pressed', 'false');
          timer = window.setTimeout(tick, hold);
        }

        controls.addEventListener('click', (event) => {
          const button = event.target.closest('[data-motion-action]');
          if (!button) return;
          const action = button.dataset.motionAction;
          if (action === 'play') play(false, true);
          if (action === 'pause') pause(true);
          if (action === 'replay') play(true, true);
          if (action === 'prev') { pause(false); render(step - 1, true); }
          if (action === 'next') { pause(false); render(step + 1, true); }
        });

        root.addEventListener('keydown', (event) => {
          if (event.target.matches('input, textarea, select, a[href]')) return;
          const keys = { ArrowLeft: step - 1, ArrowRight: step + 1, Home: 0, End: count };
          if (event.code === 'Space' && !event.target.closest('button')) {
            event.preventDefault();
            playing ? pause(true) : play(false, true);
            return;
          }
          if (!event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === 'r') {
            event.preventDefault();
            play(true, true);
            return;
          }
          if (!(event.key in keys)) return;
          event.preventDefault();
          pause(false);
          render(keys[event.key], true);
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden' && playing) pause(false);
        });
        reduce.addEventListener('change', (event) => {
          if (event.matches && root.dataset.motionState !== 'reduced') {
            stepBeforeReduce = step;
            resumeAfterReduce = playing;
          }
          pause(false);
          if (event.matches) {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'reduced';
            status.textContent = 'Reduced motion · complete static frame · playback controls unavailable';
          } else if (staticOverride || root.dataset.motionMode === 'none') {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'static';
            status.textContent = 'Static frame · complete diagram · playback controls unavailable';
          } else {
            delete root.dataset.motionState;
            if (exactStep !== null) {
              setControlsAvailable(false);
              render(exactStep, false);
              root.dataset.frame = 'step';
              root.dataset.motionState = 'test';
              status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
            } else {
              setControlsAvailable(true);
              render(stepBeforeReduce, false);
              status.textContent = `Ready · step ${step} of ${count}`;
              if (resumeAfterReduce && root.dataset.motionMode === 'reveal') {
                play(false, false);
              }
            }
            resumeAfterReduce = false;
          }
        });

        if (staticOverride) {
          document.documentElement.dataset.motion = 'static';
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = 'static';
          status.textContent = 'Static frame · complete diagram · playback controls unavailable';
        } else if (reduce.matches || root.dataset.motionMode === 'none') {
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = reduce.matches ? 'reduced' : 'static';
          status.textContent = reduce.matches
            ? 'Reduced motion · complete static frame · playback controls unavailable'
            : 'Static frame · complete diagram · playback controls unavailable';
        } else if (exactStep !== null) {
          document.documentElement.dataset.motion = 'step';
          pause(false);
          setControlsAvailable(false);
          render(exactStep, false);
          root.dataset.frame = 'step';
          root.dataset.motionState = 'test';
          status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
        } else if (root.dataset.motionMode === 'reveal') {
          setControlsAvailable(true);
          render(0, false);
          play(false, false);
        } else {
          pause(false);
          setControlsAvailable(true);
          render(0, false);
          status.textContent = `Ready · step 0 of ${count}`;
        }
        root.classList.add('motion-ready');
      });
    })();
  </script>
</body>
</html>
