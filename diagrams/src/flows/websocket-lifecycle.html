<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSocket connection lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-soft: #7a8399;
      --color-accent: #eb6c36;
      --color-rule: rgba(45,49,66,0.12);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --motion-fast: 160ms;
      --motion-step: 480ms;
      --motion-hold: 960ms;
      --motion-total: 7680ms;
      --motion-ease: cubic-bezier(.2,.8,.2,1);
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 32px;
      color: var(--color-ink);
      background: var(--color-paper);
      font-family: var(--font-sans);
    }
    [data-motion-root] { width: min(100%, 1024px); }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 24px; font: 400 32px/1.15 var(--font-serif); }
    svg { display: block; width: 100%; min-width: 720px; }

    /* Static source is complete. Only an initialized enhancement hides items. */
    .motion-ready [data-motion-item] {
      opacity: .12;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
                  transform var(--motion-step) var(--motion-ease);
    }
    .motion-ready [data-motion-item].is-visible,
    .motion-ready[data-frame="end"] [data-motion-item],
    .motion-ready[data-frame="static"] [data-motion-item] {
      opacity: 1;
      transform: none;
    }
    .motion-ready[data-frame="step"] [data-motion-item].is-current .badge { fill: var(--color-accent); }

    [data-motion-controls] {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule);
    }
    .motion-ready [data-motion-controls] { display: flex; }
    [data-motion-controls][hidden] { display: none !important; }
    [data-motion-controls] button {
      min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--color-muted);
      border-radius: 4px;
      color: var(--color-ink);
      background: var(--color-paper);
      font: 600 12px/1 var(--font-sans);
      cursor: pointer;
    }
    [data-motion-controls] button:hover { border-color: var(--color-accent); }
    [data-motion-controls] button:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }
    [data-motion-controls] button:disabled { cursor: not-allowed; opacity: .45; }
    [data-motion-status-visible] {
      margin-left: auto;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    noscript p {
      margin: 12px 0 0;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }

    html[data-motion="static"] [data-motion-controls],
    html[data-motion="static"] [data-motion-decorative] { display: none !important; }
    html[data-motion="static"] [data-motion-item] {
      opacity: 1 !important;
      transform: none !important;
      animation: none !important;
      transition: none !important;
    }
    html[data-motion="step"] [data-motion-controls],
    html[data-motion="step"] [data-motion-decorative] { display: none !important; }
    html[data-motion="step"] [data-motion-item] {
      animation: none !important;
      transition: none !important;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
      [data-motion-item] { opacity: 1 !important; transform: none !important; }
      [data-motion-decorative] { display: none !important; }
      [data-motion-controls] { display: none !important; }
    }
    @media print {
      [data-motion-controls], [data-motion-decorative] { display: none !important; }
      [data-motion-item] {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        transition: none !important;
      }
    }

    .lbl { fill: #7a8399; font: 400 8px var(--font-mono); letter-spacing: .06em; }
    .zone-lbl { fill: rgba(45,49,66,0.55); font: 500 8px var(--font-mono); letter-spacing: .14em; }
    .name { fill: #2d3142; font: 600 12px var(--font-sans); }
    .sub { fill: #4f5d75; font: 400 8px var(--font-mono); letter-spacing: .04em; }
    .badge { fill: #2d3142; }
    .badge-n { fill: #f5f5f5; font: 600 12px var(--font-mono); }
    .cap { fill: #2d3142; font: 400 12px var(--font-sans); }
    .eyebrow-svg { fill: #4f5d75; font: 500 8px var(--font-mono); letter-spacing: .14em; }
  </style>
</head>
<body>
  <main data-motion-root data-motion-mode="step" data-step-count="8" data-step-current="8" data-frame="static" data-static-frame="complete">
    <p class="eyebrow">Realtime · Flow · Local dev on Floci</p>
    <h1>WebSocket connection lifecycle</h1>


    <svg viewBox="0 80 1024 808" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="websocket-lifecycle-title websocket-lifecycle-desc">
      <title id="websocket-lifecycle-title">WebSocket connection lifecycle</title>
      <desc id="websocket-lifecycle-desc">A browser opens a socket to the WebSocket API, whose authorizer Lambda verifies the Cognito token; the connect Lambda stores the connection with its cognito_sub in DynamoDB, the events pipeline pushes to every open socket of a user and prunes rows that answer 410 Gone, and the disconnect Lambda deletes the row when the socket closes.</desc>
      <defs>
        <marker id="wsl-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="wsl-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="wsl-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
      <rect y="80" width="1024" height="808" fill="#f5f5f5"/>

      <!-- Zone (painted first) -->
      <rect x="256" y="92" width="736" height="496" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="268" y="96" width="188" height="12" rx="2" fill="#f5f5f5"/>
      <text x="272" y="105" class="zone-lbl">FLOCI :4566 · REGIONAL, NO VPC</text>

      <!-- Connectors (before nodes) -->
      <!-- web -> ws: socket -->
      <path d="M160,344 H288" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#wsl-arrow-link)"/>
      <!-- ws -> auth: authorize -->
      <path d="M336,300 V212" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#wsl-arrow)"/>
      <!-- auth -> ws: allow + sub -->
      <path d="M368,212 V300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#wsl-arrow)"/>
      <!-- ws -> connect -->
      <path d="M416,320 H472 Q480,320 480,312 V176 Q480,168 488,168 H576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#wsl-arrow)"/>
      <!-- connect -> sockets: put -->
      <path d="M704,168 H888 Q896,168 896,176 V300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#wsl-arrow)"/>
      <!-- pipeline -> ws: push (async) -->
      <path d="M576,344 H416" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#wsl-arrow)"/>
      <!-- pipeline -> sockets: prune on 410 -->
      <path d="M704,344 H832" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#wsl-arrow)"/>
      <!-- ws -> close fn -->
      <path d="M416,368 H472 Q480,368 480,376 V512 Q480,520 488,520 H576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#wsl-arrow)"/>
      <!-- close fn -> sockets: delete -->
      <path d="M704,520 H888 Q896,520 896,512 V388" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#wsl-arrow)"/>

      <!-- Arrow labels (masked, 8px off their stroke) -->
      <rect x="172" y="324" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="192" y="333" class="lbl" text-anchor="middle">SOCKET</text>
      <rect x="268" y="244" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="298" y="253" class="lbl" text-anchor="middle">AUTHORIZE</text>
      <rect x="376" y="244" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="408" y="253" class="lbl" text-anchor="middle">ALLOW + SUB</text>
      <rect x="500" y="148" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="524" y="157" class="lbl" text-anchor="middle">CONNECT</text>
      <rect x="732" y="148" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="746" y="157" class="lbl" text-anchor="middle">PUT</text>
      <rect x="500" y="324" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="516" y="333" class="lbl" text-anchor="middle">PUSH</text>
      <rect x="740" y="324" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="776" y="333" class="lbl" text-anchor="middle">PRUNE ON 410</text>
      <rect x="496" y="500" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="528" y="509" class="lbl" text-anchor="middle">DISCONNECT</text>
      <rect x="728" y="500" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="748" y="509" class="lbl" text-anchor="middle">DELETE</text>

      <!-- Nodes -->
      <!-- Web app (input) -->
      <rect x="32" y="300" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="300" width="128" height="88" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Client.svg" x="76" y="308" width="40" height="40"/>
      <text x="96" y="364" class="name" text-anchor="middle">Web app</text>
      <text x="96" y="380" class="sub" text-anchor="middle">browser</text>

      <!-- Auth Lambda -->
      <rect x="288" y="124" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="124" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AWSLambda.svg" x="332" y="132" width="40" height="40"/>
      <text x="352" y="188" class="name" text-anchor="middle">Auth Lambda</text>
      <text x="352" y="204" class="sub" text-anchor="middle">connect authorizer</text>

      <!-- WS API (focal) -->
      <rect x="288" y="300" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="300" width="128" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonAPIGateway.svg" x="332" y="312" width="40" height="40"/>
      <text x="352" y="372" class="name" text-anchor="middle">WS API</text>

      <!-- Connect fn -->
      <rect x="576" y="124" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="576" y="124" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AWSLambda.svg" x="620" y="136" width="40" height="40"/>
      <text x="640" y="196" class="name" text-anchor="middle">Connect fn</text>

      <!-- Events pipeline -->
      <rect x="576" y="300" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="576" y="300" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AWSLambda.svg" x="620" y="312" width="40" height="40"/>
      <text x="640" y="372" class="name" text-anchor="middle">Events pipeline</text>

      <!-- Close fn -->
      <rect x="576" y="476" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="576" y="476" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AWSLambda.svg" x="620" y="488" width="40" height="40"/>
      <text x="640" y="548" class="name" text-anchor="middle">Close fn</text>

      <!-- Sockets (store) -->
      <rect x="832" y="300" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="832" y="300" width="128" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonDynamoDB.svg" x="876" y="308" width="40" height="40"/>
      <text x="896" y="364" class="name" text-anchor="middle">Sockets</text>
      <text x="896" y="380" class="sub" text-anchor="middle">DynamoDB connections</text>

      <!-- Steps: badges on their connectors + the numbered caption list -->
      <line x1="32" y1="616" x2="992" y2="616" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="640" class="eyebrow-svg">STEPS</text>

      <g data-motion-item data-step="1" aria-label="Step 1: the browser opens a socket to the WS API">
        <circle class="badge" cx="232" cy="344" r="8"/><text class="badge-n" x="232" y="348" text-anchor="middle">1</text>
        <circle class="badge" cx="40" cy="664" r="8"/><text class="badge-n" x="40" y="668" text-anchor="middle">1</text>
        <text class="cap" x="56" y="668">A browser socket cannot set headers, so the Cognito</text>
        <text class="cap" x="56" y="684">token travels in the connection URL</text>
      </g>
      <g data-motion-item data-step="2" aria-label="Step 2: the authorizer verifies the token and returns the cognito_sub">
        <circle class="badge" cx="336" cy="276" r="8"/><text class="badge-n" x="336" y="280" text-anchor="middle">2</text>
        <circle class="badge" cx="368" cy="276" r="8"/><text class="badge-n" x="368" y="280" text-anchor="middle">2</text>
        <circle class="badge" cx="40" cy="704" r="8"/><text class="badge-n" x="40" y="708" text-anchor="middle">2</text>
        <text class="cap" x="56" y="708">The authorizer verifies the JWT and denies a missing or bad</text>
        <text class="cap" x="56" y="724">token; an Allow returns the cognito_sub as context</text>
      </g>
      <g data-motion-item data-step="3" aria-label="Step 3: the connect Lambda runs on the authorizer context">
        <circle class="badge" cx="480" cy="248" r="8"/><text class="badge-n" x="480" y="252" text-anchor="middle">3</text>
        <circle class="badge" cx="40" cy="744" r="8"/><text class="badge-n" x="40" y="748" text-anchor="middle">3</text>
        <text class="cap" x="56" y="748">The connect Lambda trusts only the authorizer context,</text>
        <text class="cap" x="56" y="764">never a value sent by the client</text>
      </g>
      <g data-motion-item data-step="4" aria-label="Step 4: the connection is stored in the Sockets table">
        <circle class="badge" cx="800" cy="168" r="8"/><text class="badge-n" x="800" y="172" text-anchor="middle">4</text>
        <circle class="badge" cx="40" cy="784" r="8"/><text class="badge-n" x="40" y="788" text-anchor="middle">4</text>
        <text class="cap" x="56" y="788">The connection id is stored with its cognito_sub and a</text>
        <text class="cap" x="56" y="804">2-hour TTL, the API's cap on a connection</text>
      </g>
      <g data-motion-item data-step="5" aria-label="Step 5: an inbound message is rejected with a 400">
        <circle class="badge" cx="260" cy="344" r="8"/><text class="badge-n" x="260" y="348" text-anchor="middle">5</text>
        <circle class="badge" cx="520" cy="664" r="8"/><text class="badge-n" x="520" y="668" text-anchor="middle">5</text>
        <text class="cap" x="536" y="668">An inbound message gets a 400 from the default Lambda:</text>
        <text class="cap" x="536" y="684">the channel is server-to-client only</text>
      </g>
      <g data-motion-item data-step="6" aria-label="Step 6: the events pipeline pushes to the user's open sockets">
        <circle class="badge" cx="448" cy="344" r="8"/><text class="badge-n" x="448" y="348" text-anchor="middle">6</text>
        <circle class="badge" cx="520" cy="704" r="8"/><text class="badge-n" x="520" y="708" text-anchor="middle">6</text>
        <text class="cap" x="536" y="708">The pipeline pushes to every open socket of the</text>
        <text class="cap" x="536" y="724">user's cognito_sub</text>
      </g>
      <g data-motion-item data-step="7" aria-label="Step 7: a 410 Gone prunes the stale row">
        <circle class="badge" cx="720" cy="344" r="8"/><text class="badge-n" x="720" y="348" text-anchor="middle">7</text>
        <circle class="badge" cx="520" cy="744" r="8"/><text class="badge-n" x="520" y="748" text-anchor="middle">7</text>
        <text class="cap" x="536" y="748">A 410 Gone deletes the stale row; that, not the TTL,</text>
        <text class="cap" x="536" y="764">is the real cleanup</text>
      </g>
      <g data-motion-item data-step="8" aria-label="Step 8: on close, the disconnect Lambda deletes the row">
        <circle class="badge" cx="480" cy="440" r="8"/><text class="badge-n" x="480" y="444" text-anchor="middle">8</text>
        <circle class="badge" cx="800" cy="520" r="8"/><text class="badge-n" x="800" y="524" text-anchor="middle">8</text>
        <circle class="badge" cx="520" cy="784" r="8"/><text class="badge-n" x="520" y="788" text-anchor="middle">8</text>
        <text class="cap" x="536" y="788">When the socket closes, the disconnect Lambda deletes its row;</text>
        <text class="cap" x="536" y="804">a failed delete is only logged, as the 410 prune covers it</text>
      </g>

      <!-- Legend strip -->
      <line x1="32" y1="832" x2="992" y2="832" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="860" class="eyebrow-svg">LEGEND</text>
      <line x1="104" y1="856" x2="136" y2="856" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#wsl-arrow)"/>
      <text x="148" y="860" class="lbl">SYNC CALL</text>
      <line x1="224" y1="856" x2="256" y2="856" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#wsl-arrow-link)"/>
      <text x="268" y="860" class="lbl">SOCKET FROM THE BROWSER</text>
      <line x1="416" y1="856" x2="448" y2="856" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#wsl-arrow)"/>
      <text x="460" y="860" class="lbl">ASYNC · PUSH TO A SOCKET</text>
      <rect x="616" y="848" width="24" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="652" y="860" class="lbl">FOCAL SERVICE</text>
      <circle class="badge" cx="756" cy="856" r="8"/><text class="badge-n" x="756" y="860" text-anchor="middle">n</text>
      <text x="772" y="860" class="lbl">STEP · SEE CAPTION n</text>
    </svg>

    <div data-motion-controls role="group" aria-label="Diagram playback controls">
      <button type="button" data-motion-action="prev">Previous</button>
      <button type="button" data-motion-action="play" aria-pressed="false">Play</button>
      <button type="button" data-motion-action="pause" aria-pressed="true">Pause</button>
      <button type="button" data-motion-action="next">Next</button>
      <button type="button" data-motion-action="replay">Replay</button>
      <span class="keyboard-help">←/→ step · Space play/pause · R replay · Home/End jump</span>
      <span data-motion-status-visible aria-hidden="true">Step <span data-motion-step-label>8</span> of 8</span>
    </div>
    <p class="sr-only" data-motion-status role="status" aria-live="polite" aria-atomic="true"></p>
    <noscript><p>Animation controls require JavaScript. The complete final diagram is shown above.</p></noscript>
  </main>

  <script data-diagram-controls>
    (() => {
      const params = new URLSearchParams(location.search);
      const staticOverride = params.get('motion') === 'static' || document.documentElement.dataset.motion === 'static';
      const requestedStep = params.get('step');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');
      document.fonts.ready.then(() => { document.documentElement.dataset.fontsReady = 'true'; });

      document.querySelectorAll('[data-motion-root]').forEach((root) => {
        const count = Number(root.dataset.stepCount);
        const hold = parseFloat(getComputedStyle(root).getPropertyValue('--motion-hold')) || 720;
        const parsedStep = requestedStep !== null && /^\d+$/.test(requestedStep) ? Number(requestedStep) : null;
        const exactStep = params.get('motion') === 'step' && Number.isSafeInteger(parsedStep) && parsedStep >= 0 && parsedStep <= count ? parsedStep : null;
        const items = [...root.querySelectorAll('[data-motion-item]')];
        const labels = Array.from({ length: count + 1 }, (_, index) => index === 0
          ? 'Ready'
          : items.filter((item) => !item.hasAttribute('data-motion-decorative') && Number(item.dataset.step) === index)
              .map((item) => item.getAttribute('aria-label')).join('; '));
        const controls = root.querySelector('[data-motion-controls]');
        const status = root.querySelector('[data-motion-status]');
        const visibleStep = root.querySelector('[data-motion-step-label]');
        let step = count;
        let timer = 0;
        let playing = false;
        let stepBeforeReduce = 0;
        let resumeAfterReduce = root.dataset.motionMode === 'reveal';

        const buttons = (action) => controls.querySelector(`[data-motion-action="${action}"]`);
        const clearClock = () => { window.clearTimeout(timer); timer = 0; };
        const announce = () => { status.textContent = `Step ${step} of ${count}: ${labels[step] || 'Complete'}`; };
        const setControlsAvailable = (available) => {
          controls.hidden = !available;
          controls.setAttribute('aria-hidden', String(!available));
          controls.dataset.playbackDisabled = String(!available);
          controls.querySelectorAll('button').forEach((control) => { control.disabled = !available; });
        };

        function render(next, userInitiated = false) {
          step = Math.max(0, Math.min(count, next));
          root.dataset.stepCurrent = String(step);
          root.dataset.frame = step === count ? 'end' : step === 0 ? 'start' : 'step';
          items.forEach((item) => {
            const itemStep = Number(item.dataset.step);
            item.classList.toggle('is-visible', itemStep <= step);
            item.classList.toggle('is-current', itemStep === step);
          });
          if (visibleStep) visibleStep.textContent = String(step);
          const unavailable = controls.dataset.playbackDisabled === 'true';
          buttons('prev').disabled = unavailable || step === 0;
          buttons('next').disabled = unavailable || step === count;
          if (userInitiated) announce();
        }

        function pause(userInitiated = false) {
          clearClock();
          playing = false;
          root.classList.remove('is-playing');
          buttons('play').setAttribute('aria-pressed', 'false');
          buttons('pause').setAttribute('aria-pressed', 'true');
          if (userInitiated) status.textContent = `Paused at step ${step} of ${count}`;
        }

        function finish() {
          pause(false);
          root.dataset.frame = 'end';
          status.textContent = `Complete · step ${count} of ${count}`;
        }

        function tick() {
          if (!playing) return;
          if (step >= count) { finish(); return; }
          render(step + 1, false);
          if (step >= count) { finish(); return; }
          timer = window.setTimeout(tick, hold);
        }

        function play(fromStart = false, userInitiated = false) {
          clearClock();
          if (fromStart || step >= count) render(0, userInitiated);
          playing = true;
          root.classList.add('is-playing');
          buttons('play').setAttribute('aria-pressed', 'true');
          buttons('pause').setAttribute('aria-pressed', 'false');
          timer = window.setTimeout(tick, hold);
        }

        controls.addEventListener('click', (event) => {
          const button = event.target.closest('[data-motion-action]');
          if (!button) return;
          const action = button.dataset.motionAction;
          if (action === 'play') play(false, true);
          if (action === 'pause') pause(true);
          if (action === 'replay') play(true, true);
          if (action === 'prev') { pause(false); render(step - 1, true); }
          if (action === 'next') { pause(false); render(step + 1, true); }
        });

        root.addEventListener('keydown', (event) => {
          if (event.target.matches('input, textarea, select, a[href]')) return;
          const keys = { ArrowLeft: step - 1, ArrowRight: step + 1, Home: 0, End: count };
          if (event.code === 'Space' && !event.target.closest('button')) {
            event.preventDefault();
            playing ? pause(true) : play(false, true);
            return;
          }
          if (!event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === 'r') {
            event.preventDefault();
            play(true, true);
            return;
          }
          if (!(event.key in keys)) return;
          event.preventDefault();
          pause(false);
          render(keys[event.key], true);
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden' && playing) pause(false);
        });
        reduce.addEventListener('change', (event) => {
          if (event.matches && root.dataset.motionState !== 'reduced') {
            stepBeforeReduce = step;
            resumeAfterReduce = playing;
          }
          pause(false);
          if (event.matches) {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'reduced';
            status.textContent = 'Reduced motion · complete static frame · playback controls unavailable';
          } else if (staticOverride || root.dataset.motionMode === 'none') {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'static';
            status.textContent = 'Static frame · complete diagram · playback controls unavailable';
          } else {
            delete root.dataset.motionState;
            if (exactStep !== null) {
              setControlsAvailable(false);
              render(exactStep, false);
              root.dataset.frame = 'step';
              root.dataset.motionState = 'test';
              status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
            } else {
              setControlsAvailable(true);
              render(stepBeforeReduce, false);
              status.textContent = `Ready · step ${step} of ${count}`;
              if (resumeAfterReduce && root.dataset.motionMode === 'reveal') {
                play(false, false);
              }
            }
            resumeAfterReduce = false;
          }
        });

        if (staticOverride) {
          document.documentElement.dataset.motion = 'static';
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = 'static';
          status.textContent = 'Static frame · complete diagram · playback controls unavailable';
        } else if (reduce.matches || root.dataset.motionMode === 'none') {
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = reduce.matches ? 'reduced' : 'static';
          status.textContent = reduce.matches
            ? 'Reduced motion · complete static frame · playback controls unavailable'
            : 'Static frame · complete diagram · playback controls unavailable';
        } else if (exactStep !== null) {
          document.documentElement.dataset.motion = 'step';
          pause(false);
          setControlsAvailable(false);
          render(exactStep, false);
          root.dataset.frame = 'step';
          root.dataset.motionState = 'test';
          status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
        } else if (root.dataset.motionMode === 'reveal') {
          setControlsAvailable(true);
          render(0, false);
          play(false, false);
        } else {
          pause(false);
          setControlsAvailable(true);
          render(0, false);
          status.textContent = `Ready · step 0 of ${count}`;
        }
        root.classList.add('motion-ready');
      });
    })();
  </script>
</body>
</html>
