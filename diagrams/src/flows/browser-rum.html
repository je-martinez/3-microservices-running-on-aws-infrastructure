<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How browser telemetry reaches OpenObserve</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-soft: #7a8399;
      --color-accent: #eb6c36;
      --color-rule: rgba(45,49,66,0.12);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --motion-fast: 160ms;
      --motion-step: 480ms;
      --motion-hold: 960ms;
      --motion-total: 7680ms;
      --motion-ease: cubic-bezier(.2,.8,.2,1);
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 32px;
      color: var(--color-ink);
      background: var(--color-paper);
      font-family: var(--font-sans);
    }
    [data-motion-root] { width: min(100%, 1360px); }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 24px; font: 400 32px/1.15 var(--font-serif); }
    svg { display: block; width: 100%; min-width: 720px; }

    /* Static source is complete. Only an initialized enhancement hides items. */
    .motion-ready [data-motion-item] {
      opacity: .12;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
                  transform var(--motion-step) var(--motion-ease);
    }
    .motion-ready [data-motion-item].is-visible,
    .motion-ready[data-frame="end"] [data-motion-item],
    .motion-ready[data-frame="static"] [data-motion-item] {
      opacity: 1;
      transform: none;
    }
    .motion-ready[data-frame="step"] [data-motion-item].is-current .badge { fill: var(--color-accent); }

    [data-motion-controls] {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule);
    }
    .motion-ready [data-motion-controls] { display: flex; }
    [data-motion-controls][hidden] { display: none !important; }
    [data-motion-controls] button {
      min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--color-muted);
      border-radius: 4px;
      color: var(--color-ink);
      background: var(--color-paper);
      font: 600 12px/1 var(--font-sans);
      cursor: pointer;
    }
    [data-motion-controls] button:hover { border-color: var(--color-accent); }
    [data-motion-controls] button:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }
    [data-motion-controls] button:disabled { cursor: not-allowed; opacity: .45; }
    [data-motion-status-visible] {
      margin-left: auto;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    noscript p {
      margin: 12px 0 0;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }

    html[data-motion="static"] [data-motion-controls],
    html[data-motion="static"] [data-motion-decorative] { display: none !important; }
    html[data-motion="static"] [data-motion-item] {
      opacity: 1 !important;
      transform: none !important;
      animation: none !important;
      transition: none !important;
    }
    html[data-motion="step"] [data-motion-controls],
    html[data-motion="step"] [data-motion-decorative] { display: none !important; }
    html[data-motion="step"] [data-motion-item] {
      animation: none !important;
      transition: none !important;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
      [data-motion-item] { opacity: 1 !important; transform: none !important; }
      [data-motion-decorative] { display: none !important; }
      [data-motion-controls] { display: none !important; }
    }
    @media print {
      [data-motion-controls], [data-motion-decorative] { display: none !important; }
      [data-motion-item] {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        transition: none !important;
      }
    }

    .lbl { fill: #7a8399; font: 400 8px var(--font-mono); letter-spacing: .06em; }
    .zone-lbl { fill: rgba(45,49,66,0.55); font: 500 8px var(--font-mono); letter-spacing: .14em; }
    .name { fill: #2d3142; font: 600 12px var(--font-sans); }
    .sub { fill: #4f5d75; font: 400 8px var(--font-mono); letter-spacing: .04em; }
    .badge { fill: #2d3142; }
    .badge-n { fill: #f5f5f5; font: 600 12px var(--font-mono); }
    .cap { fill: #2d3142; font: 400 12px var(--font-sans); }
    .eyebrow-svg { fill: #4f5d75; font: 500 8px var(--font-mono); letter-spacing: .14em; }
  </style>
</head>
<body>
  <main data-motion-root data-motion-mode="step" data-step-count="8" data-step-current="8" data-frame="static" data-static-frame="complete">
    <p class="eyebrow">Observability · Flow · Local dev</p>
    <h1>How browser telemetry reaches OpenObserve</h1>

    <svg viewBox="0 112 1048 704" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="browser-rum-title browser-rum-desc">
      <title id="browser-rum-title">How browser telemetry reaches OpenObserve</title>
      <desc id="browser-rum-desc">In local dev, behind a feature flag, the Angular app lazily loads a RUM SDK chunk that records page and API spans plus errors, propagates trace context through API Gateway so backend spans share the browser's trace, and exports over OTLP through the web nginx to a browser-only collector receiver that marks the spans and writes them to OpenObserve.</desc>
      <defs>
        <marker id="rum-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="rum-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="rum-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
      <rect y="112" width="1048" height="704" fill="#f5f5f5"/>

      <!-- Zones (painted first) -->
      <rect x="16" y="128" width="200" height="368" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="28" y="132" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="32" y="141" class="zone-lbl">BROWSER</text>

      <rect x="296" y="128" width="176" height="152" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="308" y="132" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="312" y="141" class="zone-lbl">FLOCI :4566</text>

      <rect x="296" y="312" width="720" height="184" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="308" y="316" width="200" height="12" rx="2" fill="#f5f5f5"/>
      <text x="312" y="325" class="zone-lbl">DOCKER COMPOSE · WEB + OBSERVABILITY</text>

      <!-- Connectors (before nodes) -->
      <!-- app -> RUM SDK: spans and errors, in-process -->
      <path d="M112,248 V340" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rum-arrow)"/>
      <!-- RUM SDK self-loop: page span -->
      <path d="M80,432 V460 Q80,468 88,468 H136 Q144,468 144,460 V436" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rum-arrow)"/>
      <!-- app -> API Gateway: trace context on ApiClient calls -->
      <path d="M176,204 H316" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#rum-arrow-link)"/>
      <!-- RUM SDK -> web nginx: OTLP/HTTP -->
      <path d="M176,388 H316" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#rum-arrow-link)"/>
      <!-- web nginx -> collector: proxy to the RUM receiver -->
      <path d="M448,388 H588" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rum-arrow)"/>
      <!-- collector self-loop: mark RUM -->
      <path d="M624,432 V460 Q624,468 632,468 H680 Q688,468 688,460 V436" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rum-arrow)"/>
      <!-- collector -> OpenObserve: three streams -->
      <path d="M720,388 H860" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rum-arrow)"/>

      <!-- Arrow labels (masked, off their stroke) -->
      <rect x="128" y="300" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="164" y="309" class="lbl" text-anchor="middle">SPANS, ERRORS</text>
      <rect x="156" y="456" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="182" y="465" class="lbl" text-anchor="middle">PAGE SPAN</text>
      <rect x="224" y="184" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="260" y="193" class="lbl" text-anchor="middle">TRACE CONTEXT</text>
      <rect x="244" y="368" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="260" y="377" class="lbl" text-anchor="middle">OTLP</text>
      <rect x="508" y="368" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="528" y="377" class="lbl" text-anchor="middle">PROXY</text>
      <rect x="700" y="456" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="724" y="465" class="lbl" text-anchor="middle">MARK RUM</text>
      <rect x="764" y="368" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="802" y="377" class="lbl" text-anchor="middle">THREE STREAMS</text>

      <!-- Nodes -->
      <!-- Angular app (input) -->
      <rect x="48" y="160" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="160" width="128" height="88" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Client.svg" x="92" y="168" width="40" height="40"/>
      <text x="112" y="228" class="name" text-anchor="middle">Angular app</text>

      <!-- RUM SDK chunk (focal) -->
      <rect x="48" y="344" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="344" width="128" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Client.svg" x="92" y="348" width="40" height="40"/>
      <text x="112" y="404" class="name" text-anchor="middle">RUM SDK chunk</text>
      <text x="112" y="420" class="sub" text-anchor="middle">lazy-loaded</text>

      <!-- API Gateway -->
      <rect x="320" y="160" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="160" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonAPIGateway.svg" x="364" y="168" width="40" height="40"/>
      <text x="384" y="228" class="name" text-anchor="middle">API Gateway</text>

      <!-- Web nginx -->
      <rect x="320" y="344" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="344" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Server.svg" x="364" y="348" width="40" height="40"/>
      <text x="384" y="404" class="name" text-anchor="middle">Web nginx</text>
      <text x="384" y="420" class="sub" text-anchor="middle">same-origin proxy</text>

      <!-- OTel collector -->
      <rect x="592" y="344" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="592" y="344" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Server.svg" x="636" y="348" width="40" height="40"/>
      <text x="656" y="404" class="name" text-anchor="middle">OTel collector</text>
      <text x="656" y="420" class="sub" text-anchor="middle">RUM receiver</text>

      <!-- OpenObserve (store) -->
      <rect x="864" y="344" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="864" y="344" width="128" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/gh/openobserve/openobserve@v0.92.2/web/src/assets/images/common/mini_logo.svg" x="908" y="348" width="40" height="40"/>
      <text x="928" y="404" class="name" text-anchor="middle">OpenObserve</text>
      <text x="928" y="420" class="sub" text-anchor="middle">app_traces · rum_*</text>

      <!-- Steps: badges on their connectors + the numbered caption list -->
      <line x1="32" y1="528" x2="1016" y2="528" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="552" class="eyebrow-svg">STEPS</text>

      <g data-motion-item data-step="1" aria-label="Step 1: with the flag on, the app lazy-loads the RUM SDK chunk">
        <circle class="badge" cx="112" cy="268" r="8"/><text class="badge-n" x="112" y="272" text-anchor="middle">1</text>
        <circle class="badge" cx="40" cy="576" r="8"/><text class="badge-n" x="40" y="580" text-anchor="middle">1</text>
        <text class="cap" x="56" y="580">Only with the flag on does the lazy RUM chunk load,</text>
        <text class="cap" x="56" y="596">so OpenTelemetry stays out of the initial bundle</text>
      </g>
      <g data-motion-item data-step="2" aria-label="Step 2: the SDK rotates a page span on each navigation">
        <circle class="badge" cx="112" cy="468" r="8"/><text class="badge-n" x="112" y="472" text-anchor="middle">2</text>
        <circle class="badge" cx="40" cy="624" r="8"/><text class="badge-n" x="40" y="628" text-anchor="middle">2</text>
        <text class="cap" x="56" y="628">A page span rotates on each NavigationEnd;</text>
        <text class="cap" x="56" y="644">page.route is the route pattern, never the URL</text>
      </g>
      <g data-motion-item data-step="3" aria-label="Step 3: API calls get a root span linked to the page span, and backend spans continue the browser's trace">
        <circle class="badge" cx="112" cy="292" r="8"/><text class="badge-n" x="112" y="296" text-anchor="middle">3</text>
        <circle class="badge" cx="196" cy="204" r="8"/><text class="badge-n" x="196" y="208" text-anchor="middle">3</text>
        <circle class="badge" cx="40" cy="672" r="8"/><text class="badge-n" x="40" y="676" text-anchor="middle">3</text>
        <text class="cap" x="56" y="676">ApiClient calls get a root span linked to the page span; backend</text>
        <text class="cap" x="56" y="692">spans continue its trace. A raw fetch() gets no span at all</text>
      </g>
      <g data-motion-item data-step="4" aria-label="Step 4: RumErrorHandler emits an allow-listed error log record">
        <circle class="badge" cx="112" cy="316" r="8"/><text class="badge-n" x="112" y="320" text-anchor="middle">4</text>
        <circle class="badge" cx="40" cy="720" r="8"/><text class="badge-n" x="40" y="724" text-anchor="middle">4</text>
        <text class="cap" x="56" y="724">RumErrorHandler emits an allow-listed log record:</text>
        <text class="cap" x="56" y="740">never bodies, tokens or emails</text>
      </g>
      <g data-motion-item data-step="5" aria-label="Step 5: the SDK exports batched telemetry same-origin to the web nginx">
        <circle class="badge" cx="196" cy="388" r="8"/><text class="badge-n" x="196" y="392" text-anchor="middle">5</text>
        <circle class="badge" cx="536" cy="576" r="8"/><text class="badge-n" x="536" y="580" text-anchor="middle">5</text>
        <text class="cap" x="552" y="580">Batched traces, Web Vitals gauges and error logs go</text>
        <text class="cap" x="552" y="596">same-origin to the web nginx</text>
      </g>
      <g data-motion-item data-step="6" aria-label="Step 6: nginx forwards to the collector's browser-only receiver">
        <circle class="badge" cx="468" cy="388" r="8"/><text class="badge-n" x="468" y="392" text-anchor="middle">6</text>
        <circle class="badge" cx="536" cy="624" r="8"/><text class="badge-n" x="536" y="628" text-anchor="middle">6</text>
        <text class="cap" x="552" y="628">nginx strips its prefix and forwards to the collector's</text>
        <text class="cap" x="552" y="644">browser-only receiver</text>
      </g>
      <g data-motion-item data-step="7" aria-label="Step 7: the collector marks browser spans as RUM">
        <circle class="badge" cx="656" cy="468" r="8"/><text class="badge-n" x="656" y="472" text-anchor="middle">7</text>
        <circle class="badge" cx="536" cy="672" r="8"/><text class="badge-n" x="536" y="676" text-anchor="middle">7</text>
        <text class="cap" x="552" y="676">Spans get telemetry.source = rum</text>
        <text class="cap" x="552" y="692">and a "RUM -" name prefix</text>
      </g>
      <g data-motion-item data-step="8" aria-label="Step 8: the collector writes spans to app_traces and vitals and errors to the rum streams">
        <circle class="badge" cx="740" cy="388" r="8"/><text class="badge-n" x="740" y="392" text-anchor="middle">8</text>
        <circle class="badge" cx="536" cy="720" r="8"/><text class="badge-n" x="536" y="724" text-anchor="middle">8</text>
        <text class="cap" x="552" y="724">Spans join app_traces beside the services' spans;</text>
        <text class="cap" x="552" y="740">vitals and errors go to rum_metrics and rum_logs</text>
      </g>

      <!-- Legend strip -->
      <line x1="32" y1="768" x2="1016" y2="768" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="796" class="eyebrow-svg">LEGEND</text>
      <line x1="104" y1="792" x2="136" y2="792" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#rum-arrow-link)"/>
      <text x="148" y="796" class="lbl">HTTP FROM THE BROWSER</text>
      <line x1="296" y1="792" x2="328" y2="792" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rum-arrow)"/>
      <text x="340" y="796" class="lbl">IN-PROCESS OR PROXIED</text>
      <rect x="488" y="784" width="24" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="524" y="796" class="lbl">FOCAL · BEHIND NG_APP_RUM_ENABLED</text>
      <circle class="badge" cx="720" cy="792" r="8"/><text class="badge-n" x="720" y="796" text-anchor="middle">n</text>
      <text x="736" y="796" class="lbl">STEP · SEE CAPTION n</text>
    </svg>

    <div data-motion-controls role="group" aria-label="Diagram playback controls">
      <button type="button" data-motion-action="prev">Previous</button>
      <button type="button" data-motion-action="play" aria-pressed="false">Play</button>
      <button type="button" data-motion-action="pause" aria-pressed="true">Pause</button>
      <button type="button" data-motion-action="next">Next</button>
      <button type="button" data-motion-action="replay">Replay</button>
      <span class="keyboard-help">←/→ step · Space play/pause · R replay · Home/End jump</span>
      <span data-motion-status-visible aria-hidden="true">Step <span data-motion-step-label>8</span> of 8</span>
    </div>
    <p class="sr-only" data-motion-status role="status" aria-live="polite" aria-atomic="true"></p>
    <noscript><p>Animation controls require JavaScript. The complete final diagram is shown above.</p></noscript>
  </main>

  <script data-diagram-controls>
    (() => {
      const params = new URLSearchParams(location.search);
      const staticOverride = params.get('motion') === 'static' || document.documentElement.dataset.motion === 'static';
      const requestedStep = params.get('step');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');
      document.fonts.ready.then(() => { document.documentElement.dataset.fontsReady = 'true'; });

      document.querySelectorAll('[data-motion-root]').forEach((root) => {
        const count = Number(root.dataset.stepCount);
        const hold = parseFloat(getComputedStyle(root).getPropertyValue('--motion-hold')) || 720;
        const parsedStep = requestedStep !== null && /^\d+$/.test(requestedStep) ? Number(requestedStep) : null;
        const exactStep = params.get('motion') === 'step' && Number.isSafeInteger(parsedStep) && parsedStep >= 0 && parsedStep <= count ? parsedStep : null;
        const items = [...root.querySelectorAll('[data-motion-item]')];
        const labels = Array.from({ length: count + 1 }, (_, index) => index === 0
          ? 'Ready'
          : items.filter((item) => !item.hasAttribute('data-motion-decorative') && Number(item.dataset.step) === index)
              .map((item) => item.getAttribute('aria-label')).join('; '));
        const controls = root.querySelector('[data-motion-controls]');
        const status = root.querySelector('[data-motion-status]');
        const visibleStep = root.querySelector('[data-motion-step-label]');
        let step = count;
        let timer = 0;
        let playing = false;
        let stepBeforeReduce = 0;
        let resumeAfterReduce = root.dataset.motionMode === 'reveal';

        const buttons = (action) => controls.querySelector(`[data-motion-action="${action}"]`);
        const clearClock = () => { window.clearTimeout(timer); timer = 0; };
        const announce = () => { status.textContent = `Step ${step} of ${count}: ${labels[step] || 'Complete'}`; };
        const setControlsAvailable = (available) => {
          controls.hidden = !available;
          controls.setAttribute('aria-hidden', String(!available));
          controls.dataset.playbackDisabled = String(!available);
          controls.querySelectorAll('button').forEach((control) => { control.disabled = !available; });
        };

        function render(next, userInitiated = false) {
          step = Math.max(0, Math.min(count, next));
          root.dataset.stepCurrent = String(step);
          root.dataset.frame = step === count ? 'end' : step === 0 ? 'start' : 'step';
          items.forEach((item) => {
            const itemStep = Number(item.dataset.step);
            item.classList.toggle('is-visible', itemStep <= step);
            item.classList.toggle('is-current', itemStep === step);
          });
          if (visibleStep) visibleStep.textContent = String(step);
          const unavailable = controls.dataset.playbackDisabled === 'true';
          buttons('prev').disabled = unavailable || step === 0;
          buttons('next').disabled = unavailable || step === count;
          if (userInitiated) announce();
        }

        function pause(userInitiated = false) {
          clearClock();
          playing = false;
          root.classList.remove('is-playing');
          buttons('play').setAttribute('aria-pressed', 'false');
          buttons('pause').setAttribute('aria-pressed', 'true');
          if (userInitiated) status.textContent = `Paused at step ${step} of ${count}`;
        }

        function finish() {
          pause(false);
          root.dataset.frame = 'end';
          status.textContent = `Complete · step ${count} of ${count}`;
        }

        function tick() {
          if (!playing) return;
          if (step >= count) { finish(); return; }
          render(step + 1, false);
          if (step >= count) { finish(); return; }
          timer = window.setTimeout(tick, hold);
        }

        function play(fromStart = false, userInitiated = false) {
          clearClock();
          if (fromStart || step >= count) render(0, userInitiated);
          playing = true;
          root.classList.add('is-playing');
          buttons('play').setAttribute('aria-pressed', 'true');
          buttons('pause').setAttribute('aria-pressed', 'false');
          timer = window.setTimeout(tick, hold);
        }

        controls.addEventListener('click', (event) => {
          const button = event.target.closest('[data-motion-action]');
          if (!button) return;
          const action = button.dataset.motionAction;
          if (action === 'play') play(false, true);
          if (action === 'pause') pause(true);
          if (action === 'replay') play(true, true);
          if (action === 'prev') { pause(false); render(step - 1, true); }
          if (action === 'next') { pause(false); render(step + 1, true); }
        });

        root.addEventListener('keydown', (event) => {
          if (event.target.matches('input, textarea, select, a[href]')) return;
          const keys = { ArrowLeft: step - 1, ArrowRight: step + 1, Home: 0, End: count };
          if (event.code === 'Space' && !event.target.closest('button')) {
            event.preventDefault();
            playing ? pause(true) : play(false, true);
            return;
          }
          if (!event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === 'r') {
            event.preventDefault();
            play(true, true);
            return;
          }
          if (!(event.key in keys)) return;
          event.preventDefault();
          pause(false);
          render(keys[event.key], true);
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden' && playing) pause(false);
        });
        reduce.addEventListener('change', (event) => {
          if (event.matches && root.dataset.motionState !== 'reduced') {
            stepBeforeReduce = step;
            resumeAfterReduce = playing;
          }
          pause(false);
          if (event.matches) {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'reduced';
            status.textContent = 'Reduced motion · complete static frame · playback controls unavailable';
          } else if (staticOverride || root.dataset.motionMode === 'none') {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'static';
            status.textContent = 'Static frame · complete diagram · playback controls unavailable';
          } else {
            delete root.dataset.motionState;
            if (exactStep !== null) {
              setControlsAvailable(false);
              render(exactStep, false);
              root.dataset.frame = 'step';
              root.dataset.motionState = 'test';
              status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
            } else {
              setControlsAvailable(true);
              render(stepBeforeReduce, false);
              status.textContent = `Ready · step ${step} of ${count}`;
              if (resumeAfterReduce && root.dataset.motionMode === 'reveal') {
                play(false, false);
              }
            }
            resumeAfterReduce = false;
          }
        });

        if (staticOverride) {
          document.documentElement.dataset.motion = 'static';
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = 'static';
          status.textContent = 'Static frame · complete diagram · playback controls unavailable';
        } else if (reduce.matches || root.dataset.motionMode === 'none') {
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = reduce.matches ? 'reduced' : 'static';
          status.textContent = reduce.matches
            ? 'Reduced motion · complete static frame · playback controls unavailable'
            : 'Static frame · complete diagram · playback controls unavailable';
        } else if (exactStep !== null) {
          document.documentElement.dataset.motion = 'step';
          pause(false);
          setControlsAvailable(false);
          render(exactStep, false);
          root.dataset.frame = 'step';
          root.dataset.motionState = 'test';
          status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
        } else if (root.dataset.motionMode === 'reveal') {
          setControlsAvailable(true);
          render(0, false);
          play(false, false);
        } else {
          pause(false);
          setControlsAvailable(true);
          render(0, false);
          status.textContent = `Ready · step 0 of ${count}`;
        }
        root.classList.add('motion-ready');
      });
    })();
  </script>
</body>
</html>
