<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passwordless sign-up, then the first emailed code</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-soft: #7a8399;
      --color-accent: #eb6c36;
      --color-rule: rgba(45,49,66,0.12);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --motion-fast: 160ms;
      --motion-step: 480ms;
      --motion-hold: 960ms;
      --motion-total: 7680ms;
      --motion-ease: cubic-bezier(.2,.8,.2,1);
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 32px;
      color: var(--color-ink);
      background: var(--color-paper);
      font-family: var(--font-sans);
    }
    [data-motion-root] { width: min(100%, 1416px); }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 24px; font: 400 32px/1.15 var(--font-serif); }
    svg { display: block; width: 100%; min-width: 720px; }

    /* Static source is complete. Only an initialized enhancement hides items. */
    .motion-ready [data-motion-item] {
      opacity: .12;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
                  transform var(--motion-step) var(--motion-ease);
    }
    .motion-ready [data-motion-item].is-visible,
    .motion-ready[data-frame="end"] [data-motion-item],
    .motion-ready[data-frame="static"] [data-motion-item] {
      opacity: 1;
      transform: none;
    }
    .motion-ready[data-frame="step"] [data-motion-item].is-current .badge { fill: var(--color-accent); }

    [data-motion-controls] {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule);
    }
    .motion-ready [data-motion-controls] { display: flex; }
    [data-motion-controls][hidden] { display: none !important; }
    [data-motion-controls] button {
      min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--color-muted);
      border-radius: 4px;
      color: var(--color-ink);
      background: var(--color-paper);
      font: 600 12px/1 var(--font-sans);
      cursor: pointer;
    }
    [data-motion-controls] button:hover { border-color: var(--color-accent); }
    [data-motion-controls] button:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }
    [data-motion-controls] button:disabled { cursor: not-allowed; opacity: .45; }
    [data-motion-status-visible] {
      margin-left: auto;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    noscript p {
      margin: 12px 0 0;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }

    html[data-motion="static"] [data-motion-controls],
    html[data-motion="static"] [data-motion-decorative] { display: none !important; }
    html[data-motion="static"] [data-motion-item] {
      opacity: 1 !important;
      transform: none !important;
      animation: none !important;
      transition: none !important;
    }
    html[data-motion="step"] [data-motion-controls],
    html[data-motion="step"] [data-motion-decorative] { display: none !important; }
    html[data-motion="step"] [data-motion-item] {
      animation: none !important;
      transition: none !important;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
      [data-motion-item] { opacity: 1 !important; transform: none !important; }
      [data-motion-decorative] { display: none !important; }
      [data-motion-controls] { display: none !important; }
    }
    @media print {
      [data-motion-controls], [data-motion-decorative] { display: none !important; }
      [data-motion-item] {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        transition: none !important;
      }
    }

    .lbl { fill: #7a8399; font: 400 8px var(--font-mono); letter-spacing: .06em; }
    .zone-lbl { fill: rgba(45,49,66,0.55); font: 500 8px var(--font-mono); letter-spacing: .14em; }
    .name { fill: #2d3142; font: 600 12px var(--font-sans); }
    .sub { fill: #4f5d75; font: 400 8px var(--font-mono); letter-spacing: .04em; }
    .badge { fill: #2d3142; }
    .badge-n { fill: #f5f5f5; font: 600 12px var(--font-mono); }
    .cap { fill: #2d3142; font: 400 12px var(--font-sans); }
    .eyebrow-svg { fill: #4f5d75; font: 500 8px var(--font-mono); letter-spacing: .14em; }
  </style>
</head>
<body>
  <main data-motion-root data-motion-mode="step" data-step-count="8" data-step-current="8" data-frame="static" data-static-frame="complete">
    <p class="eyebrow">Users · Flow · Local dev on Floci</p>
    <h1>Passwordless sign-up, then the first emailed code</h1>

    <svg viewBox="0 64 1416 792" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="users-signup-otp-title users-signup-otp-desc">
      <title id="users-signup-otp-title">Passwordless sign-up, then the first emailed code</title>
      <desc id="users-signup-otp-desc">The Users service creates a passwordless Cognito user and its Users DB row, publishes USER_CREATED through SNS, SQS and the events pipeline to an SES welcome email, then opens a Cognito CUSTOM_AUTH challenge whose Lambda trigger mints a one-time code, sends AUTH_OTP_REQUESTED straight to SQS for the pipeline to email, and checks the answer before Cognito issues tokens.</desc>
      <defs>
        <marker id="uso-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="uso-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="uso-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
      <rect width="1416" height="856" fill="#f5f5f5"/>

      <!-- Zones (painted first) -->
      <rect x="304" y="248" width="176" height="192" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="316" y="252" width="92" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="261" class="zone-lbl">DOCKER COMPOSE</text>

      <rect x="584" y="80" width="816" height="508" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="596" y="84" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="93" class="zone-lbl">FLOCI :4566</text>

      <!-- Connectors (before nodes) -->
      <!-- web -> users: REST -->
      <path d="M160,344 H320" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#uso-arrow-link)"/>
      <!-- users -> cognito: sign-up, auth -->
      <path d="M448,344 H616" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#uso-arrow)"/>
      <!-- users -> db -->
      <path d="M416,280 V180 Q416,172 424,172 H616" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#uso-arrow)"/>
      <!-- users -> sns: USER_CREATED (async) -->
      <path d="M416,408 V512 Q416,520 424,520 H616" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#uso-arrow)"/>
      <!-- cognito -> otp trigger -->
      <path d="M744,344 H856" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#uso-arrow)"/>
      <!-- otp trigger -> sqs: AUTH_OTP_REQUESTED (async) -->
      <path d="M920,388 V476" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#uso-arrow)"/>
      <!-- sns -> sqs -> pipeline (async), pipeline -> ses -->
      <path d="M744,520 H856" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#uso-arrow)"/>
      <path d="M984,520 H1048" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#uso-arrow)"/>
      <path d="M1176,520 H1256" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#uso-arrow)"/>

      <!-- Arrow labels (masked, 8px off their stroke) -->
      <rect x="176" y="324" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="192" y="333" class="lbl" text-anchor="middle">REST</text>
      <rect x="456" y="324" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="490" y="333" class="lbl" text-anchor="middle">SIGNUP, AUTH</text>
      <rect x="472" y="500" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="506" y="509" class="lbl" text-anchor="middle">USER_CREATED</text>
      <rect x="748" y="324" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="770" y="333" class="lbl" text-anchor="middle">TRIGGER</text>
      <rect x="932" y="404" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="970" y="413" class="lbl" text-anchor="middle">OTP REQUESTED</text>
      <rect x="1196" y="500" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1216" y="509" class="lbl" text-anchor="middle">EMAIL</text>

      <!-- Nodes -->
      <!-- Web app (input) -->
      <rect x="32" y="300" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="300" width="128" height="88" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Client.svg" x="76" y="312" width="40" height="40"/>
      <text x="96" y="372" class="name" text-anchor="middle">Web app</text>

      <!-- Users service (focal) -->
      <rect x="320" y="280" width="128" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="280" width="128" height="128" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/resource/Server.svg" x="364" y="308" width="40" height="40"/>
      <text x="384" y="372" class="name" text-anchor="middle">Users service</text>

      <!-- Users DB (store) -->
      <rect x="616" y="128" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="128" width="128" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="624" y="134" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="638" y="143" class="sub" text-anchor="middle">VPC</text>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonRDS.svg" x="660" y="136" width="40" height="40"/>
      <text x="680" y="192" class="name" text-anchor="middle">Users DB</text>
      <text x="680" y="208" class="sub" text-anchor="middle">RDS PostgreSQL</text>

      <!-- Cognito -->
      <rect x="616" y="300" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="300" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonCognito.svg" x="660" y="308" width="40" height="40"/>
      <text x="680" y="364" class="name" text-anchor="middle">Cognito</text>
      <text x="680" y="380" class="sub" text-anchor="middle">user pool</text>

      <!-- OTP trigger (Lambda) -->
      <rect x="856" y="300" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="856" y="300" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AWSLambda.svg" x="900" y="312" width="40" height="40"/>
      <text x="920" y="372" class="name" text-anchor="middle">OTP trigger</text>

      <!-- Events topic (SNS) -->
      <rect x="616" y="476" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="476" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonSimpleNotificationService.svg" x="660" y="488" width="40" height="40"/>
      <text x="680" y="548" class="name" text-anchor="middle">Events topic</text>

      <!-- Events queue (SQS) -->
      <rect x="856" y="476" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="856" y="476" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonSimpleQueueService.svg" x="900" y="488" width="40" height="40"/>
      <text x="920" y="548" class="name" text-anchor="middle">Events queue</text>

      <!-- Events pipeline (Lambda) -->
      <rect x="1048" y="476" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="1048" y="476" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AWSLambda.svg" x="1092" y="488" width="40" height="40"/>
      <text x="1112" y="548" class="name" text-anchor="middle">Events pipeline</text>

      <!-- SES -->
      <rect x="1256" y="476" width="128" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="1256" y="476" width="128" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <image href="https://cdn.jsdelivr.net/npm/aws-icons@3.2.0/icons/architecture-service/AmazonSimpleEmailService.svg" x="1300" y="484" width="40" height="40"/>
      <text x="1320" y="540" class="name" text-anchor="middle">SES</text>
      <text x="1320" y="556" class="sub" text-anchor="middle">Mailpit</text>

      <!-- Steps: badges on their connectors + the numbered caption list -->
      <line x1="32" y1="616" x2="1384" y2="616" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="640" class="eyebrow-svg">STEPS</text>

      <g data-motion-item data-step="1" aria-label="Step 1: the browser signs up with Users, without a password">
        <circle class="badge" cx="224" cy="344" r="8"/><text class="badge-n" x="224" y="348" text-anchor="middle">1</text>
        <circle class="badge" cx="40" cy="664" r="8"/><text class="badge-n" x="40" y="668" text-anchor="middle">1</text>
        <text class="cap" x="56" y="668">The browser signs up with a name and an email; no password is chosen on this path</text>
      </g>
      <g data-motion-item data-step="2" aria-label="Step 2: Users creates the Cognito user with a throwaway password">
        <circle class="badge" cx="544" cy="344" r="8"/><text class="badge-n" x="544" y="348" text-anchor="middle">2</text>
        <circle class="badge" cx="40" cy="696" r="8"/><text class="badge-n" x="40" y="700" text-anchor="middle">2</text>
        <text class="cap" x="56" y="700">Users signs the user up in Cognito with a random password it never logs, returns or stores</text>
      </g>
      <g data-motion-item data-step="3" aria-label="Step 3: the PASSWORDLESS row lands in the Users DB">
        <circle class="badge" cx="504" cy="172" r="8"/><text class="badge-n" x="504" y="176" text-anchor="middle">3</text>
        <circle class="badge" cx="40" cy="728" r="8"/><text class="badge-n" x="40" y="732" text-anchor="middle">3</text>
        <text class="cap" x="56" y="732">The row keeps the Cognito sub and auth type PASSWORDLESS in the Users DB</text>
      </g>
      <g data-motion-item data-step="4" aria-label="Step 4: USER_CREATED flows through SNS, SQS and the pipeline to a welcome email">
        <circle class="badge" cx="416" cy="464" r="8"/><text class="badge-n" x="416" y="468" text-anchor="middle">4</text>
        <circle class="badge" cx="1196" cy="520" r="8"/><text class="badge-n" x="1196" y="524" text-anchor="middle">4</text>
        <circle class="badge" cx="40" cy="760" r="8"/><text class="badge-n" x="40" y="764" text-anchor="middle">4</text>
        <text class="cap" x="56" y="764">USER_CREATED goes to the SNS topic and the events queue; the pipeline sends the welcome via SES</text>
      </g>
      <g data-motion-item data-step="5" aria-label="Step 5: Users opens a CUSTOM_AUTH session for the browser">
        <circle class="badge" cx="256" cy="344" r="8"/><text class="badge-n" x="256" y="348" text-anchor="middle">5</text>
        <circle class="badge" cx="568" cy="344" r="8"/><text class="badge-n" x="568" y="348" text-anchor="middle">5</text>
        <circle class="badge" cx="728" cy="664" r="8"/><text class="badge-n" x="728" y="668" text-anchor="middle">5</text>
        <text class="cap" x="744" y="668">Right after sign-up, Users opens a CUSTOM_AUTH session and hands the browser its opaque handle</text>
      </g>
      <g data-motion-item data-step="6" aria-label="Step 6: the OTP trigger mints a one-time code">
        <circle class="badge" cx="808" cy="344" r="8"/><text class="badge-n" x="808" y="348" text-anchor="middle">6</text>
        <circle class="badge" cx="728" cy="696" r="8"/><text class="badge-n" x="728" y="700" text-anchor="middle">6</text>
        <text class="cap" x="744" y="700">The trigger mints a 6-digit code held only in Cognito's private challenge</text>
      </g>
      <g data-motion-item data-step="7" aria-label="Step 7: AUTH_OTP_REQUESTED goes straight to SQS and the pipeline emails the code">
        <circle class="badge" cx="920" cy="452" r="8"/><text class="badge-n" x="920" y="456" text-anchor="middle">7</text>
        <circle class="badge" cx="1236" cy="520" r="8"/><text class="badge-n" x="1236" y="524" text-anchor="middle">7</text>
        <circle class="badge" cx="728" cy="728" r="8"/><text class="badge-n" x="728" y="732" text-anchor="middle">7</text>
        <text class="cap" x="744" y="732">AUTH_OTP_REQUESTED goes straight to the queue, past SNS; the pipeline emails the code via SES</text>
      </g>
      <g data-motion-item data-step="8" aria-label="Step 8: Users answers the challenge and Cognito issues tokens">
        <circle class="badge" cx="288" cy="344" r="8"/><text class="badge-n" x="288" y="348" text-anchor="middle">8</text>
        <circle class="badge" cx="592" cy="344" r="8"/><text class="badge-n" x="592" y="348" text-anchor="middle">8</text>
        <circle class="badge" cx="832" cy="344" r="8"/><text class="badge-n" x="832" y="348" text-anchor="middle">8</text>
        <circle class="badge" cx="728" cy="760" r="8"/><text class="badge-n" x="728" y="764" text-anchor="middle">8</text>
        <text class="cap" x="744" y="764">Users answers the challenge; the trigger checks the code and Cognito issues tokens</text>
      </g>

      <!-- Legend strip -->
      <line x1="32" y1="808" x2="1384" y2="808" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="836" class="eyebrow-svg">LEGEND</text>
      <line x1="104" y1="832" x2="136" y2="832" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#uso-arrow)"/>
      <text x="148" y="836" class="lbl">SYNC CALL</text>
      <line x1="236" y1="832" x2="268" y2="832" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#uso-arrow-link)"/>
      <text x="280" y="836" class="lbl">HTTP FROM THE BROWSER</text>
      <line x1="424" y1="832" x2="456" y2="832" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#uso-arrow)"/>
      <text x="468" y="836" class="lbl">ASYNC · TOPIC, QUEUE</text>
      <rect x="604" y="824" width="24" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="640" y="836" class="lbl">FOCAL SERVICE</text>
      <circle class="badge" cx="756" cy="832" r="8"/><text class="badge-n" x="756" y="836" text-anchor="middle">n</text>
      <text x="772" y="836" class="lbl">STEP · SEE CAPTION n</text>
      <rect x="912" y="826" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="926" y="835" class="sub" text-anchor="middle">VPC</text>
      <text x="952" y="836" class="lbl">IN VPC 10.0.0.0/16 · SUBNETS A+B</text>
    </svg>

    <div data-motion-controls role="group" aria-label="Diagram playback controls">
      <button type="button" data-motion-action="prev">Previous</button>
      <button type="button" data-motion-action="play" aria-pressed="false">Play</button>
      <button type="button" data-motion-action="pause" aria-pressed="true">Pause</button>
      <button type="button" data-motion-action="next">Next</button>
      <button type="button" data-motion-action="replay">Replay</button>
      <span class="keyboard-help">←/→ step · Space play/pause · R replay · Home/End jump</span>
      <span data-motion-status-visible aria-hidden="true">Step <span data-motion-step-label>8</span> of 8</span>
    </div>
    <p class="sr-only" data-motion-status role="status" aria-live="polite" aria-atomic="true"></p>
    <noscript><p>Animation controls require JavaScript. The complete final diagram is shown above.</p></noscript>
  </main>

  <script data-diagram-controls>
    (() => {
      const params = new URLSearchParams(location.search);
      const staticOverride = params.get('motion') === 'static' || document.documentElement.dataset.motion === 'static';
      const requestedStep = params.get('step');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');
      document.fonts.ready.then(() => { document.documentElement.dataset.fontsReady = 'true'; });

      document.querySelectorAll('[data-motion-root]').forEach((root) => {
        const count = Number(root.dataset.stepCount);
        const hold = parseFloat(getComputedStyle(root).getPropertyValue('--motion-hold')) || 720;
        const parsedStep = requestedStep !== null && /^\d+$/.test(requestedStep) ? Number(requestedStep) : null;
        const exactStep = params.get('motion') === 'step' && Number.isSafeInteger(parsedStep) && parsedStep >= 0 && parsedStep <= count ? parsedStep : null;
        const items = [...root.querySelectorAll('[data-motion-item]')];
        const labels = Array.from({ length: count + 1 }, (_, index) => index === 0
          ? 'Ready'
          : items.filter((item) => !item.hasAttribute('data-motion-decorative') && Number(item.dataset.step) === index)
              .map((item) => item.getAttribute('aria-label')).join('; '));
        const controls = root.querySelector('[data-motion-controls]');
        const status = root.querySelector('[data-motion-status]');
        const visibleStep = root.querySelector('[data-motion-step-label]');
        let step = count;
        let timer = 0;
        let playing = false;
        let stepBeforeReduce = 0;
        let resumeAfterReduce = root.dataset.motionMode === 'reveal';

        const buttons = (action) => controls.querySelector(`[data-motion-action="${action}"]`);
        const clearClock = () => { window.clearTimeout(timer); timer = 0; };
        const announce = () => { status.textContent = `Step ${step} of ${count}: ${labels[step] || 'Complete'}`; };
        const setControlsAvailable = (available) => {
          controls.hidden = !available;
          controls.setAttribute('aria-hidden', String(!available));
          controls.dataset.playbackDisabled = String(!available);
          controls.querySelectorAll('button').forEach((control) => { control.disabled = !available; });
        };

        function render(next, userInitiated = false) {
          step = Math.max(0, Math.min(count, next));
          root.dataset.stepCurrent = String(step);
          root.dataset.frame = step === count ? 'end' : step === 0 ? 'start' : 'step';
          items.forEach((item) => {
            const itemStep = Number(item.dataset.step);
            item.classList.toggle('is-visible', itemStep <= step);
            item.classList.toggle('is-current', itemStep === step);
          });
          if (visibleStep) visibleStep.textContent = String(step);
          const unavailable = controls.dataset.playbackDisabled === 'true';
          buttons('prev').disabled = unavailable || step === 0;
          buttons('next').disabled = unavailable || step === count;
          if (userInitiated) announce();
        }

        function pause(userInitiated = false) {
          clearClock();
          playing = false;
          root.classList.remove('is-playing');
          buttons('play').setAttribute('aria-pressed', 'false');
          buttons('pause').setAttribute('aria-pressed', 'true');
          if (userInitiated) status.textContent = `Paused at step ${step} of ${count}`;
        }

        function finish() {
          pause(false);
          root.dataset.frame = 'end';
          status.textContent = `Complete · step ${count} of ${count}`;
        }

        function tick() {
          if (!playing) return;
          if (step >= count) { finish(); return; }
          render(step + 1, false);
          if (step >= count) { finish(); return; }
          timer = window.setTimeout(tick, hold);
        }

        function play(fromStart = false, userInitiated = false) {
          clearClock();
          if (fromStart || step >= count) render(0, userInitiated);
          playing = true;
          root.classList.add('is-playing');
          buttons('play').setAttribute('aria-pressed', 'true');
          buttons('pause').setAttribute('aria-pressed', 'false');
          timer = window.setTimeout(tick, hold);
        }

        controls.addEventListener('click', (event) => {
          const button = event.target.closest('[data-motion-action]');
          if (!button) return;
          const action = button.dataset.motionAction;
          if (action === 'play') play(false, true);
          if (action === 'pause') pause(true);
          if (action === 'replay') play(true, true);
          if (action === 'prev') { pause(false); render(step - 1, true); }
          if (action === 'next') { pause(false); render(step + 1, true); }
        });

        root.addEventListener('keydown', (event) => {
          if (event.target.matches('input, textarea, select, a[href]')) return;
          const keys = { ArrowLeft: step - 1, ArrowRight: step + 1, Home: 0, End: count };
          if (event.code === 'Space' && !event.target.closest('button')) {
            event.preventDefault();
            playing ? pause(true) : play(false, true);
            return;
          }
          if (!event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === 'r') {
            event.preventDefault();
            play(true, true);
            return;
          }
          if (!(event.key in keys)) return;
          event.preventDefault();
          pause(false);
          render(keys[event.key], true);
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden' && playing) pause(false);
        });
        reduce.addEventListener('change', (event) => {
          if (event.matches && root.dataset.motionState !== 'reduced') {
            stepBeforeReduce = step;
            resumeAfterReduce = playing;
          }
          pause(false);
          if (event.matches) {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'reduced';
            status.textContent = 'Reduced motion · complete static frame · playback controls unavailable';
          } else if (staticOverride || root.dataset.motionMode === 'none') {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'static';
            status.textContent = 'Static frame · complete diagram · playback controls unavailable';
          } else {
            delete root.dataset.motionState;
            if (exactStep !== null) {
              setControlsAvailable(false);
              render(exactStep, false);
              root.dataset.frame = 'step';
              root.dataset.motionState = 'test';
              status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
            } else {
              setControlsAvailable(true);
              render(stepBeforeReduce, false);
              status.textContent = `Ready · step ${step} of ${count}`;
              if (resumeAfterReduce && root.dataset.motionMode === 'reveal') {
                play(false, false);
              }
            }
            resumeAfterReduce = false;
          }
        });

        if (staticOverride) {
          document.documentElement.dataset.motion = 'static';
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = 'static';
          status.textContent = 'Static frame · complete diagram · playback controls unavailable';
        } else if (reduce.matches || root.dataset.motionMode === 'none') {
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = reduce.matches ? 'reduced' : 'static';
          status.textContent = reduce.matches
            ? 'Reduced motion · complete static frame · playback controls unavailable'
            : 'Static frame · complete diagram · playback controls unavailable';
        } else if (exactStep !== null) {
          document.documentElement.dataset.motion = 'step';
          pause(false);
          setControlsAvailable(false);
          render(exactStep, false);
          root.dataset.frame = 'step';
          root.dataset.motionState = 'test';
          status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
        } else if (root.dataset.motionMode === 'reveal') {
          setControlsAvailable(true);
          render(0, false);
          play(false, false);
        } else {
          pause(false);
          setControlsAvailable(true);
          render(0, false);
          status.textContent = `Ready · step 0 of ${count}`;
        }
        root.classList.add('motion-ready');
      });
    })();
  </script>
</body>
</html>
