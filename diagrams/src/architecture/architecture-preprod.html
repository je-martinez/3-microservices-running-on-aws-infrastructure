    <p class="eyebrow">Architecture · Pre-prod (ECS on Floci)</p>
    <h1>Pre-prod on Floci — request path</h1>
    <p class="subtitle">One ECS cluster across two AZs: ECS places each Fargate task in either subnet; one ALB listener per service</p>

    <svg viewBox="0 0 1872 1280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-preprod-title architecture-preprod-desc">
      <title id="architecture-preprod-title">Pre-prod on Floci — request path</title>
      <desc id="architecture-preprod-desc">Architecture of the pre-prod environment, where every service runs as an ECS Fargate task on its own Floci: the browser loads the SPA through the ALB and calls API Gateway, which validates JWTs with Cognito and routes to the ALB; the ALB has one listener per ECS service; the orders and tracking tasks call users over gRPC; the backend tasks use RDS and ElastiCache; the cluster pulls images from ECR and reads task config from SSM plus Secrets Manager; the browser loads images from the S3 assets bucket and holds a live socket on the API Gateway WebSocket API; the backend tasks publish events through the SNS topic to SQS, which triggers the events-pipeline Lambda that sends email through SES; users and the events-pipeline Lambda push frames to the WebSocket API; every task ships logs and pushes custom metrics to CloudWatch, the backend tasks send OTLP traces to the OTel collector task, and the collector polls CloudWatch for logs and metrics and exports everything over OTLP to the OpenObserve task; when the optional Stripe integration is on, the browser loads Stripe.js, users creates setup intents, orders charges and refunds, and the Stripe CLI forwards webhooks to the ALB listeners of users and orders; when the optional Geoapify integration is on, the web task's nginx proxies address autocomplete to Geoapify.</desc>
