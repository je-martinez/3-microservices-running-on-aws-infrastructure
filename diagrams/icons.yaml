# Allowlist of icons a diagram may reference: `icons` = AWS Architecture Icons (aws-icons@3.2.0 on jsDelivr),
# `devicon` = technology logos (devicon@2.16.0 on jsDelivr), `vendor` = a vendor's own logo served from its
# official GitHub repo through jsDelivr (cdn.jsdelivr.net/gh/), pinned to a release tag or a full commit SHA.
# A diagram's <image href> must be the section's prefix + one of its values; anything else fails
# make diagrams-gate. Keys are unique across sections.
