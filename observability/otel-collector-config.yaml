# OpenTelemetry Collector config for 3MRAI log observability.
# Two receivers feed one logs pipeline exported to self-hosted OpenObserve.
#   - fluent_forward: the compose services' stdout, via Docker's fluentd driver.
#   - aws_cloudwatch: ECS/RDS logs Floci runs (e.g. the nginx ECS task).
# Env-parameterized so the same file serves local (Floci) and, later, prod.
receivers:
  # Docker fluentd driver → here. The services set fluentd-address=localhost:24224
  # (the daemon resolves it from the host, hence the published port).
  fluent_forward:
    endpoint: 0.0.0.0:24224
  # OTLP from the services' OpenTelemetry SDKs — TRACES only. Logs keep using
  # fluent_forward: the services still write JSON to stdout and Docker's fluentd
  # driver ships it, so the log path is unchanged by tracing.
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

  # Polls CloudWatch. AWS_ENDPOINT_URL redirects it to Floci locally.
  aws_cloudwatch:
    region: ${env:AWS_REGION}
    logs:
      poll_interval: 1m
      groups:
        autodiscover:
          limit: 50
          prefix: /ecs/

processors:
  # Parse the service's JSON stdout line (carried in body) into top-level
  # attributes so OpenObserve exposes them as queryable columns. Services already
  # emit snake_case, so this only flattens — no per-service renaming.
  transform/parse_body:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - merge_maps(attributes, ParseJSON(body), "upsert") where IsMatch(body, "^\\s*\\{")

          # nginx access logs (combined format) arrive from CloudWatch as PLAIN
          # TEXT, so the JSON statement above skips them and they land with only
          # a raw `body` — no service_name, no status, nothing queryable. That
          # makes them invisible to any dashboard or filter written against the
          # shared schema, which is a real gap: nginx is the only place the
          # edge's own traffic shows up (a gateway 404 never reaches a service).
          #
          # Map them onto the same field names the services emit, so one query
          # spans application and gateway logs.
          #   192.168.148.3 - - [20/Jul/2026:03:01:17 +0000] "POST /v1/orders HTTP/1.1" 409 109 "-" "curl/8.7.1"
          # Tag EVERY line from the nginx log group, not just access logs. The
          # container also emits startup output (`/docker-entrypoint.sh: …`,
          # `10-listen-on-ipv6-by-default.sh: info: …`) which matches no access
          # format, so it previously fell through untagged and unclassified —
          # landing in the stream with severity 0 (UNSPECIFIED) and no
          # service_name, invisible to every schema-based filter.
          # Guarded on the attribute being non-nil BEFORE IsMatch touches it.
          # IsMatch on a nil value raises, and with error_mode: ignore that
          # aborts the whole statement silently — which is why every nginx record
          # was still arriving with no service_name despite this rule existing.
          # Most records reaching here are NOT from CloudWatch and have no log
          # group at all, so the nil case is the common one, not the exception.
          - set(attributes["service_name"], "nginx")
            where attributes["service_name"] == nil
              and attributes["cloudwatch_log_group_name"] != nil
              and IsMatch(attributes["cloudwatch_log_group_name"], "nginx")

          # Access logs are the subset in combined format. Only these carry
          # method/route/status; the startup lines are classified further down.
          - set(attributes["nginx_log_kind"], "access")
            where attributes["service_name"] == "nginx"
              and IsMatch(body, "^\\S+ \\S+ \\S+ \\[")
          - set(attributes["http_request_method"], ExtractPatterns(body, "\"(?P<m>[A-Z]+) ")["m"])
            where attributes["nginx_log_kind"] == "access"
          - set(attributes["http_route"], ExtractPatterns(body, "\"[A-Z]+ (?P<p>\\S+) HTTP")["p"])
            where attributes["nginx_log_kind"] == "access"
          - set(attributes["http_response_status_code"], Int(ExtractPatterns(body, "HTTP/[0-9.]+\" (?P<s>[0-9]{3})")["s"]))
            where attributes["nginx_log_kind"] == "access"
          # Severity mirrors the services' OTel-aligned numbers so a
          # severity-based filter behaves identically across every source.
          - set(attributes["severity_text"], "ERROR")
            where attributes["nginx_log_kind"] == "access" and attributes["http_response_status_code"] >= 500
          - set(attributes["severity_text"], "WARN")
            where attributes["nginx_log_kind"] == "access" and attributes["http_response_status_code"] >= 400 and attributes["http_response_status_code"] < 500
          # Everything else from nginx — access 2xx/3xx AND the container's
          # startup output — is informational. Without this the startup lines
          # keep severity 0 (UNSPECIFIED), which is what put them outside every
          # severity filter and rendered them uncoloured.
          - set(attributes["severity_text"], "INFO")
            where attributes["service_name"] == "nginx" and attributes["severity_text"] == nil
          - set(attributes["severity_number"], 17) where attributes["severity_text"] == "ERROR" and attributes["service_name"] == "nginx"
          - set(attributes["severity_number"], 13) where attributes["severity_text"] == "WARN" and attributes["service_name"] == "nginx"
          - set(attributes["severity_number"], 9) where attributes["severity_text"] == "INFO" and attributes["service_name"] == "nginx"
          # nginx startup lines: keep them, but mark them so the "log a request
          # once" filter below can tell them apart from access logs.
          - set(attributes["nginx_log_kind"], "startup")
            where attributes["service_name"] == "nginx" and attributes["nginx_log_kind"] == nil

          # Promote our severity onto the log record's NATIVE severity fields.
          #
          # Everything above writes ATTRIBUTES, which are queryable but invisible
          # to the UI: OpenObserve colours its charts from the record's own
          # `severity`, which stayed 0 (UNSPECIFIED) for EVERY row in the system
          # — services included, not just nginx. That is why warnings and errors
          # all rendered the same blue. The attributes stay as they are (the
          # cross-service schema depends on those names); these two lines just
          # mirror them where the backend actually looks.
          - set(severity_number, Int(attributes["severity_number"])) where attributes["severity_number"] != nil
          - set(severity_text, attributes["severity_text"]) where attributes["severity_text"] != nil

  # Drop nginx access logs for requests that REACHED a service.
  #
  # WHY: for any 2xx/3xx/4xx the service already logs the same request with
  # strictly more information — `POST /v1/users/login 401` from nginx duplicates
  # `login_failed reason=invalid_credentials` from users. Keeping both doubles
  # the volume and makes every count query ambiguous about what it is counting.
  #
  # WHY NOT ALL OF IT: nginx is the only source that sees a request which never
  # reaches a service at all — a 502, a bad upstream, a route the gateway
  # mis-resolves. Those produce no service log by definition, so dropping the
  # whole group would create a blind spot at the edge precisely when it matters.
  # 5xx and anything unparsed are therefore kept.
  #
  # This is also what removes the `THIS IS INVALID STREAM` rows: that string is
  # a placeholder the aws_cloudwatch receiver substitutes when it cannot resolve
  # a stream name (Floci's real streams are named 2026/07/20/nginx/<task-id>),
  # so it is an emulator artifact carrying no signal.
  filter/drop_nginx_noise:
    error_mode: ignore
    logs:
      log_record:
        - 'attributes["service_name"] == "nginx" and attributes["http_response_status_code"] != nil and attributes["http_response_status_code"] < 500'

  # The SQL-echo split. These two conditions MUST stay exact complements: a
  # record matching neither is lost, and one matching both is stored twice. They
  # are written against the same expression so the pair can be read as one rule.
  #
  # `filter` DROPS what matches, so the sense is inverted in each: the sql
  # pipeline drops everything that is NOT a statement, the logs pipeline drops
  # everything that IS one.
  #
  # Matching on the statement keywords rather than on the logger name because
  # the fluent_forward path carries no logger field — by the time a record
  # reaches here it is the parsed JSON body, and `message` is what survives.
  # SQLAlchemy's echo also emits the parameter tuples on their own lines
  # ("[generated in 0.0001s] {...}"), which start with neither keyword; those
  # stay in the main stream, which is imperfect but harmless — they are one line
  # per statement, not per row.
  # Reads `attributes`, not `body`: transform/parse_body merges the parsed JSON
  # into attributes, so by the time a record reaches here the message lives
  # there. Same place the nginx filter above tests.
  filter/only_sql:
    error_mode: ignore
    logs:
      log_record:
        - 'not (attributes["message"] != nil and IsMatch(attributes["message"], "^(SELECT|INSERT|UPDATE|DELETE|BEGIN|COMMIT|ROLLBACK)\\b"))'

  filter/drop_sql:
    error_mode: ignore
    logs:
      log_record:
        - 'attributes["message"] != nil and IsMatch(attributes["message"], "^(SELECT|INSERT|UPDATE|DELETE|BEGIN|COMMIT|ROLLBACK)\\b")'

  batch: {}

exporters:
  # OpenObserve OTLP-HTTP ingest (ADR-0018). Use otlp_http — the otlphttp alias
  # is deprecated. Basic auth + stream-name are what OpenObserve requires.
  otlp_http/openobserve:
    endpoint: http://openobserve:5080/api/default
    headers:
      Authorization: "Basic ${env:O2_BASIC_AUTH}"
      stream-name: logs

  # SQL echo goes to its OWN stream. Same instance, same auth — only the
  # stream-name header differs, which is how OpenObserve separates them.
  #
  # Why separate rather than drop: the statements are genuinely useful locally
  # (SQLAlchemy's echo is on outside production by design — Settings.echo_sql),
  # but they are high-volume and drown the application events in the default
  # stream. A single tracking read emits several SELECTs, so a flow log ends up
  # buried among the queries that served it.
  #
  # They keep their shared-context fields (user_id, order_id, trace_id…), so a
  # query can still be traced back to the request that issued it — the split is
  # about which stream you look at, not about losing the correlation.
  otlp_http/openobserve_sql:
    endpoint: http://openobserve:5080/api/default
    headers:
      Authorization: "Basic ${env:O2_BASIC_AUTH}"
      stream-name: sql

  # Traces go to the SAME OpenObserve instance, a different stream. One backend
  # for both signals is what lets trace_id join a log line to its span without
  # querying across two systems (see the tracing ADR).
  # Traces go to Jaeger, NOT OpenObserve — see ADR-0019.
  #
  # WHY NOT OpenObserve: its trace ingest rejected every batch the collector
  # sent with HTTP 400, while a hand-rolled OTLP-JSON POST to the same endpoint
  # returned 206. So the route and the auth are right; the collector's
  # serialization and this OpenObserve build's parser disagree, and `encoding:
  # json` did not reconcile them. Rather than keep guessing at a third party's
  # ingest, traces land in Jaeger, which speaks OTLP natively. This is exactly
  # the backend re-evaluation ADR-0018 said would be needed if tracing ever
  # became a hard requirement — it flagged OpenObserve's APM maturity as the
  # known weak spot.
  #
  # Logs still go to OpenObserve (the exporter above, untouched). The two are
  # joined by trace_id, which every log line now carries.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  telemetry:
    logs:
      level: info
  pipelines:
    logs:
      receivers: [fluent_forward, aws_cloudwatch]
      # Order matters: parse first so the filter can test real fields
      # (service_name, http_response_status_code) rather than pattern-match raw
      # text, then drop, then batch — so dropped records never reach the batcher.
      processors: [transform/parse_body, filter/drop_nginx_noise, filter/drop_sql, batch]
      exporters: [otlp_http/openobserve]

    # SQL echo, same receivers, opposite filter, its own stream. Two pipelines
    # rather than one with routing because the exporter is what carries the
    # stream-name header, and a record can only leave through one.
    #
    # Both start with the same transform/parse_body: each pipeline processes its
    # own copy of every record, so the parse has to happen in both. The filters
    # then discard the copy that does not belong, which is why they must remain
    # exact complements — see their definitions.
    logs/sql:
      receivers: [fluent_forward, aws_cloudwatch]
      processors: [transform/parse_body, filter/only_sql, batch]
      exporters: [otlp_http/openobserve_sql]
    # No transform/parse_body here: OTLP traces arrive already structured, so
    # there is no JSON-in-a-string body to flatten as there is for stdout logs.
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
