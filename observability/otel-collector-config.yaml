# OpenTelemetry Collector config for 3MRAI log observability.
# Two receivers feed one logs pipeline exported to self-hosted OpenObserve.
#   - fluent_forward: the compose services' stdout, via Docker's fluentd driver.
#   - aws_cloudwatch: ECS/RDS logs Floci runs (e.g. the nginx ECS task).
# Env-parameterized so the same file serves local (Floci) and, later, prod.
receivers:
  # Docker fluentd driver → here. The services set fluentd-address=localhost:24224
  # (the daemon resolves it from the host, hence the published port).
  fluent_forward:
    endpoint: 0.0.0.0:24224
  # OTLP from the services' OpenTelemetry SDKs — TRACES only. Logs keep using
  # fluent_forward: the services still write JSON to stdout and Docker's fluentd
  # driver ships it, so the log path is unchanged by tracing.
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

  # Polls CloudWatch. AWS_ENDPOINT_URL redirects it to Floci locally.
  # ONE receiver, TWO signals: `logs` (ECS/RDS log groups) and `metrics` (the
  # services' custom business metrics). The same component does both — adding
  # metrics needed no new receiver.
  aws_cloudwatch:
    region: ${env:AWS_REGION}
    logs:
      poll_interval: 1m
      groups:
        autodiscover:
          limit: 50
          # NO prefix: discover every log group, not just /ecs/.
          #
          # This used to be `prefix: /ecs/`, which silently excluded the
          # events-pipeline: it is a Lambda, so its logs land in
          # /aws/lambda/<fn> and nothing about the pipeline ever reached
          # OpenObserve. The service looked instrumented — it logs plenty — and
          # only a "why is there no data for this service" query surfaced it.
          #
          # The `limit` still caps discovery, so a runaway number of groups
          # cannot flood the collector.

    # Custom business metrics, read with GetMetricData. The services publish them
    # with PutMetricData; see the design spec for why CloudWatch is the source of
    # truth rather than a bypassed intermediary.
    metrics:
      # LOCAL values. Real AWS uses 60s/60s (CloudWatch's standard resolution) and
      # keeps the default delay.
      #
      # collection_interval MUST be >= period — the receiver validates this at
      # startup and refuses to boot otherwise. That is a loud failure, which is
      # what we want.
      collection_interval: 15s
      period: 15s
      # LOCAL ONLY, and load-bearing. The default is 10 MINUTES: it shifts the
      # query window back to compensate for real CloudWatch's publication latency.
      # Floci has no such latency, so leaving the default means NOTHING appears
      # for the first ten minutes — indistinguishable from a broken pipeline, with
      # no error anywhere. Do not remove this line locally.
      delay: 0s
      queries:
        # `dimensions` is a MAP here ({Service: users}), NOT the AWS CLI's
        # list-of-{Name,Value} form.
        #
        # Every query MUST name the EXACT dimension set the metric was published
        # with. Floci does not aggregate across dimensions: a query whose
        # dimensions differ returns an EMPTY result with StatusCode "Complete" —
        # a silent no-data, not an error. Real CloudWatch would aggregate, so a
        # query written against AWS semantics renders green and empty here.
        #
        # `stats` choice is NOT cosmetic:
        #   - counters  -> Sum      (add up the events in the window)
        #   - gauges    -> Maximum  (report the single sample in the window)
        # Summing a gauge ADDS every sample in the window, so two publishes
        # landing in one window report DOUBLE the real count. That is the easiest
        # way to produce a plausible wrong number in this pipeline.

        # --- Users -----------------------------------------------------------
        - namespace: "3MRAI"
          metric_name: "users_registered_total"
          dimensions: { Service: users }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "password_resets_total"
          dimensions: { Service: users }
          stats: [Sum]
        # Two series, one per HasPassword value. Both are always published (zero
        # included) so a value with no users reads as 0 rather than as "no data".
        - namespace: "3MRAI"
          metric_name: "users_total"
          dimensions: { Service: users, HasPassword: "true" }
          stats: [Maximum]
        - namespace: "3MRAI"
          metric_name: "users_total"
          dimensions: { Service: users, HasPassword: "false" }
          stats: [Maximum]
        # The pre-summed total, published by the service rather than derived
        # here: neither CloudWatch (no cross-dimension aggregation) nor PromQL
        # (scrapes carry distinct start_times, so sum() sees one series) can
        # compute it correctly downstream.
        - namespace: "3MRAI"
          metric_name: "users_total"
          dimensions: { Service: users, HasPassword: "ALL" }
          stats: [Maximum]

        # --- Orders ----------------------------------------------------------
        # The TRUE order count, from Orders' own table. Together with the two
        # tracking series below it exposes the Orders<->Tracking integration
        # health: orders_total - (DELIVERED + IN_PROGRESS) is the number of
        # orders whose init-tracking call failed. Normally 0.
        - namespace: "3MRAI"
          metric_name: "orders_total"
          dimensions: { Service: orders }
          stats: [Maximum]

        # --- Tracking --------------------------------------------------------
        # Finished vs unfinished orders, keyed on the tracking state machine's
        # terminal status.
        - namespace: "3MRAI"
          metric_name: "orders_by_tracking_status_total"
          dimensions: { Service: tracking, Status: DELIVERED }
          stats: [Maximum]
        - namespace: "3MRAI"
          metric_name: "orders_by_tracking_status_total"
          dimensions: { Service: tracking, Status: IN_PROGRESS }
          stats: [Maximum]
        # DELIVERED + IN_PROGRESS, pre-summed by the service. Same reasoning as
        # users_total's ALL series above.
        - namespace: "3MRAI"
          metric_name: "orders_by_tracking_status_total"
          dimensions: { Service: tracking, Status: ALL }
          stats: [Maximum]

        # --- events-pipeline -------------------------------------------------
        # EmailType: ALL is a SEPARATELY PUBLISHED series, not a query-time
        # rollup — see the no-aggregation note above. Per-template series are
        # deliberately not listed yet (nine keys x sent/failed x failure kind is
        # a long list that would need editing on every new template); JE-150
        # decides between listing them and switching to `discovery`.
        - namespace: "3MRAI"
          metric_name: "emails_sent_total"
          dimensions: { Service: events-pipeline, EmailType: ALL }
          stats: [Sum]
        # permanent = the email is LOST (not retried). transient = SQS will retry.
        # Splitting them is the difference between an incident and expected noise.
        - namespace: "3MRAI"
          metric_name: "emails_failed_total"
          dimensions: { Service: events-pipeline, EmailType: ALL, FailureKind: permanent }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "emails_failed_total"
          dimensions: { Service: events-pipeline, EmailType: ALL, FailureKind: transient }
          stats: [Sum]

        # --- HTTP errors, all three HTTP services ----------------------------
        # 4xx/5xx only. A per-2xx metric would be a request-rate metric, which
        # the logs already provide. The events-pipeline is absent on purpose: it
        # is a Lambda with no HTTP surface.
        - namespace: "3MRAI"
          metric_name: "http_errors_total"
          dimensions: { Service: users, StatusClass: 4xx }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "http_errors_total"
          dimensions: { Service: users, StatusClass: 5xx }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "http_errors_total"
          dimensions: { Service: orders, StatusClass: 4xx }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "http_errors_total"
          dimensions: { Service: orders, StatusClass: 5xx }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "http_errors_total"
          dimensions: { Service: tracking, StatusClass: 4xx }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "http_errors_total"
          dimensions: { Service: tracking, StatusClass: 5xx }
          stats: [Sum]

processors:
  # Parse the service's JSON stdout line (carried in body) into top-level
  # attributes so OpenObserve exposes them as queryable columns. Services already
  # emit snake_case, so this only flattens — no per-service renaming.
  transform/parse_body:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - merge_maps(attributes, ParseJSON(body), "upsert") where IsMatch(body, "^\\s*\\{")

          # nginx access logs (combined format) arrive from CloudWatch as PLAIN
          # TEXT, so the JSON statement above skips them and they land with only
          # a raw `body` — no service_name, no status, nothing queryable. That
          # makes them invisible to any dashboard or filter written against the
          # shared schema, which is a real gap: nginx is the only place the
          # edge's own traffic shows up (a gateway 404 never reaches a service).
          #
          # Map them onto the same field names the services emit, so one query
          # spans application and gateway logs.
          #   192.168.148.3 - - [20/Jul/2026:03:01:17 +0000] "POST /v1/orders HTTP/1.1" 409 109 "-" "curl/8.7.1"
          # Tag EVERY line from the nginx log group, not just access logs. The
          # container also emits startup output (`/docker-entrypoint.sh: …`,
          # `10-listen-on-ipv6-by-default.sh: info: …`) which matches no access
          # format, so it previously fell through untagged and unclassified —
          # landing in the stream with severity 0 (UNSPECIFIED) and no
          # service_name, invisible to every schema-based filter.
          # Guarded on the attribute being non-nil BEFORE IsMatch touches it.
          # IsMatch on a nil value raises, and with error_mode: ignore that
          # aborts the whole statement silently — which is why every nginx record
          # was still arriving with no service_name despite this rule existing.
          # Most records reaching here are NOT from CloudWatch and have no log
          # group at all, so the nil case is the common one, not the exception.
          - set(attributes["service_name"], "nginx")
            where attributes["service_name"] == nil
              and attributes["cloudwatch_log_group_name"] != nil
              and IsMatch(attributes["cloudwatch_log_group_name"], "nginx")

          # Access logs are the subset in combined format. Only these carry
          # method/route/status; the startup lines are classified further down.
          - set(attributes["nginx_log_kind"], "access")
            where attributes["service_name"] == "nginx"
              and IsMatch(body, "^\\S+ \\S+ \\S+ \\[")
          - set(attributes["http_request_method"], ExtractPatterns(body, "\"(?P<m>[A-Z]+) ")["m"])
            where attributes["nginx_log_kind"] == "access"
          - set(attributes["http_route"], ExtractPatterns(body, "\"[A-Z]+ (?P<p>\\S+) HTTP")["p"])
            where attributes["nginx_log_kind"] == "access"
          - set(attributes["http_response_status_code"], Int(ExtractPatterns(body, "HTTP/[0-9.]+\" (?P<s>[0-9]{3})")["s"]))
            where attributes["nginx_log_kind"] == "access"
          # Severity mirrors the services' OTel-aligned numbers so a
          # severity-based filter behaves identically across every source.
          - set(attributes["severity_text"], "ERROR")
            where attributes["nginx_log_kind"] == "access" and attributes["http_response_status_code"] >= 500
          - set(attributes["severity_text"], "WARN")
            where attributes["nginx_log_kind"] == "access" and attributes["http_response_status_code"] >= 400 and attributes["http_response_status_code"] < 500
          # Everything else from nginx — access 2xx/3xx AND the container's
          # startup output — is informational. Without this the startup lines
          # keep severity 0 (UNSPECIFIED), which is what put them outside every
          # severity filter and rendered them uncoloured.
          - set(attributes["severity_text"], "INFO")
            where attributes["service_name"] == "nginx" and attributes["severity_text"] == nil
          - set(attributes["severity_number"], 17) where attributes["severity_text"] == "ERROR" and attributes["service_name"] == "nginx"
          - set(attributes["severity_number"], 13) where attributes["severity_text"] == "WARN" and attributes["service_name"] == "nginx"
          - set(attributes["severity_number"], 9) where attributes["severity_text"] == "INFO" and attributes["service_name"] == "nginx"
          # nginx startup lines: keep them, but mark them so the "log a request
          # once" filter below can tell them apart from access logs.
          - set(attributes["nginx_log_kind"], "startup")
            where attributes["service_name"] == "nginx" and attributes["nginx_log_kind"] == nil

          # Promote our severity onto the log record's NATIVE severity fields.
          #
          # Everything above writes ATTRIBUTES, which are queryable but invisible
          # to the UI: OpenObserve colours its charts from the record's own
          # `severity`, which stayed 0 (UNSPECIFIED) for EVERY row in the system
          # — services included, not just nginx. That is why warnings and errors
          # all rendered the same blue. The attributes stay as they are (the
          # cross-service schema depends on those names); these two lines just
          # mirror them where the backend actually looks.
          - set(severity_number, Int(attributes["severity_number"])) where attributes["severity_number"] != nil
          - set(severity_text, attributes["severity_text"]) where attributes["severity_text"] != nil

  # Drop nginx access logs for requests that REACHED a service.
  #
  # WHY: for any 2xx/3xx/4xx the service already logs the same request with
  # strictly more information — `POST /v1/users/login 401` from nginx duplicates
  # `login_failed reason=invalid_credentials` from users. Keeping both doubles
  # the volume and makes every count query ambiguous about what it is counting.
  #
  # WHY NOT ALL OF IT: nginx is the only source that sees a request which never
  # reaches a service at all — a 502, a bad upstream, a route the gateway
  # mis-resolves. Those produce no service log by definition, so dropping the
  # whole group would create a blind spot at the edge precisely when it matters.
  # 5xx and anything unparsed are therefore kept.
  #
  # This is also what removes the `THIS IS INVALID STREAM` rows: that string is
  # a placeholder the aws_cloudwatch receiver substitutes when it cannot resolve
  # a stream name (Floci's real streams are named 2026/07/20/nginx/<task-id>),
  # so it is an emulator artifact carrying no signal.
  filter/drop_nginx_noise:
    error_mode: ignore
    logs:
      log_record:
        - 'attributes["service_name"] == "nginx" and attributes["http_response_status_code"] != nil and attributes["http_response_status_code"] < 500'

  # WiredTiger's internal storage-engine chatter, from the DocumentDB cluster's
  # log group (/aws/docdb/cluster/<id>/audit).
  #
  # Despite the group name these are MongoDB's own server logs, not an audit
  # trail: Floci backs DocumentDB with a stock mongo:7.0 container and ships its
  # stdout under a docdb-shaped group. The checkpointer emits a line per cycle
  # forever ("saving checkpoint snapshot min: 547, snapshot max: 547 …"),
  # independent of any query the pipeline makes, and recovery does the same at
  # startup. On a system doing nothing they were 141 of the group's ~250 lines.
  #
  # Matched on the WiredTiger verbose CATEGORY rather than on the log group,
  # which is the whole point: that group also carries lines worth keeping —
  # `***** SERVER RESTARTED *****`, `Connection not authenticating`, index
  # builds, `createCollection`. Dropping the group wholesale would take the
  # storage layer's only real signals with it. Checked before writing this:
  # every restart and auth failure in the window clustered around a
  # `make bootstrap`, and the container had been up for hours since — noise, not
  # a fault, but noise worth being able to see next time.
  #
  # DEBUG_1 verbosity is not filtered on: severity here is "I" (info) on every
  # line, so the category is the only field that separates them.
  #
  # The path is NESTED — attributes["attr"]["message"]["category"] — not the flat
  # `attr_message_category` the field appears under in OpenObserve. transform/
  # parse_body merges the parsed body with merge_maps, which preserves the JSON's
  # own nesting; the underscore-joined name is created later, by OpenObserve's
  # indexer. Filtering on the flat name silently matched nothing (verified: 2
  # checkpoints emitted, 2 still arriving), because a nil lookup under
  # error_mode: ignore drops the condition rather than raising.
  #
  # WHERE THIS RUNS: in the logs/docdb pipeline ONLY (see below), NOT in the
  # main logs pipeline. Once filter/drop_docdb routes the whole group out of
  # `logs`, leaving this filter there would silently match nothing — every
  # WiredTiger line would already have been diverted. Keeping it on the docdb
  # stream preserves the original intent: the noisy WT_VERB_ checkpoints stay
  # out even of the dedicated stream, while restart/auth/index signals remain
  # queryable there. Deleting the filter entirely would re-flood `docdb` with
  # the same chatter that motivated this rule in the first place.
  filter/drop_wiredtiger_noise:
    error_mode: ignore
    logs:
      log_record:
        - 'attributes["attr"] != nil and attributes["attr"]["message"] != nil and attributes["attr"]["message"]["category"] != nil and IsMatch(attributes["attr"]["message"]["category"], "^WT_VERB_")'

  # The Valkey/ElastiCache split — same shape as the SQL split below, and for the
  # same reason: the engine log is high-volume and drowns the application events
  # in the main stream, but it is worth keeping, so it gets its OWN stream rather
  # than a drop rule.
  #
  # WHAT IS IN HERE: the cache cluster's engine log
  # (/aws/elasticache/cluster/<id>/engine-log). Most of it is housekeeping —
  # "DB 0: 7 keys (7 volatile) in 14 slots HT." every ~5s forever (activeExpireCycle,
  # ~17k lines/day on a completely idle stack), plus an "Accepted <ip>" /
  # "Client closed connection id=… cmd=ping" PAIR per health-check probe. In the
  # 50-record sample that prompted this, 12 (24%) were that periodic dump while
  # the system did nothing but run one E2E spec.
  #
  # WHY THE WHOLE GROUP AND NOT JUST THE NOISY LINES: the first attempt here was
  # a drop rule matched on message shape (the approach filter/drop_wiredtiger_noise
  # uses). Routing the group wholesale is better on both counts — nothing is lost,
  # so the lines that DO matter (`Ready to accept connections`, the version banner,
  # OOM-killer messages, `MISCONF`, replication and background-save failures) stay
  # queryable in the `redis` stream instead of being weighed against the noise, and
  # there is no pattern to keep in sync with a future Valkey release's wording.
  #
  # Matching on the LOG GROUP is what makes this safe to do wholesale: it is a
  # routing decision, not a filtering one. The group name is stable (it comes from
  # the cluster identifier, not from Floci's per-run ids) and holds exactly one
  # source, so "everything from this group" and "everything from the cache engine"
  # are the same set.
  #
  # These two conditions MUST stay exact complements, exactly like the SQL pair:
  # a record matching neither is LOST, and one matching both is stored TWICE.
  # `filter` DROPS what matches, so the sense is inverted in each — the redis
  # pipeline drops everything that is NOT from the group, the main pipeline drops
  # everything that IS.
  #
  # The nil guard comes FIRST and is load-bearing: most records reaching here
  # arrive over fluent_forward and carry no log group at all, so nil is the common
  # case, not the exception. IsMatch on a nil value raises, and under
  # error_mode: ignore that aborts the whole statement silently — the same failure
  # that left every nginx record untagged for so long (see transform/parse_body).
  #
  # TWO THINGS HERE ARE EASY TO GET WRONG, and both fail SILENTLY — the first
  # attempt at this split got both, routed nothing, and produced no error:
  #
  #  1. SCOPE. The log group is a RESOURCE attribute, not a log-record one. The
  #     receiver sets it on the resource:
  #
  #         resourceAttributes := resourceLogs.Resource().Attributes()
  #         resourceAttributes.PutStr("cloudwatch.log.group.name", logGroupName)
  #
  #     while the log record itself gets only `id`. So this must be read as
  #     `resource.attributes[...]`; a `log_record`-context `attributes[...]` is
  #     always nil, every condition collapses, and every record takes the same
  #     branch. Note the surrounding filters DO read log-record attributes
  #     (service_name, message) — those are written by transform/parse_body, which
  #     is why they work there and this one cannot be copied from them.
  #
  #  2. NAME. The real key is DOT-separated — `cloudwatch.log.group.name`. The
  #     underscored `cloudwatch_log_group_name` seen in OpenObserve is created
  #     later, by its indexer, exactly like the `dimensions_service` rename noted
  #     on the metrics exporter below. Filtering on the name as it appears in the
  #     UI matches nothing here.
  filter/only_redis:
    error_mode: ignore
    logs:
      log_record:
        - 'resource.attributes["cloudwatch.log.group.name"] == nil or not IsMatch(resource.attributes["cloudwatch.log.group.name"], "/elasticache/")'

  filter/drop_redis:
    error_mode: ignore
    logs:
      log_record:
        - 'resource.attributes["cloudwatch.log.group.name"] != nil and IsMatch(resource.attributes["cloudwatch.log.group.name"], "/elasticache/")'

  # The DocumentDB split — same shape as the redis/SQL splits above, and for the
  # same reason: the engine log is the single largest source in the main `logs`
  # stream (hundreds of records per hour, more than every application service
  # combined), but it is worth keeping, so it gets its OWN stream rather than a
  # drop rule.
  #
  # WHAT IS IN HERE: the DocumentDB cluster's audit log group
  # (/aws/docdb/cluster/<id>/audit). Despite the name these are MongoDB server
  # logs under Floci (see filter/drop_wiredtiger_noise): WiredTiger checkpoints,
  # restarts, auth failures, index builds, createCollection. Routing the WHOLE
  # group is deliberate — same rationale as redis. A per-message drop would
  # force a pattern to stay in sync with future mongo wording, and the lines
  # that DO matter (`***** SERVER RESTARTED *****`, `Connection not
  # authenticating`) must stay queryable somewhere. The WiredTiger noise filter
  # then runs INSIDE the docdb pipeline so checkpoints do not flood even that
  # stream — see the comment on filter/drop_wiredtiger_noise for why it left
  # the main pipeline.
  #
  # Matching on the LOG GROUP (resource attribute) is what makes this safe to do
  # wholesale. Same two silent-failure traps as redis — both already cost time:
  #
  #  1. SCOPE. Read `resource.attributes["cloudwatch.log.group.name"]`, NOT a
  #     log-record `attributes[...]`. The receiver puts the group on the resource.
  #  2. NAME. DOT-separated key. The underscored OpenObserve column is an
  #     indexer rename and matches nothing here.
  #
  # These two conditions MUST stay exact complements. Nil guard FIRST: most
  # records arrive over fluent_forward with no log group at all.
  filter/only_docdb:
    error_mode: ignore
    logs:
      log_record:
        - 'resource.attributes["cloudwatch.log.group.name"] == nil or not IsMatch(resource.attributes["cloudwatch.log.group.name"], "/docdb/")'

  filter/drop_docdb:
    error_mode: ignore
    logs:
      log_record:
        - 'resource.attributes["cloudwatch.log.group.name"] != nil and IsMatch(resource.attributes["cloudwatch.log.group.name"], "/docdb/")'

  # The SQL-echo split. These two conditions MUST stay exact complements: a
  # record matching neither is lost, and one matching both is stored twice. They
  # are written against the same expression so the pair can be read as one rule.
  #
  # `filter` DROPS what matches, so the sense is inverted in each: the sql
  # pipeline drops everything that is NOT a statement, the logs pipeline drops
  # everything that IS one.
  #
  # Matching on the statement keywords rather than on the logger name because
  # the fluent_forward path carries no logger field — by the time a record
  # reaches here it is the parsed JSON body, and `message` is what survives.
  # SQLAlchemy's echo also emits the parameter tuples on their own lines
  # ("[generated in 0.0001s] {...}"), which start with neither keyword; those
  # stay in the main stream, which is imperfect but harmless — they are one line
  # per statement, not per row.
  # Reads `attributes`, not `body`: transform/parse_body merges the parsed JSON
  # into attributes, so by the time a record reaches here the message lives
  # there. Same place the nginx filter above tests.
  # Two shapes of SQL log reach here, and the pair of conditions below must
  # recognise BOTH or the streams stop being complements:
  #
  #  - SQLAlchemy (tracking) echoes the bare statement, so `message` itself
  #    starts with the keyword.
  #  - EF Core (orders) wraps it: message is
  #    "Executed DbCommand (4ms) [Parameters=[…]] SELECT COUNT(*) FROM …",
  #    which does NOT match ^SELECT. It does, however, carry the bare statement
  #    in its own `commandText` property, which is what the second clause tests.
  #
  # Without that second clause, raising EF Core back to Information would send
  # every DbCommand into the MAIN stream — the exact noise this repo just
  # removed — instead of the sql stream where tracking's equivalent already
  # lives.
  filter/only_sql:
    error_mode: ignore
    logs:
      log_record:
        - 'not ((attributes["message"] != nil and IsMatch(attributes["message"], "^(SELECT|INSERT|UPDATE|DELETE|BEGIN|COMMIT|ROLLBACK)\\b")) or (attributes["commandText"] != nil))'

  filter/drop_sql:
    error_mode: ignore
    logs:
      log_record:
        - '(attributes["message"] != nil and IsMatch(attributes["message"], "^(SELECT|INSERT|UPDATE|DELETE|BEGIN|COMMIT|ROLLBACK)\\b")) or (attributes["commandText"] != nil)'

  # Collapse `start_time` so a metric is ONE series, not one per scrape.
  #
  # The aws_cloudwatch receiver stamps every scrape with the query window's
  # start. OpenObserve folds that into series identity, so each scrape became a
  # brand-new series. The damage is arithmetic, not cosmetic: a __hash__ audit
  # showed single hashes covering HasPassword true/false/ALL at once, which is
  # how `users_total{HasPassword="true"}` came back as 5 — the ALL value. It also
  # produced a "total users" card reading 9 beside its own breakdown reading 450.
  #
  # Zeroing it (rather than deleting it) is what works, and the reason is worth
  # keeping. Dumped from the receiver with the debug exporter rather than
  # guessed:
  #
  #     -> Name: amazonaws.com/3MRAI/users_total
  #     Data point attributes:
  #       -> Dimensions: Map({"HasPassword":"true","Service":"users"})
  #     StartTimestamp: 2026-08-14 22:25:15 +0000 UTC   <- varies per scrape
  #
  # `start_time` is NOT an attribute — it is the data point's own
  # StartTimestamp field. So no label-level processor can touch it:
  # metricstransform's aggregate_labels operates on the label set and never sees
  # it. Worse, the dimensions are ONE attribute called `Dimensions` holding a
  # map, not separate labels, so a label_set of [Service, HasPassword] retains
  # NOTHING and merges the three series into one with the breakdown gone
  # (HasPassword=None carrying 5). Both were tried; both did exactly that.
  #
  # A datapoint-context transform reaches the field directly. Setting it to 0
  # makes it constant across scrapes, which is all series identity needs — the
  # measurement's own `Timestamp` and value are untouched, so nothing about when
  # or what was measured changes. Verified against the debug exporter:
  # StartTimestamp 1970-01-01 on every scrape, Value still 3.
  transform/collapse_metric_start_time:
    error_mode: propagate
    metric_statements:
      - context: datapoint
        statements:
          - set(start_time_unix_nano, 0)
          # Zeroing start_time alone was NOT enough, and the __hash__ audit is
          # what showed it: with start_time constant, all three HasPassword
          # series still shared ONE hash, and PromQL returned a single series
          # answering 5 (the ALL value) under the label `true`.
          #
          # The reason is above — the receiver puts every dimension inside a
          # single `Dimensions` map attribute. A map is one attribute, so the
          # values inside it never reach series identity, and three logically
          # distinct series are indistinguishable to the backend.
          #
          # Promoting each entry to its own attribute is what separates them.
          # Verified against the debug exporter: `-> HasPassword: Str(true)` and
          # `-> Service: Str(users)` as siblings of Namespace/MetricName, rather
          # than `-> Dimensions: Map({...})`.
          - merge_maps(attributes, attributes["Dimensions"], "upsert") where attributes["Dimensions"] != nil
          # Drop the map once flattened: leaving it would keep an attribute
          # whose value differs per series, and OpenObserve would index a
          # redundant column of stringified maps beside the real ones.
          - delete_key(attributes, "Dimensions")

  batch: {}

exporters:
  # OpenObserve OTLP-HTTP ingest (ADR-0018). Use otlp_http — the otlphttp alias
  # is deprecated. Basic auth + stream-name are what OpenObserve requires.
  otlp_http/openobserve:
    endpoint: http://openobserve:5080/api/${env:O2_ORG}
    headers:
      Authorization: "Basic ${env:O2_BASIC_AUTH}"
      stream-name: logs

  # SQL echo goes to its OWN stream. Same instance, same auth — only the
  # stream-name header differs, which is how OpenObserve separates them.
  #
  # Why separate rather than drop: the statements are genuinely useful locally
  # (SQLAlchemy's echo is on outside production by design — Settings.echo_sql),
  # but they are high-volume and drown the application events in the default
  # stream. A single tracking read emits several SELECTs, so a flow log ends up
  # buried among the queries that served it.
  #
  # They keep their shared-context fields (user_id, order_id, trace_id…), so a
  # query can still be traced back to the request that issued it — the split is
  # about which stream you look at, not about losing the correlation.
  otlp_http/openobserve_sql:
    endpoint: http://openobserve:5080/api/${env:O2_ORG}
    headers:
      Authorization: "Basic ${env:O2_BASIC_AUTH}"
      stream-name: sql

  # The cache engine log gets its own stream too — same instance, same auth, only
  # the stream-name header differs, exactly like the sql split above.
  #
  # Why separate rather than drop: the engine log is mostly housekeeping (see
  # filter/only_redis for the volume), but it is the ONLY place the cache reports
  # an OOM kill, a MISCONF that silently stops writes, or a background-save
  # failure. Those are rare and quiet, which is precisely why they must not be
  # weighed against thousands of expire-cycle lines in the main stream — and also
  # why they must not be dropped. Splitting keeps them one query away without
  # letting them set the volume of the stream everyone reads by default.
  otlp_http/openobserve_redis:
    endpoint: http://openobserve:5080/api/${env:O2_ORG}
    headers:
      Authorization: "Basic ${env:O2_BASIC_AUTH}"
      stream-name: redis

  # DocumentDB engine/audit log gets its own stream — same instance, same auth,
  # only the stream-name header differs, exactly like the redis/sql splits.
  #
  # Why separate rather than drop: the group dwarfs application logs in volume
  # (see filter/only_docdb), but it is the ONLY place the storage layer reports
  # a restart, an auth failure, or an index build. Splitting keeps those one
  # query away without letting WiredTiger chatter set the volume of the stream
  # everyone reads by default. filter/drop_wiredtiger_noise still strips the
  # checkpoint noise inside this stream.
  otlp_http/openobserve_docdb:
    endpoint: http://openobserve:5080/api/${env:O2_ORG}
    headers:
      Authorization: "Basic ${env:O2_BASIC_AUTH}"
      stream-name: docdb

  # Traces go to the SAME OpenObserve instance, a different stream. One backend
  # for both signals is what lets trace_id join a log line to its span without
  # querying across two systems (see the tracing ADR).
  # Traces go to Jaeger, NOT OpenObserve — see ADR-0019.
  #
  # WHY NOT OpenObserve: its trace ingest rejected every batch the collector
  # sent with HTTP 400, while a hand-rolled OTLP-JSON POST to the same endpoint
  # returned 206. So the route and the auth are right; the collector's
  # serialization and this OpenObserve build's parser disagree, and `encoding:
  # json` did not reconcile them. Rather than keep guessing at a third party's
  # ingest, traces land in Jaeger, which speaks OTLP natively. This is exactly
  # the backend re-evaluation ADR-0018 said would be needed if tracing ever
  # became a hard requirement — it flagged OpenObserve's APM maturity as the
  # known weak spot.
  #
  # Logs still go to OpenObserve (the exporter above, untouched). The two are
  # joined by trace_id, which every log line now carries.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Metrics to OpenObserve, its own stream — same instance and auth as logs,
  # differing only in the stream-name header, exactly like the sql split above.
  #
  # WHY THIS WORKS WHEN TRACES DID NOT: ADR-0019 records OpenObserve rejecting
  # every trace batch the collector sent with HTTP 400, which is why traces go to
  # Jaeger. Its METRICS ingest does not have that problem — verified end to end
  # before this config was written: the stream is created and the data points come
  # back queryable.
  #
  # Note for dashboard authors: OpenObserve PREFIXES AND LOWERCASES the CloudWatch
  # dimensions on ingest. A dimension published as `Service` is queried here as
  # `dimensions_service`. The metric name becomes the stream name, sanitized:
  # amazonaws.com/3MRAI/orders_total -> amazonaws_com_3mrai_orders_total.
  otlp_http/openobserve_metrics:
    endpoint: http://openobserve:5080/api/${env:O2_ORG}
    headers:
      Authorization: "Basic ${env:O2_BASIC_AUTH}"
      stream-name: metrics

service:
  telemetry:
    logs:
      level: info
  pipelines:
    logs:
      receivers: [fluent_forward, aws_cloudwatch]
      # Order matters: parse first so the filter can test real fields
      # (service_name, http_response_status_code) rather than pattern-match raw
      # text, then drop, then batch — so dropped records never reach the batcher.
      #
      # filter/drop_wiredtiger_noise deliberately NOT listed here: once
      # filter/drop_docdb diverts the whole DocumentDB log group, that filter
      # would match nothing in this pipeline. It runs in logs/docdb instead.
      processors: [transform/parse_body, filter/drop_nginx_noise, filter/drop_redis, filter/drop_docdb, filter/drop_sql, batch]
      exporters: [otlp_http/openobserve]

    # SQL echo, same receivers, opposite filter, its own stream. Two pipelines
    # rather than one with routing because the exporter is what carries the
    # stream-name header, and a record can only leave through one.
    #
    # Both start with the same transform/parse_body: each pipeline processes its
    # own copy of every record, so the parse has to happen in both. The filters
    # then discard the copy that does not belong, which is why they must remain
    # exact complements — see their definitions.
    logs/sql:
      receivers: [fluent_forward, aws_cloudwatch]
      processors: [transform/parse_body, filter/only_sql, batch]
      exporters: [otlp_http/openobserve_sql]

    # Cache engine log, its own stream. Same structure as logs/sql: same
    # receivers, the complementary filter, a different exporter.
    #
    # aws_cloudwatch is the only receiver that can actually produce a record
    # here — the group attribute exists only on the CloudWatch path — but
    # fluent_forward stays listed for symmetry with the pipelines above, and
    # because filter/only_redis discards its records anyway (they carry no log
    # group, so the nil branch drops them).
    #
    # transform/parse_body runs here too. The engine log is plain text, not JSON,
    # so the parse is a no-op for these records — but each pipeline processes its
    # OWN copy of every record, so omitting it would only make this pipeline
    # inconsistent with the others for no gain.
    #
    # NOT in the main logs pipeline's drop list by accident: filter/drop_redis
    # there and filter/only_redis here are exact complements, so every record
    # lands in exactly one of the two streams.
    logs/redis:
      receivers: [fluent_forward, aws_cloudwatch]
      processors: [transform/parse_body, filter/only_redis, batch]
      exporters: [otlp_http/openobserve_redis]

    # DocumentDB engine/audit log, its own stream. Same structure as logs/redis:
    # same receivers, the complementary filter, a different exporter.
    #
    # aws_cloudwatch is the only receiver that can produce a matching record —
    # the group attribute exists only on the CloudWatch path — but fluent_forward
    # stays listed for symmetry; filter/only_docdb discards its records via the
    # nil branch.
    #
    # transform/parse_body runs here so WiredTiger's nested
    # attr.message.category is available to filter/drop_wiredtiger_noise. That
    # filter lives HERE (not in the main logs pipeline): after drop_docdb routes
    # the group out of `logs`, the main pipeline has nothing left for it to act
    # on. Keeping the filter on this stream strips checkpoint noise without
    # losing restart/auth/index signals — see its definition for the full WHY.
    #
    # filter/drop_docdb in the main pipeline and filter/only_docdb here are exact
    # complements, so every record lands in exactly one of the two streams.
    logs/docdb:
      receivers: [fluent_forward, aws_cloudwatch]
      processors: [transform/parse_body, filter/only_docdb, filter/drop_wiredtiger_noise, batch]
      exporters: [otlp_http/openobserve_docdb]

    # No transform/parse_body here: OTLP traces arrive already structured, so
    # there is no JSON-in-a-string body to flatten as there is for stdout logs.
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]

    # Custom business metrics: CloudWatch -> OpenObserve. Same receiver as the
    # logs pipeline, different signal — the receiver's `metrics` block above is
    # what this pipeline consumes.
    #
    # No transform/parse_body, for the same reason as traces: metrics arrive
    # already structured, unlike the services' stdout JSON.
    metrics:
      receivers: [aws_cloudwatch]
      # collapse_metric_start_time BEFORE batch: it is what makes a metric one
      # series instead of one per scrape, so batching ships real series.
      processors: [transform/collapse_metric_start_time, batch]
      exporters: [otlp_http/openobserve_metrics]
