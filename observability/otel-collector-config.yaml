# OpenTelemetry Collector config for 3MRAI log observability.
# Two receivers feed one logs pipeline exported to self-hosted OpenObserve.
#   - fluent_forward: the compose services' stdout, via Docker's fluentd driver.
#   - aws_cloudwatch: ECS/RDS logs Floci runs (e.g. the nginx ECS task).
# Env-parameterized so the same file serves local (Floci) and, later, prod.
receivers:
  # Docker fluentd driver → here. The services set fluentd-address=localhost:24224
  # (the daemon resolves it from the host, hence the published port).
  fluent_forward:
    endpoint: 0.0.0.0:24224
  # OTLP from the services' OpenTelemetry SDKs — TRACES only. Logs keep using
  # fluent_forward: the services still write JSON to stdout and Docker's fluentd
  # driver ships it, so the log path is unchanged by tracing.
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

  # Polls CloudWatch. AWS_ENDPOINT_URL redirects it to Floci locally.
  # ONE receiver, TWO signals: `logs` (ECS/RDS log groups) and `metrics` (the
  # services' custom business metrics). The same component does both — adding
  # metrics needed no new receiver.
  aws_cloudwatch:
    region: ${env:AWS_REGION}
    logs:
      poll_interval: 1m
      groups:
        autodiscover:
          limit: 50
          # CONTRACT: Do NOT add a `prefix` here. A `/ecs/` prefix excludes the
          # events-pipeline Lambda (/aws/lambda/<fn>), and nothing from it ever
          # reaches OpenObserve — with no error. `limit` still caps discovery.
          # See [[openobserve-cloudwatch]]

    # Custom business metrics, read with GetMetricData. The services publish them
    # with PutMetricData; see the design spec for why CloudWatch is the source of
    # truth rather than a bypassed intermediary.
    metrics:
      # CONTRACT: `period` MUST track the publishers' interval (60s, via
      # METRICS_INTERVAL_MS / METRICS_INTERVAL_SECONDS in the generated env
      # files). A 15s period against a 60s publisher empties three of every four
      # windows, and a Maximum gauge then renders as gaps on a healthy system.
      # collection_interval MUST be >= period; the receiver refuses to boot
      # otherwise. See [[2026-08-14-counter-metrics-need-a-clock-and-a-window]]
      collection_interval: 60s
      period: 60s
      # WORKAROUND(local): Do NOT drop this line. The default delay is 10
      # MINUTES (it compensates for real CloudWatch's publication latency);
      # Floci has none, so the default shows NOTHING for ten minutes with no
      # error — indistinguishable from a broken pipeline.
      delay: 0s
      queries:
        # CONTRACT: `dimensions` is a MAP ({Service: users}), not the AWS CLI's
        # list-of-{Name,Value}. Every query MUST name the EXACT dimension set the
        # metric was published with — Floci does not aggregate across dimensions,
        # so a mismatched query returns EMPTY with StatusCode "Complete" (silent
        # no-data, not an error). Counters use Sum, gauges Maximum: summing a
        # gauge adds every sample, so two publishes in one window report DOUBLE.
        # See [[openobserve-cloudwatch]]

        # --- Users -----------------------------------------------------------
        - namespace: "3MRAI"
          metric_name: "users_registered_total"
          dimensions: { Service: users }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "password_resets_total"
          dimensions: { Service: users }
          stats: [Sum]
        # Two series, one per HasPassword value. Both are always published (zero
        # included) so a value with no users reads as 0 rather than as "no data".
        - namespace: "3MRAI"
          metric_name: "users_total"
          dimensions: { Service: users, HasPassword: "true" }
          stats: [Maximum]
        - namespace: "3MRAI"
          metric_name: "users_total"
          dimensions: { Service: users, HasPassword: "false" }
          stats: [Maximum]
        # The pre-summed total, published by the service rather than derived
        # here: neither CloudWatch (no cross-dimension aggregation) nor PromQL
        # (scrapes carry distinct start_times, so sum() sees one series) can
        # compute it correctly downstream.
        - namespace: "3MRAI"
          metric_name: "users_total"
          dimensions: { Service: users, HasPassword: "ALL" }
          stats: [Maximum]

        # --- Orders ----------------------------------------------------------
        # The TRUE order count, from Orders' own table. Together with the two
        # tracking series below it exposes the Orders<->Tracking integration
        # health: orders_total - (DELIVERED + IN_PROGRESS) is the number of
        # orders whose init-tracking call failed. Normally 0.
        - namespace: "3MRAI"
          metric_name: "orders_total"
          dimensions: { Service: orders }
          stats: [Maximum]

        # --- Tracking --------------------------------------------------------
        # Finished vs unfinished orders, keyed on the tracking state machine's
        # terminal status.
        - namespace: "3MRAI"
          metric_name: "orders_by_tracking_status_total"
          dimensions: { Service: tracking, Status: DELIVERED }
          stats: [Maximum]
        - namespace: "3MRAI"
          metric_name: "orders_by_tracking_status_total"
          dimensions: { Service: tracking, Status: IN_PROGRESS }
          stats: [Maximum]
        # DELIVERED + IN_PROGRESS, pre-summed by the service. Same reasoning as
        # users_total's ALL series above.
        - namespace: "3MRAI"
          metric_name: "orders_by_tracking_status_total"
          dimensions: { Service: tracking, Status: ALL }
          stats: [Maximum]

        # --- events-pipeline -------------------------------------------------
        # EmailType: ALL is a SEPARATELY PUBLISHED series, not a query-time
        # rollup — see the no-aggregation note above. Per-template series are
        # deliberately not listed yet (nine keys x sent/failed x failure kind is
        # a long list that would need editing on every new template); JE-150
        # decides between listing them and switching to `discovery`.
        - namespace: "3MRAI"
          metric_name: "emails_sent_total"
          dimensions: { Service: events-pipeline, EmailType: ALL }
          stats: [Sum]
        # permanent = the email is LOST (not retried). transient = SQS will retry.
        # Splitting them is the difference between an incident and expected noise.
        - namespace: "3MRAI"
          metric_name: "emails_failed_total"
          dimensions: { Service: events-pipeline, EmailType: ALL, FailureKind: permanent }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "emails_failed_total"
          dimensions: { Service: events-pipeline, EmailType: ALL, FailureKind: transient }
          stats: [Sum]
        # Per-template failure series, on top of the ALL rollups above. Only the
        # FAILURE metric is broken out: GetMetricData discovers nothing, so both
        # metrics would cost 27 queries, and only the failure split distinguishes
        # "the receipt is broken" from "one OTP bounced".
        # CONTRACT: The nine keys come from `src/email/catalog.ts`, NOT the design
        # spec (whose list is stale). A key the code never publishes returns
        # nothing here, silently.
        # WARNING: A template key MISSING from the catalog is exactly what emits
        # the `permanent` failure, so it can be a key absent below and invisible
        # in this breakdown. The `EmailType: ALL` rollup above still counts it.
        # See [[logging-context]]
        - namespace: "3MRAI"
          metric_name: "emails_failed_total"
          dimensions: { Service: events-pipeline, EmailType: user-created, FailureKind: permanent }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "emails_failed_total"
          dimensions: { Service: events-pipeline, EmailType: user-created, FailureKind: transient }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "emails_failed_total"
          dimensions: { Service: events-pipeline, EmailType: order-created, FailureKind: permanent }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "emails_failed_total"
          dimensions: { Service: events-pipeline, EmailType: order-created, FailureKind: transient }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "emails_failed_total"
          dimensions: { Service: events-pipeline, EmailType: tracking-status-changed-placed, FailureKind: permanent }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "emails_failed_total"
          dimensions: { Service: events-pipeline, EmailType: tracking-status-changed-placed, FailureKind: transient }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "emails_failed_total"
          dimensions: { Service: events-pipeline, EmailType: tracking-status-changed-processing, FailureKind: permanent }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "emails_failed_total"
          dimensions: { Service: events-pipeline, EmailType: tracking-status-changed-processing, FailureKind: transient }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "emails_failed_total"
          dimensions: { Service: events-pipeline, EmailType: tracking-status-changed-shipped, FailureKind: permanent }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "emails_failed_total"
          dimensions: { Service: events-pipeline, EmailType: tracking-status-changed-shipped, FailureKind: transient }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "emails_failed_total"
          dimensions: { Service: events-pipeline, EmailType: tracking-status-changed-out-for-delivery, FailureKind: permanent }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "emails_failed_total"
          dimensions: { Service: events-pipeline, EmailType: tracking-status-changed-out-for-delivery, FailureKind: transient }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "emails_failed_total"
          dimensions: { Service: events-pipeline, EmailType: tracking-status-changed-delivered, FailureKind: permanent }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "emails_failed_total"
          dimensions: { Service: events-pipeline, EmailType: tracking-status-changed-delivered, FailureKind: transient }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "emails_failed_total"
          dimensions: { Service: events-pipeline, EmailType: auth-otp, FailureKind: permanent }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "emails_failed_total"
          dimensions: { Service: events-pipeline, EmailType: auth-otp, FailureKind: transient }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "emails_failed_total"
          dimensions: { Service: events-pipeline, EmailType: forgot-password, FailureKind: permanent }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "emails_failed_total"
          dimensions: { Service: events-pipeline, EmailType: forgot-password, FailureKind: transient }
          stats: [Sum]

        # --- HTTP errors, all three HTTP services ----------------------------
        # 4xx/5xx only. A per-2xx metric would be a request-rate metric, which
        # the logs already provide. The events-pipeline is absent on purpose: it
        # is a Lambda with no HTTP surface.
        - namespace: "3MRAI"
          metric_name: "http_errors_total"
          dimensions: { Service: users, StatusClass: 4xx }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "http_errors_total"
          dimensions: { Service: users, StatusClass: 5xx }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "http_errors_total"
          dimensions: { Service: orders, StatusClass: 4xx }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "http_errors_total"
          dimensions: { Service: orders, StatusClass: 5xx }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "http_errors_total"
          dimensions: { Service: tracking, StatusClass: 4xx }
          stats: [Sum]
        - namespace: "3MRAI"
          metric_name: "http_errors_total"
          dimensions: { Service: tracking, StatusClass: 5xx }
          stats: [Sum]

processors:
  # Parse the service's JSON stdout line (carried in body) into top-level
  # attributes so OpenObserve exposes them as queryable columns. Services already
  # emit snake_case, so this only flattens — no per-service renaming.
  transform/parse_body:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - merge_maps(attributes, ParseJSON(body), "upsert") where IsMatch(body, "^\\s*\\{")

          # The SAME parse, for JSON that CloudWatch wrapped in its own prefix:
          # the Lambda runtime prepends timestamp/requestId/level tab-separated,
          # so the body does not start with `{` and the statement above skips it,
          # landing a well-formed log line as opaque text (severity 0, no
          # service_name).
          # CONTRACT: Keep this anchored on the runtime's exact prefix shape, not
          # on "a { anywhere" — a stack trace or a message quoting JSON would be
          # reinterpreted as structure. Keep the service_name nil guard so it
          # cannot overwrite a record the statement above already parsed.
          # See [[2026-08-16-cloudwatch-lambda-log-prefix-defeats-json-parse]]
          - merge_maps(attributes, ParseJSON(ExtractPatterns(body, "^[0-9TZ:.\\-]+\\t[0-9a-f-]+\\t[A-Z]+\\t(?P<json>\\{.*)$")["json"]), "upsert")
            where attributes["service_name"] == nil and IsMatch(body, "^[0-9TZ:.\\-]+\\t[0-9a-f-]+\\t[A-Z]+\\t\\s*\\{")

          # nginx access logs arrive from CloudWatch as PLAIN TEXT, so the JSON
          # statement above skips them. Tags EVERY line from the group, startup
          # output included, onto the field names the services emit:
          #   192.168.148.3 - - [20/Jul/2026:03:01:17 +0000] "POST /v1/orders HTTP/1.1" 409 109 "-" "curl/8.7.1"
          # CONTRACT: Read the log group as `resource.attributes[...]` with the
          # DOT-separated key — the receiver puts it on the RESOURCE, and the
          # underscored `cloudwatch_log_group_name` seen in OpenObserve is the
          # indexer's rename. Either mistake leaves the condition permanently nil
          # and every nginx record lands with severity 0 and no service_name.
          # Keep the non-nil guard BEFORE IsMatch: IsMatch on nil raises, and
          # error_mode: ignore then aborts the whole statement silently.
          # See [[openobserve-cloudwatch]]
          - set(attributes["service_name"], "nginx")
            where attributes["service_name"] == nil
              and resource.attributes["cloudwatch.log.group.name"] != nil
              and IsMatch(resource.attributes["cloudwatch.log.group.name"], "nginx")

          # Access logs are the subset in combined format. Only these carry
          # method/route/status; the startup lines are classified further down.
          - set(attributes["nginx_log_kind"], "access")
            where attributes["service_name"] == "nginx"
              and IsMatch(body, "^\\S+ \\S+ \\S+ \\[")
          - set(attributes["http_request_method"], ExtractPatterns(body, "\"(?P<m>[A-Z]+) ")["m"])
            where attributes["nginx_log_kind"] == "access"
          - set(attributes["http_route"], ExtractPatterns(body, "\"[A-Z]+ (?P<p>\\S+) HTTP")["p"])
            where attributes["nginx_log_kind"] == "access"
          - set(attributes["http_response_status_code"], Int(ExtractPatterns(body, "HTTP/[0-9.]+\" (?P<s>[0-9]{3})")["s"]))
            where attributes["nginx_log_kind"] == "access"
          # Severity from the HTTP status, declared as a MAPPING rather than as a
          # ladder of set()s. ParseSeverity takes the value and a table, so the
          # status->level policy reads as data: 5xx is an error, 4xx a warning.
          # Its "5xx"/"4xx" range placeholders exist for exactly this case.
          - set(attributes["severity_text"], ParseSeverity(attributes["http_response_status_code"], {"ERROR":[{"range":"5xx"}],"WARN":[{"range":"4xx"}],"INFO":[{"range":"2xx"},{"range":"3xx"}]}))
            where attributes["nginx_log_kind"] == "access"
          # Everything else from nginx — the container's startup output — is
          # informational. Without this those lines keep severity 0 (UNSPECIFIED),
          # which is what put them outside every severity filter and rendered them
          # uncoloured.
          - set(attributes["severity_text"], "INFO")
            where attributes["service_name"] == "nginx" and attributes["severity_text"] == nil
          # The matching NUMBER, from the same status. nginx is the one source
          # this file is responsible for — it is the gateway, not one of our
          # services, so there is no producer to fix — and a source that owns its
          # severity owns BOTH fields, exactly as every service does.
          - set(attributes["severity_number"], ParseSeverity(attributes["http_response_status_code"], {"17":[{"range":"5xx"}],"13":[{"range":"4xx"}],"9":[{"range":"2xx"},{"range":"3xx"}]}))
            where attributes["nginx_log_kind"] == "access"
          - set(attributes["severity_number"], 9)
            where attributes["service_name"] == "nginx" and attributes["severity_number"] == nil
          # nginx startup lines: keep them, but mark them so the "log a request
          # once" filter below can tell them apart from access logs.
          - set(attributes["nginx_log_kind"], "startup")
            where attributes["service_name"] == "nginx" and attributes["nginx_log_kind"] == nil

          # The WEB app's nginx, which arrives over fluent_forward, so the
          # log-group rules above never see it. All it leaves unparsed is its own
          # startup output on stderr (~18 plain-text lines per container start);
          # the /geocode/ JSON line is already parsed above as web-geocode, and
          # static-file requests are not logged (apps/web/nginx.conf
          # `access_log off`). Classified rather than dropped so a web container
          # restarting in a loop stays visible outside `unclassified`.
          # CONTRACT: The key is the DOTTED `fluent.tag`, on the LOG RECORD — the
          # underscored `fluent_tag` seen in OpenObserve is the indexer's rename
          # and matches nothing here. Same trap as the log-group rule above.
          # See [[openobserve-cloudwatch]]
          - set(attributes["service_name"], "web")
            where attributes["service_name"] == nil
              and attributes["fluent.tag"] == "web"
          - set(attributes["severity_text"], "INFO")
            where attributes["service_name"] == "web" and attributes["severity_text"] == nil
          - set(attributes["severity_number"], 9)
            where attributes["service_name"] == "web" and attributes["severity_number"] == nil

          # ---------------------------------------------------------------
          # CONTRACT: Do NOT add a severity translation table here (Pino's
          # 30/40/50, MongoDB's I/W/E, Python's WARNING). Fixing severity in this
          # file leaves the producer emitting a schema-violating value and hides
          # it: `docker logs` on the service still shows the bad value, and the
          # contract gains a second source of truth that drifts. Each service
          # emits `severity_text`/`severity_number` itself; this file only
          # PROMOTES them onto the record (two statements below).
          # Known gaps, tracked rather than patched here: realtime-events and
          # events-pipeline (Pino) emit `level`; DocumentDB/Valkey are
          # third-party and keep severity 0 in their own `docdb`/`redis` streams.
          # See [[logging-context]]

          # WHY: Valkey severity stays 0 — its level is a single char reachable
          # only by a raw-body regex, and its own `redis` stream needs none.
          # WARNING: Do NOT reintroduce that regex inline. An unquoted `# ` starts
          # a YAML comment and silently TRUNCATES the statement, and `\*` reaches
          # OTTL double-escaped, matching nothing. If ever needed, parse the char
          # in its own transform block, double-quoted and single-escaped.

          # CONTRACT: Mirror severity onto the record's NATIVE fields. Everything
          # above writes ATTRIBUTES, which are queryable but invisible to the UI:
          # OpenObserve colours its charts from the record's own `severity`, so
          # without these two lines every row reads 0 and warnings and errors all
          # render alike. The attributes stay — the cross-service schema depends
          # on those names. See [[logging-context]]
          - set(severity_number, Int(attributes["severity_number"])) where attributes["severity_number"] != nil
          - set(severity_text, attributes["severity_text"]) where attributes["severity_text"] != nil

  # Drops the ASGI transport spans Python's zero-code instrumentation emits
  # around every FastAPI response (`<route> http send` / ` http receive`). A
  # response is two ASGI messages and the library spans each, so every endpoint
  # draws the same name twice — INTERNAL siblings of tens of microseconds under
  # the one real SERVER span, describing the framework writing bytes.
  # WORKAROUND(local): Filter here, NOT at the source. `exclude_spans` exists
  # only as a Python keyword argument, so using it means calling
  # FastAPIInstrumentor().instrument_app() in src/main.py — which puts OTel
  # config back in the source tree AND runs after `opentelemetry-instrument`
  # has patched fastapi, silently producing no spans at all.
  # Scoped to the two names, so the real SERVER span stays visible.
  # See [[2026-08-21-asgi-instrumentation-double-spans-every-response]]
  filter/drop_asgi_transport_spans:
    error_mode: ignore
    traces:
      span:
        - 'IsMatch(name, ".* http (send|receive)$")'

  # The nginx split — the gateway's access log gets its own stream, the same
  # shape as sql/redis/docdb. Routed rather than dropped: the gateway is the only
  # place a request that never reached a service appears (bad upstream,
  # mis-resolved route, 499 abort) and the only source of edge latency and byte
  # counts. The group's startup output rides along, which answers "did the
  # gateway restart?".
  # CONTRACT: Match on `resource.attributes["cloudwatch.log.group.name"]` — the
  # receiver puts the group on the RESOURCE and the key is DOT-separated; the
  # underscored spelling seen in OpenObserve is an indexer rename that matches
  # nothing. These two conditions MUST stay exact complements (a record matching
  # neither is LOST, one matching both is stored TWICE), nil guard FIRST.
  # See [[openobserve-cloudwatch]]
  filter/only_nginx:
    error_mode: ignore
    logs:
      log_record:
        - 'resource.attributes["cloudwatch.log.group.name"] == nil or not IsMatch(resource.attributes["cloudwatch.log.group.name"], "nginx")'

  filter/drop_nginx:
    error_mode: ignore
    logs:
      log_record:
        - 'resource.attributes["cloudwatch.log.group.name"] != nil and IsMatch(resource.attributes["cloudwatch.log.group.name"], "nginx")'

  # WiredTiger's storage-engine chatter from the DocumentDB group: the
  # checkpointer emits a line per cycle forever (141 of ~250 on an idle stack).
  # CONTRACT: Match the WT_VERB_ CATEGORY, not the log group — the group also
  # carries the storage layer's only real signals (`SERVER RESTARTED`,
  # `Connection not authenticating`, index builds), and severity is "I" on every
  # line, so the category is the only discriminator.
  # CONTRACT: The path is NESTED — attributes["attr"]["message"]["category"] —
  # not the flat `attr_message_category` OpenObserve's indexer creates, which
  # matches nothing silently under error_mode: ignore.
  # CONTRACT: Runs in logs/docdb ONLY; drop_docdb has already diverted the group
  # from the main pipeline. Removing it re-floods `docdb` with checkpoints.
  # See [[openobserve-cloudwatch]]
  filter/drop_wiredtiger_noise:
    error_mode: ignore
    logs:
      log_record:
        - 'attributes["attr"] != nil and attributes["attr"]["message"] != nil and attributes["attr"]["message"]["category"] != nil and IsMatch(attributes["attr"]["message"]["category"], "^WT_VERB_")'

  # The Valkey/ElastiCache split — the cache cluster's engine log gets its own
  # stream rather than a drop rule. Mostly housekeeping (~17k lines/day idle),
  # but the only place `Ready to accept connections`, `MISCONF`, OOM kills and
  # background-save failures appear. Routing the WHOLE group is safe: the group
  # name is stable and holds exactly one source.

  # CONTRACT: Read `resource.attributes["cloudwatch.log.group.name"]`. Two traps,
  # each of which routes NOTHING with no error: the receiver puts the group on
  # the RESOURCE (a log_record `attributes[...]` is always nil, so every record
  # takes the same branch), and the key is DOT-separated (the underscored form in
  # OpenObserve is an indexer rename, like `dimensions_service` below).
  # CONTRACT: These two conditions MUST stay exact complements — `filter` DROPS
  # what matches, so the sense inverts in each. A record matching neither is
  # LOST; one matching both is stored TWICE. Nil guard FIRST: most records carry
  # no log group, and IsMatch on nil raises into a silently aborted statement.
  # See [[openobserve-cloudwatch]]
  filter/only_redis:
    error_mode: ignore
    logs:
      log_record:
        - 'resource.attributes["cloudwatch.log.group.name"] == nil or not IsMatch(resource.attributes["cloudwatch.log.group.name"], "/elasticache/")'

  filter/drop_redis:
    error_mode: ignore
    logs:
      log_record:
        - 'resource.attributes["cloudwatch.log.group.name"] != nil and IsMatch(resource.attributes["cloudwatch.log.group.name"], "/elasticache/")'

  # The DocumentDB split — same shape and rationale as the redis split above.
  # The cluster's audit group (/aws/docdb/cluster/<id>/audit; MongoDB server logs
  # under Floci) is the single largest source in the main stream, and routing it
  # whole keeps `SERVER RESTARTED` and `Connection not authenticating` queryable.
  # filter/drop_wiredtiger_noise then runs inside logs/docdb so checkpoints do
  # not flood even this stream.

  # TWO ways a record belongs here, and the second is not a log group: the
  # cluster's own engine log, and a `db_statement` attribute, which the
  # events-pipeline Lambda sets on the Mongo commands it issues from
  # /aws/lambda/3mrai-local-events, where no log-group match can reach it.
  # CONTRACT: Route on `db_statement`, NOT `commandText` — the latter is what
  # filter/only_sql claims, so a record carrying it lands in two streams at once.
  # CONTRACT: Same two traps as redis (RESOURCE attribute, DOT-separated key);
  # these two conditions MUST stay exact complements, nil guard FIRST.
  # See [[openobserve-cloudwatch]]
  filter/only_docdb:
    error_mode: ignore
    logs:
      log_record:
        - '(resource.attributes["cloudwatch.log.group.name"] == nil or not IsMatch(resource.attributes["cloudwatch.log.group.name"], "/docdb/")) and attributes["db_statement"] == nil'

  filter/drop_docdb:
    error_mode: ignore
    logs:
      log_record:
        - '(resource.attributes["cloudwatch.log.group.name"] != nil and IsMatch(resource.attributes["cloudwatch.log.group.name"], "/docdb/")) or attributes["db_statement"] != nil'

  # The RDS split — /aws/rds/instance/<id>/error for both Aurora clusters (Users'
  # Postgres, Orders' MySQL). Despite the group name these are the servers'
  # general logs: startup banners, checkpoints and connection lines at LOG level,
  # 51 records an hour on an idle stack, all at severity 0 because the engines'
  # level prefixes are not the shared schema. Routed rather than dropped because
  # this is the only place a database reports a failed start, a recovery, a
  # connection storm or a disk-full.
  # CONTRACT: Same two traps as the other splits — RESOURCE attribute,
  # DOT-separated key — and these two conditions MUST stay exact complements,
  # nil guard FIRST.
  # See [[openobserve-cloudwatch]]
  filter/only_rds:
    error_mode: ignore
    logs:
      log_record:
        - 'resource.attributes["cloudwatch.log.group.name"] == nil or not IsMatch(resource.attributes["cloudwatch.log.group.name"], "/aws/rds/")'

  filter/drop_rds:
    error_mode: ignore
    logs:
      log_record:
        - 'resource.attributes["cloudwatch.log.group.name"] != nil and IsMatch(resource.attributes["cloudwatch.log.group.name"], "/aws/rds/")'

  # The UNCLASSIFIED split — the safety net for what the parses missed: a format
  # no rule covers, or a rule whose `where` silently stopped matching. Routed,
  # never dropped: a growing `unclassified` stream is the visible signal that a
  # producer needs fixing. Defaulting the fields to "unknown"/INFO was rejected —
  # a plausible record is easier to ignore than an empty stream growing rows.

  # Catches EITHER failure independently: no `service_name` (the line was not
  # understood at all), or `severity_number` 0/nil (OTel UNSPECIFIED — "nobody
  # said", NOT "below DEBUG"), which is what a producer that logs its identity
  # but forgets its severity looks like.
  # CONTRACT: Test the RECORD's `severity_number`, not
  # `attributes["severity_number"]` — the native field is what OpenObserve stores
  # and dashboards filter on, so the attribute passes a record whose copy onto
  # the record never ran. `<= 0` so a negative cannot read as classified.
  # CONTRACT: These two MUST stay exact complements — three clauses, so De
  # Morgan: the `or` here is an `and` of the negations there. This pair runs LAST
  # in the main pipeline, so "unclassified" means "nothing else wanted it".
  # See [[openobserve-runbook]]
  filter/only_unclassified:
    error_mode: ignore
    logs:
      log_record:
        - 'attributes["service_name"] != nil and severity_number != nil and severity_number > 0'

  filter/drop_unclassified:
    error_mode: ignore
    logs:
      log_record:
        - 'attributes["service_name"] == nil or severity_number == nil or severity_number <= 0'

  # The SQL-echo split. Matches on statement keywords rather than the logger
  # name, because the fluent_forward path carries no logger field. Reads
  # `attributes`, not `body` — transform/parse_body has merged the parsed JSON
  # there by the time a record arrives.

  # CONTRACT: Both clauses are required, for two shapes of SQL log. A driver
  # echoing the bare statement puts the keyword at the start of `message` (the
  # generic shape; nothing emits it today — Go Tracking has config.EchoSQL but
  # wires no echo logger). EF Core wraps it instead — "Executed DbCommand (4ms)
  # […] SELECT …" does NOT match ^SELECT — carrying the statement in its own
  # `commandText`. Without that clause, raising EF Core to Information sends
  # every DbCommand into the MAIN stream.
  # CONTRACT: These two conditions MUST stay exact complements — `filter` DROPS
  # what matches, so the sense inverts in each. A record matching neither is
  # LOST; one matching both is stored TWICE.
  # See [[openobserve-cloudwatch]]
  filter/only_sql:
    error_mode: ignore
    logs:
      log_record:
        - 'not ((attributes["message"] != nil and IsMatch(attributes["message"], "^(SELECT|INSERT|UPDATE|DELETE|BEGIN|COMMIT|ROLLBACK)\\b")) or (attributes["commandText"] != nil))'

  filter/drop_sql:
    error_mode: ignore
    logs:
      log_record:
        - '(attributes["message"] != nil and IsMatch(attributes["message"], "^(SELECT|INSERT|UPDATE|DELETE|BEGIN|COMMIT|ROLLBACK)\\b")) or (attributes["commandText"] != nil)'

  # Collapse `start_time` so a metric is ONE series, not one per scrape. The
  # aws_cloudwatch receiver stamps every scrape with the query window's start and
  # OpenObserve folds that into series identity, which corrupts arithmetic rather
  # than looks wrong: `users_total{HasPassword="true"}` returns the ALL value, and
  # a "total users" card reads 9 beside its own breakdown reading 450.

  # CONTRACT: Do NOT reach for a label-level processor here. `start_time` is the
  # data point's own StartTimestamp field, not an attribute, so metricstransform
  # never sees it; and the dimensions arrive as ONE `Dimensions` map, so an
  # aggregate_labels label_set retains NOTHING and merges the three series with
  # the breakdown gone. A datapoint-context transform reaches the field directly,
  # leaving the measurement's own Timestamp and value untouched.
  # See [[2026-08-14-counter-metrics-need-a-clock-and-a-window]]
  transform/collapse_metric_start_time:
    error_mode: propagate
    metric_statements:
      - context: datapoint
        statements:
          - set(start_time_unix_nano, 0)
          # CONTRACT: Zeroing start_time alone does NOT separate the series.
          # The receiver puts every dimension inside a single `Dimensions` map,
          # and a map is one attribute, so the values inside it never reach
          # series identity: all three HasPassword series share one hash and
          # PromQL answers the ALL value under the label `true`. Promoting each
          # entry to its own attribute is what separates them.
          - merge_maps(attributes, attributes["Dimensions"], "upsert") where attributes["Dimensions"] != nil
          # Drop the map once flattened: leaving it would keep an attribute
          # whose value differs per series, and OpenObserve would index a
          # redundant column of stringified maps beside the real ones.
          - delete_key(attributes, "Dimensions")

  # Bounds the collector's own memory: above the soft limit it refuses data with
  # a NON-permanent error, so exporters retry instead of the container being
  # OOM-killed (which loses every signal, not just traces).
  # CONTRACT: MUST sit BEFORE batch in the traces pipeline. Placed after, the
  # batcher already holds the spans by the time the limiter sees them, so the
  # memory it is meant to bound has already been spent.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  batch: {}

exporters:
  # OpenObserve OTLP-HTTP ingest (ADR-0018). Use otlp_http — the otlphttp alias
  # is deprecated. Basic auth + stream-name are what OpenObserve requires.
  otlp_http/openobserve:
    endpoint: http://openobserve:5080/api/${env:O2_ORG}
    headers:
      Authorization: "Basic ${env:O2_BASIC_AUTH}"
      stream-name: logs

  # SQL echo goes to its OWN stream — same instance and auth, only the
  # stream-name header differs, which is how OpenObserve separates them. Split
  # rather than dropped: the statements are useful locally but high-volume enough
  # to bury a flow log. They keep their shared-context fields (user_id,
  # order_id, trace_id…), so a query still traces back to its request.
  otlp_http/openobserve_sql:
    endpoint: http://openobserve:5080/api/${env:O2_ORG}
    headers:
      Authorization: "Basic ${env:O2_BASIC_AUTH}"
      stream-name: sql

  # The cache engine log gets its own stream, exactly like the sql split above.
  # Split rather than dropped: mostly housekeeping, but the ONLY place the cache
  # reports an OOM kill, a MISCONF that silently stops writes, or a
  # background-save failure — rare and quiet, so they must neither be weighed
  # against expire-cycle noise in the main stream nor discarded.
  otlp_http/openobserve_redis:
    endpoint: http://openobserve:5080/api/${env:O2_ORG}
    headers:
      Authorization: "Basic ${env:O2_BASIC_AUTH}"
      stream-name: redis

  # DocumentDB engine/audit log gets its own stream, like the redis/sql splits.
  # Split rather than dropped: the group dwarfs application logs in volume, but
  # is the ONLY place the storage layer reports a restart, an auth failure or an
  # index build. filter/drop_wiredtiger_noise strips checkpoint noise inside it.
  otlp_http/openobserve_docdb:
    endpoint: http://openobserve:5080/api/${env:O2_ORG}
    headers:
      Authorization: "Basic ${env:O2_BASIC_AUTH}"
      stream-name: docdb

  # The gateway's access log, its own stream, like the splits above. The
  # per-request lines duplicate what the services log, so they do not belong in
  # the main stream — but the gateway is the only place a request that never
  # reached a service shows up, and the only source of edge latency and bytes.
  # Severity comes from the HTTP status in transform/parse_body, so this stream
  # filters by ERROR/WARN like any other.
  otlp_http/openobserve_nginx:
    endpoint: http://openobserve:5080/api/${env:O2_ORG}
    headers:
      Authorization: "Basic ${env:O2_BASIC_AUTH}"
      stream-name: nginx

  # The database engine logs get their own stream, like the splits above. Split
  # rather than dropped: the only place either Aurora cluster reports a failed
  # start, a recovery or a connection problem — rare and quiet, so they must
  # neither be weighed against checkpoint chatter nor discarded.
  otlp_http/openobserve_rds:
    endpoint: http://openobserve:5080/api/${env:O2_ORG}
    headers:
      Authorization: "Basic ${env:O2_BASIC_AUTH}"
      stream-name: rds

  # Everything no parse understood. This stream should normally be EMPTY, and
  # that is what makes it useful: rows appearing here mean a producer emits a
  # shape the collector does not know how to read, which is the exact condition
  # that stayed invisible for weeks in the `logs` stream. Check it when a
  # service's lines go missing from a dashboard — the answer is usually here,
  # with the raw `body` intact so the unrecognized format can be read directly.
  otlp_http/openobserve_unclassified:
    endpoint: http://openobserve:5080/api/${env:O2_ORG}
    headers:
      Authorization: "Basic ${env:O2_BASIC_AUTH}"
      stream-name: unclassified

  # Traces go to OpenObserve, the SAME instance as the logs above — one backend
  # for both signals, so trace_id joins a log line to its span. Only the path
  # differs from the log exporters, because OpenObserve takes traces on its own
  # OTLP route rather than through a stream-name header; `encoding` stays at the
  # default (protobuf).

  # WARNING: A trace-detail view returning HTTP 400 (`gen_ai_operation_name`) is
  # a QUERY failure, not an ingest one — the spans arrive fine. OpenObserve's
  # /traces/{id}/dag SELECTs that column unconditionally and 400s when it is
  # absent from the stream schema. Fix with `make observability-traces-schema`,
  # which observability-up runs; it is not a version bug.
  # See [[ADR-0019-distributed-tracing-opentelemetry]]
  otlp_http/openobserve_traces:
    endpoint: http://openobserve:5080/api/${env:O2_ORG}
    headers:
      Authorization: "Basic ${env:O2_BASIC_AUTH}"
      # Without this header OpenObserve files every span under `default`.
      # `app-traces` leaves room for infrastructure traces on another route.
      # CONTRACT: Write it with an UNDERSCORE. OpenObserve normalises
      # `app-traces` to `app_traces` on ingestion, so a hyphen leaves the config
      # and the queryable stream name disagreeing. Renaming does not move spans
      # already stored; they stay in `default` until retention ages them out.
      stream-name: app_traces

  # Metrics to OpenObserve, its own stream — same instance and auth as logs,
  # differing only in the stream-name header, exactly like the sql split above.
  # WARNING: For dashboard authors — OpenObserve PREFIXES AND LOWERCASES the
  # CloudWatch dimensions on ingest, so a dimension published as `Service` is
  # queried as `dimensions_service`, and the metric name becomes the stream name
  # sanitized: amazonaws.com/3MRAI/orders_total -> amazonaws_com_3mrai_orders_total.
  otlp_http/openobserve_metrics:
    endpoint: http://openobserve:5080/api/${env:O2_ORG}
    headers:
      Authorization: "Basic ${env:O2_BASIC_AUTH}"
      stream-name: metrics

# Liveness surface for `make doctor`. Behind `profiles: [observability]`, so a
# plain `docker compose up` leaves the collector down and the services' exports
# fail with connection refused — silently, since a failed export is not a failed
# request. A dedicated endpoint rather than the OTLP ingest ports, which answer
# only to a well-formed payload: probing those means writing a fake trace, or a
# bare TCP connect that cannot tell a collector from anything else on the port.
extensions:
  health_check:
    # 0.0.0.0, not the default localhost:13133 — the default binds the
    # CONTAINER's loopback, where a probe from the host can never reach it.
    endpoint: 0.0.0.0:13133

service:
  # Declared here as well as above: an extension defined and not listed is
  # simply never started.
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    logs:
      receivers: [fluent_forward, aws_cloudwatch]
      # CONTRACT: Order matters — parse first so filters test real fields, then
      # drop, then batch, so dropped records never reach the batcher.
      # filter/drop_wiredtiger_noise is absent: drop_docdb already diverts it.
      # See [[openobserve-runbook]]
      processors: [transform/parse_body, filter/drop_nginx, filter/drop_redis, filter/drop_docdb, filter/drop_rds, filter/drop_sql, filter/drop_unclassified, batch]
      exporters: [otlp_http/openobserve]

    # SQL echo, same receivers, opposite filter, its own stream. Two pipelines
    # rather than routing, because the exporter carries the stream-name header
    # and a record leaves through only one. Each pipeline processes its OWN copy
    # of every record, so transform/parse_body runs in both and the filters
    # discard the copy that does not belong — hence the exact-complement rule.
    logs/sql:
      receivers: [fluent_forward, aws_cloudwatch]
      processors: [transform/parse_body, filter/only_sql, batch]
      exporters: [otlp_http/openobserve_sql]

    # Cache engine log, its own stream: same receivers, complementary filter,
    # different exporter. Only aws_cloudwatch can produce a record here;
    # fluent_forward stays listed for symmetry and is dropped via the nil branch.
    # CONTRACT: filter/drop_redis in the main pipeline and filter/only_redis here
    # are exact complements, so every record lands in exactly one stream.
    logs/redis:
      receivers: [fluent_forward, aws_cloudwatch]
      processors: [transform/parse_body, filter/only_redis, batch]
      exporters: [otlp_http/openobserve_redis]

    # DocumentDB engine/audit log, its own stream, structured like logs/redis.
    # CONTRACT: transform/parse_body must run here so WiredTiger's nested
    # attr.message.category reaches filter/drop_wiredtiger_noise, which lives
    # HERE — drop_docdb has already routed the group out of the main pipeline.
    # CONTRACT: filter/drop_docdb there and filter/only_docdb here are exact
    # complements, so every record lands in exactly one stream.
    logs/docdb:
      receivers: [fluent_forward, aws_cloudwatch]
      processors: [transform/parse_body, filter/only_docdb, filter/drop_wiredtiger_noise, batch]
      exporters: [otlp_http/openobserve_docdb]

    # The gateway's access log, its own stream, structured like the splits above.
    # CONTRACT: transform/parse_body must run here — it turns the combined-format
    # line into http_request_method / http_route / http_response_status_code and
    # the status into a severity; without it these records carry only `body`.
    # CONTRACT: filter/drop_nginx in the main pipeline and filter/only_nginx here
    # are exact complements, so every record lands in exactly one stream.
    logs/nginx:
      receivers: [fluent_forward, aws_cloudwatch]
      processors: [transform/parse_body, filter/only_nginx, batch]
      exporters: [otlp_http/openobserve_nginx]

    # Database engine logs, their own stream. Same structure as logs/redis: same
    # receivers, the complementary filter, a different exporter.
    #
    # filter/drop_rds in the main pipeline and filter/only_rds here are exact
    # complements, so every record lands in exactly one of the two streams.
    logs/rds:
      receivers: [fluent_forward, aws_cloudwatch]
      processors: [transform/parse_body, filter/only_rds, batch]
      exporters: [otlp_http/openobserve_rds]

    # CONTRACT: The catch-all MUST repeat EVERY drop_* filter before
    # only_unclassified, unlike the other splits, which each own a log group.
    # "Unclassified" is defined by ABSENCE, so without these drops it swallows
    # another stream's unparsed records — a DocumentDB or RDS line of plain
    # engine text has no service_name either and would be routed here.
    logs/unclassified:
      receivers: [fluent_forward, aws_cloudwatch]
      processors: [transform/parse_body, filter/drop_nginx, filter/drop_redis, filter/drop_docdb, filter/drop_rds, filter/drop_sql, filter/only_unclassified, batch]
      exporters: [otlp_http/openobserve_unclassified]

    # No transform/parse_body here: OTLP traces arrive already structured, so
    # there is no JSON-in-a-string body to flatten as there is for stdout logs.
    traces:
      receivers: [otlp]
      # memory_limiter BEFORE batch, for the reason spelled out on the processor
      # itself: limiting after the batcher has already buffered the spans limits
      # nothing.
      # filter BEFORE batch: dropping the ASGI transport spans first keeps them
      # out of the batches entirely rather than shipping and discarding them.
      processors: [memory_limiter, filter/drop_asgi_transport_spans, batch]
      # ONE destination: traces land beside the logs they share a trace_id with,
      # so "show me the logs for this span" is one query in one system.
      exporters: [otlp_http/openobserve_traces]

    # Custom business metrics: CloudWatch -> OpenObserve. Same receiver as the
    # logs pipeline, different signal — the receiver's `metrics` block above is
    # what this pipeline consumes.
    #
    # No transform/parse_body, for the same reason as traces: metrics arrive
    # already structured, unlike the services' stdout JSON.
    metrics:
      receivers: [aws_cloudwatch]
      # collapse_metric_start_time BEFORE batch: it is what makes a metric one
      # series instead of one per scrape, so batching ships real series.
      processors: [transform/collapse_metric_start_time, batch]
      exporters: [otlp_http/openobserve_metrics]
