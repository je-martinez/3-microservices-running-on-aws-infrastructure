load_module modules/ngx_http_js_module.so;
events {}
http {
  js_import auth from /etc/nginx/mounted/auth.js;
  js_set $jwt_sub auth.jwtSub;

  # Shared proxy headers (identity injection MUST apply to every backend: the
  # njs-decoded Cognito sub is how both services learn the caller).
  server {
    listen 80;
    resolver 127.0.0.11 valid=5s;

    # ── Health, per service (exact match wins over the /v1/orders/ prefix) ──
    # Both services serve /v1/health UNPREFIXED internally, so we REWRITE the
    # prefixed gateway path to the bare service path. HEALTH-ONLY rewrite — do
    # NOT extend this to functional routes (they use their real paths).
    location = /v1/users/health {
      set $backend users;
      proxy_pass http://$backend:3000/v1/health;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header x-user-id $jwt_sub;
    }
    location = /v1/orders/health {
      set $backend orders;
      proxy_pass http://$backend:8080/v1/health;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header x-user-id $jwt_sub;
    }
    # SINGULAR /v1/tracking/health, while the functional routes below are PLURAL
    # /v1/trackings/*. Deliberate: the health path mirrors users/orders, the
    # functional ones are Tracking's real service paths. Exact match, so it never
    # falls into the /v1/trackings prefix (which would not rewrite).
    location = /v1/tracking/health {
      # THE SWITCH (1 of 2) — keep this in step with the /v1/trackings block
      # below, so the health probe reports on the container that is actually
      # serving traffic rather than on the one that is not.
      # `tracking` = the Python service · `tracking-go` = the Go port.
      # Both containers are up; see docker-compose.yml and the block below.
      set $backend tracking;
      proxy_pass http://$backend:8000/v1/health;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header x-user-id $jwt_sub;
    }

    # ── Orders functional routes (path preserved — these ARE the real paths) ──
    # No trailing URI on proxy_pass → nginx forwards the original request URI
    # unchanged (e.g. /v1/orders/my-orders reaches orders as-is).
    location /v1/orders {
      set $backend orders;
      proxy_pass http://$backend:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header x-user-id $jwt_sub;
    }

    # Products catalog is served by Orders. Without this, /v1/products would fall
    # through to the default `/` location and wrongly hit Users.
    location /v1/products {
      set $backend orders;
      proxy_pass http://$backend:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header x-user-id $jwt_sub;
    }

    # Cart is served by Orders too, but under its OWN top-level path
    # (/v1/cart, not /v1/orders/*), so it needs its own block for the same
    # reason /v1/products does — without one it falls through to the default
    # `/` location and silently hits Users on 3000 instead of Orders.
    location /v1/cart {
      set $backend orders;
      proxy_pass http://$backend:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header x-user-id $jwt_sub;
    }

    # ── Tracking functional routes (path preserved — these ARE the real paths) ──
    # Covers init-tracking, both user-scoped reads, and the carrier status PUT.
    # x-user-id is injected here too: `POST /v1/trackings/init-tracking` and the
    # reads derive their whole identity from this header, and it is set PER
    # LOCATION — a block that only declared proxy_pass would forward requests with
    # no caller, which looks like a JWT failure (401) rather than a missing
    # directive.
    #
    # The carrier `PUT /v1/trackings/{orderId}/status` carries no Cognito JWT (it
    # authenticates with its own API key), so $jwt_sub is empty for it. Harmless:
    # that route's handler never asks for x-user-id, so the empty header is simply
    # ignored — same as the other no-JWT paths through this proxy.
    # ── THE MIGRATION SWITCH (2 of 2) ─────────────────────────────────────────
    #
    # `tracking` = the PYTHON service · `tracking-go` = the GO port. Change this
    # one word (and its twin in the health block above) to move every functional
    # Tracking route between implementations.
    #
    # Why it is only a word: the two are separate compose services on the same
    # network, both listening on 8000 INSIDE their own container, both reading a
    # generated env file with the same values, both against the same database.
    # `$backend` is resolved by Docker's embedded DNS at REQUEST time (see the
    # `resolver` directive at the top), so nginx never pinned an address at
    # startup and there is nothing cached to invalidate.
    #
    # EDIT THE TWO `set $backend` LINES BY HAND. A sed over this file is the
    # obvious shortcut and it is a trap: the pattern also matches the example
    # commands written inside THIS comment, so the instructions rewrite
    # themselves and the "revert" line silently becomes a no-op that maps
    # tracking-go to tracking-go. Observed here, first try.
    #
    # There are exactly two lines to change, and neither the users nor the
    # orders blocks are among them (their values are `users` and `orders`):
    #
    #   in `location = /v1/tracking/health`  → set $backend <value>;
    #   in `location /v1/trackings`          → set $backend <value>;
    #
    # (Located by their enclosing `location`, not by line number — the number
    # drifts every time this comment is edited, which is its own small trap.)
    #
    # where <value> is `tracking` for Python or `tracking-go` for Go. Reverting
    # is the SAME edit in the other direction — that symmetry is the point.
    #
    # THEN MAKE IT LIVE. This file is BIND-MOUNTED into the nginx ECS task from
    # the host (infra/modules/compute/main.tf: `volume { host_path = ... }`), so
    # the edit is already inside the container and the only thing needed is for
    # nginx to re-read it:
    #
    #   docker exec $(docker ps --filter name=nginx --format '{{.Names}}') \
    #     nginx -s reload
    #
    # A `terraform apply` is NOT required and does not help: the task definition
    # does not embed this file's contents. Reverting therefore costs one sed and
    # one reload, with no rebuild and no downtime — both containers stay up.
    # Confirm which backend is live before trusting a result:
    #   curl -s <API_GATEWAY_URL>/v1/tracking/health   # both answer {"status":"ok"}
    #   docker logs --since 1m 3mrai-tracking-go-1     # only the LIVE one logs
    location /v1/trackings {
      set $backend tracking;
      proxy_pass http://$backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header x-user-id $jwt_sub;
    }

    # ── Everything else → Users (default; unchanged behavior) ──
    location / {
      set $backend users;
      proxy_pass http://$backend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header x-user-id $jwt_sub;
    }
  }
}
