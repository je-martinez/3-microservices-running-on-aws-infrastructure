[project]
name = "lib3mrai"
version = "0.1.0"
description = "Shared helpers for 3MRAI infrastructure scripts"
requires-python = ">=3.11"
# Pillow: raster resize/re-encode for the email assets uploaded by
# modules/assets-bucket/scripts/sync_assets.py. Python has no `sharp`; Pillow is
# the standard equivalent and ships wheels for every platform this repo targets,
# so `make scripts-setup` still needs no system libraries.
#
# blurhash-python: computes the BlurHash placeholder the web app paints while a
# product photo loads, written into assets.manifest.json by the same script. Pure
# Python (no system libraries), so `make scripts-setup` still needs no toolchain.
# RUNTIME rather than [dev]: sync_assets.py runs inside a Terraform local-exec
# during phase 2, where the dev extra is not installed.
dependencies = ["boto3>=1.34,<2", "pillow>=10,<12", "blurhash-python>=1.1,<2"]

[project.optional-dependencies]
# Test-only. Kept OUT of the runtime dependency list so `make scripts-setup`
# (a prerequisite of every apply target) stays as small and fast as it is today
# — an apply must not pull a test runner. Install explicitly to run the suite:
#   .venv/bin/pip install -e "infra/scripts[dev]"
dev = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Only the importable helper package ships; `tests/` stays a sibling, run in
# place rather than installed.
include = ["lib3mrai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
